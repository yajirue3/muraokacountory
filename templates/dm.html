<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 密書 (DM)</title>
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --card-bg: #16181c; 
            --border: #2f3336; 
            --primary: #d4af37; 
            --primary-hover: #b8962e; 
            --text: #e7e9ea; 
            --sub: #71767b; 
            --danger: #ef4444;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; }
        
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; border-left: 1px solid var(--border); border-right: 1px solid var(--border); height: 100%; position: relative; }
        
        /* 共通ヘッダー */
        .header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 10; flex-shrink: 0; }
        .view { display: none; flex-direction: column; height: 100%; width: 100%; min-height: 0; }
        .view.active { display: flex; animation: fadein 0.2s ease-out; }
        @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* リスト画面 */
        .action-bar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
        .thread-list { flex: 1; overflow-y: auto; }
        .thread-item { padding: 16px; display: flex; cursor: pointer; border-bottom: 1px solid var(--border); align-items: center; }
        .thread-item:hover { background: var(--card-bg); }
        .avatar { width: 46px; height: 46px; border-radius: 50%; background: #333; margin-right: 14px; display: flex; align-items: center; justify-content: center; font-weight: bold; object-fit: cover; flex-shrink: 0; }
        .thread-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .thread-name { font-weight: bold; font-size: 1rem; }
        .thread-msg { color: var(--sub); font-size: 0.85rem; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* チャット画面 */
        .chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }
        .msg-row { display: flex; flex-direction: column; width: 100%; position: relative; }
        .msg-mine { align-items: flex-end; }
        .msg-other { align-items: flex-start; }
        .msg-container { display: flex; gap: 8px; max-width: 85%; align-items: flex-end; }
        .msg-mine .msg-container { flex-direction: row-reverse; }

        .msg-bubble { padding: 12px 16px; font-size: 0.95rem; line-height: 1.45; word-break: break-word; position: relative; }
        .msg-mine .msg-bubble { background: var(--primary); color: #000; border-radius: 18px 18px 2px 18px; font-weight: 500; }
        .msg-other .msg-bubble { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 18px 18px 18px 2px; }

        .msg-image { max-width: 220px; border-radius: 12px; }
        .msg-stamp { width: 130px; }
        .msg-meta { font-size: 0.7rem; color: var(--sub); margin-top: 4px; display: flex; gap: 6px; }

        /* 📱 スマホ対応: フローティングツールバー (折り返し対応) */
        .msg-floating-toolbar {
            display: none; position: absolute; top: -52px; left: 0;
            background: #000; border: 1px solid var(--border); border-radius: 12px; 
            padding: 6px; gap: 6px; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            /* スマホファーストな折り返し設定 */
            display: none; flex-wrap: wrap; width: max-content; max-width: 200px; justify-content: center;
        }
        .msg-row:hover .msg-floating-toolbar, .msg-bubble:active .msg-floating-toolbar { display: flex; }
        .msg-mine .msg-floating-toolbar { left: auto; right: 0; }
        
        .toolbar-btn { background: transparent; border: none; font-size: 1.1rem; padding: 2px 4px; cursor: pointer; color: var(--text); transition: 0.1s; }
        .toolbar-btn:hover { transform: scale(1.2); }
        .react-badge { background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 2px 6px; font-size: 0.75rem; margin-top: 4px; display: inline-block; cursor: pointer; }

        /* 入力バー */
        .chat-input-wrapper { padding: 10px 14px; border-top: 1px solid var(--border); background: var(--bg); display: flex; gap: 8px; align-items: center; }
        .btn-circle { width: 38px; height: 38px; border-radius: 50%; background: transparent; border: 1px solid transparent; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; flex-shrink: 0; }
        .chat-input-wrapper input { flex: 1; background: var(--card-bg); border: 1px solid transparent; padding: 12px 16px; border-radius: 20px; color: var(--text); font-size: 0.95rem; outline: none; }
        .chat-input-wrapper input:focus { border-color: var(--primary); }
        .btn-send { background: var(--primary); border: none; color: #000; padding: 0 16px; height: 38px; border-radius: 19px; font-weight: bold; cursor: pointer; display: none; }
        .btn-send.active { display: block; }

        /* ドロワー */
        .drawer-panel { display: none; background: #000; border-top: 1px solid var(--border); padding: 16px; max-height: 200px; overflow-y: auto; }
        .launcher-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
        .launcher-item { background: var(--card-bg); border-radius: 12px; padding: 12px 0; cursor: pointer; font-size: 0.8rem; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #000; padding: 24px; border-radius: 16px; width: 360px; max-width: 90%; border: 1px solid var(--border); }
        .input-text { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; margin: 8px 0; font-size: 0.95rem; }
        .btn-full { width: 100%; padding: 12px; background: var(--primary); color: #000; border: none; border-radius: 20px; font-weight: bold; margin-top: 8px; cursor: pointer; }
        .btn-sub { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .nav-icon { background: transparent; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; padding: 6px; }

        #block-warning { display: none; background: #2a0808; border-top: 1px solid var(--danger); color: #ff9999; text-align: center; padding: 12px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- リスト画面 -->
    <div id="view-list" class="view active">
        <div class="header">
            <span id="sidebar-title">密書 (DM)</span>
            <div style="display:flex; gap: 4px;">
                <button class="nav-icon" onclick="openModal('new-group-modal')">👥</button>
                <button class="nav-icon" onclick="openModal('settings-modal')">⚙️</button>
                <button class="nav-icon" onclick="location.href='/dashboard'">◀</button>
            </div>
        </div>
        <div class="action-bar">
            <button class="btn-full" style="margin:0;" onclick="openModal('new-dm-modal')">＋ 新しい密書</button>
            <button class="btn-full btn-sub" id="btn-admin-mode" style="margin:0; display:none;" onclick="toggleAdminMode()">👁️ 国王検閲</button>
        </div>
        <div class="thread-list" id="thread-list"></div>
    </div>

    <!-- チャット画面 -->
    <div id="view-chat" class="view">
        <div class="header">
            <div style="display:flex; align-items:center; gap: 4px;">
                <button class="nav-icon" onclick="closeChat()">←</button>
                <img id="chat-avatar" class="avatar" style="width:34px; height:34px; margin:0 8px 0 4px; display:none;">
                <div style="display:flex; flex-direction:column;">
                    <span id="chat-title" style="font-size:0.95rem;">名前</span>
                    <span id="chat-subtitle" style="font-size:0.7rem; color:var(--sub);"></span>
                </div>
            </div>
            <div id="chat-header-actions" style="display:flex;">
                <button class="nav-icon">📞</button>
                <button class="nav-icon">🎥</button>
                <button class="nav-icon" onclick="toggleBlock()">︙</button>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages"></div>
        <div id="block-warning">⛔ この国民とは交信が制限されています</div>

        <div class="chat-input-wrapper" id="chat-input-area">
            <button class="btn-circle" onclick="toggleDrawer('launcher-drawer')">＋</button>
            <input type="text" id="chat-input" placeholder="メッセージ..." oninput="toggleSendBtn()" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn-circle" id="btn-stamp" onclick="toggleDrawer('stamp-drawer')">☺</button>
            <button class="btn-send" id="btn-send-msg" onclick="sendMsg()">➤</button>
        </div>

        <div class="drawer-panel" id="launcher-drawer">
            <div class="launcher-grid">
                <div class="launcher-item" onclick="openModal('transfer-modal')">💰 送金</div>
                <div class="launcher-item" onclick="document.getElementById('img-file').click()">🖼️ 画像</div>
            </div>
            <input type="file" id="img-file" style="display:none;" onchange="uploadImage(event)">
        </div>
        <div class="drawer-panel" id="stamp-drawer">
            <div style="text-align:center; font-size:0.8rem; color:var(--sub);">スタンプ準備中</div>
        </div>
    </div>

</div>

<!-- モーダル: 1v1 DM -->
<div class="modal" id="new-dm-modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">新しい密書</h3>
        <input type="text" id="target-dm-id" class="input-text" placeholder="@dm_id">
        <button class="btn-full" onclick="startChat('DM')">開始</button>
        <button class="btn-full btn-sub" onclick="closeModal('new-dm-modal')">キャンセル</button>
    </div>
</div>

<!-- モーダル: グループ -->
<div class="modal" id="new-group-modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">密談部屋を結成</h3>
        <input type="text" id="group-name" class="input-text" placeholder="部屋名">
        <input type="text" id="group-members" class="input-text" placeholder="DM ID (カンマ区切り)">
        <button class="btn-full" onclick="startChat('GROUP')">結成</button>
        <button class="btn-full btn-sub" onclick="closeModal('new-group-modal')">キャンセル</button>
    </div>
</div>

<!-- モーダル: 設定 -->
<div class="modal" id="settings-modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">DM ID設定</h3>
        <input type="text" id="my-dm-id" class="input-text" placeholder="muraoka_king">
        <button class="btn-full" onclick="saveDMID()">保存</button>
        <button class="btn-full btn-sub" onclick="closeModal('settings-modal')">閉じる</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    let currentUser = null, activeRoom = null, activeTarget = null, isAdmin = false, isGroup = false;

    async function init() {
        const res = await fetch("/api/dm/me", { headers: { "Authorization": `Bearer ${token}` } });
        if(res.ok) { currentUser = await res.json(); if(currentUser.role==='king') document.getElementById('btn-admin-mode').style.display='block'; }
        fetchThreads();
        setInterval(() => { if(activeTarget || activeRoom) fetchMessages(true); else fetchThreads(true); }, 3000);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function toggleDrawer(id) {
        const el = document.getElementById(id);
        const st = el.style.display;
        document.querySelectorAll('.drawer-panel').forEach(d => d.style.display='none');
        el.style.display = st === 'block' ? 'none' : 'block';
    }

    function toggleSendBtn() {
        const v = document.getElementById('chat-input').value.trim();
        document.getElementById('btn-send-msg').classList.toggle('active', v.length > 0);
        document.getElementById('btn-stamp').style.display = v.length > 0 ? 'none' : 'flex';
    }

    async function fetchThreads(bg=false) {
        const res = await fetch("/api/dm/conversations", { headers: { "Authorization": `Bearer ${token}` } });
        const data = await res.json();
        let html = '';
        (data.conversations||[]).forEach(c => {
            const isGrp = c.type === "GROUP";
            const idArg = isGrp ? c.room_id : `'${c.partner_dm_id}'`;
            const ava = c.avatar ? `<img src="https://lh3.googleusercontent.com/u/0/d/${c.avatar}=w100" class="avatar">` : `<div class="avatar">${isGrp?'👥':c.name.charAt(0)}</div>`;
            html += `
                <div class="thread-item" onclick="openChat(${idArg}, '${c.name}', ${isGrp}, ${c.is_blocked||false})">
                    ${ava}
                    <div class="thread-info">
                        <div class="thread-name">${c.name}</div>
                        <div class="thread-msg">${c.latest_message}</div>
                    </div>
                </div>`;
        });
        document.getElementById('thread-list').innerHTML = html || '<div style="text-align:center; padding:40px; color:var(--sub);">何もないようだ...</div>';
    }

    async function openChat(id, name, grp, blocked) {
        isGroup = grp;
        if(isGroup) { activeRoom = id; activeTarget = null; document.getElementById('chat-subtitle').innerText = 'グループ密談'; }
        else { activeTarget = id; activeRoom = null; document.getElementById('chat-subtitle').innerText = '@'+id; }
        document.getElementById('chat-title').innerText = name;
        
        document.getElementById('chat-input-area').style.display = blocked ? 'none' : 'flex';
        document.getElementById('block-warning').style.display = blocked ? 'block' : 'none';

        document.getElementById('view-list').classList.remove('active');
        document.getElementById('view-chat').classList.add('active');
        fetchMessages();
    }

    function closeChat() { document.getElementById('view-chat').classList.remove('active'); document.getElementById('view-list').classList.add('active'); activeRoom = null; activeTarget = null; }

    async function fetchMessages(bg=false) {
        const url = isGroup ? `/api/dm/messages/group/${activeRoom}` : `/api/dm/messages/direct/${activeTarget}`;
        const res = await fetch(url, { headers: { "Authorization": `Bearer ${token}` } });
        const data = await res.json();
        
        let html = '';
        (data.messages||[]).forEach(m => {
            const mine = String(m.sender_id) === String(currentUser.id);
            const reactBadges = m.dm_message_reactions ? m.dm_message_reactions.map(r => `<span class="react-badge">${r.reaction_type}</span>`).join('') : '';
            
            // 📱 スマホ対応: 2行に折り返すツールバー
            const tb = `
                <div class="msg-floating-toolbar">
                    <button class="toolbar-btn" onclick="react(${m.id},'👍')">👍</button>
                    <button class="toolbar-btn" onclick="react(${m.id},'❤️')">❤️</button>
                    <button class="toolbar-btn" onclick="react(${m.id},'😂')">😂</button>
                    <button class="toolbar-btn" onclick="react(${m.id},'🙏')">🙏</button>
                    <button class="toolbar-btn" onclick="react(${m.id},'👀')">👀</button>
                    <button class="toolbar-btn" onclick="react(${m.id},'🔥')">🔥</button>
                    <button class="toolbar-btn" style="color:var(--danger)" onclick="delMsg(${m.id})">🗑️</button>
                </div>`;
            
            const cont = m.is_deleted ? `<i style="color:var(--sub)">取消済</i>` : (m.message_type==='IMAGE' ? `<img src="https://lh3.googleusercontent.com/u/0/d/${m.metadata.drive_file_id}=w400" class="msg-image">` : m.content);

            html += `
                <div class="msg-row ${mine?'msg-mine':'msg-other'}">
                    ${!mine && isGroup ? `<div style="font-size:0.7rem; color:var(--sub); margin:0 40px 2px;">${m.profiles?.nickname||''}</div>` : ''}
                    <div class="msg-container">
                        <div>
                            <div class="msg-bubble">${cont}${!m.is_deleted ? tb : ''}</div>
                            ${reactBadges ? `<div>${reactBadges}</div>` : ''}
                        </div>
                    </div>
                    <div class="msg-meta">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                </div>`;
        });
        const box = document.getElementById('chat-messages');
        const isBot = box.scrollHeight - box.scrollTop - box.clientHeight < 50;
        box.innerHTML = html;
        if(!bg || isBot) box.scrollTop = box.scrollHeight;
    }

    async function sendMsg() {
        const inp = document.getElementById('chat-input');
        if(!inp.value.trim()) return;
        await fetch("/api/dm/send", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ target_dm_id: activeTarget, room_id: activeRoom, content: inp.value })
        });
        inp.value = ''; toggleSendBtn(); fetchMessages(); fetchThreads();
    }

    async function startChat(type) {
        if(type==='DM') {
            const id = document.getElementById('target-dm-id').value;
            if(id) { closeModal('new-dm-modal'); openChat(id, id, false, false); }
        } else {
            const name = document.getElementById('group-name').value;
            const mems = document.getElementById('group-members').value.split(',').map(s=>s.trim());
            const res = await fetch("/api/dm/groups", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ room_name: name, member_dm_ids: mems }) });
            if(res.ok) { const d = await res.json(); closeModal('new-group-modal'); openChat(d.room_id, name, true, false); fetchThreads(); }
        }
    }

    async function react(id, type) { await fetch(`/api/dm/messages/${id}/react`, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ reaction_type: type }) }); fetchMessages(); }
    async function delMsg(id) { if(confirm("削除しますか？")) { await fetch(`/api/dm/messages/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } }); fetchMessages(); } }

    init();
</script>
</body>
</html>
