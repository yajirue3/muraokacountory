<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - タワーゲーム (Tower)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-purple: #b000ff;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #2a0033 0%, #000000 90%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 100% 100%, 12px 12px, 12px 12px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            margin: 0; 
            min-height: 100vh;
            padding: 4px;
            user-select: none;
            overflow-x: hidden;
        }

        .container { 
            width: 100%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between;
            padding: 4px; 
            position: relative;
        }

        .card { 
            background: rgba(10, 2, 18, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 14px; 
            padding: 6px; 
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6); 
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            overflow: hidden;
        }

        .header { 
            font-size: 1.0rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan); 
            padding-bottom: 2px; 
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 1px;
            margin: 0;
        }

        /* 🎰 最上部ステータスエリア */
        .status-display { 
            background: #000; 
            border: 2px solid var(--neon-cyan); 
            border-radius: 10px; 
            padding: 4px; 
            text-align: center; 
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.4);
            position: relative;
            z-index: 10;
            will-change: transform;
        }

        .status-text { 
            font-size: 0.75rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            min-height: 18px; 
            text-shadow: 0 0 8px currentColor;
            line-height: 1.1;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 4px; 
            margin-top: 2px;
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.9);
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .stat-label { font-size: 0.6rem; color: #aaa; font-weight: bold; }
        .stat-val { 
            font-size: 0.95rem; 
            font-weight: 900; 
            color: var(--neon-green); 
            text-shadow: 0 0 8px var(--neon-green); 
            font-family: 'Black Ops One', monospace;
            display: inline-block;
            will-change: transform;
        }

        /* 🏰 15段タワー */
        .tower-container {
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            background: #000;
            padding: 3px;
            border-radius: 8px;
            border: 2px solid var(--neon-pink);
            box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.3);
            overflow: hidden;
        }

        .tower-row {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.25;
            padding: 1px 3px;
            border-radius: 4px;
            background: rgba(20, 10, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            height: 22px;
            transition: all 0.1s ease;
        }

        /* ⚡ 狂乱のフロア突破エフェクト */
        .tower-row.just-cleared {
            animation: row-clear-frenzy 0.4s ease-out;
            opacity: 1.0 !important;
            background: #fff !important;
            border: 2px solid var(--neon-yellow) !important;
        }

        @keyframes row-clear-frenzy {
            0% { transform: scale(1.15) rotate(-1deg); box-shadow: 0 0 40px #fff, 0 0 80px var(--neon-pink); }
            50% { transform: scale(1.08) rotate(1deg); box-shadow: 0 0 30px var(--neon-yellow); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .tower-row.active {
            opacity: 1.0;
            background: rgba(0, 243, 255, 0.2);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
            animation: active-row-pulse 0.4s infinite alternate;
        }

        @keyframes active-row-pulse {
            from { border-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
            to { border-color: var(--neon-pink); box-shadow: 0 0 20px var(--neon-pink); }
        }

        .tower-row.cleared {
            opacity: 0.8;
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid rgba(0, 255, 102, 0.5);
        }

        .floor-num {
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--neon-yellow);
            width: 20px;
            text-align: center;
            text-shadow: 0 0 4px var(--neon-yellow);
            font-family: 'Black Ops One', monospace;
        }

        .tiles-group {
            display: flex;
            flex: 1;
            gap: 4px;
            height: 100%;
            align-items: center;
        }

        .tile-btn {
            flex: 1;
            height: 18px;
            background: #121220;
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            cursor: pointer;
            margin: 0;
            padding: 0;
            box-shadow: 0 0 4px rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-btn:not(:disabled):hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .tile-btn:disabled {
            cursor: not-allowed;
            background: #0d0d12;
            border-color: #222;
            color: #333;
            box-shadow: none;
        }

        .tile-btn.safe { 
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%) !important; 
            border-color: #fff !important; 
            color: #fff !important; 
            text-shadow: 0 0 6px #000;
            box-shadow: 0 0 20px var(--neon-green) !important;
            animation: tile-mega-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }

        @keyframes tile-mega-pop {
            0% { transform: scale(0.3); }
            60% { transform: scale(1.6); }
            100% { transform: scale(1); }
        }

        .tile-btn.trap { 
            background: linear-gradient(135deg, #ff003c 0%, #990000 100%) !important; 
            border-color: #fff !important; 
            color: #fff !important; 
            box-shadow: 0 0 20px var(--neon-red) !important;
            animation: tile-shake 0.2s ease-in-out;
        }

        @keyframes tile-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .floor-mult { 
            font-size: 0.6rem; 
            font-weight: 900;
            color: var(--neon-green); 
            width: 50px; 
            text-align: right; 
            text-shadow: 0 0 4px var(--neon-green);
            font-family: 'Black Ops One', monospace;
        }

        /* 🎛️ 入力フォーム */
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .label { 
            font-size: 0.6rem; 
            color: var(--neon-cyan); 
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-cyan);
            margin-bottom: 1px;
        }

        input, select { 
            width: 100%; 
            padding: 4px 6px; 
            border-radius: 6px; 
            border: 1.5px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            font-size: 0.75rem; 
            font-weight: bold;
            font-family: inherit; 
            outline: none;
        }

        /* 🚀 アクションボタン */
        .btn-group {
            display: flex;
            gap: 4px;
        }

        button { 
            width: 100%; 
            padding: 6px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 0.8rem; 
            box-shadow: 0 0 10px var(--neon-yellow);
            user-select: none;
            transition: transform 0.05s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.95);
            filter: brightness(1.3);
        }

        .btn-start { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            box-shadow: 0 0 20px var(--neon-pink);
            text-shadow: 0 0 5px #fff;
            border: 1.5px solid #fff;
            animation: pulse-btn 1.0s infinite;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 10px var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), 0 0 15px var(--neon-cyan); }
            100% { box-shadow: 0 0 10px var(--neon-pink); }
        }

        .btn-start:disabled { 
            background: #222; 
            box-shadow: none; 
            cursor: not-allowed; 
            border: none;
            color: #555;
            animation: none;
            transform: none !important;
        }

        .btn-cashout {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000;
            box-shadow: 0 0 18px var(--neon-green);
            border: 1.5px solid #fff;
            animation: cashout-glow 0.5s infinite alternate;
        }

        @keyframes cashout-glow {
            from { box-shadow: 0 0 8px var(--neon-green); filter: brightness(1); }
            to { box-shadow: 0 0 30px var(--neon-green), 0 0 15px var(--neon-yellow); filter: brightness(1.5); }
        }

        .btn-cashout:disabled { background: #222; box-shadow: none; cursor: not-allowed; border: none; color: #555; animation: none; }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back { 
            background: #111; 
            color: #888; 
            border: 1px solid #333; 
            font-size: 0.65rem;
            padding: 3px 6px;
            box-shadow: none;
            width: auto;
        }

        .checkbox-label { 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            font-size: 0.65rem; 
            font-weight: bold;
            color: #aaa; 
            cursor: pointer; 
        }

        .checkbox-label input[type=checkbox] { 
            width: 14px; 
            height: 14px; 
            margin: 0; 
            accent-color: var(--neon-pink);
        }

        /* 💥💥💥 激化限界突破フラッシュ・超振動演出 💥💥💥 */
        body.hyper-flash-active {
            animation: hyper-body-flash 0.25s linear;
        }
        body.hyper-flash-extreme {
            animation: hyper-body-flash-extreme 0.4s linear;
        }

        @keyframes hyper-body-flash {
            0% { background-color: #fff; filter: invert(1) hue-rotate(180deg); }
            50% { background-color: var(--neon-pink); }
            100% { background-color: #000; filter: none; }
        }
        
        @keyframes hyper-body-flash-extreme {
            0% { background-color: #fff; }
            20% { background-color: var(--neon-cyan); }
            40% { background-color: var(--neon-yellow); }
            60% { background-color: var(--neon-pink); }
            100% { background-color: #000; }
        }

        .win-rainbow-shake {
            animation: hyper-rainbow-glow 0.15s linear infinite, hyper-shake-anim 0.08s ease-in-out infinite alternate;
        }

        .win-rainbow-noshake {
            animation: hyper-rainbow-glow 0.15s linear infinite;
        }

        .win-text-rainbow {
            animation: rainbow-text 0.1s linear infinite;
        }

        .num-pop {
            animation: hyper-pop-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5);
        }
        .num-pop-extreme {
            animation: hyper-pop-bounce-extreme 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.5);
        }

        @keyframes hyper-pop-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(2.0); text-shadow: 0 0 40px #ffffff, 0 0 80px var(--neon-pink), 0 0 100px var(--neon-yellow); }
            100% { transform: scale(1); }
        }
        
        @keyframes hyper-pop-bounce-extreme {
            0% { transform: scale(1); }
            50% { transform: scale(2.5) rotate(5deg); color: #fff; text-shadow: 0 0 50px #fff, 0 0 100px var(--neon-yellow), 0 0 150px var(--neon-red); }
            100% { transform: scale(1); }
        }

        .lose-shake {
            animation: hyper-lose-shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) 2;
            border-color: var(--neon-red) !important;
        }

        @keyframes hyper-rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 40px #ffff00, inset 0 0 30px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 40px #00ff00, inset 0 0 30px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 40px #00ffff, inset 0 0 30px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 40px #ff00ff, inset 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
        }

        @keyframes rainbow-text {
            0% { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            25% { color: #ffe600; text-shadow: 0 0 20px #ffe600; }
            50% { color: #00ff66; text-shadow: 0 0 20px #00ff66; }
            75% { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
            100% { color: #ff00a0; text-shadow: 0 0 20px #ff00a0; }
        }

        @keyframes hyper-shake-anim {
            0% { transform: scale(1.04) translate(2px, 2px) rotate(0deg); }
            25% { transform: scale(1.04) translate(-2px, -2px) rotate(-1.5deg); }
            50% { transform: scale(1.04) translate(-2px, 2px) rotate(1.5deg); }
            75% { transform: scale(1.04) translate(2px, -2px) rotate(-1.5deg); }
            100% { transform: scale(1.04) translate(2px, 2px) rotate(1.5deg); }
        }

        @keyframes hyper-lose-shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-12px, -6px); }
            30% { transform: translate(12px, 6px); }
            50% { transform: translate(-12px, 6px); }
            70% { transform: translate(12px, -6px); }
            90% { transform: translate(-6px, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="main-card">
        <div class="header">👑 タワーゲーム 👑</div>

        <!-- 🎰 最上部：ステータスエリア -->
        <div class="status-display" id="status-display-box">
            <div id="game-status" class="status-text">チャレンジスタートボタンを押してください</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">獲得倍率</div>
                    <div id="stat-multiplier" class="stat-val">1.00x</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">見込みGold</div>
                    <div id="stat-payout" class="stat-val">0 G</div>
                </div>
            </div>
        </div>

        <!-- 🏰 15段タワー -->
        <div id="tower-container" class="tower-container"></div>

        <!-- 🎛️ 入力エリア -->
        <div class="inputs-grid">
            <div class="input-group">
                <div class="label">💳 支払口座</div>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <div class="label">💎 賭け金 (Gold)</div>
                <input type="number" id="bet-amount" min="10" value="100" placeholder="例: 100">
            </div>
        </div>

        <!-- 🚀 アクションボタン -->
        <div class="btn-group">
            <button id="start-btn" class="btn-start">🚀 チャレンジスタート</button>
            <button id="cashout-btn" class="btn-cashout" disabled>💰 今すぐ引き出し</button>
        </div>

        <!-- ⚙️ フッターエリア -->
        <div class="footer-row">
            <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧に戻る</button>
            <label class="checkbox-label">
                <input type="checkbox" id="bgm-toggle">
                <span>🎵 音声/BGM ON</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 画面演出をオフ</span>
            </label>
        </div>
        <audio id="bgm-player" src="/templates/dopa.mp3" loop preload="auto"></audio>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    const TOTAL_FLOORS = 15;
    
    let myWalletsData = [];
    let currentGameId = null;
    let currentFloor = 0;
    let isPlaying = false;
    let activeBetAmount = 0;

    // Web Audio API によるドーパミンSE
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(!document.getElementById("bgm-toggle").checked) return;
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SAFE') {
            // タイル成功音：ピロリン♪
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 + (currentFloor * 50), now); // 階が上がるごとに音が高くなる
            osc.frequency.exponentialRampToValueAtTime(1200 + (currentFloor * 50), now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'TRAP') {
            // 地雷爆発音：ドカーン
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'CASHOUT') {
            // 利確音：チャリンチャリン
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    initTowerUI();

    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets();
        setupEventListeners();
    }

    // RTP 96.0% 倍率計算関数 (2.88倍)
    function getMultiplier(floor) {
        if (floor <= 0) return 1.0;
        return Math.floor(Math.pow(2.88, floor) * 100) / 100;
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            myWalletsData = await res.json();
            
            const select = document.getElementById("wallet-select");
            const currentSelected = select.value;

            select.innerHTML = myWalletsData.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} - 残高:${w.balance}G</option>
            `).join('');

            if (currentSelected && myWalletsData.some(w => w.wallet_id === currentSelected)) {
                select.value = currentSelected;
            }
        } catch (e) {
            console.error(e);
        }
    }

    function formatNumber(num) {
        if (num >= 1000000) return (num / 1000000).toFixed(2) + "M";
        if (num >= 1000) return (num / 1000).toFixed(1) + "k";
        return num;
    }

    function initTowerUI() {
        const container = document.getElementById("tower-container");
        container.innerHTML = "";

        for (let f = 1; f <= TOTAL_FLOORS; f++) {
            const mult = formatNumber(getMultiplier(f));
            const row = document.createElement("div");
            row.className = `tower-row ${f === 1 ? 'active' : ''}`;
            row.id = `floor-row-${f}`;

            row.innerHTML = `
                <div class="floor-num">${f}F</div>
                <div class="tiles-group">
                    <button class="tile-btn" onclick="selectTile(${f}, 0)" disabled>?</button>
                    <button class="tile-btn" onclick="selectTile(${f}, 1)" disabled>?</button>
                    <button class="tile-btn" onclick="selectTile(${f}, 2)" disabled>?</button>
                </div>
                <div class="floor-mult">${mult}x</div>
            `;
            container.appendChild(row);
        }
    }

    function setupEventListeners() {
        document.getElementById("start-btn").addEventListener("click", startGame);
        document.getElementById("cashout-btn").addEventListener("click", cashout);

        const bgmPlayer = document.getElementById("bgm-player");
        const bgmToggle = document.getElementById("bgm-toggle");

        bgmToggle.addEventListener("change", (e) => {
            if (e.target.checked) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                bgmPlayer.play().catch(err => console.log("再生ブロック解除待ち:", err));
            } else {
                bgmPlayer.pause();
            }
        });

        document.addEventListener("click", function startAudioOnFirstUserGesture() {
            if (bgmToggle.checked && bgmPlayer.paused) {
                bgmPlayer.play().catch(() => {});
            }
        }, { once: true });
    }

    // 💥💥 激化限界突破演出発生処理 💥💥
    function triggerWinEffects(floorCleared) {
        const displayBox = document.getElementById("status-display-box");
        const disableShake = document.getElementById("disable-shake").checked;
        const payoutEl = document.getElementById("stat-payout");
        const statusEl = document.getElementById("game-status");

        displayBox.className = "status-display";
        payoutEl.className = "stat-val";
        statusEl.className = "status-text";

        statusEl.classList.add("win-text-rainbow");

        if (floorCleared) {
            const clearedRow = document.getElementById(`floor-row-${floorCleared}`);
            if (clearedRow) {
                clearedRow.classList.add("just-cleared");
                setTimeout(() => clearedRow.classList.remove("just-cleared"), 400);
            }
        }

        if (disableShake) {
            displayBox.classList.add("win-rainbow-noshake");
        } else {
            displayBox.classList.add("win-rainbow-shake");
            
            // 階層が深ければ深いほど演出が過激になる
            if (currentFloor > 5) {
                payoutEl.classList.add("num-pop-extreme");
                document.body.classList.add("hyper-flash-extreme");
                setTimeout(() => document.body.classList.remove("hyper-flash-extreme"), 400);
            } else {
                payoutEl.classList.add("num-pop");
                document.body.classList.add("hyper-flash-active");
                setTimeout(() => document.body.classList.remove("hyper-flash-active"), 250);
            }
        }
    }

    function triggerLoseEffects() {
        const displayBox = document.getElementById("status-display-box");
        const disableShake = document.getElementById("disable-shake").checked;
        
        displayBox.className = "status-display";
        
        if (!disableShake) {
            displayBox.classList.add("lose-shake");
        }
    }

    function resetEffects() {
        const displayBox = document.getElementById("status-display-box");
        const payoutEl = document.getElementById("stat-payout");
        const statusEl = document.getElementById("game-status");

        displayBox.className = "status-display";
        payoutEl.className = "stat-val";
        statusEl.className = "status-text";
    }

    async function startGame() {
        const wallet_id = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value, 10);

        if (!wallet_id) return alert("口座を選択してください");
        if (!amount || amount <= 0) return alert("賭け金を正しく入力してください");

        try {
            const res = await fetch("/api/tower/start", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id, amount })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            resetEffects();
            initTowerUI();

            currentGameId = data.game_id;
            activeBetAmount = amount;
            currentFloor = 1;
            isPlaying = true;

            await loadWallets();
            updateUIState();

            const statusEl = document.getElementById("game-status");
            statusEl.innerText = "1階のブロックを1つ選んでください！";
            statusEl.style.color = "#00f3ff";

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function selectTile(floor, tileIndex) {
        if (!isPlaying || floor !== currentFloor) return;

        try {
            const res = await fetch("/api/tower/step", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ game_id: currentGameId, floor, tile_index: tileIndex })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            const row = document.getElementById(`floor-row-${floor}`);
            const buttons = row.querySelectorAll(".tile-btn");

            if (data.is_safe) {
                buttons[tileIndex].innerText = "💎";
                buttons[tileIndex].classList.add("safe");
                playSound("SAFE");

                if (data.is_cleared) {
                    isPlaying = false;
                    const statusEl = document.getElementById("game-status");
                    statusEl.innerText = `🎉 15F完全制覇！！ +${data.payout} Gold 獲得！！`;
                    
                    triggerWinEffects(floor);
                    await loadWallets();
                } else {
                    const clearedFloor = currentFloor;
                    currentFloor = data.next_floor;
                    const statusEl = document.getElementById("game-status");
                    statusEl.innerText = `見事命中！ (${data.multiplier}x) ${currentFloor}階に進みます。`;
                    statusEl.style.color = "#00ff66";

                    triggerWinEffects(clearedFloor);
                }
            } else {
                buttons[tileIndex].innerText = "💣";
                buttons[tileIndex].classList.add("trap");
                playSound("TRAP");
                
                if (buttons[data.safe_tile]) {
                    buttons[data.safe_tile].innerText = "💎";
                }

                isPlaying = false;
                const statusEl = document.getElementById("game-status");
                statusEl.innerText = `💀 罠を踏みました！ゲームオーバー... (-${activeBetAmount} G)`;
                statusEl.style.color = "#ff003c";

                triggerLoseEffects();
            }

            updateUIState();

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function cashout() {
        if (!isPlaying || currentFloor <= 1) return;

        try {
            const res = await fetch("/api/tower/cashout", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ game_id: currentGameId })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.detail || "エラーが発生しました");

            isPlaying = false;
            playSound("CASHOUT");
            const statusEl = document.getElementById("game-status");
            statusEl.innerText = `💰 キャッシュアウト成功！ +${data.payout} Gold 獲得！`;

            triggerWinEffects();
            await loadWallets();
            updateUIState();

        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    function updateUIState() {
        document.getElementById("start-btn").disabled = isPlaying;
        document.getElementById("wallet-select").disabled = isPlaying;
        document.getElementById("bet-amount").disabled = isPlaying;
        document.getElementById("cashout-btn").disabled = !isPlaying || currentFloor <= 1;

        const mult = isPlaying && currentFloor > 1 ? getMultiplier(currentFloor - 1) : (isPlaying ? 1.0 : 0);
        const payout = Math.floor(activeBetAmount * mult);
        document.getElementById("stat-multiplier").innerText = formatNumber(mult) + "x";
        document.getElementById("stat-payout").innerText = payout + " G";

        for (let f = 1; f <= TOTAL_FLOORS; f++) {
            const row = document.getElementById(`floor-row-${f}`);
            if (!row) continue;
            
            const buttons = row.querySelectorAll(".tile-btn");
            row.classList.remove("active", "cleared");

            if (f === currentFloor && isPlaying) {
                row.classList.add("active");
                buttons.forEach(btn => {
                    if (!btn.classList.contains("safe") && !btn.classList.contains("trap")) {
                        btn.disabled = false;
                    }
                });
            } else {
                if (f < currentFloor) row.classList.add("cleared");
                buttons.forEach(btn => btn.disabled = true);
            }
        }
    }

    function escapeHtml(str) { 
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
    }
</script>
