<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>THE 2048 - 王国知能遊戯</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #0b0f19;
            --grid-bg: rgba(20, 25, 40, 0.8);
            --cell-bg: rgba(255, 255, 255, 0.03);
            --text-color: #e2e8f0;
            --gap: 12px;
            --board-size: calc(100vw - 40px);
            --max-board: 400px;
        }

        body {
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
            background: radial-gradient(circle at center, #151a2d 0%, #05070a 100%);
        }

        .header-area {
            width: 100%; max-width: var(--max-board); display: flex; justify-content: space-between;
            align-items: center; padding: 30px 20px 20px; box-sizing: border-box;
        }
        
        .title-box h1 { margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .title-box p { margin: 4px 0 0; font-size: 0.8rem; color: #64748b; letter-spacing: 1px; }

        .score-container {
            display: flex; gap: 10px;
        }
        .score-box {
            background: rgba(0, 0, 0, 0.5); border: 1px solid #2d3748; border-radius: 8px;
            padding: 8px 15px; text-align: center; min-width: 70px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .score-label { font-size: 0.65rem; color: #a0aec0; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px; }
        .score-value { font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: 900; color: #fff; }

        /* Board */
        .board-wrapper {
            position: relative; width: var(--board-size); height: var(--board-size); max-width: var(--max-board); max-height: var(--max-board);
            background: var(--grid-bg); border-radius: 12px; padding: var(--gap); box-sizing: border-box;
            border: 1px solid #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
        }

        .grid-bg {
            display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--gap);
            width: 100%; height: 100%; position: absolute; top: var(--gap); left: var(--gap);
            width: calc(100% - var(--gap)*2); height: calc(100% - var(--gap)*2);
        }
        .grid-cell { background: var(--cell-bg); border-radius: 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }

        .tile-container { position: absolute; top: var(--gap); left: var(--gap); width: calc(100% - var(--gap)*2); height: calc(100% - var(--gap)*2); pointer-events: none; }
        
        .tile {
            position: absolute; display: flex; justify-content: center; align-items: center;
            border-radius: 8px; font-weight: 900; font-size: 2rem; color: #fff;
            transition: transform 0.15s ease-in-out;
            will-change: transform;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Tile Stylings */
        .tile[data-val="2"] { background: #1e293b; color: #cbd5e0; }
        .tile[data-val="4"] { background: #334155; color: #fff; }
        .tile[data-val="8"] { background: linear-gradient(135deg, #d97706, #b45309); text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .tile[data-val="16"] { background: linear-gradient(135deg, #ea580c, #c2410c); }
        .tile[data-val="32"] { background: linear-gradient(135deg, #e11d48, #be123c); }
        .tile[data-val="64"] { background: linear-gradient(135deg, #9333ea, #7e22ce); }
        .tile[data-val="128"] { background: linear-gradient(135deg, #4f46e5, #4338ca); font-size: 1.8rem; box-shadow: 0 0 15px rgba(79, 70, 229, 0.4); }
        .tile[data-val="256"] { background: linear-gradient(135deg, #0284c7, #0369a1); font-size: 1.8rem; box-shadow: 0 0 20px rgba(2, 132, 199, 0.5); }
        .tile[data-val="512"] { background: linear-gradient(135deg, #059669, #047857); font-size: 1.8rem; box-shadow: 0 0 25px rgba(5, 150, 105, 0.6); }
        .tile[data-val="1024"] { background: linear-gradient(135deg, #d946ef, #a21caf); font-size: 1.5rem; box-shadow: 0 0 30px rgba(217, 70, 239, 0.7); }
