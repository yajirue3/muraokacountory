<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 - Strategic Merge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-base: #09090b;
            --board-bg: #18181b;
            --cell-bg: rgba(255, 255, 255, 0.04);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --gap: 10px;
            --board-padding: 12px;
            --transition-speed: 130ms;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
            background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
        }

        .header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-area h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #fff;
            line-height: 1;
        }

        .title-area p {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 16px;
            text-align: center;
            min-width: 90px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .score-title {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .score-val {
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        /* 盤面レイアウト */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            background: var(--board-bg);
            border-radius: 14px;
            padding: var(--board-padding);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .grid-bg {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: var(--gap);
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: var(--cell-bg);
            border-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        /* タイルアニメーション層 */
        .tile-layer {
            position: absolute;
            top: var(--board-padding);
            left: var(--board-padding);
            right: var(--board-padding);
            bottom: var(--board-padding);
            pointer-events: none;
        }

        /* 外側のラッパーで移動アニメーションを処理 */
        .tile-wrapper {
            position: absolute;
            width: calc(25% - (var(--gap) * 3 / 4));
            height: calc(25% - (var(--gap) * 3 / 4));
            top: 0; left: 0;
            transition: transform var(--transition-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
            /* c(列)とr(行)の変数を使って絶対位置を計算 */
            transform: translate(
                calc(var(--c) * 100% + var(--c) * var(--gap)), 
                calc(var(--r) * 100% + var(--r) * var(--gap))
            );
        }

        /* 内側の要素で色・サイズ・ポップアップを処理 */
        .tile-inner {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            transition: background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 色彩設計（モダン・ルミナス） */
        .tile-2    { background: rgba(255,255,255,0.08); color: #e4e4e7; box-shadow: none; border: 1px solid rgba(255,255,255,0.05); }
        .tile-4    { background: rgba(255,255,255,0.15); color: #fff; box-shadow: none; border: 1px solid rgba(255,255,255,0.1); }
        .tile-8    { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .tile-16   { background: linear-gradient(135deg, #f97316, #ea580c); }
        .tile-32   { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .tile-64   { background: linear-gradient(135deg, #ec4899, #be185d); }
        .tile-128  { background: linear-gradient(135deg, #8b5cf6, #6d28d9); font-size: 1.5rem; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        .tile-256  { background: linear-gradient(135deg, #3b82f6, #2563eb); font-size: 1.5rem; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .tile-512  { background: linear-gradient(135deg, #10b981, #059669); font-size: 1.5rem; box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
        .tile-1024 { background: linear-gradient(135deg, #14b8a6, #0d9488); font-size: 1.25rem; box-shadow: 0 0 30px rgba(20, 184, 166, 0.7); }
        .tile-2048, .tile-4096 { 
            background: linear-gradient(135deg, #fbbf24, #f59e0b); 
            color: #451a03; 
            font-size: 1.25rem; 
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.8), inset 0 0 10px rgba(255,255,255,0.6);
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        /* ポップアニメーション */
        .pop-in { animation: popIn 250ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .pop-merge { animation: popMerge 200ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes popMerge {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); box-shadow: 0 0 30px rgba(255,255,255,0.5); }
            100% { transform: scale(1); }
        }

        /* コントロール */
        .controls {
            width: 100%;
            max-width: 380px;
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active { transform: scale(0.96); }
        .btn-restart { background: #fff; color: #09090b; }
        .btn-back { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); flex: 0.5; }

        /* リザルトモーダル */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #18181b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 340px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            transform: translateY(20px);
            opacity: 0;
            animation: modalFade 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes modalFade {
            to { transform: translateY(0); opacity: 1; }
        }

        .elite-tag {
            display: none;
            color: #fbbf24;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }

        .modal-score {
            font-size: 3.5rem;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            margin: 10px 0 24px;
            font-variant-numeric: tabular-nums;
        }

        .leaderboard {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
            color: #a1a1aa;
        }
        .lb-row:last-child { border-bottom: none; }
        .lb-top { color: #fbbf24; font-weight: 700; }
    </style>
</head>
<body>

<div class="header">
    <div class="title-area">
        <h1>2048</h1>
        <p>STRATEGIC MERGE</p>
    </div>
    <div class="score-box">
        <div class="score-title">SCORE</div>
        <div class="score-val" id="score-display">0</div>
    </div>
</div>

<div class="board-container" id="touch-area">
    <div class="grid-bg">
        <!-- 16個の背景マス -->
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div class="tile-layer" id="tile-layer"></div>
</div>

<div class="controls">
    <button class="btn btn-back" onclick="location.href='/casino'">退出</button>
    <button class="btn btn-restart" onclick="resetGame()">RESTART</button>
</div>

<div class="overlay" id="overlay">
    <div class="modal-content">
        <div class="elite-tag" id="elite-badge">👑 ELITE RANK IN</div>
        <div style="font-size: 0.75rem; color: #a1a1aa; font-weight: 700; letter-spacing: 1px;">FINAL SCORE</div>
        <div class="modal-score" id="final-score">0</div>
        <div class="leaderboard" id="leaderboard">
            <div style="text-align:center; color:#a1a1aa; font-size:0.75rem; padding: 10px;">記録を同期中...</div>
        </div>
        <button class="btn btn-restart" style="width: 100%; background: #fff; color: #000;" onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
    function getAuthToken() {
        return localStorage.getItem("access_token") || localStorage.getItem("token") || localStorage.getItem("sb-access-token") || "";
    }

    let grid = Array(4).fill(null).map(() => Array(4).fill(null));
    let tiles = []; // 画面上の全タイル要素の参照
    let tileIdSeq = 0;
    let score = 0;
    let isGameOver = false;

    const layer = document.getElementById("tile-layer");
    const scoreDisplay = document.getElementById("score-display");
    const overlay = document.getElementById("overlay");
    const eliteBadge = document.getElementById("elite-badge");

    // iOS等のスクロールバウンス防止
    document.addEventListener("touchmove", (e) => {
        if (e.target.closest('.board-container')) e.preventDefault();
    }, { passive: false });

    function createTile(r, c, val) {
        const wrapper = document.createElement("div");
        wrapper.className = "tile-wrapper";
        
        const inner = document.createElement("div");
        inner.className = `tile-inner tile-${val}`;
        inner.innerText = val;
        
        wrapper.appendChild(inner);
        layer.appendChild(wrapper);

        const tile = {
            id: tileIdSeq++,
            r, c, val,
            wrapper, inner,
            isNew: true,
            isMerged: false,
            isDeleted: false,
            mergedFrom: []
        };
        tiles.push(tile);
        return tile;
    }

    function addRandomTile() {
        const empties = [];
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (!grid[r][c]) empties.push({ r, c });
            }
        }
        if (empties.length === 0) return;
        const spot = empties[Math.floor(Math.random() * empties.length)];
        grid[spot.r][spot.c] = createTile(spot.r, spot.c, Math.random() < 0.9 ? 2 : 4);
    }

    function renderDOM() {
        scoreDisplay.innerText = score;
        let activeTiles = [];

        tiles.forEach(t => {
            // CSS変数に座標を渡して滑らかに移動させる
            t.wrapper.style.setProperty('--c', t.c);
            t.wrapper.style.setProperty('--r', t.r);

            if (t.isNew && !t.isMerged) {
                t.inner.classList.add('pop-in');
                t.isNew = false;
            }

            if (t.isMerged) {
                t.wrapper.style.zIndex = 10;
                t.inner.style.transform = "scale(0)"; // スライド完了まで非表示
                setTimeout(() => {
                    t.inner.className = `tile-inner tile-${t.val > 2048 ? 2048 : t.val} pop-merge`;
                    t.inner.innerText = t.val;
                    t.inner.style.transform = "";
                }, 130); // 移行速度に合わせる
                t.isMerged = false;
            }

            if (t.isDeleted) {
                t.wrapper.style.zIndex = 1; // 下敷きになる
                setTimeout(() => t.wrapper.remove(), 130);
            } else {
                activeTiles.push(t);
            }
        });
        tiles = activeTiles; // 削除予定の参照を配列から外す
    }

    function resetGame() {
        layer.innerHTML = "";
        grid = Array(4).fill(null).map(() => Array(4).fill(null));
        tiles = [];
        score = 0;
        isGameOver = false;
        overlay.style.display = "none";
        eliteBadge.style.display = "none";
        addRandomTile();
        addRandomTile();
        renderDOM();
    }

    function operate(dir) {
        if (isGameOver) return;

        let moved = false;
        let gainedScore = 0;
        const oldPositions = new Map(tiles.map(t => [t.id, {r: t.r, c: t.c}]));
        
        const newGrid = Array(4).fill(null).map(() => Array(4).fill(null));

        for (let i = 0; i < 4; i++) {
            let line = [];
            for (let j = 0; j < 4; j++) {
                let r = (dir === "UP" || dir === "DOWN") ? j : i;
                let c = (dir === "LEFT" || dir === "RIGHT") ? j : i;
                if (grid[r][c]) line.push(grid[r][c]);
            }

            if (dir === "RIGHT" || dir === "DOWN") line.reverse();

            let newLine = [];
            for (let k = 0; k < line.length; k++) {
                if (k < line.length - 1 && line[k].val === line[k+1].val && !line[k].isDeleted && !line[k+1].isDeleted) {
                    let val = line[k].val * 2;
                    gainedScore += val;
                    
                    let newTile = createTile(0, 0, val);
                    newTile.isMerged = true;
                    newTile.mergedFrom = [line[k], line[k+1]];
                    line[k].isDeleted = true;
                    line[k+1].isDeleted = true;
                    newLine.push(newTile);
                    k++;
                } else {
                    newLine.push(line[k]);
                }
            }

            while (newLine.length < 4) newLine.push(null);
            if (dir === "RIGHT" || dir === "DOWN") newLine.reverse();

            for (let j = 0; j < 4; j++) {
                let r = (dir === "UP" || dir === "DOWN") ? j : i;
                let c = (dir === "LEFT" || dir === "RIGHT") ? j : i;
                let t = newLine[j];

                newGrid[r][c] = t;
                if (t) {
                    t.r = r; t.c = c;
                    if (t.isMerged) {
                        t.mergedFrom[0].r = r; t.mergedFrom[0].c = c;
                        t.mergedFrom[1].r = r; t.mergedFrom[1].c = c;
                    }
                }
            }
        }

        grid = newGrid;

        tiles.forEach(t => {
            let old = oldPositions.get(t.id);
            if (old && (old.r !== t.r || old.c !== t.c)) moved = true;
        });
        if (gainedScore > 0) moved = true;

        if (moved) {
            score += gainedScore;
            addRandomTile();
            renderDOM();
            checkGameOver();
        }
    }

    function checkGameOver() {
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (!grid[r][c]) return;
                if (c < 3 && grid[r][c].val === grid[r][c+1].val) return;
                if (r < 3 && grid[r][c].val === grid[r+1][c].val) return;
            }
        }
        isGameOver = true;
        setTimeout(handleFinish, 500); // 最後の動きを見せてからリザルトへ
    }

    async function handleFinish() {
        document.getElementById("final-score").innerText = score;
        overlay.style.display = "flex";

        let maxTile = 0;
        for (let r = 0; r < 4; r++) {
            for (let c = 0; c < 4; c++) {
                if (grid[r][c] && grid[r][c].val > maxTile) maxTile = grid[r][c].val;
            }
        }

        const token = getAuthToken();
        const lbEl = document.getElementById("leaderboard");
        
        if (!token) {
            lbEl.innerHTML = '<div style="text-align:center; color:#a1a1aa; font-size:0.8rem; padding:10px;">ゲストプレイ</div>';
            return;
        }

        try {
            const res = await fetch("/api/2048/score", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ score: score, max_tile: maxTile })
            });
            const data = await res.json();

            if (data.my_rank && data.my_rank <= 3) {
                eliteBadge.style.display = "block";
            }

            if (data.ranking) {
                lbEl.innerHTML = "";
                data.ranking.forEach((entry, idx) => {
                    const row = document.createElement("div");
                    row.className = `lb-row ${idx < 3 ? "lb-top" : ""}`;
                    row.innerHTML = `<span>${idx + 1}. ${escapeHtml(entry.nickname)}</span><span>${entry.score.toLocaleString()}</span>`;
                    lbEl.appendChild(row);
                });
            }
        } catch (e) {
            lbEl.innerHTML = '<div style="text-align:center; color:#ef4444; font-size:0.8rem; padding:10px;">通信エラー</div>';
        }
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t]));
    }

    // 操作系イベント
    window.addEventListener("keydown", (e) => {
        if (["ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); operate("UP"); }
        if (["ArrowDown", "KeyS"].includes(e.code)) { e.preventDefault(); operate("DOWN"); }
        if (["ArrowLeft", "KeyA"].includes(e.code)) { e.preventDefault(); operate("LEFT"); }
        if (["ArrowRight", "KeyD"].includes(e.code)) { e.preventDefault(); operate("RIGHT"); }
    }, { passive: false });

    const touchArea = document.getElementById("touch-area");
    let startX = 0, startY = 0;

    touchArea.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, { passive: true });

    touchArea.addEventListener("touchend", (e) => {
        if (isGameOver) return;
        const diffX = e.changedTouches[0].clientX - startX;
        const diffY = e.changedTouches[0].clientY - startY;

        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (Math.abs(diffX) > 20) operate(diffX > 0 ? "RIGHT" : "LEFT");
        } else {
            if (Math.abs(diffY) > 20) operate(diffY > 0 ? "DOWN" : "UP");
        }
    }, { passive: true });

    resetGame();
</script>
</body>
</html>
