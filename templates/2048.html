<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap');

        :root {
            --bg-color: #faf8ef;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
            --board-bg: #bbada0;
            --cell-bg: rgba(238, 228, 218, 0.35);
            --gap: 12px;
            --board-padding: 12px;
            --transition-speed: 130ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 16px; overflow: hidden;
        }

        .header-top {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;
        }

        .title { font-size: 3.2rem; font-weight: 700; color: var(--text-dark); line-height: 1; letter-spacing: -1px; }
        
        .scores-container { display: flex; gap: 8px; }
        .score-box { background: var(--board-bg); border-radius: 6px; padding: 6px 16px; text-align: center; min-width: 70px; color: white; }
        .score-label { font-size: 0.7rem; font-weight: 700; color: #eee4da; text-transform: uppercase; margin-bottom: 2px; }
        .score-val { font-size: 1.25rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }

        .controls-row {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 10px;
        }

        .action-btn {
            background: #8f7a66; color: var(--text-light); border: none; border-radius: 6px;
            padding: 10px 16px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.15s; flex: 1; text-align: center; text-decoration: none;
        }
        .action-btn:active { background: #9f8b77; }
        .btn-secondary { background: var(--board-bg); }

        .board-container {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
            background: var(--board-bg); border-radius: 8px; padding: var(--board-padding);
        }

        .grid-bg { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: var(--gap); width: 100%; height: 100%; }
        .grid-cell { background: var(--cell-bg); border-radius: 4px; }

        .tile-layer { position: absolute; top: var(--board-padding); left: var(--board-padding); right: var(--board-padding); bottom: var(--board-padding); pointer-events: none; }
        .tile-wrapper {
            position: absolute; width: calc(25% - (var(--gap) * 3 / 4)); height: calc(25% - (var(--gap) * 3 / 4)); top: 0; left: 0;
            transition: transform var(--transition-speed) ease-in-out;
            transform: translate(calc(var(--c) * 100% + var(--c) * var(--gap)), calc(var(--r) * 100% + var(--r) * var(--gap)));
        }
        .tile-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 4px;
            font-size: 2.2rem; font-weight: 700; transition: background-color 0.15s;
        }

        /* Classic Colors */
        .tile-2    { background: #eee4da; color: #776e65; }
        .tile-4    { background: #ede0c8; color: #776e65; }
        .tile-8    { background: #f2b179; color: #f9f6f2; }
        .tile-16   { background: #f59563; color: #f9f6f2; }
        .tile-32   { background: #f67c5f; color: #f9f6f2; }
        .tile-64   { background: #f65e3b; color: #f9f6f2; }
        .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 1.8rem; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.3) inset; }
        .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 1.8rem; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.4) inset; }
        .tile-512  { background: #edc850; color: #f9f6f2; font-size: 1.8rem; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.5) inset; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.6) inset; }
        .tile-2048, .tile-4096 { background: #edc22e; color: #f9f6f2; font-size: 1.5rem; box-shadow: 0 0 30px 10px rgba(243, 215, 116, 0.7) inset; }

        .pop-in { animation: popIn 200ms ease forwards; }
        .pop-merge { animation: popMerge 200ms ease forwards; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes popMerge { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* モーダル汎用 */
        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(238, 228, 218, 0.75); backdrop-filter: blur(3px);
            z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #faf8ef; border: 2px solid var(--board-bg); border-radius: 8px; width: 100%; max-width: 360px;
            padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ランキング用UI */
        .tab-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px; background: var(--board-bg); color: #fff; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; opacity: 0.6; }
        .tab-btn.active { opacity: 1; background: #8f7a66; }
        
        .leaderboard {
            background: #fff; border: 1px solid var(--board-bg); border-radius: 6px; padding: 12px; margin-bottom: 15px;
            max-height: 250px; overflow-y: auto; text-align: left;
        }
        .lb-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; font-weight: 700; color: var(--text-dark); }
        .lb-row:last-child { border-bottom: none; }
        .lb-top { color: #f67c5f; }

        .modal-title { font-size: 1.8rem; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="header-top">
    <div class="title">2048</div>
    <div class="scores-container">
        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="score-display">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-val" id="best-display">0</div>
        </div>
    </div>
</div>

<div class="controls-row">
    <a href="/games" class="action-btn btn-secondary">戻る</a>
    <button class="action-btn btn-secondary" onclick="openRankingModal()">ランキング</button>
    <button class="action-btn" onclick="resetGame()">ニューゲーム</button>
</div>

<div class="board-container" id="touch-area">
    <div class="grid-bg">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div class="tile-layer" id="tile-layer"></div>
</div>

<!-- 汎用モーダル (ゲームオーバー ＆ ランキング共通) -->
<div class="overlay" id="overlay">
    <div class="modal-content">
        <div class="modal-title" id="modal-main-title">Game Over!</div>
        
        <!-- タブ（ランキング表示時のみ） -->
        <div class="tab-row" id="ranking-tabs">
            <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">Daily Top 10</button>
            <button class="tab-btn" id="tab-alltime" onclick="switchTab('alltime')">All-Time Top 10</button>
        </div>

        <div class="leaderboard" id="leaderboard">
            <div style="text-align:center; color:#bbada0; font-size:0.85rem;">データ取得中...</div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="action-btn btn-secondary" id="btn-close-modal" onclick="closeModal()">閉じる</button>
            <button class="action-btn" id="btn-restart-modal" onclick="resetGame()">再挑戦</button>
        </div>
    </div>
</div>

<script>
    function getAuthToken() { return localStorage.getItem("access_token") || localStorage.getItem("token") || ""; }

    let grid = Array(4).fill(null).map(() => Array(4).fill(null));
    let tiles = [];
    let tileIdSeq = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem("2048_best")) || 0;
    let isGameOver = false;

    let rankingData = { daily: [], alltime: [] };

    const layer = document.getElementById("tile-layer");
    const scoreDisplay = document.getElementById("score-display");
    const bestDisplay = document.getElementById("best-display");
    const overlay = document.getElementById("overlay");
    const lbEl = document.getElementById("leaderboard");

    bestDisplay.innerText = bestScore;

    document.addEventListener("touchmove", (e) => { if (e.target.closest('.board-container')) e.preventDefault(); }, { passive: false });

    function createTile(r, c, val) {
        const wrapper = document.createElement("div");
        wrapper.className = "tile-wrapper";
        const inner = document.createElement("div");
        inner.className = `tile-inner tile-${val}`;
        inner.innerText = val;
        wrapper.appendChild(inner);
        layer.appendChild(wrapper);
        const tile = { id: tileIdSeq++, r, c, val, wrapper, inner, isNew: true, isMerged: false, isDeleted: false, mergedFrom: [] };
        tiles.push(tile);
        return tile;
    }

    function addRandomTile() {
        const empties = [];
        for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (!grid[r][c]) empties.push({r, c});
        if (empties.length === 0) return;
        const spot = empties[Math.floor(Math.random() * empties.length)];
        grid[spot.r][spot.c] = createTile(spot.r, spot.c, Math.random() < 0.9 ? 2 : 4);
    }

    function renderDOM() {
        scoreDisplay.innerText = score;
        if (score > bestScore) {
            bestScore = score;
            bestDisplay.innerText = bestScore;
            localStorage.setItem("2048_best", bestScore);
        }

        let activeTiles = [];
        tiles.forEach(t => {
            t.wrapper.style.setProperty('--c', t.c);
            t.wrapper.style.setProperty('--r', t.r);
            if (t.isNew && !t.isMerged) { t.inner.classList.add('pop-in'); t.isNew = false; }
            if (t.isMerged) {
                t.wrapper.style.zIndex = 10;
                t.inner.style.transform = "scale(0)";
                setTimeout(() => {
                    t.inner.className = `tile-inner tile-${t.val > 2048 ? 2048 : t.val} pop-merge`;
                    t.inner.innerText = t.val;
                    t.inner.style.transform = "";
                }, 130);
                t.isMerged = false;
            }
            if (t.isDeleted) {
                t.wrapper.style.zIndex = 1;
                setTimeout(() => t.wrapper.remove(), 130);
            } else activeTiles.push(t);
        });
        tiles = activeTiles;
    }

    function resetGame() {
        layer.innerHTML = "";
        grid = Array(4).fill(null).map(() => Array(4).fill(null));
        tiles = [];
        score = 0;
        isGameOver = false;
        closeModal();
        addRandomTile(); addRandomTile();
        renderDOM();
    }

    function operate(dir) {
        if (isGameOver) return;
        let moved = false, gainedScore = 0;
        const oldPositions = new Map(tiles.map(t => [t.id, {r: t.r, c: t.c}]));
        const newGrid = Array(4).fill(null).map(() => Array(4).fill(null));

        for (let i = 0; i < 4; i++) {
            let line = [];
            for (let j = 0; j < 4; j++) {
                let r = (dir === "UP" || dir === "DOWN") ? j : i;
                let c = (dir === "LEFT" || dir === "RIGHT") ? j : i;
                if (grid[r][c]) line.push(grid[r][c]);
            }
            if (dir === "RIGHT" || dir === "DOWN") line.reverse();

            let newLine = [];
            for (let k = 0; k < line.length; k++) {
                if (k < line.length - 1 && line[k].val === line[k+1].val && !line[k].isDeleted && !line[k+1].isDeleted) {
                    let val = line[k].val * 2;
                    gainedScore += val;
                    let newTile = createTile(0, 0, val);
                    newTile.isMerged = true; newTile.mergedFrom = [line[k], line[k+1]];
                    line[k].isDeleted = true; line[k+1].isDeleted = true;
                    newLine.push(newTile); k++;
                } else newLine.push(line[k]);
            }

            while (newLine.length < 4) newLine.push(null);
            if (dir === "RIGHT" || dir === "DOWN") newLine.reverse();

            for (let j = 0; j < 4; j++) {
                let r = (dir === "UP" || dir === "DOWN") ? j : i;
                let c = (dir === "LEFT" || dir === "RIGHT") ? j : i;
                let t = newLine[j];
                newGrid[r][c] = t;
                if (t) {
                    t.r = r; t.c = c;
                    if (t.isMerged) { t.mergedFrom[0].r = r; t.mergedFrom[0].c = c; t.mergedFrom[1].r = r; t.mergedFrom[1].c = c; }
                }
            }
        }

        grid = newGrid;
        tiles.forEach(t => { let old = oldPositions.get(t.id); if (old && (old.r !== t.r || old.c !== t.c)) moved = true; });
        if (gainedScore > 0) moved = true;

        if (moved) {
            score += gainedScore;
            addRandomTile(); renderDOM(); checkGameOver();
        }
    }

    function checkGameOver() {
        for (let r=0; r<4; r++) for (let c=0; c<4; c++) {
            if (!grid[r][c]) return;
            if (c<3 && grid[r][c].val === grid[r][c+1].val) return;
            if (r<3 && grid[r][c].val === grid[r+1][c].val) return;
        }
        isGameOver = true;
        setTimeout(handleFinish, 600);
    }

    async function handleFinish() {
        document.getElementById("modal-main-title").innerText = "Game Over!";
        document.getElementById("btn-close-modal").style.display = "none";
        document.getElementById("btn-restart-modal").style.display = "block";
        overlay.style.display = "flex";

        let maxTile = 0;
        for (let r=0; r<4; r++) for (let c=0; c<4; c++) if (grid[r][c] && grid[r][c].val > maxTile) maxTile = grid[r][c].val;

        const token = getAuthToken();
        if (!token) { renderRankings([]); return; }

        try {
            const res = await fetch("/api/2048/score", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ score, max_tile: maxTile })
            });
            const data = await res.json();
            rankingData = { daily: data.daily || [], alltime: data.alltime || [] };
            switchTab('daily');
        } catch (e) { lbEl.innerHTML = '<div style="text-align:center; color:#f67c5f; font-size:0.9rem;">通信エラー</div>'; }
    }

    async function openRankingModal() {
        document.getElementById("modal-main-title").innerText = "Ranking";
        document.getElementById("btn-close-modal").style.display = "block";
        document.getElementById("btn-restart-modal").style.display = isGameOver ? "block" : "none";
        overlay.style.display = "flex";

        try {
            const res = await fetch("/api/2048/ranking");
            const data = await res.json();
            rankingData = { daily: data.daily || [], alltime: data.alltime || [] };
            switchTab('daily');
        } catch(e) { lbEl.innerHTML = '<div style="text-align:center; color:#f67c5f; font-size:0.9rem;">通信エラー</div>'; }
    }

    function switchTab(type) {
        document.getElementById("tab-daily").className = type === 'daily' ? "tab-btn active" : "tab-btn";
        document.getElementById("tab-alltime").className = type === 'alltime' ? "tab-btn active" : "tab-btn";
        renderRankings(rankingData[type]);
    }

    function renderRankings(list) {
        lbEl.innerHTML = "";
        if (list.length === 0) {
            lbEl.innerHTML = '<div style="text-align:center; color:#bbada0; font-size:0.85rem;">データがありません</div>';
            return;
        }
        list.forEach((entry, idx) => {
            const row = document.createElement("div");
            row.className = `lb-row ${idx < 3 ? "lb-top" : ""}`;
            row.innerHTML = `<span>${idx + 1}. ${escapeHtml(entry.nickname)}</span><span>${entry.score.toLocaleString()}</span>`;
            lbEl.appendChild(row);
        });
    }

    function closeModal() { overlay.style.display = "none"; }
    function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t])); }

    window.addEventListener("keydown", (e) => {
        if (["ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); operate("UP"); }
        if (["ArrowDown", "KeyS"].includes(e.code)) { e.preventDefault(); operate("DOWN"); }
        if (["ArrowLeft", "KeyA"].includes(e.code)) { e.preventDefault(); operate("LEFT"); }
        if (["ArrowRight", "KeyD"].includes(e.code)) { e.preventDefault(); operate("RIGHT"); }
    }, { passive: false });

    const touchArea = document.getElementById("touch-area");
    let startX = 0, startY = 0;
    touchArea.addEventListener("touchstart", e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, { passive: true });
    touchArea.addEventListener("touchend", e => {
        if (isGameOver) return;
        const diffX = e.changedTouches[0].clientX - startX, diffY = e.changedTouches[0].clientY - startY;
        if (Math.abs(diffX) > Math.abs(diffY)) { if (Math.abs(diffX) > 20) operate(diffX > 0 ? "RIGHT" : "LEFT"); } 
        else { if (Math.abs(diffY) > 20) operate(diffY > 0 ? "DOWN" : "UP"); }
    }, { passive: true });

    resetGame();
</script>
</body>
</html>
