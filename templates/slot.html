<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - IMPERIAL JUGGLER VIP</title>
    <style>
        /* ==========================================================================
           HYPER DOPAMINE UI FONTS
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=M+PLUS+1p:wght@400;700;900&family=Playfair+Display:ital,wght@1,900&family=Righteous&family=Share+Tech+Mono&display=swap');

        /* ==========================================================================
           OVERDOSE VARIABLES
           ========================================================================== */
        :root {
            --vip-bg: #070014;
            --vip-panel: rgba(15, 5, 25, 0.95);
            --gold-light: #fff5a0;
            --gold-base: #ffd700;
            --gold-dark: #b8860b;
            --neon-magenta: #ff007f;
            --neon-cyan: #00ffff;
            --neon-purple: #9d00ff;
            --alert-red: #ff0033;
            --gold-gradient: linear-gradient(135deg, #fff5a0 0%, #ffd700 25%, #b8860b 50%, #ffd700 75%, #fff5a0 100%);
            --sym-h: 100px; 
        }

        /* ==========================================================================
           RESET & BASE
           ========================================================================== */
        * { box-sizing: border-box; touch-action: manipulation; }
        
        body { 
            font-family: 'M PLUS 1p', sans-serif; 
            margin: 0; 
            min-height: 100dvh;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--vip-bg);
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(157, 0, 255, 0.15) 0%, transparent 40%);
            background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
            background-position: center center;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            position: relative;
        }

        /* ==========================================================================
           CABINET (LUXURY NEON CASING)
           ========================================================================== */
        .arcade-cabinet {
            width: 100%;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: max(env(safe-area-inset-top), 20px) 15px max(env(safe-area-inset-bottom), 30px) 15px;
            gap: 15px;
            max-width: 600px;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            body { align-items: center; }
            .arcade-cabinet {
                max-width: 800px;
                min-height: auto;
                height: 96vh;
                background: linear-gradient(to bottom, #110022 0%, #05000a 100%);
                border-radius: 20px;
                padding: 30px 40px;
                gap: 20px;
                border: 2px solid var(--neon-cyan);
                box-shadow: 
                    0 20px 60px rgba(0,0,0,0.9),
                    0 0 40px rgba(0, 255, 255, 0.3),
                    inset 0 0 30px rgba(157, 0, 255, 0.3);
            }
        }

        /* ==========================================================================
           MARQUEE & NOTICE
           ========================================================================== */
        .marquee {
            text-align: center;
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            color: var(--gold-base);
            background: var(--gold-gradient);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            padding: 10px;
            letter-spacing: 4px;
            text-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
            position: relative;
            animation: shine-gold 3s infinite linear;
        }

        .marquee.active {
            font-family: 'Righteous', cursive;
            background: linear-gradient(90deg, #fff, var(--neon-cyan), #fff);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 10px #fff;
            transform: scale(1.02);
            animation: shine-gold 1s infinite linear;
        }

        .marquee.jackpot {
            font-family: 'Righteous', cursive;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow: 0 0 30px #ff00ff, 0 0 15px #fff;
            animation: marquee-rush 0.5s infinite linear;
            letter-spacing: 6px;
            transform: scale(1.08);
        }

        .notice-banner {
            width: 100%;
            background: rgba(0, 243, 255, 0.15);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            font-family: 'M PLUS 1p', sans-serif;
            font-size: 0.75rem;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: -5px;
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* ==========================================================================
           HUD PANEL (LUXURY BORDERS)
           ========================================================================== */
        .hud-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--vip-panel);
            border: 2px solid var(--neon-purple);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(157, 0, 255, 0.4);
            position: relative;
            transition: all 0.1s;
        }
        
        .inputs-row { display: flex; gap: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { 
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; color: var(--gold-base); 
            font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 0 5px var(--gold-dark);
        }
        .input-group select, .input-group input { 
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--neon-purple); 
            border-radius: 6px;
            color: #fff; 
            font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: bold;
            outline: none;
            transition: all 0.2s;
        }
        .input-group select:focus, .input-group input:focus { 
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan); 
            background: #111;
        }
        
        .meters-row { display: flex; gap: 15px; margin-top: 5px; }
        .meter {
            flex: 1; 
            background: #000; 
            border: 2px solid var(--gold-dark);
            border-radius: 8px;
            padding: 12px 15px; text-align: right; position: relative;
            box-shadow: inset 0 0 20px rgba(184, 134, 11, 0.3);
        }
        .meter-label { 
            position: absolute; left: 12px; top: 12px; font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem; color: #aaa; font-weight: 900; letter-spacing: 1px;
        }
        .meter-val { 
            font-family: 'Share Tech Mono', monospace; font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 900;
            color: #fff; 
            line-height: 1; margin-top: 20px; 
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            will-change: transform;
        }
        .meter-val.green { 
            color: var(--gold-base); 
            text-shadow: 0 0 15px var(--gold-base), 0 0 30px var(--gold-dark); 
        }

        /* ==========================================================================
           STAGE AREA (DECORATED CASING)
           ========================================================================== */
        .stage-area {
            flex: 1; display: flex; align-items: center; justify-content: space-between;
            background: radial-gradient(circle at center, #1a0033 0%, #000 100%);
            border: 4px solid #333;
            border-image: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan)) 1;
            border-radius: 2px;
            padding: 25px 15px;
            box-shadow: inset 0 0 50px rgba(157, 0, 255, 0.4), 0 10px 20px rgba(0,0,0,0.8);
            position: relative; 
            min-height: 220px;
        }

        .stage-area::before, .stage-area::after {
            content: ''; position: absolute; left: 5px; right: 5px; height: 10px;
            background: radial-gradient(circle, var(--gold-light) 20%, transparent 20%) 0 0 / 20px 20px repeat-x;
            opacity: 0.7; z-index: 1; pointer-events: none;
        }
        .stage-area::before { top: 5px; }
        .stage-area::after { bottom: 5px; }

        @media (min-width: 768px) { .stage-area { min-height: 320px; padding: 40px 30px; } }

        .gogo-lamp {
            width: 24%; aspect-ratio: 1;
            background: radial-gradient(circle at 30% 30%, #222 0%, #050505 100%);
            border-radius: 50%;
            border: 5px solid #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: 'Righteous', cursive;
            font-size: clamp(0.9rem, 2.5vw, 1.5rem);
            color: #1a1a1a; line-height: 1.1;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.9), 0 0 0 3px #333, 0 10px 15px rgba(0,0,0,0.8);
            position: relative; z-index: 20;
        }
        .gogo-lamp span { font-size: clamp(1.2rem, 3.5vw, 2.2rem); margin-top: -2px; color: #1a1a1a; }
        
        .gogo-lamp.peka {
            background: radial-gradient(circle at 40% 40%, #fff 0%, #ff007f 40%, #800040 100%);
            border-color: #ffb3d9;
            box-shadow: 0 0 50px rgba(255, 0, 127, 1), 0 0 100px rgba(255, 0, 127, 0.6), inset 0 0 30px rgba(255,255,255,0.9);
            animation: hyper-peka-pulse 0.2s infinite alternate;
        }
        .gogo-lamp.peka span { color: #fff; text-shadow: 0 0 15px #fff; }

        /* ==========================================================================
           REELS
           ========================================================================== */
        .reels-wrapper {
            width: 72%; display: flex; gap: 8px;
            background: linear-gradient(180deg, #111 0%, #333 10%, #111 90%, #000 100%); 
            padding: 12px 10px;
            border-radius: 8px;
            border: 3px solid var(--gold-base);
            position: relative;
            box-shadow: 0 0 0 2px #000, 0 0 20px rgba(255, 215, 0, 0.5), inset 0 20px 20px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        .reels-wrapper::before {
            content: "★ HIGH ROLLER ★";
            position: absolute;
            top: -14px; left: 50%; transform: translateX(-50%);
            background: #000; color: var(--gold-base);
            padding: 2px 12px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; font-weight: 900;
            border: 2px solid var(--gold-base); border-radius: 4px;
            box-shadow: 0 0 10px var(--gold-base);
            z-index: 40; white-space: nowrap;
        }

        .reels-wrapper::after {
            content: ""; position: absolute; top: 50%; left: -5%; right: -5%; height: 3px;
            background: rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            transform: translateY(-50%); z-index: 30; pointer-events: none;
        }
        
        .reel-window {
            flex: 1; aspect-ratio: 1 / 2.4;
            background: #e8e8e8; 
            border-radius: 4px;
            overflow: hidden; position: relative;
            box-shadow: inset 0 25px 25px -15px rgba(0,0,0,0.8), inset 0 -25px 25px -15px rgba(0,0,0,0.8);
            border: 1px solid #000;
        }
        .reel-window.bounce { animation: reel-hyper-bounce 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .reel-strip {
            position: absolute; top: 0; left: 0; width: 100%;
            display: flex; flex-direction: column; 
            will-change: transform;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .symbol {
            width: 100%; height: var(--sym-h); 
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2.8rem, 8vw, 4.5rem); font-weight: 900;
            font-family: 'Righteous', cursive;
            position: relative; z-index: 1;
        }
        
        .sym-7 { color: var(--alert-red); text-shadow: 2px 2px 0px #000, 0 0 15px rgba(255,0,0,0.5); transform: scale(1.1); }
        .sym-bar { 
            color: #fff; background: linear-gradient(180deg, #333 0%, #000 100%); 
            border: 3px solid #ccc; border-radius: 4px;
            width: 85%; height: 45%; font-size: 0.35em; 
            display: flex; align-items: center; justify-content: center; 
            letter-spacing: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .spin-blur { opacity: 0.85; filter: contrast(1.2); } 

        /* ==========================================================================
           CONTROLS
           ========================================================================== */
        .controls-area { display: flex; flex-direction: column; gap: 15px; margin-top: auto; }
        .stop-buttons { display: flex; justify-content: flex-end; width: 100%; gap: 12px; padding-left: 28%; }
        
        .btn-stop {
            flex: 1; aspect-ratio: 1.4;
            background: linear-gradient(180deg, #ff1a1a 0%, #cc0000 100%);
            border: 2px solid #ff9999; border-radius: 8px;
            box-shadow: 0 8px 0 #660000, 0 15px 20px rgba(0,0,0,0.6);
            color: #fff; font-family: 'Share Tech Mono', monospace;
            font-size: clamp(1.5rem, 5vw, 2.2rem); font-weight: 900;
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s; 
        }
        .btn-stop:active:not(:disabled) {
            transform: translateY(8px); 
            box-shadow: 0 0 0 #660000, 0 5px 10px rgba(0,0,0,0.6);
            background: #ff3333;
        }
        .btn-stop:disabled { 
            background: linear-gradient(180deg, #444 0%, #222 100%);
            border-color: #555; color: #777;
            box-shadow: 0 8px 0 #111; cursor: not-allowed; 
        }

        .btn-start {
            width: 100%; padding: 22px 0;
            background: var(--gold-gradient);
            background-size: 200% auto;
            border: 2px solid #fff; border-radius: 12px;
            color: #111; font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 900; 
            font-family: 'Cinzel Decorative', serif;
            letter-spacing: 6px;
            box-shadow: 0 10px 0 #b8860b, 0 20px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.5);
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
            animation: shine-gold 2s infinite linear;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(10px); 
            box-shadow: 0 0 0 #b8860b, 0 5px 10px rgba(0,0,0,0.8);
        }
        .btn-start:disabled { 
            background: #333; color: #666; border-color: #444; 
            box-shadow: 0 10px 0 #111; cursor: not-allowed; animation: none;
        }

        /* ==========================================================================
           FOOTER & SETTINGS
           ========================================================================== */
        .footer-row {
            display: flex; justify-content: space-between; align-items: center; margin-top: 5px;
        }
        .btn-back { 
            background: #111; color: #888; border: 1px solid #333; font-size: 0.75rem; 
            padding: 6px 12px; box-shadow: none; width: auto; border-radius: 4px; cursor: pointer; text-decoration: none;
        }
        .checkbox-label { 
            display: flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: bold; color: #aaa; cursor: pointer; 
        }
        .checkbox-label input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--neon-magenta); }

        /* ==========================================================================
           HYPER EFFECTS (DOM MINIMAL & SHAKES)
           ========================================================================== */
        body.hyper-flash-active { animation: hyper-body-flash 0.25s linear; }
        
        .win-rainbow-shake {
            animation: hyper-rainbow-glow 0.15s linear infinite, hyper-shake-anim 0.08s ease-in-out infinite alternate;
        }
        .win-rainbow-noshake {
            animation: hyper-rainbow-glow 0.15s linear infinite;
        }
        .num-pop { 
            animation: overdrive-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5) !important; 
            color: #fff !important; 
            text-shadow: 0 0 20px var(--gold-base), 0 0 40px var(--gold-base) !important; 
        }

        /* ==========================================================================
           OVERDOSE KEYFRAMES
           ========================================================================== */
        @keyframes shine-gold { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        @keyframes marquee-rush { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
        @keyframes hyper-peka-pulse { 0% { transform: scale(1.05); text-shadow: 0 0 10px #fff; } 100% { transform: scale(1.12); text-shadow: 0 0 20px #fff, 0 0 40px #ff007f; } }
        @keyframes reel-hyper-bounce { 0% { transform: translateY(0); } 40% { transform: translateY(20px); } 100% { transform: translateY(0); } }
        
        @keyframes hyper-body-flash {
            0% { background-color: #fff; filter: invert(1) hue-rotate(180deg); }
            50% { background-color: var(--neon-magenta); }
            100% { background-color: #000; filter: none; }
        }
        @keyframes hyper-rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 40px #ffff00, inset 0 0 30px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 40px #00ff00, inset 0 0 30px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 40px #00ffff, inset 0 0 30px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 40px #ff00ff, inset 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
        }
        @keyframes hyper-shake-anim {
            0% { transform: scale(1.02) translate(2px, 2px) rotate(0deg); }
            25% { transform: scale(1.02) translate(-2px, -2px) rotate(-1deg); }
            50% { transform: scale(1.02) translate(-2px, 2px) rotate(1deg); }
            75% { transform: scale(1.02) translate(2px, -2px) rotate(-1deg); }
            100% { transform: scale(1.02) translate(2px, 2px) rotate(1deg); }
        }
        @keyframes overdrive-pop { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.5); } 
            100% { transform: scale(1); } 
        }
    </style>
</head>
<body>

<div class="arcade-cabinet" id="cabinet">
    <div class="marquee" id="marquee">INSERT MEDAL</div>
    
    <div class="notice-banner">
        【お知らせ】還元率96%の黄金バランス（高ボラティリティ）に再調整しました。
    </div>

    <div class="hud-panel" id="hud-panel">
        <div class="inputs-row">
            <div class="input-group">
                <label>ACCOUNT</label>
                <select id="wallet-select"></select>
            </div>
            <div class="input-group">
                <label>BET</label>
                <input type="number" id="bet-amount" min="1" value="3">
            </div>
        </div>
        <div class="meters-row">
            <div class="meter">
                <div class="meter-label">CREDIT</div>
                <div class="meter-val" id="credit-display">---</div>
            </div>
            <div class="meter">
                <div class="meter-label">PAYOUT</div>
                <div class="meter-val green" id="payout-display">0</div>
            </div>
        </div>
    </div>

    <div class="stage-area">
        <div class="gogo-lamp" id="gogo-lamp">GOGO!<br><span>CHANCE</span></div>
        <div class="reels-wrapper">
            <div class="reel-window" id="window-0"><div class="reel-strip" id="reel-0"></div></div>
            <div class="reel-window" id="window-1"><div class="reel-strip" id="reel-1"></div></div>
            <div class="reel-window" id="window-2"><div class="reel-strip" id="reel-2"></div></div>
        </div>
    </div>

    <div class="controls-area">
        <div class="stop-buttons">
            <button class="btn-stop" id="btn-stop-0" disabled>1</button>
            <button class="btn-stop" id="btn-stop-1" disabled>2</button>
            <button class="btn-stop" id="btn-stop-2" disabled>3</button>
        </div>
        <button class="btn-start" id="btn-start">LEVER ON</button>
        
        <div class="footer-row">
            <a href="/casino" class="btn-back">◀ 戻る</a>
            <label class="checkbox-label">
                <input type="checkbox" id="bgm-toggle">
                <span>🎵 BGM ON</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 演出オフ</span>
            </label>
        </div>
        <audio id="bgm-player" src="/templates/dopa.mp3" loop preload="auto"></audio>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const SYMBOLS = {
        "7": '<div class="symbol"><div class="sym-7">7</div></div>',
        "BAR": '<div class="symbol"><div class="sym-bar">BAR</div></div>',
        "BELL": '<div class="symbol"><span class="sym-bell">🔔</span></div>',
        "GRAPE": '<div class="symbol"><span class="sym-grape">🍇</span></div>',
        "CHERRY": '<div class="symbol"><span class="sym-cherry">🍒</span></div>',
        "REPLAY": '<div class="symbol"><span class="sym-replay">💎</span></div>'
    };

    const getSymbolHtml = (key) => SYMBOLS[key] || SYMBOLS["7"];
    const FIXED_STRIP_PATTERN = [
        "7", "CHERRY", "GRAPE", "BELL", "BAR", "REPLAY", 
        "GRAPE", "BAR", "CHERRY", "BELL", "7", "REPLAY",
        "GRAPE", "BELL", "7", "REPLAY", "BAR", "GRAPE"
    ];
    const TOTAL_SPIN_SYMS = 32; 
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = new AudioContext();

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'SPIN') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'STOP') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
            gain.gain.setValueAtTime(1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'PEKA') { 
            osc.type = 'square';
            osc.frequency.setValueAtTime(1500, now);
            osc.frequency.linearRampToValueAtTime(4500, now + 0.1);
            
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine'; lfo.frequency.value = 35;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 1200;
            lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
            lfo.start(now); lfo.stop(now + 1.5);

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.5, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
            osc.start(now); osc.stop(now + 1.5);
        } else if (type === 'COIN') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(2500 + Math.random()*500, now);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        }
    }

    let myWalletsData = [];
    let reelEls = [document.getElementById('reel-0'), document.getElementById('reel-1'), document.getElementById('reel-2')];
    let winEls = [document.getElementById('window-0'), document.getElementById('window-1'), document.getElementById('window-2')];
    let rPos = [0, 0, 0];
    let rState = [0, 0, 0];
    let symbolHeight = 0;
    let reqAnim;
    
    let isSpinning = false;
    let stoppedCount = 0;
    let serverRes = null;

    init();

    async function init() {
        await loadWallets();
        setupReels(true);
        requestAnimationFrame(animate);
        
        document.getElementById("btn-start").addEventListener("click", () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            startSpin();
        });
        document.getElementById("btn-stop-0").addEventListener("click", () => stopReel(0));
        document.getElementById("btn-stop-1").addEventListener("click", () => stopReel(1));
        document.getElementById("btn-stop-2").addEventListener("click", () => stopReel(2));
        
        document.getElementById("wallet-select").addEventListener("change", (e) => {
            const w = myWalletsData.find(w => w.wallet_id === e.target.value);
            if(w) updateCredit(w.balance);
        });

        const bgmPlayer = document.getElementById("bgm-player");
        const bgmToggle = document.getElementById("bgm-toggle");
        bgmToggle.addEventListener("change", (e) => {
            if (e.target.checked) bgmPlayer.play().catch(() => {});
            else bgmPlayer.pause();
        });
        document.addEventListener("click", () => {
            if (bgmToggle.checked && bgmPlayer.paused) bgmPlayer.play().catch(() => {});
        }, { once: true });

        window.addEventListener('resize', () => { setupReels(true); });
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            myWalletsData = await res.json();
            const select = document.getElementById("wallet-select");
            const cur = select.value;
            select.innerHTML = myWalletsData.map(w => `<option value="${w.wallet_id}">${w.wallet_name}</option>`).join('');
            if (cur && myWalletsData.some(w => w.wallet_id === cur)) select.value = cur;
            const w = myWalletsData.find(w => w.wallet_id === select.value);
            if(w) updateCredit(w.balance);
        } catch (e) {}
    }

    function updateCredit(val) { document.getElementById("credit-display").innerText = val; }
    function updateWin(val) { document.getElementById("payout-display").innerText = val; }

    function fireFeedback(type) {
        const mq = document.getElementById("marquee");
        const hud = document.getElementById("hud-panel");
        const disableShake = document.getElementById("disable-shake").checked;

        if(type === "PEKA") {
            playSound("PEKA");
            document.getElementById("gogo-lamp").classList.add("peka");
            if (!disableShake) {
                document.body.classList.remove("hyper-flash-active");
                void document.body.offsetWidth;
                document.body.classList.add("hyper-flash-active");
            }
        } else if (type === "BIG") {
            mq.innerText = "SUPER JACKPOT";
            mq.classList.add("jackpot");
            hud.className = disableShake ? "hud-panel win-rainbow-noshake" : "hud-panel win-rainbow-shake";
        } else if (type === "REG") {
            mq.innerText = "REGULAR BONUS";
            mq.classList.add("active");
            hud.className = disableShake ? "hud-panel win-rainbow-noshake" : "hud-panel win-rainbow-shake";
        }
    }

    function resetUI() {
        document.getElementById("gogo-lamp").classList.remove("peka");
        document.body.classList.remove("hyper-flash-active");
        document.getElementById("hud-panel").className = "hud-panel";
        const mq = document.getElementById("marquee");
        mq.innerText = "GOOD LUCK";
        mq.className = "marquee";
        updateWin(0);
        winEls.forEach(el => el.classList.remove("bounce"));
    }

    function setupReels(isInit = false, resSyms = ["7","7","7"]) {
        const windowHeight = winEls[0].offsetHeight;
        symbolHeight = windowHeight / 3;
        document.documentElement.style.setProperty('--sym-h', `${symbolHeight}px`);
        
        for(let i=0; i<3; i++) {
            let html = "";
            for(let j=0; j<TOTAL_SPIN_SYMS; j++) {
                html += getSymbolHtml(FIXED_STRIP_PATTERN[j % FIXED_STRIP_PATTERN.length]);
            }
            if(!isInit && serverRes) html += getSymbolHtml(resSyms[i]);
            else html += getSymbolHtml("7");
            
            html += getSymbolHtml("GRAPE");
            html += getSymbolHtml("REPLAY");
            
            reelEls[i].innerHTML = html;
            rPos[i] = 0;
            reelEls[i].style.transform = `translateY(0px)`;
        }
    }

    function animate() {
        const speed = symbolHeight * 0.9; 
        const maxScroll = -(TOTAL_SPIN_SYMS * symbolHeight);
        
        for(let i=0; i<3; i++) {
            if(rState[i] === 1) {
                rPos[i] -= speed;
                if(rPos[i] <= maxScroll) rPos[i] += Math.abs(maxScroll);
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
            } else if (rState[i] === 2) {
                rPos[i] = -(TOTAL_SPIN_SYMS * symbolHeight) + symbolHeight;
                reelEls[i].style.transform = `translateY(${rPos[i]}px)`;
                reelEls[i].classList.remove("spin-blur");
                
                winEls[i].classList.remove("bounce");
                void winEls[i].offsetWidth;
                winEls[i].classList.add("bounce");

                rState[i] = 0;
                playSound("STOP");
            }
        }
        reqAnim = requestAnimationFrame(animate);
    }

    async function startSpin() {
        if (isSpinning) return;
        const wid = document.getElementById("wallet-select").value;
        const bet = parseInt(document.getElementById("bet-amount").value, 10);
        
        if(!wid || isNaN(bet) || bet < 1) return alert("口座またはベット額が正しくありません。");

        isSpinning = true;
        stoppedCount = 0;
        serverRes = null;
        resetUI();
        playSound("SPIN");
        document.getElementById("btn-start").disabled = true;
        
        try {
            const res = await fetch("/api/slot/spin", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                // Python側が新旧どちらのコードでも確実に通るように「両方」送信する
                body: JSON.stringify({ wallet_id: wid, amount: bet, bet_amount: bet }) 
            });
            
            const data = await res.json();
            
            // [object Object] を防ぎ、エラーの本当の理由をテキスト化する
            if (!res.ok) {
                let errMsg = data.detail || "エラーが発生しました";
                if (typeof errMsg === 'object') {
                    errMsg = JSON.stringify(errMsg); // オブジェクトなら文字列に変換
                }
                throw new Error(errMsg);
            }
            
            serverRes = data;
            
            const w = myWalletsData.find(w => w.wallet_id === wid);
            if(w) { w.balance = serverRes.new_balance - serverRes.payout; updateCredit(w.balance); }

            setupReels(false, serverRes.result_symbols);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`btn-stop-${i}`).disabled = false;
                reelEls[i].classList.add("spin-blur");
                rState[i] = 1;
            }

            if (serverRes.is_early_pekari) fireFeedback("PEKA");

        } catch (e) {
            alert(e.message);
            isSpinning = false; 
            document.getElementById("btn-start").disabled = false;
        }
    }

    function stopReel(idx) {
        if (rState[idx] !== 1) return;
        document.getElementById(`btn-stop-${idx}`).disabled = true;
        rState[idx] = 2; 
        stoppedCount++;
        if (stoppedCount === 3) setTimeout(finishGame, 200);
    }

    async function finishGame() {
        isSpinning = false;
        document.getElementById("btn-start").disabled = false;
        document.getElementById("marquee").innerText = "INSERT MEDAL";
        
        if (serverRes.is_pekari && !serverRes.is_early_pekari) fireFeedback("PEKA");
        if (serverRes.prize === "BIG") fireFeedback("BIG");
        else if (serverRes.prize === "REG") fireFeedback("REG");
        else if (serverRes.payout > 0) document.getElementById("marquee").innerText = "WINNER";

        if (serverRes.payout > 0) {
            let cur = 0;
            const tgt = serverRes.payout;
            const step = Math.ceil(tgt / 30); 
            
            const countTimer = setInterval(() => {
                cur += step;
                if(cur >= tgt) {
                    cur = tgt;
                    clearInterval(countTimer);
                    const w = myWalletsData.find(w => w.wallet_id === document.getElementById("wallet-select").value);
                    if(w) { w.balance = serverRes.new_balance; updateCredit(w.balance); }
                }
                updateWin(cur);
                const pEl = document.getElementById("payout-display");
                if(!document.getElementById("disable-shake").checked) {
                    pEl.classList.remove("num-pop");
                    void pEl.offsetWidth; 
                    pEl.classList.add("num-pop");
                }
                playSound("COIN");
            }, 16); 
        }
        loadWallets();
    }
</script>
</body>
</html>
