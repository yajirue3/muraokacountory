<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 国立機械工場 (Babylon.js PBR Edition)</title>
    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        :root {
            --bg-body: #050505; --panel-bg: #121418; --panel-border: #2a313b;
            --accent-blue: #3b82f6; --accent-orange: #f59e0b; --accent-red: #ef4444;
            --text-main: #e2e8f0; --text-dim: #94a3b8;
        }

        body { 
            background: var(--bg-body); color: var(--text-main); 
            font-family: 'Consolas', monospace; margin: 0; padding: 2vh 2vw; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden;
            box-sizing: border-box;
        }

        .app-grid { 
            display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; 
            width: 100%; max-width: 1400px; height: 96vh; 
        }

        /* --- CRTモニター演出（スキャンライン・湾曲・ビネット） --- */
        .viewport-section {
            background: #000; border: 12px solid #1a1c23; border-radius: 16px;
            position: relative; box-shadow: inset 0 0 40px rgba(0,0,0,1), 0 10px 30px rgba(0,0,0,0.9);
            overflow: hidden; display: flex; flex-direction: column;
            transform: perspective(1000px) rotateX(1deg);
        }
        
        .viewport-section::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; z-index: 20; mix-blend-mode: overlay;
        }
        .viewport-section::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.8); pointer-events: none; z-index: 21;
        }

        #viewport-3d { width: 100%; height: 100%; flex: 1; outline: none; }

        /* 画面振動エフェクト */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(2px, -2px) rotate(1deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake { animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both; }

        .cctv-osd {
            position: absolute; top: 12px; left: 12px; right: 12px; pointer-events: none;
            color: #4ade80; font-size: 0.85rem; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000;
            display: flex; justify-content: space-between; z-index: 25; font-weight: bold;
        }
        .red-dot {
            display: inline-block; width: 10px; height: 10px; background: #ff003c; border-radius: 50%;
            animation: blink 1s infinite; margin-right: 6px; box-shadow: 0 0 8px #ff003c;
        }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* --- 操作盤UI --- */
        .control-section {
            background: var(--panel-bg); border: 2px solid var(--panel-border);
            border-radius: 8px; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; 
        }
        .header-panel {
            border-bottom: 1px dashed var(--panel-border); padding-bottom: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px;
        }
        .header-panel h2 { margin: 0; font-size: 1.25rem; color: var(--accent-blue); width: 100%; }

        select { 
            background: #0b0d10; color: var(--accent-blue); border: 1px solid var(--panel-border); 
            padding: 10px; font-family: inherit; border-radius: 4px; width: 100%; font-size: 0.95rem;
        }

        .wear-container { font-size: 0.9rem; color: var(--accent-orange); display: flex; align-items: center; gap: 8px; width: 100%; font-weight:bold; }
        .wear-bar-bg { flex: 1; height: 12px; background: #0b0d10; border: 1px solid #333; border-radius: 2px;}
        .wear-bar-fill { height: 100%; background: var(--accent-orange); width: 0%; transition: width 0.4s ease; }

        .track-container { 
            background: #0b0d10; height: 16px; border: 1px solid var(--panel-border);
            margin: 10px 0 15px 0; display: flex; padding: 3px; gap: 3px; border-radius: 4px;
        }
        .track-node { flex: 1; background: #222; transition: all 0.3s; border-radius: 2px;}
        .track-node.active { background: var(--accent-blue); box-shadow: 0 0 8px var(--accent-blue); }
        .track-node.completed { background: #334155; }

        .action-area { 
            flex: 1; background: #0a0b0e; padding: 15px; border: 1px solid #1e293b; 
            border-radius: 6px; display: flex; flex-direction: column; gap: 12px; min-height: min-content;
        }
        .panel-title { font-size: 1.1rem; color: var(--accent-blue); border-left: 4px solid var(--accent-blue); padding-left: 10px; margin: 0; font-weight:bold;}
        .instruction-box { background: #151a22; padding: 15px; font-size: 0.9rem; line-height: 1.6; border-radius: 4px; border-left: 4px solid var(--accent-orange);}
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* --- 物理ボタン（陥没ギミック） --- */
        .btn-machinery { 
            background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-bottom: 6px solid #0f172a;
            padding: 14px; font-weight: bold; font-family: inherit; cursor: pointer; 
            border-radius: 4px; font-size: 0.9rem; min-height: 50px;
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), border-bottom-width 0.1s;
        }
        .btn-machinery:active { transform: translateY(5px); border-bottom-width: 1px; margin-bottom: 5px; }
        .btn-machinery:disabled { opacity: 0.5; cursor: not-allowed; transform: translateY(5px); border-bottom-width: 1px; margin-bottom: 5px; }
        
        .btn-action { background: #1d4ed8; border-color: #3b82f6; grid-column: span 2; font-size: 1rem; border-bottom: 6px solid #1e3a8a; }
        
        /* 安全カバー付きパージボタン */
        .btn-maint-wrapper { position: relative; margin-bottom: 10px; display: none; }
        .btn-maint-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, #eab308, #eab308 10px, #000 10px, #000 20px);
            opacity: 0.8; cursor: pointer; border-radius: 4px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; text-shadow: 1px 1px 2px #000; transition: transform 0.2s, opacity 0.2s; z-index: 10;
        }
        .btn-maint { background: #991b1b; border-color: #f87171; width: 100%; border-bottom: 6px solid #7f1d1d; }

        .gauge-container { width: 100%; background: #000; height: 32px; border: 1px solid var(--panel-border); position: relative; overflow: hidden; border-radius:4px;}
        .gauge-target { position: absolute; left: 45%; width: 10%; height: 100%; background: rgba(59, 130, 246, 0.2); border-left: 2px solid var(--accent-blue); border-right: 2px solid var(--accent-blue); }
        .gauge-pointer { position: absolute; width: 4px; height: 100%; background: var(--accent-red); left: 0%; box-shadow: 0 0 8px var(--accent-red); }

        .console-log { 
            background: #050608; border: 1px solid #1e293b; padding: 12px; height: 120px; 
            overflow-y: auto; font-size: 0.85rem; color: #10b981; margin-top: 15px; border-radius: 4px; line-height: 1.5;
        }
        .btn-back { background: #1e293b; color: #cbd5e1; border: none; padding: 16px; margin-top: 15px; cursor: pointer; border-radius: 4px; width: 100%; font-weight:bold; font-size: 1rem;}

        @media (max-width: 900px) {
            body { display: block; padding: 10px; height: auto; min-height: 100vh; }
            .app-grid { display: flex; flex-direction: column; height: auto; gap: 15px; max-width: 100%; }
            .viewport-section { height: 35vh; min-height: 250px; flex: none; position: sticky; top: 10px; z-index: 40; }
        }
    </style>
</head>
<body>

<div class="app-grid">
    <div class="viewport-section" id="monitorBox">
        <div class="cctv-osd">
            <div><span class="red-dot"></span>SYS_REC_01</div>
            <div id="cctv-cam">CAM-01 [RECEIVE]</div>
        </div>
        <canvas id="viewport-3d"></canvas>
    </div>

    <div class="control-section">
        <div class="header-panel">
            <h2>FACTORY_MURAOKA_01</h2>
            <div class="wear-container">
                <span>WEAR:</span><div class="wear-bar-bg"><div class="wear-bar-fill" id="wearBar"></div></div><span id="wearText">0%</span>
            </div>
            <select id="walletSelect"><option value="">Loading accounts...</option></select>
        </div>

        <div class="btn-maint-wrapper" id="maintWrapper">
            <div class="btn-maint-cover" id="maintCover" onclick="openCover()">▲ COVER OPEN ▲</div>
            <button class="btn-machinery btn-maint" onclick="performMaintenance()">EMERGENCY PURGE</button>
        </div>

        <div class="track-container">
            <div id="node1" class="track-node"></div><div id="node2" class="track-node"></div>
            <div id="node3" class="track-node"></div><div id="node4" class="track-node"></div>
            <div id="node5" class="track-node"></div>
        </div>

        <div class="panel-title" id="stepTitle">INITIALIZING...</div>

        <div class="action-area" id="actionArea"></div>

        <div class="console-log" id="consoleLog">> SYSTEM BOOT... ZERO TRUST PROTOCOL ENABLED.<br></div>
        <button class="btn-back" onclick="location.href='/dashboard'">◀ ラインから退出</button>
    </div>
</div>

<script>
// --- 音響 (Web Audio API)[span_1](start_span)[span_1](end_span) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    
    if (type === 'click') {
        osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'error') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'heavy') { 
        osc.type = 'square'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
        gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
    }
}

function triggerShake() {
    const box = document.getElementById('monitorBox');
    box.classList.remove('shake');
    void box.offsetWidth; // force reflow
    box.classList.add('shake');
}

// --- Babylon.js 3Dエンジン設定 ---
const canvas = document.getElementById("viewport-3d");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
let scene, camera, steps3D = {};
let step3Gear, step4Cylinder;

const createScene = function () {
    const s = new BABYLON.Scene(engine);
    s.clearColor = new BABYLON.Color4(0.05, 0.05, 0.07, 1);
    s.fogMode = BABYLON.Scene.FOGMODE_EXP2; s.fogDensity = 0.02; s.fogColor = new BABYLON.Color3(0.05, 0.05, 0.07);

    // PBR環境光 (工場風)
    const envHelper = s.createDefaultEnvironment({
        createSkybox: false, createGround: true, groundSize: 50, groundColor: new BABYLON.Color3(0.1, 0.1, 0.1), enableGroundShadow: true
    });
    const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), s);
    dirLight.intensity = 1.2;

    camera = new BABYLON.ArcRotateCamera("camera", -Math.PI/2, Math.PI/2.5, 6, BABYLON.Vector3.Zero(), s);
    camera.attachControl(canvas, true);
    
    // マテリアル定義 (PBR)
    const matMetal = new BABYLON.PBRMaterial("metal", s);
    matMetal.metallic = 0.9; matMetal.roughness = 0.4; matMetal.albedoColor = new BABYLON.Color3(0.2, 0.2, 0.22);
    
    const matGlass = new BABYLON.PBRMaterial("glass", s);
    matGlass.metallic = 0.1; matGlass.roughness = 0.1; matGlass.alpha = 0.5; matGlass.albedoColor = new BABYLON.Color3(0.6, 0.8, 0.9);

    const matGold = new BABYLON.PBRMaterial("gold", s);
    matGold.metallic = 1.0; matGold.roughness = 0.2; matGold.albedoColor = new BABYLON.Color3(0.8, 0.6, 0.1);

    const matCardboard = new BABYLON.PBRMaterial("cardboard", s);
    matCardboard.metallic = 0.0; matCardboard.roughness = 0.9; matCardboard.albedoColor = new BABYLON.Color3(0.6, 0.4, 0.2);

    // 全ステップのモデルを事前生成して非表示化 (ゼロトラスト用軽量追従)
    steps3D[1] = BABYLON.MeshBuilder.CreateCylinder("part", {diameter: 2, height: 0.5}, s);
    steps3D[1].material = matMetal;

    steps3D[2] = BABYLON.MeshBuilder.CreateBox("circuit", {width: 2, height: 0.2, depth: 1.5}, s);
    steps3D[2].material = matMetal;

    step3Gear = BABYLON.MeshBuilder.CreateCylinder("gear", {diameter: 2, height: 0.3, tessellation: 12}, s);
    step3Gear.material = matGold;
    steps3D[3] = step3Gear;

    step4Cylinder = BABYLON.MeshBuilder.CreateCylinder("pump", {diameter: 1, height: 3}, s);
    step4Cylinder.material = matMetal;
    steps3D[4] = step4Cylinder;

    steps3D[5] = BABYLON.MeshBuilder.CreateBox("box", {size: 2}, s);
    steps3D[5].material = matCardboard;

    for(let i=1; i<=5; i++) steps3D[i].setEnabled(false);
    return s;
};
scene = createScene();

engine.runRenderLoop(() => { 
    if(steps3D[3].isEnabled()) step3Gear.rotation.y += 0.02;
    scene.render(); 
});
window.addEventListener("resize", () => engine.resize());

function switchStep3D(step, targetPartStr = "") {
    for(let i=1; i<=5; i++) steps3D[i].setEnabled(i === step);
    
    // Step1の動的マテリアル変更（6択対応）
    if(step === 1 && steps3D[1]) {
        if(targetPartStr.includes("ガラス")) steps3D[1].material = scene.getMaterialByName("glass");
        else if(targetPartStr.includes("IC") || targetPartStr.includes("ARM")) steps3D[1].material = scene.getMaterialByName("gold");
        else steps3D[1].material = scene.getMaterialByName("metal");
    }
}

// --- ロジック & UI ---
const token = localStorage.getItem("access_token") || localStorage.getItem("token");
// ローカルテスト用にトークンが無くても動くようにモック化（本番は外す）
// if (!token) window.location.href = "/";

let currentSession = null, gaugeVal = 0, gaugeDir = 2.5, gaugeInterval = null;
let tapCount = 0, isLocked = false, isFetching = false;
let step2Colors = [], step2Input = [];

async function initFactory() {
    await fetchStatusMock(); // 実際は await fetchStatus();
}

function logMessage(msg) {
    const log = document.getElementById('consoleLog');
    log.innerHTML += `> ${msg}<br>`; 
    log.scrollTop = log.scrollHeight;
}

// ※ バックエンド結合時はこれを本物の fetch に差し替えます。
// 非同期・楽観的UIの動作確認用モック
async function fetchStatusMock() {
    currentSession = {
        current_step: 1, title: "① コンポーネント選定",
        target_part: "SKF-6204ベアリング",
        options: ["SKF-6204ベアリング", "SUS304 M12ボルト", "IC-TTL7400回路", "テンパックス耐熱ガラス", "ARM-Cortex-M7", "高耐圧シリコンパッキン"]
    };
    updateWear(0);
    renderStep();
}

function updateWear(wear) {
    document.getElementById('wearBar').style.width = `${wear}%`;
    document.getElementById('wearText').innerText = `${wear}%`;
    isLocked = (wear >= 100);
    const wrap = document.getElementById('maintWrapper');
    if(isLocked) {
        wrap.style.display = 'block';
        document.getElementById('maintCover').style.transform = 'translateY(0)';
        document.getElementById('maintCover').style.opacity = '0.8';
        document.getElementById('maintCover').style.pointerEvents = 'auto';
    } else {
        wrap.style.display = 'none';
    }
}

function openCover() {
    const cover = document.getElementById('maintCover');
    playSound('click');
    cover.style.transform = 'translateY(-100%)';
    cover.style.opacity = '0';
    cover.style.pointerEvents = 'none';
}

async function performMaintenance() {
    playSound('heavy'); triggerShake();
    logMessage(`<span style="color:var(--accent-blue);">[SYSTEM] エアパージ完了。稼働を再開。</span>`);
    updateWear(0);
}

function renderStep() {
    if(!currentSession) return;
    const step = currentSession.current_step;
    document.getElementById('stepTitle').innerText = currentSession.title;
    switchStep3D(step, currentSession.target_part);
    
    for (let i = 1; i <= 5; i++) {
        document.getElementById(`node${i}`).className = 'track-node' + (i < step ? ' completed' : (i === step ? ' active' : ''));
    }

    const area = document.getElementById('actionArea');
    
    if (step === 1) {
        area.innerHTML = `<div class="instruction-box">要求仕様: <b style="color:var(--accent-orange);">${currentSession.target_part}</b></div>
            <div class="btn-grid">${currentSession.options.map(opt => `<button class="btn-machinery" onclick="submitStepOptimistic(${step}, '${opt}')">${opt}</button>`).join('')}</div>`;
    } else if (step === 2) {
        step2Input = []; step2Colors = ["赤", "青", "黄", "緑"]; // 本来はサーバーから取得
        area.innerHTML = `<div class="instruction-box">4色アモアス配線：シーケンス【赤→青→黄→緑】の順に結線せよ</div>
            <div class="btn-grid" id="wiringGrid">
                ${step2Colors.map(c => `<button class="btn-machinery" onclick="pushWire('${c}')">${c}</button>`).join('')}
            </div>`;
    } else if (step === 3) {
        area.innerHTML = `<div class="instruction-box">クラッチ同期：トルク（45-55 Nm）でロックせよ</div>
            <div class="gauge-container"><div class="gauge-target"></div><div id="pointer" class="gauge-pointer"></div></div>
            <button class="btn-machinery btn-action" onclick="stopGauge(${step})">クラッチ結合 [LOCK]</button>`;
        startGauge();
    } else if (step === 4) {
        tapCount = 0;
        area.innerHTML = `<div class="instruction-box">手動油圧シリンダー：規定圧（10 Bar）まで加圧せよ</div>
            <div style="font-size:1.4rem; font-weight:bold; color:var(--accent-blue); text-align:center; padding:10px;">圧力: <span id="taps">0</span> / 10 Bar</div>
            <button class="btn-machinery btn-action" onclick="countTap(${step})">加圧ストローク [PUMP]</button>`;
    } else if (step === 5) {
        area.innerHTML = `<div class="instruction-box">全シーケンス完了。出荷処理を実行せよ。</div>
            <button class="btn-machinery btn-action" style="background:var(--accent-orange); border-color:#fff;" onclick="submitStepOptimistic(${step}, true)">出荷打刻・転送</button>`;
    }
}

// Step 2 アモアス風配線入力
window.pushWire = function(color) {
    if(isLocked) return;
    playSound('click');
    step2Input.push(color);
    logMessage(`> 結線: ${color}`);
    if(step2Input.length >= 4) submitStepOptimistic(2, step2Input);
}

function startGauge() {
    gaugeVal = 0; gaugeDir = 2.5; clearInterval(gaugeInterval);
    gaugeInterval = setInterval(() => {
        gaugeVal += gaugeDir;
        if (gaugeVal >= 100 || gaugeVal <= 0) gaugeDir *= -1;
        const p = document.getElementById('pointer'); if (p) p.style.left = `${gaugeVal}%`;
    }, 20);
}

function stopGauge(step) { 
    clearInterval(gaugeInterval); playSound('click');
    submitStepOptimistic(step, Math.floor(gaugeVal)); 
}

function countTap(step) {
    if(isLocked) return;
    tapCount++; playSound('heavy'); triggerShake();
    document.getElementById('taps').innerText = tapCount;
    if (tapCount >= 10) setTimeout(() => submitStepOptimistic(step, tapCount), 200);
}

// 楽観的UI更新 ＆ ゼロトラスト非同期通信
async function submitStepOptimistic(step, answer) {
    if (isLocked || isFetching) return;
    
    // UIをブロックせず即座に音と振動を出す
    playSound(step === 5 ? 'heavy' : 'click');
    if (step === 5) triggerShake();
    isFetching = true;

    // --- ここで本来は fetch('/api/factory/process', ...) を呼び、結果を待ちます ---
    // 成功したと仮定して即座に次ステップを生成するモックロジック
    setTimeout(() => {
        logMessage(`<span style="color:var(--accent-blue);">[VERIFIED] STEP ${step} 完了。シグネチャを検証しました。</span>`);
        let nextStep = step + 1;
        if (nextStep > 5) {
            logMessage(`<span style="color:#4ade80);">製品出荷完了。SERIAL: MRK-SYS-001 | ＋25G 獲得</span>`);
            nextStep = 1;
        }
        
        currentSession.current_step = nextStep;
        const titles = ["① コンポーネント選定", "② 回路結線", "③ クラッチ同期", "④ 油圧加圧", "⑤ 出荷転送"];
        currentSession.title = titles[nextStep - 1];
        
        updateWear(parseInt(document.getElementById('wearText').innerText) + 12);
        renderStep();
        isFetching = false;
    }, 300); // 通信ラグをシミュレート
}

window.onload = initFactory;
</script>
</body>
</html>
