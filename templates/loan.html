<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 王国裏金融</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #1c1e24;
            --border: #333842;
            --gold: #d4af37;
            --gold-hover: #f1c40f;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --blue: #3b82f6;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 20px 0; margin: 0; min-height: 100vh; }
        .container { width: 380px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .header { font-size: 1.3rem; font-weight: 800; color: var(--gold); text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .sub-desc { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: -10px; margin-bottom: 16px; }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 4px; background: #262932; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(212, 175, 55, 0.2); }
        .tab-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .list-item { background: #15171a; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .list-item:hover { border-color: #4b5563; transform: translateY(-2px); }
        .list-item .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .list-item .title { font-weight: 700; color: #fff; font-size: 0.95rem; }
        
        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .badge-open { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-active { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .badge-paid { background: rgba(59, 130, 246, 0.2); color: var(--blue); border: 1px solid var(--blue); }

        .list-item .row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .list-item .row span:last-child { color: var(--text-main); font-weight: 600; }
        .highlight { color: var(--danger) !important; font-size: 1.05rem; }
        .highlight-green { color: var(--success) !important; }

        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #15171a; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 12px; font-size: 0.9rem; transition: border 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--gold); }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: linear-gradient(145deg, var(--gold), #b8860b); color: #1a1a1a; font-size: 0.9rem; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); box-shadow: none; }

        .btn-action { background: linear-gradient(145deg, var(--blue), #2563eb); color: #fff; padding: 10px; margin-top: 4px; }
        .btn-danger { background: linear-gradient(145deg, var(--danger), #b91c1c); color: #fff; padding: 10px; margin-top: 8px; }
        .btn-back { background: #334155; color: #cbd5e1; margin-top: 14px; box-shadow: none; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 340px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); animation: scaleUp 0.2s ease-out; }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-title { color: #fff; margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 16px; }
        
        .empty-msg { text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">⚖️ 王国裏金融</div>
        <div class="sub-desc">毎朝9時に未返済者から強制没収が執行されます</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('borrow', event)">🛒 市場 (借りる)</button>
            <button class="tab-btn" onclick="switchTab('debts', event)">💸 負債 (借りた金)</button>
            <button class="tab-btn" onclick="switchTab('lend', event)">💰 出品 (貸す)</button>
            <button class="tab-btn" onclick="switchTab('receivables', event)">📜 債権 (貸した金)</button>
        </div>

        <!-- タブ1: 借りる -->
        <div id="tab-borrow" class="tab-content active">
            <div id="offers-list"><div class="empty-msg">読み込み中...</div></div>
            <button id="btn-refresh-offers" onclick="loadOffers()" style="background: #334155; color: #fff; margin-top: 10px;">🔄 リロード</button>
        </div>

        <!-- タブ2: 負債 -->
        <div id="tab-debts" class="tab-content">
            <div id="debts-list"><div class="empty-msg">読み込み中...</div></div>
            <button id="btn-refresh-debts" onclick="loadMyDebts()" style="background: #334155; color: #fff; margin-top: 10px;">🔄 リロード</button>
        </div>

        <!-- タブ3: 貸す (出品) -->
        <div id="tab-lend" class="tab-content">
            <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; border-left: 3px solid var(--gold);">
                手元の資金を市場にデポジットし、利息をつけて貸し出します。
            </div>
            
            <label style="font-size: 0.75rem; color: #94a3b8;">出資する口座 (デポジット元)</label>
            <select id="lend-wallet-select"></select>

            <label style="font-size: 0.75rem; color: #94a3b8;">最大貸出枠 (Gold)</label>
            <input type="number" id="lend-max-amount" placeholder="例: 5000" min="1" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57">

            <label style="font-size: 0.75rem; color: #94a3b8;">設定金利 (%)</label>
            <input type="number" id="lend-interest-rate" placeholder="例: 20" min="0" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57">

            <button id="btn-create-offer" onclick="createOffer()">市場へ融資枠を出品する</button>
        </div>

        <!-- タブ4: 債権 -->
        <div id="tab-receivables" class="tab-content">
            <div id="receivables-list"><div class="empty-msg">読み込み中...</div></div>
            <button id="btn-refresh-receivables" onclick="loadMyReceivables()" style="background: #334155; color: #fff; margin-top: 10px;">🔄 リロード</button>
        </div>

        <button class="btn-back" onclick="location.href='/dashboard'">ダッシュボードへ戻る</button>
    </div>
</div>

<!-- 借入モーダル -->
<div id="modal-borrow" class="modal">
    <div class="modal-content">
        <h3 class="modal-title">資金を借りる</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 16px;" id="borrow-offer-info"></p>
        
        <input type="hidden" id="borrow-offer-id">
        <input type="hidden" id="borrow-max-amount">
        <input type="hidden" id="borrow-interest-rate">
        
        <label style="font-size: 0.75rem; color: #94a3b8;">借入希望額 (Gold)</label>
        <input type="number" id="borrow-amount" placeholder="金額を入力" min="1" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57" oninput="calculateBorrow()">
        
        <div style="background: #0f1115; border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px;">
            <div style="font-size: 0.75rem; color: #94a3b8;">返済予定額 (元本+利息)</div>
            <div style="font-size: 1.4rem; font-weight: bold; color: var(--danger);"><span id="borrow-total-due">0</span> G</div>
        </div>

        <label style="font-size: 0.75rem; color: #94a3b8;">受取口座</label>
        <select id="borrow-wallet-select"></select>

        <button id="btn-execute-borrow" class="btn-action" onclick="executeBorrow()" style="padding: 14px;">この内容で契約する</button>
        <button id="btn-cancel-borrow" class="btn-back" onclick="closeModal('modal-borrow')">キャンセル</button>
    </div>
</div>

<!-- 返済モーダル -->
<div id="modal-repay" class="modal">
    <div class="modal-content">
        <h3 class="modal-title">借金を返済する</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 16px;" id="repay-loan-info"></p>
        
        <input type="hidden" id="repay-loan-id">
        <input type="hidden" id="repay-remaining">
        
        <label style="font-size: 0.75rem; color: #94a3b8;">返済額 (Gold)</label>
        <input type="number" id="repay-amount" placeholder="金額を入力" min="1" step="1" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
        
        <button id="btn-execute-repay" class="btn-danger" onclick="executeRepay()" style="padding: 14px;">返済を実行する</button>
        <button id="btn-cancel-repay" class="btn-back" onclick="closeModal('modal-repay')">キャンセル</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let wallets = [];
    let isProcessing = false;

    function escapeHtml(str) { 
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    }

    async function init() {
        await loadWallets();
        loadOffers();
        loadMyDebts();
        loadMyReceivables();
    }

    function switchTab(tabId, evt) {
        if (isProcessing) return;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        if (evt && evt.target) evt.target.classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                wallets = await res.json();
                const options = wallets.map(w => `<option value="${escapeHtml(w.wallet_id)}">${escapeHtml(w.wallet_name)} (残高: ${w.balance} G)</option>`).join('');
                document.getElementById("lend-wallet-select").innerHTML = options;
                document.getElementById("borrow-wallet-select").innerHTML = options;
            }
        } catch (e) {
            console.error(e);
        }
    }

    /* タブ1: 借りる */
    async function loadOffers() {
        if (isProcessing) return;
        const listEl = document.getElementById("offers-list");
        const btn = document.getElementById("btn-refresh-offers");
        listEl.innerHTML = '<div class="empty-msg">読み込み中...</div>';
        btn.disabled = true;

        try {
            const res = await fetch("/api/loans/offers", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                if (data.length === 0) {
                    listEl.innerHTML = '<div class="empty-msg">現在、市場に融資枠はありません。</div>';
                } else {
                    listEl.innerHTML = data.map(o => `
                        <div class="list-item">
                            <div class="title-row">
                                <span class="title">🏦 融資枠 #${o.id}</span>
                                <span class="badge badge-open">受付中</span>
                            </div>
                            <div class="row"><span>残り貸出枠</span> <span class="highlight-green">${o.max_amount} G</span></div>
                            <div class="row"><span>設定金利</span> <span>${o.interest_rate} %</span></div>
                            <button class="btn-action" onclick="openBorrowModal(${o.id}, ${o.max_amount}, ${o.interest_rate})">この枠から借りる</button>
                        </div>
                    `).join('');
                }
            }
        } catch (e) {} finally { btn.disabled = false; }
    }

    /* タブ2: 負債 */
    async function loadMyDebts() {
        if (isProcessing) return;
        const listEl = document.getElementById("debts-list");
        const btn = document.getElementById("btn-refresh-debts");
        listEl.innerHTML = '<div class="empty-msg">読み込み中...</div>';
        btn.disabled = true;

        try {
            const res = await fetch("/api/loans/my-debts", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                if (data.length === 0) {
                    listEl.innerHTML = '<div class="empty-msg">現在、借金はありません。</div>';
                } else {
                    listEl.innerHTML = data.map(d => {
                        const remaining = d.total_due - d.repaid_amount;
                        const isPaid = d.status === "PAID";
                        const badge = isPaid ? '<span class="badge badge-paid">完済</span>' : '<span class="badge badge-active">未返済</span>';
                        
                        let html = `
                        <div class="list-item" style="${isPaid ? 'opacity: 0.6;' : ''}">
                            <div class="title-row"><span class="title">📜 借入 #${d.id}</span> ${badge}</div>
                            <div class="row"><span>借入元本</span> <span>${d.principal} G (金利 ${d.loan_offers ? d.loan_offers.interest_rate : 0}%)</span></div>
                            <div class="row"><span>返済総額</span> <span>${d.total_due} G</span></div>
                            <div class="row"><span>返済済み</span> <span>${d.repaid_amount} G</span></div>`;
                            
                        if (!isPaid) {
                            html += `
                            <div class="row" style="border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px;">
                                <span>残り返済額</span> <span class="highlight">${remaining} G</span>
                            </div>
                            <button class="btn-danger" onclick="openRepayModal(${d.id}, ${remaining})">手動で返済する</button>`;
                        }
                        html += `</div>`;
                        return html;
                    }).join('');
                }
            }
        } catch (e) {} finally { btn.disabled = false; }
    }

    /* タブ4: 債権 */
    async function loadMyReceivables() {
        if (isProcessing) return;
        const listEl = document.getElementById("receivables-list");
        const btn = document.getElementById("btn-refresh-receivables");
        listEl.innerHTML = '<div class="empty-msg">読み込み中...</div>';
        btn.disabled = true;

        try {
            const res = await fetch("/api/loans/my-receivables", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                if (data.length === 0) {
                    listEl.innerHTML = '<div class="empty-msg">現在、誰にもお金を貸していません。</div>';
                } else {
                    listEl.innerHTML = data.map(d => {
                        const remaining = d.total_due - d.repaid_amount;
                        const isPaid = d.status === "PAID";
                        const badge = isPaid ? '<span class="badge badge-paid">回収完了</span>' : '<span class="badge badge-active">回収中</span>';
                        
                        return `
                        <div class="list-item" style="${isPaid ? 'opacity: 0.6;' : ''}">
                            <div class="title-row"><span class="title">🎯 債権 #${d.id}</span> ${badge}</div>
                            <div class="row"><span>貸付元本</span> <span>${d.principal} G</span></div>
                            <div class="row"><span>回収予定額</span> <span>${d.total_due} G</span></div>
                            <div class="row"><span>回収済み</span> <span class="highlight-green">${d.repaid_amount} G</span></div>
                            ${!isPaid ? `<div class="row"><span>未回収残額</span> <span>${remaining} G</span></div>` : ''}
                        </div>`;
                    }).join('');
                }
            }
        } catch (e) {} finally { btn.disabled = false; }
    }

    /* 出品処理 */
    async function createOffer() {
        if (isProcessing) return;
        const lender_wallet_id = document.getElementById("lend-wallet-select").value;
        const max_amount = parseInt(document.getElementById("lend-max-amount").value, 10);
        const interest_rate = parseInt(document.getElementById("lend-interest-rate").value, 10);

        if (isNaN(max_amount) || max_amount <= 0) return alert("貸出枠は正の整数で入力してください。");
        if (isNaN(interest_rate) || interest_rate < 0) return alert("金利は0以上の数値を入力してください。");
        if (!lender_wallet_id) return alert("口座を選択してください。");

        isProcessing = true;
        const btn = document.getElementById("btn-create-offer");
        btn.disabled = true; btn.innerText = "処理中...";

        try {
            const res = await fetch("/api/loans/offers", {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ lender_wallet_id, max_amount, interest_rate })
            });
            const data = await res.json();
            alert(data.message || data.detail);
            if (res.ok) {
                document.getElementById("lend-max-amount").value = "";
                document.getElementById("lend-interest-rate").value = "";
                await loadWallets();
                switchTab('borrow');
                loadOffers();
            }
        } catch (e) { alert("通信エラー"); } finally { isProcessing = false; btn.disabled = false; btn.innerText = "市場へ融資枠を出品する"; }
    }

    /* 借入モーダル操作 */
    function openBorrowModal(id, max, rate) {
        if (isProcessing) return;
        document.getElementById("borrow-offer-id").value = id;
        document.getElementById("borrow-max-amount").value = max;
        document.getElementById("borrow-interest-rate").value = rate;
        document.getElementById("borrow-offer-info").innerText = `残り枠: ${max} G / 金利: ${rate}%`;
        document.getElementById("borrow-amount").value = "";
        document.getElementById("borrow-total-due").innerText = "0";
        document.getElementById("modal-borrow").style.display = "flex";
    }

    function calculateBorrow() {
        let amt = parseInt(document.getElementById("borrow-amount").value, 10);
        if (isNaN(amt) || amt < 0) amt = 0;
        const rate = parseInt(document.getElementById("borrow-interest-rate").value, 10) || 0;
        const max = parseInt(document.getElementById("borrow-max-amount").value, 10) || 0;
        
        if (amt > max) { amt = max; document.getElementById("borrow-amount").value = max; }
        document.getElementById("borrow-total-due").innerText = amt > 0 ? amt + Math.floor(amt * (rate / 100)) : 0;
    }

    async function executeBorrow() {
        if (isProcessing) return;
        const offer_id = parseInt(document.getElementById("borrow-offer-id").value, 10);
        const borrow_amount = parseInt(document.getElementById("borrow-amount").value, 10);
        const borrower_wallet_id = document.getElementById("borrow-wallet-select").value;

        if (isNaN(borrow_amount) || borrow_amount <= 0) return alert("借入額は正の整数を入力してください。");

        isProcessing = true;
        const btnExec = document.getElementById("btn-execute-borrow");
        const btnCancel = document.getElementById("btn-cancel-borrow");
        btnExec.disabled = true; btnCancel.disabled = true; btnExec.innerText = "処理中...";

        try {
            const res = await fetch("/api/loans/borrow", {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ offer_id, borrow_amount, borrower_wallet_id })
            });
            const data = await res.json();
            alert(data.message || data.detail);
            if (res.ok) {
                closeModal('modal-borrow');
                await loadWallets(); loadOffers(); loadMyDebts();
            }
        } catch (e) { alert("通信エラー"); } finally {
            isProcessing = false; btnExec.disabled = false; btnCancel.disabled = false; btnExec.innerText = "この内容で契約する";
        }
    }

    /* 返済モーダル操作 */
    function openRepayModal(id, remaining) {
        if (isProcessing) return;
        document.getElementById("repay-loan-id").value = id;
        document.getElementById("repay-remaining").value = remaining;
        document.getElementById("repay-loan-info").innerText = `現在の残り返済額: ${remaining} G`;
        document.getElementById("repay-amount").value = remaining; 
        document.getElementById("modal-repay").style.display = "flex";
    }

    async function executeRepay() {
        if (isProcessing) return;
        const loan_id = parseInt(document.getElementById("repay-loan-id").value, 10);
        let repay_amount = parseInt(document.getElementById("repay-amount").value, 10);
        const max_remaining = parseInt(document.getElementById("repay-remaining").value, 10);

        if (isNaN(repay_amount) || repay_amount <= 0) return alert("返済額は正の整数を入力してください。");
        if (repay_amount > max_remaining) repay_amount = max_remaining;

        isProcessing = true;
        const btnExec = document.getElementById("btn-execute-repay");
        const btnCancel = document.getElementById("btn-cancel-repay");
        btnExec.disabled = true; btnCancel.disabled = true; btnExec.innerText = "処理中...";

        try {
            const res = await fetch("/api/loans/repay", {
                method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ loan_id, repay_amount })
            });
            const data = await res.json();
            alert(data.message || data.detail);
            if (res.ok) {
                closeModal('modal-repay');
                await loadWallets(); loadMyDebts(); loadMyReceivables();
            }
        } catch (e) { alert("通信エラー"); } finally {
            isProcessing = false; btnExec.disabled = false; btnCancel.disabled = false; btnExec.innerText = "返済を実行する";
        }
    }

    function closeModal(id) { if (!isProcessing) document.getElementById(id).style.display = "none"; }

    init();
</script>
</body>
</html>
