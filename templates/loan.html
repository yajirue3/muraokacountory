<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 王国裏金融</title>
    <!-- ※CSSは元々のものをそのまま使用 -->
    <style>
        /* (元のCSSスタイルをここに配置) */
        :root { --bg-dark: #0f1115; --card-bg: #1c1e24; --border: #333842; --gold: #d4af37; --danger: #ef4444; --success: #10b981; --blue: #3b82f6; --text-main: #e2e8f0; --text-muted: #94a3b8;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 20px 0; margin: 0; min-height: 100vh; }
        .container { width: 380px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { font-size: 1.3rem; font-weight: 800; color: var(--gold); text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 4px; background: #262932; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .tab-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .list-item { background: #15171a; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
        .list-item .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .list-item .title { font-weight: 700; color: #fff; font-size: 0.95rem; }
        .row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        .badge-active { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-action { background: linear-gradient(145deg, var(--blue), #2563eb); color: #fff; }
        .btn-danger { background: linear-gradient(145deg, var(--danger), #b91c1c); color: #fff; margin-top: 8px; }
        .btn-back { background: #334155; color: #cbd5e1; margin-top: 14px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">⚖️ 王国裏金融</div>
        <div class="tabs" id="tab-container">
            <button class="tab-btn active" onclick="switchTab('borrow', event)">🛒 市場 (借りる)</button>
            <button class="tab-btn" onclick="switchTab('debts', event)">💸 負債 (借金)</button>
            <button class="tab-btn" onclick="switchTab('lend', event)">💰 出品 (貸す)</button>
            <button class="tab-btn" onclick="switchTab('receivables', event)">📜 債権 (貸付)</button>
            <!-- 王様の場合のみここにタブがJSで追加されます -->
        </div>

        <!-- 既存のタブ中身は省略 (元のものをそのまま保持) -->
        <div id="tab-borrow" class="tab-content active">...</div>
        <div id="tab-debts" class="tab-content">...</div>
        <div id="tab-lend" class="tab-content">...</div>
        <div id="tab-receivables" class="tab-content">...</div>

        <!-- 👑 管理者用タブ (追加) -->
        <div id="tab-admin" class="tab-content">
            <div style="color: var(--danger); font-size: 0.8rem; margin-bottom: 10px; text-align: center; border: 1px solid var(--danger); padding: 5px; border-radius: 5px;">
                ⚠️ 国王専用：全滞納者への強制取り立て執行
            </div>
            <div id="admin-loans-list"><div class="empty-msg">読み込み中...</div></div>
            <button onclick="loadAdminLoans()" style="background: #334155; color: #fff; margin-top: 10px;">🔄 リロード</button>
        </div>

        <button class="btn-back" onclick="location.href='/dashboard'">ダッシュボードへ戻る</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    let isKingUser = false;

    async function init() {
        // プロフィールをチェックして王様か判定
        const profRes = await fetch("/api/profile", { headers: { "Authorization": `Bearer ${token}` } });
        if (profRes.ok) {
            const prof = await profRes.json();
            if (prof.role === "king") {
                isKingUser = true;
                document.getElementById('tab-container').innerHTML += `<button class="tab-btn" style="color:var(--gold); border-color:var(--gold);" onclick="switchTab('admin', event)">👑 国王管理</button>`;
            }
        }
        // 他の初期化処理...
    }

    // --- 管理者用メソッド ---
    async function loadAdminLoans() {
        const listEl = document.getElementById("admin-loans-list");
        try {
            const res = await fetch("/api/admin/loans", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                if (data.length === 0) {
                    listEl.innerHTML = '<div class="empty-msg">滞納中の負債はありません。</div>';
                    return;
                }
                listEl.innerHTML = data.map(d => {
                    const remaining = d.total_due - d.repaid_amount;
                    return `
                    <div class="list-item" style="border-color: var(--danger);">
                        <div class="title-row"><span class="title">🎯 #${d.id} | ${d.profiles?.nickname || '不明'}</span> <span class="badge badge-active">未返済</span></div>
                        <div class="row"><span>借入</span> <span>${d.principal} G</span></div>
                        <div class="row"><span>残り返済額</span> <span style="color:var(--danger); font-weight:bold;">${remaining} G</span></div>
                        <button class="btn-danger" onclick="executeForceRepay(${d.id})">💰 この奴隷から強制徴収する</button>
                    </div>`;
                }).join('');
            }
        } catch (e) { console.error(e); }
    }

    async function executeForceRepay(loanId) {
        if (!confirm(`ローン #${loanId} に対して強制取り立てを実行しますか？残高が不足している場合はゼロになります。`)) return;
        try {
            const res = await fetch(`/api/admin/loans/${loanId}/force-repay`, {
                method: "POST", headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            alert(data.message || data.detail);
            if (res.ok) loadAdminLoans();
        } catch (e) { alert("通信エラー"); }
    }
    
    init();
</script>
</body>
</html>
