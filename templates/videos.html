<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>村岡王国 - 映像広場</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; }
        .header { background: #1e1e1e; border-bottom: 1px solid #333; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #d4af37; font-weight: bold; font-size: 1.2rem; text-decoration: none; }
        .btn { padding: 8px 14px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .btn-primary { background: #d4af37; color: #1a1a1a; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; border: 1px solid #333; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: #d4af37; transform: translateY(-3px); }
        .thumb { background: #000; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 2rem; position: relative; }
        .badge { position: absolute; top: 8px; right: 8px; background: #c0392b; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; }
        .info { padding: 12px; }
        .title { font-weight: bold; margin-bottom: 6px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { font-size: 0.8rem; color: #aaa; display: flex; justify-content: space-between; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #d4af37; width: 400px; }
        .modal input, .modal textarea { width: 100%; margin-bottom: 12px; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; box-sizing: border-box; border-radius: 4px;}
    </style>
</head>
<body>
    <div class="header">
        <a href="/dashboard" class="logo">🎬 映像広場</a>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" onclick="document.getElementById('modal').style.display='flex'">＋ 投稿</button>
            <a href="/manage_videos" class="btn">🛠 管理所</a>
            <a href="/dashboard" class="btn">ダッシュボードへ</a>
        </div>
    </div>

    <div class="container">
        <div class="video-grid" id="grid">読み込み中...</div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 style="color:#d4af37; margin-top:0;">新規映像の投稿</h3>
            <form onsubmit="uploadVideo(event)">
                <input type="text" id="up-title" required placeholder="タイトル">
                <textarea id="up-desc" placeholder="説明文" rows="3"></textarea>
                <input type="file" id="up-file" accept="video/*" required>
                <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 8px; margin-bottom: 15px;">
                    <input type="checkbox" id="up-private" style="width:auto; margin:0;"> 非公開にする
                </label>
                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn btn-primary" id="btn-up" style="flex:1;">投稿</button>
                    <button type="button" class="btn" onclick="document.getElementById('modal').style.display='none'">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        if (!token) location.href = "/";

        async function loadVideos() {
            try {
                const res = await fetch("/api/videos", { headers: { "Authorization": `Bearer ${token}` } });
                if (!res.ok) throw new Error("取得エラー");
                const data = await res.json();
                const grid = document.getElementById("grid");
                
                if(data.videos.length === 0) {
                    grid.innerHTML = "映像がありません。";
                    return;
                }
                
                grid.innerHTML = data.videos.map(v => `
                    <div class="card" onclick="location.href='/watch?v=${v.id}'">
                        <div class="thumb">▶️ ${v.is_private ? '<span class="badge">非公開</span>' : ''}</div>
                        <div class="info">
                            <div class="title">${v.title}</div>
                            <div class="meta">
                                <span>👤 ${v.author_name}</span>
                                <span>👀 ${v.views || 0}回</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById("grid").innerHTML = "エラーが発生しました。";
            }
        }

        async function uploadVideo(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-up");
            btn.disabled = true;
            btn.innerText = "転送中...";

            const fd = new FormData();
            fd.append("title", document.getElementById("up-title").value);
            fd.append("description", document.getElementById("up-desc").value);
            fd.append("is_private", document.getElementById("up-private").checked);
            fd.append("file", document.getElementById("up-file").files[0]);

            try {
                const res = await fetch("/api/videos/upload", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` },
                    body: fd
                });
                
                if (res.ok) {
                    alert("投稿完了しました");
                    document.getElementById("modal").style.display = 'none';
                    e.target.reset();
                    loadVideos();
                } else {
                    const err = await res.json();
                    alert("エラー: " + err.detail);
                }
            } catch(e) {
                alert("通信エラーが発生しました");
            } finally {
                btn.disabled = false;
                btn.innerText = "投稿";
            }
        }
        loadVideos();
    </script>
</body>
</html>
