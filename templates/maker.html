            break;
    }
}

function drawSpike(ctx, x, y, ts, dir) {
    ctx.fillStyle = '#ff2a5f'; 
    const hc = ts / 2; 
    ctx.beginPath();
    if (dir === 'up') { ctx.moveTo(x + hc, y + 4); ctx.lineTo(x + ts - 2, y + ts); ctx.lineTo(x + 2, y + ts); } 
    else if (dir === 'down') { ctx.moveTo(x + hc, y + ts - 4); ctx.lineTo(x + ts - 2, y); ctx.lineTo(x + 2, y); } 
    else if (dir === 'left') { ctx.moveTo(x + 4, y + hc); ctx.lineTo(x + ts, y + 2); ctx.lineTo(x + ts, y + ts - 2); } 
    else if (dir === 'right') { ctx.moveTo(x + ts - 4, y + hc); ctx.lineTo(x, y + 2); ctx.lineTo(x, y + ts - 2); }
    ctx.closePath(); 
    ctx.fill(); 
    ctx.stroke();
    
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; 
    ctx.beginPath();
    if (dir === 'up') { ctx.moveTo(x + hc, y + 10); ctx.lineTo(x + hc + 6, y + ts - 4); ctx.lineTo(x + hc - 2, y + ts - 4); } 
    else if (dir === 'down') { ctx.moveTo(x + hc, y + ts - 10); ctx.lineTo(x + hc + 6, y + 4); ctx.lineTo(x + hc - 2, y + 4); } 
    else if (dir === 'left') { ctx.moveTo(x + 10, y + hc); ctx.lineTo(x + ts - 4, y + hc + 6); ctx.lineTo(x + ts - 4, y + hc - 2); } 
    else if (dir === 'right') { ctx.moveTo(x + ts - 10, y + hc); ctx.lineTo(x + 4, y + hc + 6); ctx.lineTo(x + 4, y + hc - 2); } 
    ctx.fill();
}

function drawOneway(ctx, x, y, ts, dir) {
    ctx.fillStyle = '#2ecc71';
    if (dir === 'up') { 
        roundRect(ctx, x, y + ts - 12, ts, 12, 4); 
        ctx.fillStyle = '#fff'; 
        ctx.beginPath(); ctx.moveTo(x + ts/2, y + 16); ctx.lineTo(x + ts/2 - 6, y + 26); ctx.lineTo(x + ts/2 + 6, y + 26); ctx.fill(); 
    } else if (dir === 'down') { 
        roundRect(ctx, x, y, ts, 12, 4); 
        ctx.fillStyle = '#fff'; 
        ctx.beginPath(); ctx.moveTo(x + ts/2, y + 24); ctx.lineTo(x + ts/2 - 6, y + 14); ctx.lineTo(x + ts/2 + 6, y + 14); ctx.fill(); 
    } else if (dir === 'left') { 
        roundRect(ctx, x + ts - 12, y, 12, ts, 4); 
        ctx.fillStyle = '#fff'; 
        ctx.beginPath(); ctx.moveTo(x + 16, y + ts/2); ctx.lineTo(x + 26, y + ts/2 - 6); ctx.lineTo(x + 26, y + ts/2 + 6); ctx.fill(); 
    } else if (dir === 'right') { 
        roundRect(ctx, x, y, 12, ts, 4); 
        ctx.fillStyle = '#fff'; 
        ctx.beginPath(); ctx.moveTo(x + 24, y + ts/2); ctx.lineTo(x + 14, y + ts/2 - 6); ctx.lineTo(x + 14, y + ts/2 + 6); ctx.fill(); 
    }
}

function draw() {
    ctx.fillStyle = '#0f121a'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const dpr = window.devicePixelRatio || 1;
    const viewW = window.innerWidth / zoomScale; 
    const viewH = window.innerHeight / zoomScale;
    
    if (mode === 'play') { 
        // スマホなどの画面で、操作UIにプレイヤーが隠れないようにカメラを少し上方向(yOffset)にずらす
        const yOffset = isMobile ? 80 / zoomScale : 0;
        camera.x += (player.x + player.w/2 - viewW/2 - camera.x) * 0.15; 
        camera.y += (player.y + player.h/2 - viewH/2 + yOffset - camera.y) * 0.15; 
    }
    
    camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, camera.x)); 
    camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, camera.y));

    ctx.save();
    ctx.scale(dpr, dpr);
    
    let shakeX = 0, shakeY = 0;
    if (screenShake > 0) { 
        shakeX = (Math.random() - 0.5) * screenShake; 
        shakeY = (Math.random() - 0.5) * screenShake; 
        
        if (player.boostTimer > 0 && player.vy === 0) {
            shakeX = (Math.random() - 0.5) * screenShake * 2;
            shakeY = 0;
        }
        
        screenShake *= 0.8; 
        if (screenShake < 0.5) screenShake = 0; 
    }
    
    ctx.scale(zoomScale, zoomScale); 
    
    const drawCamX = Math.round(camera.x - shakeX);
    const drawCamY = Math.round(camera.y - shakeY);
    ctx.translate(-drawCamX, -drawCamY);

    if (mode === 'edit') {
        ctx.strokeStyle = 'rgba(255,255,255,0.03)'; 
        ctx.lineWidth = 1; 
        ctx.beginPath();
        const sC = Math.max(0, Math.floor(camera.x / TILE_SIZE));
        const eC = Math.min(MAP_COLS, Math.ceil((camera.x + viewW) / TILE_SIZE));
        const sR = Math.max(0, Math.floor(camera.y / TILE_SIZE));
        const eR = Math.min(MAP_ROWS, Math.ceil((camera.y + viewH) / TILE_SIZE));
        
        for (let c = sC; c <= eC; c++) { 
            ctx.moveTo(c * TILE_SIZE, sR * TILE_SIZE); 
            ctx.lineTo(c * TILE_SIZE, eR * TILE_SIZE); 
        }
        for (let r = sR; r <= eR; r++) { 
            ctx.moveTo(sC * TILE_SIZE, r * TILE_SIZE); 
            ctx.lineTo(eC * TILE_SIZE, r * TILE_SIZE); 
        } 
        ctx.stroke();
    }

    const mData = mode === 'play' ? activeMapData : mapData;
    ctx.lineWidth = 3; 
    ctx.lineJoin = 'round';

    for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = 0; c < MAP_COLS; c++) {
            const t = mData[r][c]; 
            if (t === 0) continue;
            drawTileGraphics(ctx, t, r, c, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE / 2);
        }
    }

    // 動的オブジェクトの描画
    if (mode === 'play') {
        crosses.forEach(cr => { 
            ctx.fillStyle = '#f39c12'; roundRect(ctx, cr.x+12, cr.y+2, 16, cr.h-4, 2); roundRect(ctx, cr.x+2, cr.y+12, cr.w-4, 16, 2); 
            ctx.fillStyle = '#fff'; ctx.fillRect(cr.x+16, cr.y+16, 8, 8); 
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cr.x+4, cr.y+4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cr.x+cr.w-4, cr.y+4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cr.x+4, cr.y+cr.h-4, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cr.x+cr.w-4, cr.y+cr.h-4, 2, 0, Math.PI*2); ctx.fill();
        });
        
        lifts.forEach(lf => { 
            ctx.fillStyle = '#3498db'; roundRect(ctx, lf.x, lf.y, lf.w, lf.h, 4); 
            ctx.fillStyle='#111'; ctx.fillRect(lf.x+4, lf.y+4, lf.w-8, lf.h-8); 
        });
        
        trails.forEach(tr => { 
            ctx.save(); 
            ctx.globalAlpha = tr.life * 0.5; 
            ctx.translate(tr.x + tr.w/2, tr.y + tr.h); 
            ctx.fillStyle = (player.starTimer > 0) ? '#ffd700' : '#00e5ff'; 
            roundRect(ctx, -tr.w/2, -tr.h, tr.w, tr.h, 6); 
            ctx.restore(); 
        });
        
        enemies.forEach(e => {
            if (e.type === 6) {
                ctx.strokeStyle = (e.tmr > 130 && e.tmr % 4 < 2) ? '#fff' : 'rgba(255, 71, 87, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(e.x + e.w/2, e.y + e.h/2);
                ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
                ctx.stroke();
            }
        });

        if (player.hook) { 
            ctx.strokeStyle = '#fff'; 
            ctx.lineWidth = 2; 
            ctx.beginPath(); 
            ctx.moveTo(player.x + player.w/2, player.y + player.h/2); 
            ctx.lineTo(player.hook.x, player.hook.y); 
            ctx.stroke(); 
        }
        
        projectiles.forEach(p => { 
            if (p.isGolgo) {
                ctx.strokeStyle = '#ffd700'; 
                ctx.lineWidth = 4;
                ctx.beginPath(); 
                ctx.moveTo(p.x + p.w/2, p.y + p.h/2); 
                ctx.lineTo(p.x + p.w/2 - p.vx, p.y + p.h/2 - p.vy); 
                ctx.stroke();
            } else {
                ctx.fillStyle = p.color || 'rgba(255,42,95,0.9)'; 
                ctx.strokeStyle = '#000'; 
                ctx.lineWidth = 2; 
                ctx.beginPath(); 
                ctx.arc(p.x+p.w/2, p.y+p.h/2, p.w/2, 0, Math.PI*2); 
                ctx.fill(); 
                ctx.stroke(); 
                
                ctx.fillStyle = '#fff'; 
                ctx.beginPath(); 
                ctx.arc(p.x+p.w/2, p.y+p.h/2, p.w/4, 0, Math.PI*2); 
                ctx.fill(); 
            }
        });
        
        if (player.state !== 'dead') {
            ctx.save(); 
            ctx.translate(player.x + player.w/2, player.y + player.h); 
            ctx.scale(player.scaleX, player.scaleY);
            
            if (player.starTimer > 0) { 
                let t = Date.now() * 0.01;
                let r = Math.floor(Math.sin(t) * 127 + 128);
                let g = Math.floor(Math.sin(t + 2) * 127 + 128);
                let b = Math.floor(Math.sin(t + 4) * 127 + 128);
                ctx.shadowColor = `rgb(${r},${g},${b})`;
                ctx.shadowBlur = 15;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
            } else {
                ctx.fillStyle = '#00e5ff'; 
            }
            
            ctx.strokeStyle = '#000'; 
            ctx.lineWidth = 3;
            roundRect(ctx, -player.w/2, -player.h, player.w, player.h, 6);
            ctx.shadowBlur = 0;
            
            if (player.boostTimer > 0) {
                ctx.fillStyle = '#fff';
                const eyeX = player.faceDir > 0 ? 6 : -14;
                ctx.fillRect(eyeX, -player.h+6, 8, 2);
            } else {
                ctx.fillStyle = '#fff'; 
                const eyeX = player.faceDir > 0 ? 8 : -6;
                ctx.beginPath(); ctx.arc(eyeX-5, -player.h+8, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                ctx.beginPath(); ctx.arc(eyeX+5, -player.h+8, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = '#000'; 
                const px = player.faceDir > 0 ? 1 : -1; 
                ctx.beginPath(); ctx.arc(eyeX-5+px, -player.h+8, 2, 0, Math.PI*2); ctx.fill(); 
                ctx.beginPath(); ctx.arc(eyeX+5+px, -player.h+8, 2, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        enemies.forEach(e => {
            if (e.type === 6) {
                ctx.fillStyle = '#111'; 
                roundRect(ctx, e.x, e.y, e.w, e.h, 2);
                ctx.fillStyle = '#f1c27d'; 
                ctx.fillRect(e.x+6, e.y+4, 16, 8); 
                ctx.fillStyle = '#000'; 
                ctx.fillRect(e.x+4, e.y+6, 20, 4); 
            } else if (e.type === 5) {
                ctx.fillStyle = '#ff4757'; 
                ctx.strokeStyle = '#000'; 
                ctx.lineWidth = 3; 
                roundRect(ctx, e.x, e.y, e.w, e.h, 4);
                
                ctx.fillStyle = '#fff'; 
                ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + e.h/2, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#ff4757';
                ctx.beginPath(); ctx.arc(e.x + e.w/2 + (e.vx>0?2:-2), e.y + e.h/2, 3, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = (e.type === 2) ? '#ff2a5f' : (e.type === 3) ? '#e67e22' : (e.type === 4) ? '#34495e' : '#a855f7'; 
                ctx.strokeStyle = '#000'; 
                ctx.lineWidth = 3; 
                roundRect(ctx, e.x, e.y, e.w, e.h, 6);
                
                if (e.blink < 90) { 
                    ctx.fillStyle = '#fff'; 
                    const ex = e.vx > 0 ? e.x+14 : e.x+6; 
                    ctx.beginPath(); ctx.arc(ex, e.y+10, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                    ctx.beginPath(); ctx.arc(ex+8, e.y+10, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke(); 
                    
                    ctx.fillStyle = '#000'; 
                    ctx.beginPath(); ctx.arc(ex+(e.vx>0?1:-1), e.y+10, 1.5, 0, Math.PI*2); ctx.fill(); 
                    ctx.beginPath(); ctx.arc(ex+8+(e.vx>0?1:-1), e.y+10, 1.5, 0, Math.PI*2); ctx.fill(); 
                } else { 
                    ctx.beginPath(); ctx.moveTo(e.x+6, e.y+10); ctx.lineTo(e.x+12, e.y+10); ctx.stroke(); 
                    ctx.beginPath(); ctx.moveTo(e.x+16, e.y+10); ctx.lineTo(e.x+22, e.y+10); ctx.stroke(); 
                }
            }
        });
    }

    particles.forEach(p => { 
        ctx.globalAlpha = Math.max(0, p.life); 
        ctx.fillStyle = p.color; 
        ctx.fillRect(p.x, p.y, 5, 5); 
        ctx.globalAlpha = 1.0; 
    });
    
    ctx.restore();
}

let slowFrames = 0;

function loop() { 
    let isAiming = (mode === 'play' && player.hasSpider && input.isDown && !player.hook);
    let doUpdate = true;
    
    if (isAiming) {
        slowFrames++;
        if (slowFrames % 3 !== 0) {
            doUpdate = false; 
        }
    }
    
    if (mode === 'play' && doUpdate) {
        updatePhysics(); 
    }
    
    draw(); 
    requestAnimationFrame(loop); 
}

requestAnimationFrame(loop);

/* =========================================================
   6. 通信・モーダル処理
========================================================= */
const token = localStorage.getItem("access_token");

function openModal(id) { 
    document.getElementById(id).style.display = 'flex'; 
}

function closeModal(id) { 
    document.getElementById(id).style.display = 'none'; 
}

function openSaveModal() {
    if (mode === 'play') {
        setMode('edit');
    }
    
    let hasStart = false, hasGoal = false;
    for (let r = 0; r < MAP_ROWS; r++) { 
        for (let c = 0; c < MAP_COLS; c++) { 
            if (mapData[r][c] === T.START) hasStart = true; 
            if (mapData[r][c] === T.GOAL) hasGoal = true; 
        } 
    }
    
    if (!hasStart || !hasGoal) {
        alert("公開には「スタート(S)」と「ゴール(旗)」が必要です。");
        return;
    }
    openModal('modal-save');
}

async function saveStage() {
    const title = document.getElementById('save-title').value.trim(); 
    const desc = document.getElementById('save-desc').value.trim();
    if (!title) {
        alert("ステージ名を入力してください。");
        return;
    }
    
    try {
        const payload = JSON.stringify({ map: mapData, warps: warpPairs });
        const res = await fetch("/api/maker/stages", { 
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${token}` 
            }, 
            body: JSON.stringify({ title: title, description: desc, map_data: payload }) 
        });
        
        const data = await res.json();
        
        if (res.ok) { 
            alert(data.message || "公開しました！"); 
            currentStageInfo = { id: data.id, title: title, author: '自分', isMine: true }; 
            updateCourseHUDInfo(); 
            closeModal('modal-save'); 
        } else {
            alert("エラー: " + (data.detail || "保存失敗"));
        }
    } catch (e) { 
        alert("通信エラーが発生しました。"); 
    }
}

async function openLoadModal() {
    if (mode === 'play') {
        setMode('edit'); 
    }
    openModal('modal-load');
    
    const box = document.getElementById('stage-list-container'); 
    box.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">検索中...</div>';
    
    try {
        const res = await fetch("/api/maker/stages", { 
            headers: { 'Authorization': `Bearer ${token}` } 
        }); 
        const data = await res.json();
        
        if (data.stages && data.stages.length > 0) {
            box.innerHTML = data.stages.map(s => {
                const badges = []; 
                if (s.is_pinned) badges.push(`<span style="color:var(--accent-gold); font-size:0.75rem;">👑勅命</span>`); 
                if (s.is_confiscated) badges.push(`<span style="color:var(--danger-color); font-size:0.75rem;">🚨接収済</span>`);
                
                let actions = ''; 
                if (s.is_mine || data.is_king) {
                    actions += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem; border-color:var(--danger-color);" onclick="deleteStage(${s.id}, event)">破棄</button>`;
                }
                
                if (data.is_king) { 
                    actions += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem;" onclick="pinStage(${s.id}, event)">勅命</button>`; 
                    if (!s.is_confiscated) {
                        actions += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem;" onclick="confiscateStage(${s.id}, event)">接収</button>`; 
                    }
                }
                
                const userIcon = s.is_mine ? '<span style="color:var(--accent-gold)">👑</span>' : '👤';
                
                return `
                <div class="stage-card" onclick="loadStage(${s.id})">
                    <div style="flex:1;">
                        <div class="st-title">${badges.join(' ')} ${userIcon} ${escapeHtml(s.title)}</div>
                        <div class="st-author">作: ${escapeHtml(s.creator_name)} | ${escapeHtml(s.description||'')}</div>
                        <div class="st-stats">プレイ: ${s.plays_count} / クリア: ${s.clears_count}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
                        <button class="btn-retro btn-cyan" style="padding:8px 12px;">PLAY</button>
                        <div style="display:flex; gap:6px; margin-top:4px;">${actions}</div>
                    </div>
                </div>`;
            }).join('');
        } else { 
            box.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">ステージがありません。</div>'; 
        }
    } catch (e) { 
        box.innerHTML = '<div style="text-align:center;color:#ff2a5f;margin-top:20px;">エラーが発生しました。<br><button class="btn-retro" style="margin:10px auto;" onclick="openLoadModal()">再試行</button></div>'; 
    }
}

async function loadStage(id) {
    try {
        const res = await fetch(`/api/maker/stages/${id}`, { 
            headers: { 'Authorization': `Bearer ${token}` } 
        }); 
        const data = await res.json();
        
        if (res.ok) { 
            let parsed = JSON.parse(data.stage.map_data); 
            if (Array.isArray(parsed)) { 
                mapData = parsed; 
                warpPairs = []; 
            } else { 
                mapData = parsed.map; 
                warpPairs = parsed.warps || []; 
            } 
            currentStageInfo = { 
                id: id, 
                title: data.stage.title, 
                author: data.stage.creator_name, 
                isMine: data.stage.is_mine 
            }; 
            updateCourseHUDInfo(); 
            closeModal('modal-load'); 
            setMode('play'); 
        } else { 
            alert("失敗: " + data.detail); 
        }
    } catch (e) { 
        alert("通信エラーが発生しました。"); 
    }
}

async function deleteStage(id, e) { 
    e.stopPropagation(); 
    if (!confirm("破壊しますか？")) return; 
    
    try { 
        await fetch(`/api/maker/stages/${id}`, { 
            method: 'DELETE', 
            headers: { 'Authorization': `Bearer ${token}` } 
        }); 
        openLoadModal(); 
    } catch (e) {} 
}

async function pinStage(id, e) { 
    e.stopPropagation(); 
    try { 
        await fetch(`/api/admin/maker/stages/${id}/pin`, { 
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` } 
        }); 
        openLoadModal(); 
    } catch (e) {} 
}

async function confiscateStage(id, e) { 
    e.stopPropagation(); 
    if (!confirm("接収しますか？")) return; 
    
    try { 
        await fetch(`/api/admin/maker/stages/${id}/confiscate`, { 
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` } 
        }); 
        openLoadModal(); 
    } catch (e) {} 
}
</script>
