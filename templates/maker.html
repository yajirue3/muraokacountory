<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 王立試練迷宮（Maker DX Pro Max）</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Press+Start+2P&display=swap');

        :root {
            --bg-base: #0f121a; --bg-surface: #1e2430; --border-bold: #000000;
            --text-primary: #ffffff; --text-secondary: #8a99a8;
            --accent-gold: #ffd700; --accent-cyan: #00e5ff; --danger-color: #ff2a5f;
            --switch-off: #ff2a5f; --switch-on: #00e5ff;
            --btn-shadow: 0 4px 0 rgba(0,0,0,0.8);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; width: 100vw; height: 100dvh; }
        .pixel-text { font-family: 'Press Start 2P', monospace; text-transform: uppercase; }

        /* ヘッダー UI */
        #top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 56px; background: rgba(15, 18, 26, 0.9); backdrop-filter: blur(10px); border-bottom: 3px solid var(--border-bold); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 100; gap: 6px; }
        .btn-retro { background: var(--bg-surface); border: 3px solid #000; color: var(--text-primary); padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 900; border-radius: 8px; box-shadow: var(--btn-shadow); transition: transform 0.1s, box-shadow 0.1s; white-space: nowrap; }
        .btn-retro:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        .btn-retro svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .btn-cyan { background: var(--accent-cyan); color: #000; }
        .btn-gold { background: var(--accent-gold); color: #000; }

        .mode-toggle { display: flex; background: #000; border: 3px solid #000; border-radius: 10px; overflow: hidden; box-shadow: var(--btn-shadow); }
        .mode-toggle button { background: #1a1e29; border: none; color: #fff; padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 0.8rem; }
        .mode-toggle button svg { width: 16px; height: 16px; fill: currentColor; }
        .mode-toggle button.active { background: var(--accent-cyan); color: #000; }

        .zoom-controls { display: flex; align-items: center; background: #000; border-radius: 8px; border: 2px solid #000; }
        .zoom-btn { background: var(--bg-surface); color: #fff; border: none; padding: 4px 8px; font-weight: 900; cursor: pointer; }
        .zoom-btn:active { background: var(--accent-gold); color: #000; }
        .zoom-val { font-size: 0.75rem; padding: 0 8px; color: var(--accent-gold); font-weight: 900; }

        /* HUD */
        #hud { position: absolute; top: 66px; left: 10px; z-index: 90; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; max-width: 90vw; }
        .hud-badge { background: rgba(0,0,0,0.8); border: 2.5px solid #000; border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 900; }
        .hud-badge svg { width: 16px; height: 16px; }
        .course-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; }
        .tag-my { background: var(--accent-gold); color: #000; }
        .tag-other { background: var(--accent-cyan); color: #000; }

        /* パレット */
        #palette-wrap { position: absolute; bottom: calc(var(--safe-bottom) + 10px); left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1); }
        #palette-wrap.collapsed { transform: translate(-50%, calc(100% - 28px)); }
        #palette-toggle { background: #000; color: #fff; border: 2px solid #fff; border-bottom: none; border-radius: 12px 12px 0 0; padding: 4px 24px; font-size: 0.75rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        #palette-wrap.collapsed #palette-toggle svg { transform: rotate(180deg); }
        .palette-box { background: var(--bg-surface); border: 3px solid #000; padding: 8px; border-radius: 16px; box-shadow: 0 8px 0 rgba(0,0,0,0.8); max-width: 95vw; }
        .pal-categories { display: flex; gap: 6px; margin-bottom: 8px; border-bottom: 2px dashed #444; padding-bottom: 8px; overflow-x: auto; }
        .pal-tab { background: #111; color: #888; border: 2px solid #000; border-radius: 6px; padding: 4px 12px; font-size: 0.75rem; font-weight: 900; cursor: pointer; white-space: nowrap; }
        .pal-tab.active { background: var(--accent-gold); color: #000; }
        #palette { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-behavior: smooth; }
        .palette-item { min-width: 44px; height: 44px; background: #111; border: 2.5px solid #000; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; flex-shrink: 0; box-shadow: 0 3px 0 #000; transition: transform 0.1s; }
        .palette-item:active { transform: translateY(3px); box-shadow: none; }
        .palette-item.selected { background: var(--accent-gold) !important; color: #000 !important; }
        .palette-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .palette-label { font-size: 0.5rem; font-weight: 900; margin-top: 2px; }

        /* スマホ用操作コントロール */
        #mobile-controls { position: absolute; bottom: calc(var(--safe-bottom) + 20px); left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 95; pointer-events: none; }
        .ctrl-group { display: flex; gap: 12px; pointer-events: auto; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(0,0,0,0.5); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; pointer-events: auto; backdrop-filter: blur(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
        .ctrl-btn svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .ctrl-btn:active { background: var(--accent-cyan); color: #000; border-color: #000; transform: translateY(4px); box-shadow: none; }

        #center-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 5px solid var(--accent-gold); border-radius: 16px; padding: 16px 32px; text-align: center; color: var(--accent-gold); font-size: 2rem; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 150; box-shadow: 0 10px 0 #000; white-space: nowrap; }
        #center-msg.show { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(-3deg); }
        #toast-msg { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: rgba(255, 42, 95, 0.95); color: #fff; border: 3px solid #000; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 0.9rem; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 140; box-shadow: 0 4px 0 #000; }
        #toast-msg.show { opacity: 1; }

        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal-box { background: var(--bg-surface); border: 4px solid #000; border-radius: 16px; width: 100%; max-width: 550px; padding: 20px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 0 #000; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px dashed var(--border-bold); padding-bottom: 10px; margin-bottom: 16px; }
        .modal-title { font-size: 1.2rem; color: var(--accent-gold); font-weight: 900; }
        .modal-close { background: var(--danger-color); color: #fff; border: 2.5px solid #000; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #000; }
        .modal-close:active { transform: translateY(3px); box-shadow: none; }
        
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-primary); }
        .form-group input { padding: 12px; background: #111; border: 3px solid #000; border-radius: 8px; color: #fff; outline: none; font-size: 1rem; font-weight: bold; }
        .form-group input:focus { border-color: var(--accent-gold); }
        
        .stage-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .stage-card { background: #13161f; border: 3px solid #000; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; box-shadow: 0 4px 0 #000; }
        .stage-card:active { transform: translateY(3px); box-shadow: none; }
        .st-title { font-weight: 900; color: var(--accent-gold); font-size: 1.05rem; }
        .st-author { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }
        .st-stats { font-size: 0.8rem; color: var(--accent-cyan); font-weight: bold; margin-top: 4px; }
        .io-textarea { width: 100%; height: 120px; background: #111; color: #fff; border: 3px solid #000; border-radius: 8px; padding: 8px; font-family: monospace; resize: none; margin-bottom: 10px; outline: none; }
        .io-textarea:focus { border-color: var(--accent-cyan); }
        .flex-btns { display: flex; gap: 8px; margin-top: 10px; }

        @media (max-width: 650px) { .hide-sm { display: none; } .btn-retro { padding: 6px 8px; } #top-bar { padding: 6px 8px; } #hud { top: 62px; } }
    </style>
</head>
<body>

    <div id="top-bar">
        <button class="btn-retro" onclick="location.href='/dashboard'"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg><span class="hide-sm">戻る</span></button>
        <div class="mode-toggle">
            <button id="btn-edit" class="active" onclick="setMode('edit')"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg><span class="hide-sm">作成</span></button>
            <button id="btn-play" onclick="setMode('play')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" stroke="none"></polygon></svg><span class="hide-sm">遊ぶ</span></button>
        </div>
        <div class="zoom-controls hide-sm">
            <button class="zoom-btn" onclick="adjustZoom(-0.15)">－</button><span class="zoom-val" id="zoom-text">100%</span><button class="zoom-btn" onclick="adjustZoom(0.15)">＋</button>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-retro" onclick="openModal('modal-io')"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span class="hide-sm">I/O</span></button>
            <button class="btn-retro btn-cyan" onclick="openLoadModal()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="hide-sm">探す</span></button>
            <button class="btn-retro btn-gold" onclick="openSaveModal()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg><span class="hide-sm">公開</span></button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-badge" style="color: var(--accent-gold);"><svg viewBox="0 0 24 24" fill="#ffd700" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="17"/></svg><span id="hud-coins">0</span> / <span id="hud-total-coins">0</span></div>
        <div class="hud-badge" id="hud-key" style="color: #666;"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><line x1="11" y1="11" x2="20" y2="20"/><line x1="16" y1="16" x2="19" y2="13"/></svg><span id="hud-key-text">なし</span></div>
        <div class="hud-badge" id="hud-switch-status" style="display:none; color: var(--accent-cyan);"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span id="hud-sw-text">回路: OFF</span></div>
        <div class="hud-badge" id="hud-course-info"><span id="hud-course-tag" class="course-tag tag-my">MY COURSE</span><span id="hud-course-title">新規作成コース</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="center-msg" class="pixel-text">STAGE CLEAR!</div>
    <div id="toast-msg"><span id="toast-text"></span></div>

    <div id="palette-wrap">
        <button id="palette-toggle" onclick="togglePalette()"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg> ツール</button>
        <div class="palette-box">
            <div class="pal-categories">
                <div class="pal-tab active" onclick="setPalCat('all', this)">全て</div>
                <div class="pal-tab" onclick="setPalCat('terrain', this)">地形</div>
                <div class="pal-tab" onclick="setPalCat('gimmick', this)">仕掛</div>
                <div class="pal-tab" onclick="setPalCat('item', this)">強化</div>
                <div class="pal-tab" onclick="setPalCat('danger', this)">危険</div>
                <div class="pal-tab" onclick="setPalCat('entity', this)">キャラ</div>
            </div>
            <div id="palette"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
            <div class="ctrl-btn" id="btn-right"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
        </div>
        <div class="ctrl-btn" id="btn-jump" style="background: rgba(0,229,255,0.3); border-color: #00e5ff;"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg></div>
    </div>

    <!-- モーダル群 -->
    <div id="modal-io" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-io')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">DATA I/O</div>
                <button class="modal-close" onclick="closeModal('modal-io')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <p style="font-size:0.85rem; margin-bottom:8px;">コースデータのテキスト（JSON）</p>
            <textarea id="io-data" class="io-textarea" placeholder="ここにコードを貼り付けてロード、またはエクスポートで生成"></textarea>
            <div class="flex-btns">
                <button class="btn-retro btn-cyan" style="flex:1; justify-content:center;" onclick="exportData()">書き出し (コピー)</button>
                <button class="btn-retro btn-gold" style="flex:1; justify-content:center;" onclick="importData()">読み込み (ロード)</button>
            </div>
        </div>
    </div>

    <div id="modal-save" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-save')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">STAGE UPLOAD</div>
                <button class="modal-close" onclick="closeModal('modal-save')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div class="form-group"><label>ステージ名</label><input type="text" id="save-title" placeholder="例: 奈落のどっきり迷宮" maxlength="30"></div>
            <div class="form-group"><label>説明・煽り文句</label><input type="text" id="save-desc" placeholder="例: 罠がいっぱい！" maxlength="50"></div>
            <button class="btn-retro btn-gold" style="justify-content: center; padding: 12px; margin-top: 10px; font-size: 1rem;" onclick="saveStage()">データベースへ公開</button>
        </div>
    </div>

    <div id="modal-load" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-load')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">WORLD STAGES</div>
                <button class="modal-close" onclick="closeModal('modal-load')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:12px;"><button class="btn-retro" onclick="openLoadModal()" style="width:100%; justify-content:center;">🔄 リロード / 再検索</button></div>
            <div class="stage-list" id="stage-list-container"></div>
        </div>
    </div>

<script>
function escapeHtml(str) { return str ? String(str).replace(/[&<>"']/g, match => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[match])) : ''; }

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const TILE_SIZE = 40; 
const MAP_COLS = 100; 
const MAP_ROWS = 25;

const COLOR_SW_ON = '#00e5ff';
const COLOR_SW_OFF = '#ff2a5f';
const W_COLORS = ['#9b59b6', '#3498db', '#1abc9c', '#e67e22', '#e74c3c', '#f1c40f', '#34495e'];

const T = {
    EMPTY: 0, BLOCK: 1, SPIKE_UP: 2, COIN: 3, GOAL: 4, KEY: 5, DOOR: 6, BOUNCER: 7, 
    ENEMY: 8, START: 9, BRICK: 10, SPIKE_DOWN: 11, SPIKE_LEFT: 12, SPIKE_RIGHT: 13,
    BEAM_R: 14, ONEWAY_UP: 15, WARP: 16, PAN: 100,
    BEAM_L: 18, BEAM_U: 19, BEAM_D: 20, 
    ONEWAY_DOWN: 21, ONEWAY_LEFT: 22, ONEWAY_RIGHT: 23,
    ENEMY2: 24, SWITCH: 25, SW_BLOCK_A: 26, SW_BLOCK_B: 27,
    CROSS: 28, BOOST_R: 29, BOOST_L: 30,
    HIDDEN_BLOCK: 31, LEVER: 32, ENEMY_H: 33, ENEMY_V: 34, BOOST_U: 35, LIFT_H: 36, LIFT_V: 37,
    STAR: 38, SPIDER: 39, ENEMY_SNIPER: 40, ENEMY_GOLGO: 41
};

const paletteItems = [
    { id: T.PAN, cat: 'all', color: '#fff', label: '移動', icon: '<path d="M9 11V4a2 2 0 0 1 4 0v7M13 11V7a2 2 0 0 1 4 0v4M17 11v-1a2 2 0 0 1 4 0v5.5a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7V9a2 2 0 0 1 4 0v2"/>' },
    { id: T.EMPTY, cat: 'terrain', color: '#ff2a5f', label: '消しゴム', icon: '<path d="M18 6L6 18M6 6l12 12"/>' },
    { id: T.BLOCK, cat: 'terrain', color: '#aaa', label: 'ブロック', icon: '<rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="9"/><line x1="8" y1="9" x2="8" y2="15"/><line x1="16" y1="9" x2="16" y2="15"/>' },
    { id: T.BRICK, cat: 'terrain', color: '#e67e22', label: '壊れる', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v9M8 12v9M16 12v9"/>' },
    { id: T.HIDDEN_BLOCK, cat: 'terrain', color: '#f1c40f', label: '隠し', icon: '<rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 4"/><text x="12" y="16" font-size="12" font-weight="900" text-anchor="middle" stroke="none" fill="currentColor">?</text>' },
    { id: T.ONEWAY_UP, cat: 'terrain', color: '#2ecc71', label: '一方(上)', icon: '<rect x="3" y="15" width="18" height="6" rx="2"/><path d="M12 15V5M8 9l4-4 4 4"/>' },
    { id: T.ONEWAY_DOWN, cat: 'terrain', color: '#2ecc71', label: '一方(下)', icon: '<rect x="3" y="3" width="18" height="6" rx="2"/><path d="M12 9v10M8 15l4 4 4-4"/>' },
    { id: T.ONEWAY_LEFT, cat: 'terrain', color: '#2ecc71', label: '一方(左)', icon: '<rect x="15" y="3" width="6" height="18" rx="2"/><path d="M15 12H5M9 8l-4 4 4 4"/>' },
    { id: T.ONEWAY_RIGHT, cat: 'terrain', color: '#2ecc71', label: '一方(右)', icon: '<rect x="3" y="3" width="6" height="18" rx="2"/><path d="M9 12h10M15 8l4 4-4 4"/>' },
    
    { id: T.SWITCH, cat: 'gimmick', color: '#00e5ff', label: '感圧板', icon: '<rect x="4" y="14" width="16" height="6" rx="2"/><circle cx="12" cy="14" r="3" fill="currentColor"/>' },
    { id: T.LEVER, cat: 'gimmick', color: '#f39c12', label: 'レバー', icon: '<rect x="6" y="18" width="12" height="4"/><line x1="12" y1="18" x2="8" y2="6"/><circle cx="8" cy="6" r="3" fill="currentColor"/>' },

    x: 0, y: 0, vx: 0, vy: 0, w: 26, h: 26, state: 'idle',

/* =========================================================
   初期化・リサイズ処理
========================================================= */
function initMap() {
    mapData = Array.from({ length: MAP_ROWS }, () => new Array(MAP_COLS).fill(0));
    for (let c = 0; c < MAP_COLS; c++) { 
        mapData[MAP_ROWS-1][c] = T.BLOCK; 
        mapData[MAP_ROWS-2][c] = T.BLOCK; 
        if (c === 0 || c === MAP_COLS-1) {
            for (let r = 0; r < MAP_ROWS; r++) {
                mapData[r][c] = T.BLOCK;
            }
        }
    }
    mapData[MAP_ROWS-4][3] = T.START; 
    mapData[MAP_ROWS-4][15] = T.GOAL;
    warpPairs = []; 
    pendingWarp = null; 
    updateCourseHUDInfo();
}

function focusCameraOnStart() {
    for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = 0; c < MAP_COLS; c++) {
            if (mapData[r][c] === T.START) {
                const viewW = window.innerWidth / zoomScale;
                const viewH = window.innerHeight / zoomScale;
                const startX = c * TILE_SIZE + TILE_SIZE / 2;
                const startY = r * TILE_SIZE + TILE_SIZE / 2;
                
                camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, startX - viewW / 2));
                camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, startY - viewH / 2));
                return;
            }
        }
    }
}

function setPalCat(cat, btn) {
    document.querySelectorAll('.pal-tab').forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    
    document.getElementById('palette').innerHTML = paletteItems.filter(i => cat === 'all' || i.cat === 'all' || i.cat === cat).map(item => `
        <div class="palette-item ${item.id === currentBrush ? 'selected' : ''}" data-id="${item.id}" style="color:${item.color}" onclick="selectBrush(${item.id})">
            <svg viewBox="0 0 24 24">${item.icon}</svg>
            <span class="palette-label">${item.label}</span>
        </div>
    `).join('');
}

function selectBrush(id) { 
    currentBrush = id; 
    document.querySelectorAll('.palette-item').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.id) === id);
    });
}

function togglePalette() { 
    document.getElementById('palette-wrap').classList.toggle('collapsed'); 
}

function adjustZoom(delta) { 
    zoomScale = Math.min(Math.max(0.5, zoomScale + delta), 1.8); 
    document.getElementById('zoom-text').innerText = Math.round(zoomScale * 100) + '%'; 
    resize(); 
}

function resize() { 
    isMobile = (window.innerWidth <= 768 || 'ontouchstart' in window);
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = window.innerWidth * dpr; 
    canvas.height = window.innerHeight * dpr; 
    ctx.imageSmoothingEnabled = false;
    
    if (mode === 'edit') {
        const viewW = window.innerWidth / zoomScale;
        const viewH = window.innerHeight / zoomScale;
        camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, camera.x));
        camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, camera.y));
    }
}

window.addEventListener('resize', resize);
initMap(); 
setPalCat('all', document.querySelector('.pal-tab.active')); 
resize(); 
focusCameraOnStart();

/* =========================================================
   モード切り替え & ゲームロジック
========================================================= */
function setMode(newMode) {
    mode = newMode;
    
    document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
    document.getElementById('btn-play').classList.toggle('active', mode === 'play');
    
    document.getElementById('palette-wrap').style.display = (mode === 'play') ? 'none' : 'flex';
    document.getElementById('mobile-controls').style.display = (mode === 'play' && isMobile) ? 'flex' : 'none';
    document.getElementById('hud-switch-status').style.display = (mode === 'play') ? 'flex' : 'none';

    if (mode === 'play') {
        savedMapDataStr = JSON.stringify(mapData);
        startPlay();
    } else {
        activeMapData = []; 
        focusCameraOnStart(); 
    }
}

function startPlay() {
    activeMapData = JSON.parse(savedMapDataStr);
    
    enemies = []; beamEmitters = []; projectiles = []; particles = []; trails = []; crosses = []; lifts = []; leverStates = {};
    
    player.hasKey = false; player.coins = 0; player.state = 'idle'; 
    player.vx = 0; player.vy = 0; player.warpCooldown = 0;
    player.scaleX = 1; player.scaleY = 1; player.boostTimer = 0; 
    player.starTimer = 0; player.hasSpider = false; player.hook = null;
    player.hookDist = 0; player.lastLevers = new Set();
    
    isCircuitActive = false; activeSwitchCount = 0; screenShake = 0;
    
    document.getElementById('center-msg').classList.remove('show');
    totalCoinsInStage = 0; 
    let startFound = false;

    // マップスキャン
    for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = 0; c < MAP_COLS; c++) {
            const t = activeMapData[r][c];
            
            if (t === T.COIN) {
                totalCoinsInStage++;
            } else if (t === T.START) { 
                player.x = c * TILE_SIZE + (TILE_SIZE - player.w) / 2; 
                player.y = r * TILE_SIZE + (TILE_SIZE - player.h); 
                startFound = true; 
            } else if (t === T.ENEMY) {
                enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: -2, vy: 0, w: 28, h: 28, blink: 0, type: 1 });
            } else if (t === T.ENEMY2) {
                enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: -2, vy: 0, w: 28, h: 28, blink: 0, type: 2, jumpTmr: 0 });
            } else if (t === T.ENEMY_H) {
                enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 24)/2, vx: 2, vy: 0, w: 28, h: 24, blink: 0, type: 3 });
            } else if (t === T.ENEMY_V) {
                enemies.push({ x: c * TILE_SIZE + (TILE_SIZE - 24)/2, y: r * TILE_SIZE, vx: 0, vy: 2, w: 24, h: 28, blink: 0, type: 4 });
            } else if (t === T.ENEMY_SNIPER) {
                enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: 0, vy: 0, w: 28, h: 28, blink: 0, type: 5, tmr: 0 });
            } else if (t === T.ENEMY_GOLGO) {
                enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 36), vx: 0, vy: 0, w: 28, h: 36, blink: 0, type: 6, tmr: 0, aimAngle: 0 });
            } else if ([T.BEAM_R, T.BEAM_L, T.BEAM_U, T.BEAM_D].includes(t)) {
                beamEmitters.push({ r, c, type: t, tmr: Math.floor(Math.random() * 90) });
            } else if (t === T.CROSS) {
                crosses.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 0, vy: 0, w: TILE_SIZE, h: TILE_SIZE });
                activeMapData[r][c] = 0; 
            } else if (t === T.LIFT_H) {
                lifts.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 2, vy: 0, w: TILE_SIZE, h: 12 });
                activeMapData[r][c] = 0;
            } else if (t === T.LIFT_V) {
                lifts.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 0, vy: 2, w: TILE_SIZE, h: 12 });
                activeMapData[r][c] = 0;
            } else if (t === T.LEVER) {
                leverStates[`${r},${c}`] = false;
            }
        }
    }
    
    if (!startFound) { 
        player.x = 2 * TILE_SIZE; 
        player.y = 2 * TILE_SIZE; 
    }
    
    updateHUD(); 
    
    const viewW = window.innerWidth / zoomScale;
    const viewH = window.innerHeight / zoomScale;
    camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, player.x + player.w/2 - viewW / 2)); 
    camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, player.y + player.h/2 - viewH / 2));
}

function showToast(text) {
    const t = document.getElementById('toast-msg'); 
    document.getElementById('toast-text').innerText = text;
    t.classList.add('show'); 
    setTimeout(() => { t.classList.remove('show'); }, 2500);
}

function updateCourseHUDInfo() {
    const tag = document.getElementById('hud-course-tag'); 
    const title = document.getElementById('hud-course-title');
    if (currentStageInfo.isMine) { 
        tag.className = 'course-tag tag-my'; tag.innerText = 'MY COURSE'; 
    } else { 
        tag.className = 'course-tag tag-other'; tag.innerText = '作: ' + currentStageInfo.author; 
    }
    title.innerText = currentStageInfo.title;

function updateHUD() {
    document.getElementById('hud-coins').innerText = player.coins; 
    document.getElementById('hud-total-coins').innerText = totalCoinsInStage;
    
    const keyEl = document.getElementById('hud-key'); 
    document.getElementById('hud-key-text').innerText = player.hasKey ? 'あり' : 'なし';
    keyEl.style.color = player.hasKey ? '#ff9900' : '#666';

    const swEl = document.getElementById('hud-switch-status');
    const swTxt = document.getElementById('hud-sw-text');
    swEl.style.color = isCircuitActive ? 'var(--switch-on)' : '#666'; 
    swTxt.innerText = `回路: ${isCircuitActive ? 'ON' : 'OFF'} (${activeSwitchCount})`;
}

function die() {
    if (player.state === 'dead') return;
    
    player.state = 'dead'; 
    screenShake = 15; 
    createParticles(player.x + player.w/2, player.y + player.h/2, '#ff2a5f', 30);
    
    setTimeout(() => { 
        if (mode === 'play') startPlay(); 
    }, 1200);
}

function win() {
    if (player.state === 'clear') return;
    if (player.coins < totalCoinsInStage) { 
        showToast(`コインをぜんぶ集めてね！（残り: ${totalCoinsInStage - player.coins}枚）`); 
        return; 
    }
    
    player.state = 'clear'; 
    player.vx = 0; 
    player.vy = 0; 
    const centerMsg = document.getElementById('center-msg');
    centerMsg.innerText = "STAGE CLEAR!"; 
    centerMsg.classList.add('show');
    
    if (currentStageInfo.id) {
        fetch(`/api/maker/stages/${currentStageInfo.id}/clear`, { 
            method: 'POST', 
            headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${localStorage.getItem("access_token")}` 
            } 
        }).catch(() => {});
    }
    setTimeout(() => { setMode('edit'); }, 2500);
}

/* =========================================================
   入力・イベント処理
========================================================= */
window.addEventListener('keydown', e => {
    if (mode !== 'play') return;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { 
        if (!keys.jump) { keys.jump = true; doJump(); } 
    }
});

window.addEventListener('keyup', e => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

function doJump() {
    if (player.state !== 'idle') return;
    
    if (player.hook) { 
        // 遠心力にジャンプの初速を上乗せして解除
        player.hook = null; 
        player.vy -= 12; 
        player.vx *= 1.2;
        screenShake = 6;
        createParticles(player.x + player.w/2, player.y + player.h, '#fff', 15);
        return; 
    }
    
    if (player.grounded) { 
        player.vy = -12; 
        player.grounded = false; 
        player.scaleX = 0.6; 
        player.scaleY = 1.4; 
        createParticles(player.x + player.w/2, player.y + player.h, '#fff', 8); 
    } else if (player.touchingWall !== 0) { 
        player.vy = -11.5; 
        player.vx = player.touchingWall * -9; 
        player.faceDir = -player.touchingWall; 
        player.scaleX = 0.6; 
        player.scaleY = 1.4; 
        screenShake = 4; 
        const px = player.x + player.w/2 + (player.touchingWall === 1 ? player.w/2 : -player.w/2);
        createParticles(px, player.y + player.h/2, '#00e5ff', 12); 
    }
}

// スパイダーの吸着先（エイムアシスト）取得
function getSpiderHookTarget(cx, cy) {
    let col = Math.floor(cx / TILE_SIZE);
    let row = Math.floor(cy / TILE_SIZE);
    let bestDist = Infinity;
    let target = null;
    
    // タップ位置の周囲 5x5 マスを探索して一番近い壁にくっつける
    for (let r = row - 2; r <= row + 2; r++) {
        for (let c = col - 2; c <= col + 2; c++) {
            if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS && isSolid(activeMapData[r][c])) {
                let tx = c * TILE_SIZE + TILE_SIZE / 2;
                let ty = r * TILE_SIZE + TILE_SIZE / 2;
                let dist = Math.hypot(tx - cx, ty - cy);
                
                // 吸着範囲（約2.5マス）
                if (dist < bestDist && dist < TILE_SIZE * 2.5) {
                    bestDist = dist;
                    target = { x: tx, y: ty };
                }
            }
        }
    }
    return target;
}

function handleInputCoords(clientX, clientY, isRightClick) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    // CSSピクセル座標からワールド座標への変換
    const wx = (clientX - rect.left) / zoomScale + camera.x;
    const wy = (clientY - rect.top)  / zoomScale + camera.y;
    
    const col = Math.floor(wx / TILE_SIZE); 
    const row = Math.floor(wy / TILE_SIZE);
    
    if (mode === 'play') {
        if (player.hasSpider && !isRightClick && player.boostTimer === 0) {
            let hookTarget = getSpiderHookTarget(wx, wy);
            if (hookTarget) {
                player.hook = hookTarget;
                player.hookDist = 0; 
                // スローモーション解除時の反動のためにタイマーリセット
                slowFrames = 0;
            }
        }
        return;
    }
    
    if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        if (input.rightDown || isRightClick) {
            if (mapData[row][col] === T.WARP) { 
                warpPairs = warpPairs.filter(wp => !(wp.r1===row && wp.c1===col) && !(wp.r2===row && wp.c2===col)); 
                if (pendingWarp && pendingWarp.r===row && pendingWarp.c===col) {
                    pendingWarp = null; 
                }
            }
            mapData[row][col] = 0; 
            return;
        }
        
        if (currentBrush === T.START) { 
            for (let y = 0; y < MAP_ROWS; y++) {
                for (let x = 0; x < MAP_COLS; x++) {
                    if (mapData[y][x] === T.START) mapData[y][x] = 0; 
                }
            }
        }
        
        if (currentBrush === T.WARP) {
            if (mapData[row][col] !== T.WARP) {
                if (pendingWarp) { 
                    warpPairs.push({ id: warpPairs.length + 1, r1: pendingWarp.r, c1: pendingWarp.c, r2: row, c2: col }); 
                    pendingWarp = null; 
                } else {
                    pendingWarp = { r: row, c: col }; 
                }
                mapData[row][col] = T.WARP;
            }
        } else { 
            mapData[row][col] = currentBrush; 
        }
    }
}

canvas.addEventListener('mousedown', e => { 
    if (e.button === 0) input.isDown = true; 
    if (e.button === 2) input.rightDown = true; 
    
    if (mode === 'play' && e.button === 0) {
        handleInputCoords(e.clientX, e.clientY, false);
    } else if (mode === 'edit' && currentBrush !== T.PAN) {
        handleInputCoords(e.clientX, e.clientY, input.rightDown);
    }
});

window.addEventListener('mouseup', () => { 
    input.isDown = false; 
    input.rightDown = false; 
    
    if (mode === 'play' && player.hook) {
        player.hook = null;
        player.vy -= 10;
        player.vx *= 1.2;
        screenShake = 6;
    }
});

        camera.x -= e.movementX / zoomScale; 
        camera.y -= e.movementY / zoomScale; 
    } else if (mode === 'edit' && input.isDown && currentBrush !== T.PAN) {

});

canvas.addEventListener('contextmenu', e => { e.preventDefault(); });

        keys[key] = false; 
    }, { passive: false }); 
};

/* =========================================================
   物理演算 & ギミック
========================================================= */
function isSolid(t) {
    if (t === T.SW_BLOCK_A) return !isCircuitActive; 
    if (t === T.SW_BLOCK_B) return isCircuitActive;
    return [T.BLOCK, T.BRICK, T.DOOR, T.BEAM_R, T.BEAM_L, T.BEAM_U, T.BEAM_D, T.HIDDEN_BLOCK].includes(t);
}

function rectIntersect(r1, r2) { 
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; 
}

function getSpikeBox(r, c, type) {
    const bx = c * TILE_SIZE, by = r * TILE_SIZE, ts = TILE_SIZE;
    if (type === T.SPIKE_UP) return { x: bx+6, y: by+ts/2+4, w: ts-12, h: ts/2-4 };
    if (type === T.SPIKE_DOWN) return { x: bx+6, y: by, w: ts-12, h: ts/2-4 };
    if (type === T.SPIKE_LEFT) return { x: bx+ts/2+4, y: by+6, w: ts/2-4, h: ts-12 };
    if (type === T.SPIKE_RIGHT) return { x: bx, y: by+6, w: ts/2-4, h: ts-12 };
    return { x: bx, y: by, w: ts, h: ts };
}

function updatePhysics() {
    if (player.state === 'dead' || player.state === 'clear') return;
    
    if (player.warpCooldown > 0) player.warpCooldown--;
    if (player.invincibleTimer > 0) player.invincibleTimer--;
    
    if (player.boostTimer > 0) { 
        player.boostTimer--; 
        if (player.boostTimer % 2 === 0) {
            trails.push({ x: player.x, y: player.y, w: player.w, h: player.h, life: 1.0 }); 
        }
    }

    player.scaleX += (1.0 - player.scaleX) * 0.25; 
    player.scaleY += (1.0 - player.scaleY) * 0.25;

    // --- 1. 論理回路（スイッチとレバーの同期） ---
    let pressureCount = 0;
    let currentTouchingLevers = new Set();
    
    for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = 0; c < MAP_COLS; c++) {
            let t = activeMapData[r][c];
            if (t === T.SWITCH) {
                let swBox = { x: c * TILE_SIZE + 2, y: r * TILE_SIZE + 16, w: 36, h: 24 };
                if (rectIntersect(player, swBox) || crosses.some(cr => rectIntersect(cr, swBox))) {
                    pressureCount++;
                }
            } else if (t === T.LEVER) {
                let lBox = { x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
                if (rectIntersect(player, lBox) || crosses.some(cr => rectIntersect(cr, lBox))) {
                    let key = `${r},${c}`;
                    currentTouchingLevers.add(key);
                    if (!player.lastLevers.has(key)) {
                        leverStates[key] = !leverStates[key];
                        screenShake = 6;
                        createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#f39c12', 20);
                    }
                }
            }
        }
    }
    player.lastLevers = currentTouchingLevers;
    
    let leverCount = Object.values(leverStates).filter(v => v).length;
    let newSwitchCount = pressureCount + leverCount;
    
    if (activeSwitchCount !== newSwitchCount) {
        activeSwitchCount = newSwitchCount;
        if (activeSwitchCount % 2 !== 0 && !isCircuitActive) { 
            screenShake = 8; 
            createParticles(player.x, player.y, '#00e5ff', 30); 
        } else if (activeSwitchCount % 2 === 0 && isCircuitActive) { 
            screenShake = 3; 
            createParticles(player.x, player.y, '#ff2a5f', 10); 
        }
    }
    isCircuitActive = (activeSwitchCount % 2 !== 0);
    updateHUD();

    // --- 2. リフト更新 ---
    lifts.forEach(lf => {
        let oldX = lf.x, oldY = lf.y; 
        lf.x += lf.vx; 
        lf.y += lf.vy;
        
        let cx = Math.floor((lf.vx > 0 ? lf.x + lf.w : lf.x) / TILE_SIZE);
        let cy = Math.floor((lf.vy > 0 ? lf.y + lf.h : lf.y) / TILE_SIZE);
        
        if (cx < 0 || cx >= MAP_COLS || cy < 0 || cy >= MAP_ROWS || isSolid(activeMapData[cy]?.[cx])) { 
            lf.x = oldX; 
            lf.y = oldY; 
            lf.vx *= -1; 
            lf.vy *= -1; 
            screenShake = Math.max(screenShake, 1); 
        }
        
        if (player.vy >= 0 && rectIntersect(player, { x: lf.x, y: lf.y - 8, w: lf.w, h: 8 }) && player.y + player.h <= lf.y + 12) { 
            player.y = lf.y - player.h; 
            player.x += lf.vx; 
            player.y += lf.vy; 
            player.grounded = true; 
            player.vy = 0; 
            if (Math.random() < 0.2) createParticles(lf.x + lf.w/2, lf.y, '#fff', 1); 
        }
    });

    // --- 3. 十字箱の更新と壁すり抜け完全防止 ---
    crosses.forEach(cr => {
        cr.vy += 0.65; 
        if (cr.vy > 14) cr.vy = 14;
        
        if (rectIntersect(player, cr)) {
            if (player.y + player.h <= cr.y + 10 && player.vy >= 0) { 
                player.y = cr.y - player.h; 
                player.grounded = true; 
                player.vy = 0; 
            } else {
                let pushSpeed = player.vx;
                cr.vx = pushSpeed;
                if (Math.abs(pushSpeed) > 0) {
                    screenShake = Math.max(screenShake, 1.5);
                    if (Math.random() < 0.3) createParticles(cr.x + cr.w/2, cr.y + cr.h, '#f39c12', 3);
                }
            }
        }
        
        cr.vx *= 0.8;
        if (Math.abs(cr.vx) < 0.1) cr.vx = 0;
        
        // 箱のX移動と壁クランプ
        cr.x += cr.vx;
        let cx1 = Math.floor(cr.x / TILE_SIZE);
        let cx2 = Math.floor((cr.x + cr.w - 0.1) / TILE_SIZE);
        let cy1 = Math.floor(cr.y / TILE_SIZE);
        let cy2 = Math.floor((cr.y + cr.h - 0.1) / TILE_SIZE);
        
        if (cr.vx > 0 && (isSolid(activeMapData[cy1]?.[cx2]) || isSolid(activeMapData[cy2]?.[cx2]))) { 
            cr.x = cx2 * TILE_SIZE - cr.w; 
            cr.vx = 0; 
        } else if (cr.vx < 0 && (isSolid(activeMapData[cy1]?.[cx1]) || isSolid(activeMapData[cy2]?.[cx1]))) { 
            cr.x = cx1 * TILE_SIZE + TILE_SIZE; 
            cr.vx = 0; 
        }

        // 箱のY移動と壁クランプ
        cr.y += cr.vy;
        cx1 = Math.floor(cr.x / TILE_SIZE);
        cx2 = Math.floor((cr.x + cr.w - 0.1) / TILE_SIZE);
        cy1 = Math.floor(cr.y / TILE_SIZE);
        cy2 = Math.floor((cr.y + cr.h - 0.1) / TILE_SIZE);
        
        if (cr.vy > 0 && (isSolid(activeMapData[cy2]?.[cx1]) || isSolid(activeMapData[cy2]?.[cx2]))) { 
            cr.y = cy2 * TILE_SIZE - cr.h; 
            cr.vy = 0; 
        } else if (cr.vy < 0 && (isSolid(activeMapData[cy1]?.[cx1]) || isSolid(activeMapData[cy1]?.[cx2]))) { 
            cr.y = cy1 * TILE_SIZE + TILE_SIZE; 
            cr.vy = 0; 
        }
        
        // プレイヤーめり込み防止の最終ストッパー
        if (rectIntersect(player, cr)) {
            if (player.vx > 0) player.x = cr.x - player.w;
            else if (player.vx < 0) player.x = cr.x + cr.w;
        }
    });

    // --- 4. プレイヤーの移動 ---
    if (player.hook) {
        let dx = player.hook.x - (player.x + player.w/2);
        let dy = player.hook.y - (player.y + player.h/2);
        let dist = Math.hypot(dx, dy);
        
        if (!player.hookDist) player.hookDist = dist;
        
        // 振り子牽引力
        if (dist > player.hookDist) { 
            let pull = (dist - player.hookDist) * 0.2; // 牽引力を高めに設定
            player.vx += (dx / dist) * pull; 
            player.vy += (dy / dist) * pull; 
        }
        
        player.vx *= 0.99; // 摩擦を減らして超加速
        player.vy *= 0.99; 
        player.vy += 0.6;  // 重力
        
        // スピードリミッター（暴走防止）
        let speed = Math.hypot(player.vx, player.vy);
        if (speed > 24) {
            player.vx = (player.vx / speed) * 24;
            player.vy = (player.vy / speed) * 24;
        }
        
        if (Math.random() < 0.3) {
            trails.push({ x: player.x, y: player.y, w: player.w, h: player.h, life: 0.8 }); 
        }
    } else if (player.boostTimer > 0) {
    player.vx = player.faceDir * 18;
    if (player.vy >= 0) {
        player.vy = 0;
    }
} else {
        if (keys.left) { player.vx -= 0.8; player.faceDir = -1; }
        if (keys.right) { player.vx += 0.8; player.faceDir = 1; }
        if (!keys.left && !keys.right) player.vx *= 0.75;
        
        player.vx = Math.max(-6, Math.min(6, player.vx));
        player.vy += 0.65; 
        if (player.vy > 14) player.vy = 14;
    }
    
    if (Math.abs(player.vx) < 0.1) player.vx = 0;

    let wasGrounded = player.grounded; 
    player.touchingWall = 0;
    
    player.x += player.vx; 
    checkCollision(true);
    
    player.y += player.vy; 
    player.grounded = false; 
    checkCollision(false);

    if (!player.grounded && player.touchingWall !== 0 && player.vy > 0 && !player.hook && player.boostTimer === 0) {
        if ((keys.left && player.touchingWall === -1) || (keys.right && player.touchingWall === 1)) {
            player.vy = Math.min(player.vy, 2.5);
            if (Math.random() < 0.5) {
                createParticles(player.x + (player.touchingWall === 1 ? player.w : 0), player.y + player.h, '#fff', 1);
            }
        }
    }
    
    if (!wasGrounded && player.grounded) { 
        player.scaleX = 1.4; 
        player.scaleY = 0.7; 
        screenShake = Math.max(screenShake, 2); 
        createParticles(player.x + player.w/2, player.y + player.h, '#fff', 8); 
    }
    
    if (player.y > MAP_ROWS * TILE_SIZE + 200) die();

    // --- 5. 敵の更新 ---
    enemies.forEach(e => {
        if (e.type === 1 || e.type === 2) {
            e.vy += 0.6;
        }
        
        if (e.type === 2) { 
            e.vx += (player.x > e.x ? 0.15 : -0.15); 
            e.vx = Math.max(-2.5, Math.min(2.5, e.vx)); 
            e.jumpTmr++; 
        }
        
        if (e.type === 5) {
            e.vx = 0; e.vy = 0; e.tmr++;
            let dx = player.x - e.x;
            let dy = player.y - e.y;
            if (Math.hypot(dx, dy) < 450) {
                if (e.tmr > 120) {
                    e.tmr = 0;
                    let angle = Math.atan2(dy, dx);
                    projectiles.push({ x: e.x+e.w/2, y: e.y+e.h/2, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, w: 12, h: 12, active: true, color: '#ff4757', pierce: false });
                }
            }
        }
        
        if (e.type === 6) {
            e.vx = 0; e.vy = 0; e.tmr++;
            let dx = (player.x + player.w/2) - (e.x + e.w/2);
            let dy = (player.y + player.h/2) - (e.y + e.h/2);
            e.aimAngle = Math.atan2(dy, dx);
            
            if (e.tmr > 150) {
                e.tmr = 0;
                screenShake = 12;
                projectiles.push({ x: e.x+e.w/2, y: e.y+e.h/2, vx: Math.cos(e.aimAngle)*30, vy: Math.sin(e.aimAngle)*30, w: 8, h: 8, active: true, color: '#ffd700', pierce: true, isGolgo: true });
            }
        }
        
        e.x += e.vx; 
        e.y += e.vy;
        
        let ex = Math.floor((e.vx > 0 ? e.x + e.w : e.x) / TILE_SIZE);
        let ey = Math.floor((e.vy > 0 ? e.y + e.h : e.y) / TILE_SIZE);
        
        if (e.type === 3) { 
            if (ex < 0 || ex >= MAP_COLS || isSolid(activeMapData[Math.floor(e.y/TILE_SIZE)]?.[ex])) { 
                e.vx *= -1; 
                e.x += e.vx; 
            } 
        } else if (e.type === 4) { 
            if (ey < 0 || ey >= MAP_ROWS || isSolid(activeMapData[ey]?.[Math.floor(e.x/TILE_SIZE)])) { 
                e.vy *= -1; 
                e.y += e.vy; 
            } 
        } else if (e.type === 1 || e.type === 2) {
            if (isSolid(activeMapData[Math.floor((e.y + e.h/2) / TILE_SIZE)]?.[ex])) { 
                if (e.type === 1) { e.vx *= -1; e.x += e.vx; } else { e.vx = 0; } 
            }
            if (e.vy > 0 && isSolid(activeMapData[ey]?.[Math.floor((e.x + e.w/2) / TILE_SIZE)])) { 
                e.y = ey * TILE_SIZE - e.h; 
                e.vy = 0; 
                if (e.type === 2 && e.jumpTmr > 50 && Math.abs(player.x - e.x) < 300) { 
                    e.vy = -10; 
                    e.jumpTmr = 0; 
                } 
            }
        }
        
        e.blink = (e.blink + 1) % 100;
        
        if (rectIntersect(player, e)) {
            if (player.invincibleTimer > 0) { 
                e.dead = true; 
                screenShake = 4; 
                player.vy = -6; 
                createParticles(e.x + e.w/2, e.y + e.h/2, '#ffd700', 20); 
            } else if (player.boostTimer > 0 || (player.vy > 0 && player.y + player.h - e.y < 20)) {
                e.dead = true; 
                if (player.boostTimer === 0) { 
                    player.vy = -10; 
                    player.scaleX = 0.6; 
                    player.scaleY = 1.4; 
                    screenShake = 4; 
                }
                createParticles(e.x + e.w/2, e.y + e.h/2, '#ff2a5f', 15);
            } else { 
                die(); 
            }
        }
    });
    enemies = enemies.filter(e => !e.dead);

    // --- 6. 砲台発射と弾の更新 ---
    beamEmitters.forEach(b => {
        b.tmr++;
        if (b.tmr >= 90) {
            b.tmr = 0; 
            let ts = TILE_SIZE; 
            let px = b.c * ts + ts/2;
            let py = b.r * ts + ts/2; 
            let pvx = 0, pvy = 0;
            
            if (b.type === T.BEAM_R) { px += ts; pvx = 5; } 
            else if (b.type === T.BEAM_L) { px -= ts; pvx = -5; }
            else if (b.type === T.BEAM_U) { py -= ts; pvy = -5; } 
            else if (b.type === T.BEAM_D) { py += ts; pvy = 5; }
            
            projectiles.push({ x: px - 6, y: py - 6, vx: pvx, vy: pvy, w: 12, h: 12, active: true, color: '#e74c3c', pierce: false });
        }
    });

    projectiles.forEach(p => {
        p.x += p.vx; 
        p.y += p.vy;
        
        if (p.x < -100 || p.x > MAP_COLS * TILE_SIZE + 100 || p.y < -100 || p.y > MAP_ROWS * TILE_SIZE + 100) {
            p.active = false;
        }
        
        if (rectIntersect(player, p)) { 
            if (player.invincibleTimer > 0) { 
                p.active = false; 
                createParticles(p.x, p.y, '#ffd700', 5); 
            } else { 
                if (player.boostTimer === 0) die(); 
                p.active = false; 
            }
        }
        
        let cx = Math.floor((p.x + p.w/2) / TILE_SIZE);
        let cy = Math.floor((p.y + p.h/2) / TILE_SIZE);
        
        if (!p.pierce && cy >= 0 && cy < MAP_ROWS && cx >= 0 && cx < MAP_COLS && isSolid(activeMapData[cy][cx])) { 
            p.active = false; 
            createParticles(p.x + p.w/2, p.y + p.h/2, p.color, 6); 
        }
    });
    projectiles = projectiles.filter(p => p.active);

    // --- 7. パーティクル・残像の確実な減衰と破棄 ---
    particles.forEach(p => { 
        p.x += p.vx; 
        p.y += p.vy; 
        p.life -= 0.06; 
    });
    particles = particles.filter(p => p.life > 0);
    
    trails.forEach(tr => { 
        tr.life -= 0.1; 
    });
    trails = trails.filter(tr => tr.life > 0);
}

function checkCollision(isX) {
    const p = player;
    const left = Math.floor(Math.max(0, p.x) / TILE_SIZE);
    const right = Math.floor(Math.min(MAP_COLS * TILE_SIZE - 1, p.x + p.w - 0.1) / TILE_SIZE);
    const top = Math.floor(Math.max(0, p.y) / TILE_SIZE);
    const bottom = Math.floor(Math.min(MAP_ROWS * TILE_SIZE - 1, p.y + p.h - 0.1) / TILE_SIZE);

    for (let r = top; r <= bottom; r++) {
        for (let c = left; c <= right; c++) {
            if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) continue;
            let t = activeMapData[r][c]; 
            if (t === 0) continue;

            if ([T.SPIKE_UP, T.SPIKE_DOWN, T.SPIKE_LEFT, T.SPIKE_RIGHT].includes(t)) {
                if (p.invincibleTimer > 0) continue;
                let sBox = getSpikeBox(r, c, t);
                if (rectIntersect(p, sBox) && p.boostTimer === 0) { 
                    screenShake = 16; 
                    createParticles(p.x + p.w/2, p.y + p.h/2, '#ff2a5f', 40); 
                    die(); 
                    return; 
                }
                continue;
            }

            if (t === T.COIN) { 
                activeMapData[r][c] = 0; 
                p.coins++; 
                updateHUD(); 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#ffd700', 8); 
            }
            
            if (t === T.KEY) { 
                activeMapData[r][c] = 0; 
                p.hasKey = true; 
                updateHUD(); 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#f39c12', 12); 
            }
            
            if (t === T.STAR) { 
                activeMapData[r][c] = 0; 
                p.invincibleTimer = 600; 
                screenShake = 5; 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#ffd700', 30); 
                showToast("★ STAR POWER! (10秒)"); 
            }
            
            if (t === T.SPIDER) { 
                activeMapData[r][c] = 0; 
                p.hasSpider = true; 
                screenShake = 5; 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#ff1744', 30); 
                showToast("スパイダー解放！空中タップでスイング！"); 
            }
            
            if (t === T.DOOR && p.hasKey) { 
                activeMapData[r][c] = 0; 
                screenShake = 3; 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#8e44ad', 20); 
                continue; 
            }
            
            if (t === T.BOUNCER && !isX && p.vy > 0) { 
                p.vy = -22; 
                p.y = r * TILE_SIZE - p.h; 
                p.scaleX = 0.4; 
                p.scaleY = 1.8; 
                createParticles(p.x + p.w/2, p.y + p.h, '#00e5ff', 12); 
                return; 
            }
            
            if (t === T.BOOST_R && rectIntersect(p, {x: c*TILE_SIZE, y: r*TILE_SIZE+20, w: TILE_SIZE, h: 20})) { 
                p.faceDir = 1; 
                p.boostTimer = 30; 
                p.vx = 18; 
                p.vy = 0; 
                screenShake = 8; 
                p.scaleX = 1.6; 
                p.scaleY = 0.7;
                createParticles(p.x, p.y + p.h/2, '#00e5ff', 12); 
                createParticles(p.x, p.y + p.h/2, '#ffffff', 8); 
            }
            
            if (t === T.BOOST_L && rectIntersect(p, {x: c*TILE_SIZE, y: r*TILE_SIZE+20, w: TILE_SIZE, h: 20})) { 
                p.faceDir = -1; 
                p.boostTimer = 30; 
                p.vx = -18; 
                p.vy = 0; 
                screenShake = 8; 
                p.scaleX = 1.6; 
                p.scaleY = 0.7;
                createParticles(p.x + p.w, p.y + p.h/2, '#00e5ff', 12); 
                createParticles(p.x + p.w, p.y + p.h/2, '#ffffff', 8); 
            }
            
            if (t === T.BOOST_U && rectIntersect(p, {x: c*TILE_SIZE, y: r*TILE_SIZE+20, w: TILE_SIZE, h: 20})) { 
                p.vy = -24; 
                screenShake = 10; 
                p.scaleX = 0.3; 
                p.scaleY = 2.0; 
                createParticles(p.x + p.w/2, p.y + p.h, '#00e5ff', 25); 
            }

            if (t === T.ONEWAY_UP && !isX && p.vy > 0 && (p.y + p.h - p.vy) <= r * TILE_SIZE + 8) { 
                p.y = r * TILE_SIZE - p.h; 
                p.grounded = true; 
                p.vy = 0; 
                return; 
            }
            if (t === T.ONEWAY_DOWN && !isX && p.vy < 0 && (p.y - p.vy) >= r * TILE_SIZE + TILE_SIZE - 8) { 
                p.y = r * TILE_SIZE + TILE_SIZE; 
                p.vy = 0; 
                return; 
            }
            if (t === T.ONEWAY_LEFT && isX && p.vx > 0 && (p.x + p.w - p.vx) <= c * TILE_SIZE + 8) { 
                p.x = c * TILE_SIZE - p.w; 
                p.vx = 0; 
                return; 
            }
            if (t === T.ONEWAY_RIGHT && isX && p.vx < 0 && (p.x - p.vx) >= c * TILE_SIZE + TILE_SIZE - 8) { 
                p.x = c * TILE_SIZE + TILE_SIZE; 
                p.vx = 0; 
                return; 
            }

            if (t === T.WARP && p.warpCooldown === 0) {
                let pair = warpPairs.find(wp => (wp.r1 === r && wp.c1 === c) || (wp.r2 === r && wp.c2 === c));
                if (pair && pair.r2 !== undefined) {
                    let destR = (pair.r1 === r && pair.c1 === c) ? pair.r2 : pair.r1; 
                    let destC = (pair.r1 === r && pair.c1 === c) ? pair.c2 : pair.c1;
                    p.x = destC * TILE_SIZE + (TILE_SIZE - p.w) / 2; 
                    p.y = destR * TILE_SIZE + (TILE_SIZE - p.h); 
                    p.warpCooldown = 60; 
                    screenShake = 12; 
                    p.scaleX = 0.2; 
                    p.scaleY = 2.0;
                    createParticles(p.x + p.w/2, p.y + p.h/2, W_COLORS[pair.id % W_COLORS.length], 30); 
                    return;
                }
            }
            
            if (t === T.GOAL) { 
                win(); 
                return; 
            }
            
            if (t === T.HIDDEN_BLOCK && !isX && p.vy < 0 && (p.y - p.vy) >= r * TILE_SIZE + TILE_SIZE - 8) { 
                activeMapData[r][c] = T.BLOCK; 
                p.vy = 2; 
                p.y = r * TILE_SIZE + TILE_SIZE; 
                screenShake = 10; 
                p.scaleX = 1.5; 
                p.scaleY = 0.5; 
                createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#f1c40f', 25); 
                return; 
            }

            if (isSolid(t) && t !== T.HIDDEN_BLOCK) {
                if (isX) {
                    if (p.vx > 0) { 
                        p.x = c * TILE_SIZE - p.w; 
                        p.touchingWall = 1; 
                    } else if (p.vx < 0) { 
                        p.x = c * TILE_SIZE + TILE_SIZE; 
                        p.touchingWall = -1; 
                    }
                    
                    if (p.boostTimer > 0 && p.vy >= -15) { 
                        screenShake = 6; 
                        createParticles(p.x + (p.touchingWall === 1 ? p.w : 0), p.y + p.h/2, '#fff', 8); 
                        p.boostTimer = 0; 
                    }
                    p.vx = 0;
                } else {
                    if (p.vy > 0) { 
                        p.y = r * TILE_SIZE - p.h; 
                        p.grounded = true; 
                    } else if (p.vy < 0) { 
                        p.y = r * TILE_SIZE + TILE_SIZE; 
                        if (t === T.BRICK) { 
                            activeMapData[r][c] = 0; 
                            screenShake = 4; 
                            createParticles(c * TILE_SIZE + 20, r * TILE_SIZE + 20, '#e67e22', 15); 
                        } 
                    }
                    p.vy = 0;
                }
            }
        }
    }
}

function createParticles(x, y, color, count) { 
    for (let i = 0; i < count; i++) {
        particles.push({ 
            x, y, 
            vx: (Math.random() - 0.5) * 16, 
            vy: (Math.random() - 0.5) * 16 - 2, 
            life: 1.0, 
            color 
        });
    }
}

/* =========================================================
   5. 描画 (リファクタリング済み共通化)
========================================================= */
function roundRect(ctx, x, y, w, h, r) { 
    ctx.beginPath(); 
    ctx.moveTo(x + r, y); 
    ctx.lineTo(x + w - r, y); 
    ctx.quadraticCurveTo(x + w, y, x + w, y + r); 
    ctx.lineTo(x + w, y + h - r); 
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); 
    ctx.lineTo(x + r, y + h); 
    ctx.quadraticCurveTo(x, y + h, x, y + h - r); 
    ctx.lineTo(x, y + r); 
    ctx.quadraticCurveTo(x, y, x + r, y); 
    ctx.closePath(); 
    ctx.fill(); 
    ctx.stroke(); 
}

function drawTileGraphics(ctx, t, r, c, x, y, ts, hc) {
    ctx.strokeStyle = '#000';

    switch (t) {
        case T.BLOCK:
            ctx.fillStyle = '#4a5568'; roundRect(ctx, x, y, ts, ts, 4);

                ctx.fillStyle = '#f1c40f'; ctx.font = '900 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', x+hc, y+hc+6); ctx.globalAlpha = 1.0;

            break;
        case T.BEAM_R: case T.BEAM_L: case T.BEAM_U: case T.BEAM_D:

            if (t === T.BEAM_R) ctx.arc(x + ts - 8, y + hc, 6, 0, Math.PI * 2); else if (t === T.BEAM_L) ctx.arc(x + 8, y + hc, 6, 0, Math.PI * 2); else if (t === T.BEAM_U) ctx.arc(x + hc, y + 8, 6, 0, Math.PI * 2); else if (t === T.BEAM_D) ctx.arc(x + hc, y + ts - 8, 6, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            break;
        case T.SWITCH:

            ctx.fillStyle = pressed ? COLOR_SW_ON : '#555'; roundRect(ctx, x+8, y+(pressed?28:24), 24, pressed?12:16, 2);

            if (on) { ctx.moveTo(x+ts/2, y+ts-8); ctx.lineTo(x+ts-8, y+10); } else { ctx.moveTo(x+ts/2, y+ts-8); ctx.lineTo(x+8, y+10); } ctx.stroke();
            ctx.fillStyle = on ? COLOR_SW_ON : COLOR_SW_OFF; ctx.beginPath(); ctx.arc(on?x+ts-8:x+8, y+10, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.lineWidth = 3;
            break;
        case T.SW_BLOCK_A: case T.SW_BLOCK_B:
            let isActive = (t === T.SW_BLOCK_A) ? !isCircuitActive : isCircuitActive; 
            ctx.fillStyle = (t === T.SW_BLOCK_A) ? COLOR_SW_OFF : COLOR_SW_ON;
            if (isActive || mode === 'edit') { roundRect(ctx, x, y, ts, ts, 4); ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x+6, y+6, ts-12, ts-12); } 
            else { ctx.globalAlpha = 0.3; ctx.strokeStyle = ctx.fillStyle; ctx.setLineDash([4,4]); roundRect(ctx, x+4, y+4, ts-8, ts-8, 2); ctx.setLineDash([]); ctx.globalAlpha = 1.0; }
            break;
        case T.CROSS:
            ctx.fillStyle = '#f39c12'; roundRect(ctx, x+12, y+2, 16, ts-4, 2); roundRect(ctx, x+2, y+12, ts-4, 16, 2); ctx.fillStyle = '#fff'; ctx.fillRect(x+16, y+16, 8, 8);
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x+4, y+4, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+ts-4, y+4, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+4, y+ts-4, 2, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+ts-4, y+ts-4, 2, 0, Math.PI*2); ctx.fill();
            break;
        case T.LIFT_H: case T.LIFT_V:
            ctx.fillStyle = '#3498db'; roundRect(ctx, x, y+ts/4, ts, ts/2, 4); ctx.fillStyle='#111'; ctx.fillRect(x+4, y+ts/4+4, ts-8, ts/2-8);
            break;
        case T.BOOST_R: case T.BOOST_L:
            ctx.fillStyle = 'rgba(0, 229, 255, 0.2)'; ctx.fillRect(x, y+ts-8, ts, 8); ctx.fillStyle = '#00e5ff'; ctx.beginPath();
            if (t === T.BOOST_R) { ctx.moveTo(x+8, y+ts-6); ctx.lineTo(x+ts-4, y+ts-4); ctx.lineTo(x+8, y+ts-2); } else { ctx.moveTo(x+ts-8, y+ts-6); ctx.lineTo(x+4, y+ts-4); ctx.lineTo(x+ts-8, y+ts-2); } ctx.fill();
            break;
        case T.BOOST_U:
            ctx.fillStyle = 'rgba(0, 229, 255, 0.2)'; roundRect(ctx, x+4, y+4, ts-8, ts-4, 2); ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(x+10, y+24); ctx.lineTo(x+hc, y+14); ctx.lineTo(x+ts-10, y+24); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+10, y+16); ctx.lineTo(x+hc, y+6); ctx.lineTo(x+ts-10, y+16); ctx.stroke();
            break;
        case T.WARP:
            let pair = warpPairs.find(wp => (wp.r1 === r && wp.c1 === c) || (wp.r2 === r && wp.c2 === c)); 
            let isPending = pendingWarp && pendingWarp.r === r && pendingWarp.c === c;
            ctx.strokeStyle = pair ? W_COLORS[pair.id % W_COLORS.length] : (isPending ? (Date.now() % 500 < 250 ? '#999' : '#444') : '#999'); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x+hc, y+hc, hc-4, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = ctx.strokeStyle; ctx.beginPath(); ctx.arc(x+hc, y+hc, 6, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.font = '900 16px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(pair ? pair.id : (isPending ? '?' : '-'), x+hc, y+hc-14);
            break;
        case T.COIN:
            ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(x+hc, y+hc, ts/3, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#b38f00'; ctx.fillRect(x+hc-2, y+hc-ts/5, 4, ts/2.5);
            break;
        case T.KEY:
            ctx.fillStyle = '#f39c12'; ctx.beginPath(); ctx.arc(x+ts*0.3, y+hc, ts/5, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillRect(x+ts*0.3, y+hc-3, ts*0.5, 6); ctx.strokeRect(x+ts*0.3, y+hc-3, ts*0.5, 6); ctx.fillRect(x+ts*0.6, y+hc, 4, 8); ctx.strokeRect(x+ts*0.6, y+hc, 4, 8);
            break;
        case T.DOOR:
            ctx.fillStyle = '#8B4513'; roundRect(ctx, x, y, ts, ts, 4); ctx.fillStyle = '#5C2E0B'; ctx.fillRect(x+4, y+4, ts-8, ts-8); ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(x+hc, y+hc, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            break;
        case T.BOUNCER:
            ctx.fillStyle = '#00e5ff'; roundRect(ctx, x+2, y+ts-12, ts-4, 12, 4); ctx.fillStyle = '#fff'; ctx.fillRect(x+6, y+ts-10, ts-12, 4);
            break;
        case T.STAR:
            ctx.fillStyle = '#ffd700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(x+hc, y+4); ctx.lineTo(x+25, y+14); ctx.lineTo(x+36, y+16); ctx.lineTo(x+28, y+24); ctx.lineTo(x+30, y+35); ctx.lineTo(x+hc, y+30); ctx.lineTo(x+10, y+35); ctx.lineTo(x+12, y+24); ctx.lineTo(x+4, y+16); ctx.lineTo(x+15, y+14); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x+16, y+17); ctx.lineTo(x+16, y+21); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+24, y+17); ctx.lineTo(x+24, y+21); ctx.stroke();
            break;
        case T.SPIDER:
            ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x+8, y+8); ctx.lineTo(x+14, y+14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+6, y+16); ctx.lineTo(x+14, y+18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+6, y+26); ctx.lineTo(x+14, y+24); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+8, y+34); ctx.lineTo(x+14, y+28); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+32, y+8); ctx.lineTo(x+26, y+14); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+34, y+16); ctx.lineTo(x+26, y+18); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+34, y+26); ctx.lineTo(x+26, y+24); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x+32, y+34); ctx.lineTo(x+26, y+28); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x+hc, y+22, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(x+hc, y+12, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x+16, y+10); ctx.lineTo(x+18, y+13); ctx.lineTo(x+16, y+13); ctx.fill(); ctx.beginPath(); ctx.moveTo(x+24, y+10); ctx.lineTo(x+22, y+13); ctx.lineTo(x+24, y+13); ctx.fill();
            break;
