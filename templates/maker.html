<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 王立試練迷宮（Maker）</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-base: #060709;
            --bg-surface: #0f1115;
            --border-subtle: #242831;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-gold: #d4af37;
            --accent-cyan: #00f3ff;
            --danger-color: #ff3366;
            --chamfer-clip: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-base); color: var(--text-primary);
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; /* Canvas固定のため */
            width: 100vw; height: 100vh;
        }

        /* レトロフォント適用 */
        .pixel-text { font-family: 'Press Start 2P', monospace; text-transform: uppercase; }

        /* ヘッダー UI */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 50px;
            background: linear-gradient(to bottom, rgba(15,17,21,0.9), rgba(15,17,21,0));
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; z-index: 100;
        }

        .btn-retro {
            background: rgba(0,0,0,0.6); border: 2px solid var(--border-subtle);
            color: var(--text-primary); padding: 8px 12px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: bold;
            transition: 0.1s; border-radius: 4px;
        }
        .btn-retro:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn-retro:active { transform: scale(0.95); }
        .btn-retro svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
        .btn-retro.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        /* トグルスイッチ（プレイ / エディット） */
        .mode-toggle { display: flex; background: rgba(0,0,0,0.8); border: 2px solid var(--border-subtle); border-radius: 6px; overflow: hidden; }
        .mode-toggle button {
            background: transparent; border: none; color: #fff; padding: 6px 16px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .mode-toggle button svg { width: 18px; height: 18px; fill: currentColor; }
        .mode-toggle button.active { background: var(--accent-cyan); color: #000; }
        
        /* ツールパレット (エディタ専用) */
        #palette {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 17, 21, 0.95); border: 2px solid var(--border-subtle);
            padding: 8px; display: flex; gap: 6px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #palette.hidden { transform: translate(-50%, 150%); }

        .palette-item {
            width: 44px; height: 44px; background: #000; border: 2px solid #333;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: 0.1s; position: relative;
        }
        .palette-item:hover { border-color: var(--text-primary); }
        .palette-item.selected { border-color: var(--accent-cyan); background: rgba(0, 243, 255, 0.1); }
        .palette-item svg { width: 28px; height: 28px; }

        /* スマホ用コントローラー (プレイモード専用) */
        #mobile-controls {
            position: absolute; bottom: 20px; left: 0; width: 100%;
            display: none; justify-content: space-between; padding: 0 20px; z-index: 100;
        }
        .ctrl-group { display: flex; gap: 12px; }
        .ctrl-btn {
            width: 60px; height: 60px; background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.5); font-size: 24px; pointer-events: auto;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.3); border-color: var(--accent-gold); color: var(--accent-gold); }

        /* Canvas */
        #gameCanvas {
            display: block; width: 100%; height: 100%; image-rendering: pixelated;
        }

        /* 画面中央メッセージ */
        #center-msg {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: var(--accent-gold); text-shadow: 4px 4px 0 #000;
            font-size: 2rem; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 150;
        }
        #center-msg.show { opacity: 1; }

        /* HUD */
        #hud {
            position: absolute; top: 60px; left: 20px; z-index: 90;
            display: flex; gap: 16px; font-size: 14px;
        }
        .hud-item { display: flex; align-items: center; gap: 6px; text-shadow: 2px 2px 0 #000; }
        .hud-item svg { width: 20px; height: 20px; }

        /* モーダル */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999;
            justify-content: center; align-items: center; padding: 16px;
        }
        .modal-box {
            background: var(--bg-card); border: 1px solid var(--accent-gold); clip-path: var(--chamfer-clip);
            width: 100%; max-width: 500px; padding: 24px; position: relative; max-height: 80vh; display: flex; flex-direction: column;
        }
        .modal-title { font-size: 1.1rem; color: var(--accent-gold); margin-bottom: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-group label { font-size: 0.75rem; color: var(--text-secondary); font-weight: bold; }
        .form-group input { padding: 10px; background: #000; border: 1px solid var(--border-subtle); color: #fff; outline: none; }
        .form-group input:focus { border-color: var(--accent-cyan); }
        
        .stage-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .stage-card {
            background: #000; border: 1px solid var(--border-subtle); padding: 12px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .stage-card:hover { border-color: var(--accent-gold); background: rgba(212,175,55,0.05); }
        .st-title { font-weight: bold; color: var(--accent-cyan); font-size: 0.9rem; }
        .st-author { font-size: 0.7rem; color: var(--text-secondary); margin-top: 4px; }
        .st-stats { font-size: 0.7rem; color: #aaa; text-align: right; }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <div id="top-bar">
        <button class="btn-retro" onclick="location.href='/dashboard'">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 王国へ戻る
        </button>

        <div class="mode-toggle">
            <button id="btn-edit" class="active" onclick="setMode('edit')" title="エディットモード">
                <!-- 鉛筆SVG -->
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            </button>
            <button id="btn-play" onclick="setMode('play')" title="テストプレイ">
                <!-- 再生SVG -->
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn-retro" onclick="openLoadModal()">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> 探す
            </button>
            <button class="btn-retro" onclick="openSaveModal()">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> 公開
            </button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="pixel-text">
        <div class="hud-item" style="color: var(--accent-gold);">
            <svg fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><line x1="12" y1="8" x2="12" y2="16" stroke="#000" stroke-width="2"></line></svg>
            <span id="hud-coins">0</span>
        </div>
        <div class="hud-item" id="hud-key" style="color: #666;">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"></circle><line x1="11" y1="11" x2="20" y2="20"></line><line x1="16" y1="16" x2="19" y2="13"></line></svg>
        </div>
    </div>

    <!-- キャンバス -->
    <canvas id="gameCanvas"></canvas>

    <!-- 画面中央メッセージ -->
    <div id="center-msg" class="pixel-text">STAGE CLEAR!</div>

    <!-- ツールパレット -->
    <div id="palette">
        <!-- JSで動的に生成 -->
    </div>

    <!-- スマホ用コントロール -->
    <div id="mobile-controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-btn" id="btn-jump" style="background: rgba(0,243,255,0.2);">▲</div>
    </div>

    <!-- モーダル：保存 -->
    <div id="modal-save" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-save')">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title pixel-text">STAGE UPLOAD</div>
            <div class="form-group">
                <label>ステージ名</label>
                <input type="text" id="save-title" placeholder="例: 奈落の神殿" maxlength="20">
            </div>
            <div class="form-group">
                <label>説明・ヒント</label>
                <input type="text" id="save-desc" placeholder="任意" maxlength="50">
            </div>
            <button class="btn-retro" style="justify-content: center; background: var(--accent-gold); color:#000; margin-top:10px;" onclick="saveStage()">データベースへ公開</button>
        </div>
    </div>

    <!-- モーダル：ロード -->
    <div id="modal-load" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-load')">
        <div class="modal-box" onclick="event.stopPropagation()" style="height: 80vh;">
            <div class="modal-title pixel-text">WORLD STAGES</div>
            <div class="stage-list" id="stage-list-container">
                <div style="text-align:center; color:#666; margin-top:20px;">読込中...</div>
            </div>
            <button class="btn-retro" style="justify-content: center;" onclick="closeModal('modal-load')">閉じる</button>
        </div>
    </div>

<script>
/* =========================================================
   1. 定数・初期設定・アセット定義
========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;

const TILE_SIZE = 40;
const MAP_COLS = 80;
const MAP_ROWS = 20;

let mode = 'edit'; // 'edit' | 'play'
let currentStageId = null; 

// カメラ
let camera = { x: 0, y: 0 };
// マウス / タッチ (エディタ用)
let input = { x: 0, y: 0, isDown: false, rightDown: false };
// キー入力 (プレイ用)
let keys = { left: false, right: false, jump: false };

// マップデータ (2D配列: [y][x])
let mapData = [];

// タイル定義
// 0: 空白, 1: ブロック, 2: トゲ, 3: コイン, 4: ゴール, 5: 鍵, 6: 扉, 7: ジャンプ台, 8: 敵(パトロール), 9: スタート地点
const TILES = {
    EMPTY: 0, BLOCK: 1, SPIKE: 2, COIN: 3, GOAL: 4, KEY: 5, DOOR: 6, BOUNCER: 7, ENEMY: 8, START: 9
};

// パレットUIデータ
const paletteItems = [
    { id: 1, color: '#444', icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="12" y1="3" x2="12" y2="9"/><line x1="8" y1="9" x2="8" y2="15"/><line x1="16" y1="9" x2="16" y2="15"/>' },
    { id: 2, color: '#ff3366', icon: '<polygon points="12 2 2 22 22 22 12 2"/>' },
    { id: 3, color: '#d4af37', icon: '<circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="16"/>' },
    { id: 5, color: '#ff9900', icon: '<circle cx="8" cy="8" r="4"/><line x1="11" y1="11" x2="20" y2="20"/><line x1="16" y1="16" x2="19" y2="13"/>' },
    { id: 6, color: '#888', icon: '<rect x="5" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>' },
    { id: 7, color: '#00f3ff', icon: '<path d="M4 18h16"/><path d="M7 14l5-5 5 5"/><path d="M12 9v9"/>' },
    { id: 8, color: '#a855f7', icon: '<circle cx="12" cy="10" r="5"/><line x1="9" y1="18" x2="15" y2="18"/><polyline points="6 20 8 16 16 16 18 20"/>' },
    { id: 4, color: '#fff', icon: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>' },
    { id: 9, color: '#10b981', icon: '<polygon points="5 3 19 12 5 21 5 3"/>' }, // Start
    { id: 0, color: '#222', icon: '<path d="M7 21L20 8l-5-5L2 16l5 5z"/><path d="M18 14l-4-4"/>' } // 消しゴム
];
let currentBrush = 1;

// 動的エンティティ
let player = { x: 0, y: 0, vx: 0, vy: 0, w: 24, h: 24, state: 'idle', coins: 0, hasKey: false };
let enemies = [];
let particles = [];

/* =========================================================
   2. 初期化 ＆ リサイズ
========================================================= */
function initMap() {
    mapData = [];
    for(let r=0; r<MAP_ROWS; r++) {
        mapData.push(new Array(MAP_COLS).fill(0));
    }
    // 外枠と初期の床
    for(let c=0; c<MAP_COLS; c++) {
        mapData[MAP_ROWS-1][c] = 1; // 床
        mapData[MAP_ROWS-2][c] = 1; // 床
        if(c===0 || c===MAP_COLS-1) {
            for(let r=0; r<MAP_ROWS; r++) mapData[r][c] = 1; // 壁
        }
    }
    mapData[MAP_ROWS-4][3] = 9; // デフォルトスタート位置
}

function initPalette() {
    const pal = document.getElementById('palette');
    let html = '';
    paletteItems.forEach(item => {
        html += `<div class="palette-item ${item.id===currentBrush?'selected':''}" data-id="${item.id}" style="color:${item.color}" onclick="selectBrush(${item.id})">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24">${item.icon}</svg>
        </div>`;
    });
    pal.innerHTML = html;
}

function selectBrush(id) {
    currentBrush = id;
    document.querySelectorAll('.palette-item').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.id) === id);
    });
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

initMap();
initPalette();
resize();

/* =========================================================
   3. モード切替 & プレイ開始ロジック
========================================================= */
function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
    document.getElementById('btn-play').classList.toggle('active', mode === 'play');
    document.getElementById('palette').classList.toggle('hidden', mode === 'play');
    
    // スマホ判定（ざっくり）してコントローラー表示
    const isMobile = window.innerWidth <= 768 || 'ontouchstart' in window;
    document.getElementById('mobile-controls').style.display = (mode === 'play' && isMobile) ? 'flex' : 'none';

    if (mode === 'play') {
        startPlay();
    }
}

function startPlay() {
    // マップスキャンして開始位置と敵を抽出
    enemies = [];
    player.hasKey = false;
    player.coins = 0;
    player.state = 'idle';
    player.vx = 0; player.vy = 0;
    updateHUD();
    document.getElementById('center-msg').classList.remove('show');

    let startFound = false;
    // オリジナルのマップデータから動的オブジェクト(敵)を抽出（マップ上の8は描画時に無視するか消す）
    for(let r=0; r<MAP_ROWS; r++) {
        for(let c=0; c<MAP_COLS; c++) {
            if (mapData[r][c] === 9) { // Start
                player.x = c * TILE_SIZE + (TILE_SIZE - player.w)/2;
                player.y = r * TILE_SIZE + (TILE_SIZE - player.h);
                startFound = true;
            } else if (mapData[r][c] === 8) { // Enemy
                enemies.push({
                    x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 24),
                    vx: -2, w: 24, h: 24, startX: c*TILE_SIZE
                });
            }
        }
    }
    if(!startFound) {
        player.x = 2 * TILE_SIZE; player.y = 2 * TILE_SIZE; // fail-safe
    }
}

function die() {
    player.state = 'dead';
    createParticles(player.x + player.w/2, player.y + player.h/2, '#00f3ff', 20);
    setTimeout(() => {
        if(mode === 'play') startPlay(); // Restart
    }, 1000);
}

function win() {
    if (player.state === 'clear') return;
    player.state = 'clear';
    const msg = document.getElementById('center-msg');
    msg.innerText = "STAGE CLEAR!";
    msg.style.color = "var(--accent-gold)";
    msg.classList.add('show');
    
    // APIへクリア送信
    if (currentStageId) {
        const token = localStorage.getItem("access_token");
        fetch(`/api/maker/stages/${currentStageId}/clear`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({})
        }).catch(e=>console.log(e));
    }

    setTimeout(() => setMode('edit'), 2000);
}

function updateHUD() {
    document.getElementById('hud-coins').innerText = player.coins;
    document.getElementById('hud-key').style.color = player.hasKey ? '#ff9900' : '#666';
}

/* =========================================================
   4. 入力処理 (PC / Mobile)
========================================================= */
// キーボード (Play)
window.addEventListener('keydown', e => {
    if(mode !== 'play') return;
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if(!keys.jump) { keys.jump = true; doJump(); }
    }
});
window.addEventListener('keyup', e => {
    if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});
function doJump() {
    if (player.state !== 'dead' && player.grounded) {
        player.vy = -11;
        player.grounded = false;
        createParticles(player.x + player.w/2, player.y + player.h, '#fff', 5);
    }
}

// マウス (Edit)
canvas.addEventListener('mousedown', e => {
    if(e.button === 0) input.isDown = true;
    if(e.button === 2) input.rightDown = true;
    handlePaint(e);
});
window.addEventListener('mouseup', e => {
    if(e.button === 0) input.isDown = false;
    if(e.button === 2) input.rightDown = false;
});
canvas.addEventListener('mousemove', e => {
    if(mode === 'edit' && input.rightDown) {
        // 右ドラッグでカメラ移動
        camera.x -= e.movementX;
        camera.y -= e.movementY;
    } else {
        handlePaint(e);
    }
});
canvas.addEventListener('contextmenu', e => e.preventDefault()); // 右クリックメニュー防止

function handlePaint(e) {
    if(mode !== 'edit') return;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    
    // World座標
    const wx = cx + camera.x;
    const wy = cy + camera.y;

    const col = Math.floor(wx / TILE_SIZE);
    const row = Math.floor(wy / TILE_SIZE);

    if (input.isDown && row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        // スタート地点は1つのみ
        if (currentBrush === 9) {
            for(let r=0; r<MAP_ROWS; r++) for(let c=0; c<MAP_COLS; c++) if(mapData[r][c] === 9) mapData[r][c] = 0;
        }
        mapData[row][col] = currentBrush;
    }
}

// スマホコントローラー
const bindBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); if(key==='jump'){if(!keys.jump)doJump();} keys[key] = true; }, {passive:false});
    btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive:false});
};
bindBtn('btn-left', 'left');
bindBtn('btn-right', 'right');
bindBtn('btn-jump', 'jump');

// スマホスワイプ (Editカメラ)
let lastTouch = null;
canvas.addEventListener('touchstart', e => {
    if(mode === 'edit' && e.touches.length===1) {
        lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        input.isDown = true; handlePaint(e.touches[0]);
    }
});
canvas.addEventListener('touchmove', e => {
    if(mode === 'edit' && e.touches.length===1) {
        if(currentBrush === 0) { // 消しゴム選択時はドラッグでカメラ移動とする
            const dx = e.touches[0].clientX - lastTouch.x;
            const dy = e.touches[0].clientY - lastTouch.y;
            camera.x -= dx; camera.y -= dy;
            lastTouch = {x: e.touches[0].clientX, y: e.touches[0].clientY};
        } else {
            handlePaint(e.touches[0]);
        }
    }
}, {passive:false});
canvas.addEventListener('touchend', () => { input.isDown = false; lastTouch = null; });


/* =========================================================
   5. ゲームロジック (物理演算・衝突判定)
========================================================= */
function getTile(x, y) {
    const col = Math.floor(x / TILE_SIZE);
    const row = Math.floor(y / TILE_SIZE);
    if(col<0 || col>=MAP_COLS || row<0 || row>=MAP_ROWS) return 1; // 画面外は壁扱い
    return mapData[row][col];
}
function setTile(x, y, val) {
    const col = Math.floor(x / TILE_SIZE);
    const row = Math.floor(y / TILE_SIZE);
    if(col>=0 && col<MAP_COLS && row>=0 && row<MAP_ROWS) mapData[row][col] = val;
}
function isSolid(t) {
    return t === 1 || t === 6; // 1:ブロック, 6:ロック扉
}

function updatePhysics() {
    if (player.state === 'dead' || player.state === 'clear') return;

    // 左右入力
    const acc = 0.8;
    const friction = 0.8;
    const maxSpeed = 5;

    if (keys.left) player.vx -= acc;
    if (keys.right) player.vx += acc;
    if (!keys.left && !keys.right) player.vx *= friction;
    
    // 速度制限
    if (player.vx > maxSpeed) player.vx = maxSpeed;
    if (player.vx < -maxSpeed) player.vx = -maxSpeed;
    if (Math.abs(player.vx) < 0.1) player.vx = 0;

    // 重力
    player.vy += 0.6; // gravity
    if (player.vy > 12) player.vy = 12; // 終端速度

    // --- X軸移動 & 衝突 ---
    player.x += player.vx;
    checkMapCollision(true);

    // --- Y軸移動 & 衝突 ---
    player.y += player.vy;
    player.grounded = false;
    checkMapCollision(false);

    // 画面外落下
    if (player.y > MAP_ROWS * TILE_SIZE + 100) die();

    // 敵の移動
    enemies.forEach(e => {
        e.vy = (e.vy || 0) + 0.6;
        e.x += e.vx;
        // 敵のX壁判定 (簡易)
        if(isSolid(getTile(e.x + (e.vx>0?e.w:0), e.y + e.h/2))) {
            e.vx *= -1; e.x += e.vx;
        }
        e.y += e.vy;
        // 敵のY床判定
        if(e.vy > 0 && isSolid(getTile(e.x + e.w/2, e.y + e.h))) {
            e.y = Math.floor((e.y+e.h)/TILE_SIZE)*TILE_SIZE - e.h;
            e.vy = 0;
        }
        // プレイヤーと敵の当たり判定
        if (rectIntersect(player, e)) {
            if (player.vy > 0 && player.y + player.h - e.y < 15) {
                // 踏んだ
                e.dead = true;
                player.vy = -8;
                createParticles(e.x+e.w/2, e.y+e.h/2, '#a855f7', 10);
            } else {
                die();
            }
        }
    });
    enemies = enemies.filter(e => !e.dead);
}

function rectIntersect(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function checkMapCollision(isX) {
    const p = player;
    // プレイヤーの四隅の座標が属するタイルをチェック
    const left = Math.floor(p.x / TILE_SIZE);
    const right = Math.floor((p.x + p.w - 0.1) / TILE_SIZE);
    const top = Math.floor(p.y / TILE_SIZE);
    const bottom = Math.floor((p.y + p.h - 0.1) / TILE_SIZE);

    for (let r = top; r <= bottom; r++) {
        for (let c = left; c <= right; c++) {
            if (r < 0 || r >= MAP_ROWS || c < 0 || c >= MAP_COLS) continue;
            let t = mapData[r][c];

            // ギミック判定
            if (t === 2) { die(); return; } // Spikes
            if (t === 3) { // Coin
                mapData[r][c] = 0; player.coins += 10; updateHUD();
                createParticles(c*TILE_SIZE+20, r*TILE_SIZE+20, '#d4af37', 5);
            }
            if (t === 5) { // Key
                mapData[r][c] = 0; player.hasKey = true; updateHUD();
                createParticles(c*TILE_SIZE+20, r*TILE_SIZE+20, '#ff9900', 8);
            }
            if (t === 4) { win(); return; } // Goal

            // 鍵持ち時の扉開放
            if (t === 6 && player.hasKey) {
                mapData[r][c] = 0;
                createParticles(c*TILE_SIZE+20, r*TILE_SIZE+20, '#888', 10);
                continue;
            }
            
            // ジャンプ台
            if (t === 7 && !isX && p.vy > 0) {
                p.vy = -18; // 大ジャンプ
                p.y = r * TILE_SIZE - p.h;
                return;
            }

            // 物理壁判定
            if (isSolid(t)) {
                if (isX) {
                    if (p.vx > 0) p.x = c * TILE_SIZE - p.w; // 右へ衝突
                    else if (p.vx < 0) p.x = c * TILE_SIZE + TILE_SIZE; // 左へ衝突
                    p.vx = 0;
                } else {
                    if (p.vy > 0) {
                        p.y = r * TILE_SIZE - p.h; // 床に着地
                        p.grounded = true;
                    }
                    else if (p.vy < 0) p.y = r * TILE_SIZE + TILE_SIZE; // 天井に衝突
                    p.vy = 0;
                }
            }
        }
    }
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x, y,
            vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8 - 2,
            life: 1.0, color
        });
    }
}

/* =========================================================
   6. 描画 (Render)
========================================================= */
function draw() {
    // 背景クリア
    ctx.fillStyle = '#060709'; // var(--bg-base)
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // カメラ追従
    if (mode === 'play') {
        const targetCx = player.x + player.w/2 - canvas.width/2;
        const targetCy = player.y + player.h/2 - canvas.height/2;
        camera.x += (targetCx - camera.x) * 0.1;
        camera.y += (targetCy - camera.y) * 0.1;
    }
    
    // カメラのクランプ (マップ外を見せない)
    const maxCx = Math.max(0, MAP_COLS * TILE_SIZE - canvas.width);
    const maxCy = Math.max(0, MAP_ROWS * TILE_SIZE - canvas.height);
    if(camera.x < 0) camera.x = 0; if(camera.x > maxCx) camera.x = maxCx;
    if(camera.y < 0) camera.y = 0; if(camera.y > maxCy) camera.y = maxCy;

    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    // エディタ用のグリッド線
    if (mode === 'edit') {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        const startC = Math.max(0, Math.floor(camera.x / TILE_SIZE));
        const endC = Math.min(MAP_COLS, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
        const startR = Math.max(0, Math.floor(camera.y / TILE_SIZE));
        const endR = Math.min(MAP_ROWS, Math.ceil((camera.y + canvas.height) / TILE_SIZE));
        
        ctx.beginPath();
        for(let c=startC; c<=endC; c++) { ctx.moveTo(c*TILE_SIZE, startR*TILE_SIZE); ctx.lineTo(c*TILE_SIZE, endR*TILE_SIZE); }
        for(let r=startR; r<=endR; r++) { ctx.moveTo(startC*TILE_SIZE, r*TILE_SIZE); ctx.lineTo(endC*TILE_SIZE, r*TILE_SIZE); }
        ctx.stroke();
    }

    // マップ描画
    const startCol = Math.max(0, Math.floor(camera.x / TILE_SIZE));
    const endCol = Math.min(MAP_COLS, Math.ceil((camera.x + canvas.width) / TILE_SIZE));
    const startRow = Math.max(0, Math.floor(camera.y / TILE_SIZE));
    const endRow = Math.min(MAP_ROWS, Math.ceil((camera.y + canvas.height) / TILE_SIZE));

    for (let r = startRow; r < endRow; r++) {
        for (let c = startCol; c < endCol; c++) {
            const t = mapData[r][c];
            if (t === 0) continue;
            
            const x = c * TILE_SIZE;
            const y = r * TILE_SIZE;
            const ts = TILE_SIZE;
            const hc = ts/2;

            if (t === 1) { // Block
                ctx.fillStyle = '#242831'; ctx.fillRect(x, y, ts, ts);
                ctx.strokeStyle = '#444'; ctx.strokeRect(x, y, ts, ts);
                // 内側の模様
                ctx.fillStyle = '#15181e'; ctx.fillRect(x+4, y+4, ts-8, ts-8);
            }
            else if (t === 2) { // Spike
                ctx.fillStyle = '#ff3366';
                ctx.beginPath(); ctx.moveTo(x+hc, y); ctx.lineTo(x+ts, y+ts); ctx.lineTo(x, y+ts); ctx.fill();
            }
            else if (t === 3) { // Coin
                ctx.fillStyle = '#d4af37';
                ctx.beginPath(); ctx.arc(x+hc, y+hc, ts/3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.fillRect(x+hc-2, y+hc-ts/6, 4, ts/3);
            }
            else if (t === 4) { // Goal (Flag)
                ctx.fillStyle = '#fff'; ctx.fillRect(x+ts/4, y, 4, ts);
                ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.moveTo(x+ts/4+4, y); ctx.lineTo(x+ts-4, y+ts/4); ctx.lineTo(x+ts/4+4, y+ts/2); ctx.fill();
            }
            else if (t === 5) { // Key
                ctx.fillStyle = '#ff9900';
                ctx.beginPath(); ctx.arc(x+ts*0.3, y+hc, ts/6, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(x+ts*0.3, y+hc-2, ts*0.5, 4);
                ctx.fillRect(x+ts*0.6, y+hc, 4, 6);
            }
            else if (t === 6) { // Door
                ctx.fillStyle = '#111'; ctx.fillRect(x, y, ts, ts);
                ctx.strokeStyle = '#888'; ctx.lineWidth=2; ctx.strokeRect(x+2, y+2, ts-4, ts-4);
                ctx.fillStyle = '#ff9900'; ctx.beginPath(); ctx.arc(x+hc, y+hc, 4, 0, Math.PI*2); ctx.fill();
            }
            else if (t === 7) { // Bouncer
                ctx.fillStyle = '#00f3ff'; ctx.fillRect(x+4, y+ts-8, ts-8, 8);
                ctx.fillStyle = '#555'; ctx.fillRect(x+8, y+ts-16, ts-16, 8);
            }
            else if (t === 8 && mode === 'edit') { // Enemy (Edit view only)
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(x+4, y+ts-24, 24, 24);
                ctx.fillStyle = '#fff'; ctx.fillRect(x+8, y+ts-20, 4,4); ctx.fillRect(x+18, y+ts-20, 4,4);
            }
            else if (t === 9) { // Start
                ctx.fillStyle = 'rgba(16, 185, 129, 0.3)'; ctx.fillRect(x, y, ts, ts);
                ctx.strokeStyle = '#10b981'; ctx.strokeRect(x, y, ts, ts);
                ctx.fillStyle = '#10b981'; ctx.font = "10px sans-serif"; ctx.fillText("START", x+4, y+hc+4);
            }
        }
    }

    // プレイヤー
    if (player.state !== 'dead') {
        ctx.fillStyle = '#00f3ff'; // サイバーシアン
        // 少しドット感のある描画
        ctx.fillRect(player.x, player.y, player.w, player.h);
        // 目
        ctx.fillStyle = '#000';
        const dir = keys.left ? -1 : (keys.right ? 1 : (player.vx>0?1:-1));
        const eyeX = dir > 0 ? player.x + 14 : player.x + 4;
        ctx.fillRect(eyeX, player.y + 6, 4, 4);
    }

    // 敵 (Play view)
    if (mode === 'play') {
        enemies.forEach(e => {
            ctx.fillStyle = '#a855f7';
            ctx.fillRect(e.x, e.y, e.w, e.h);
            ctx.fillStyle = '#fff'; // 怒った目
            const ex = e.vx > 0 ? e.x+14 : e.x+4;
            ctx.fillRect(ex, e.y+4, 6, 2);
        });
    }

    // パーティクル
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1.0;
        if(p.life <= 0) particles.splice(i, 1);
    }

    ctx.restore();
}

/* =========================================================
   7. メインループ
========================================================= */
function loop() {
    if (mode === 'play') updatePhysics();
    draw();
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   8. API連携・モーダル処理 (Save / Load)
========================================================= */
const token = localStorage.getItem("access_token");

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openSaveModal() {
    if(mode === 'play') setMode('edit');
    // スタートとゴールがあるか最低限チェック
    let hasStart = false, hasGoal = false;
    for(let r=0; r<MAP_ROWS; r++) {
        for(let c=0; c<MAP_COLS; c++) {
            if(mapData[r][c] === 9) hasStart = true;
            if(mapData[r][c] === 4) hasGoal = true;
        }
    }
    if(!hasStart || !hasGoal) {
        alert("公開するには「スタート地点(S)」と「ゴール(旗)」がマップ内に必要です。");
        return;
    }
    openModal('modal-save');
}

async function saveStage() {
    const title = document.getElementById('save-title').value.trim();
    const desc = document.getElementById('save-desc').value.trim();
    if(!title) return alert("ステージ名を入力してください。");

    // 2D配列をフラットな文字列/JSONにして圧縮
    // 実際にはランレングス圧縮等を行うと良いが、ここでは単純なJSON文字列
    const mapStr = JSON.stringify(mapData);

    try {
        const res = await fetch("/api/maker/stages", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ title, description: desc, map_data: mapStr })
        });
        const data = await res.json();
        if (res.ok) {
            alert(data.message);
            closeModal('modal-save');
        } else {
            alert("エラー: " + (data.detail || "保存失敗"));
        }
    } catch (e) {
        alert("通信エラーが発生しました。");
    }
}

async function openLoadModal() {
    if(mode === 'play') setMode('edit');
    openModal('modal-load');
    const container = document.getElementById('stage-list-container');
    container.innerHTML = '<div style="text-align:center;color:#666;margin-top:20px;">検索中...</div>';

    try {
        const res = await fetch("/api/maker/stages", { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        
        if (data.stages && data.stages.length > 0) {
            let html = '';
            data.stages.forEach(s => {
                const date = new Date(s.created_at).toLocaleDateString();
                html += `
                <div class="stage-card" onclick="loadStage(${s.id})">
                    <div>
                        <div class="st-title">${s.title}</div>
                        <div class="st-author">作: ${s.creator_name} | ${s.description||''}</div>
                    </div>
                    <div class="st-stats">
                        プレイ: ${s.plays_count} <br>
                        クリア: ${s.clears_count}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = '<div style="text-align:center;color:#666;margin-top:20px;">ステージがまだありません。</div>';
        }
    } catch (e) {
        container.innerHTML = '<div style="text-align:center;color:#ff3366;margin-top:20px;">取得エラー</div>';
    }
}

async function loadStage(id) {
    try {
        const res = await fetch(`/api/maker/stages/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (res.ok) {
            mapData = JSON.parse(data.map_data);
            currentStageId = id;
            closeModal('modal-load');
            camera.x = 0; camera.y = 0;
            // ロード後すぐにプレイモードへ移行
            setMode('play');
        } else {
            alert("ロード失敗: " + data.detail);
        }
    } catch (e) {
        alert("通信エラー");
    }
}
</script>
