<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 王立試練迷宮（Maker DX Pro Max）</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Press+Start+2P&display=swap');
        :root { --bg-base: #0f121a; --bg-surface: #1e2430; --border-bold: #000000; --text-primary: #ffffff; --text-secondary: #8a99a8; --accent-gold: #ffd700; --accent-cyan: #00e5ff; --danger-color: #ff2a5f; --switch-off: #ff2a5f; --switch-on: #00e5ff; --btn-shadow: 0 4px 0 rgba(0,0,0,0.8); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        
        /* スワイプによるブラウザバックとスクロールを完全に禁止 */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-primary); font-family: 'M PLUS Rounded 1c', sans-serif; overflow: hidden; width: 100vw; height: 100dvh; overscroll-behavior: none; touch-action: none; }
        
        .pixel-text { font-family: 'Press Start 2P', monospace; text-transform: uppercase; }
        #top-bar { position: absolute; top: 0; left: 0; width: 100%; height: 56px; background: rgba(15, 18, 26, 0.9); backdrop-filter: blur(10px); border-bottom: 3px solid var(--border-bold); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 100; gap: 6px; }
        .btn-retro { background: var(--bg-surface); border: 3px solid #000; color: var(--text-primary); padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 900; border-radius: 8px; box-shadow: var(--btn-shadow); transition: transform 0.1s, box-shadow 0.1s; white-space: nowrap; }
        .btn-retro:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
        .btn-retro svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .btn-cyan { background: var(--accent-cyan); color: #000; } .btn-gold { background: var(--accent-gold); color: #000; } .btn-fire { background: #ff4757; color: #fff; }
        .mode-toggle { display: flex; background: #000; border: 3px solid #000; border-radius: 10px; overflow: hidden; box-shadow: var(--btn-shadow); }
        .mode-toggle button { background: #1a1e29; border: none; color: #fff; padding: 6px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 0.8rem; }
        .mode-toggle button svg { width: 16px; height: 16px; fill: currentColor; } .mode-toggle button.active { background: var(--accent-cyan); color: #000; }
        .zoom-controls { display: flex; align-items: center; background: #000; border-radius: 8px; border: 2px solid #000; }
        .zoom-btn { background: var(--bg-surface); color: #fff; border: none; padding: 4px 8px; font-weight: 900; cursor: pointer; } .zoom-btn:active { background: var(--accent-gold); color: #000; } .zoom-val { font-size: 0.75rem; padding: 0 8px; color: var(--accent-gold); font-weight: 900; }
        #hud { position: absolute; top: 66px; left: 10px; z-index: 90; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; max-width: 90vw; }
        .hud-badge { background: rgba(0,0,0,0.8); border: 2.5px solid #000; border-radius: 8px; padding: 4px 10px; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 900; }
        .hud-badge svg { width: 16px; height: 16px; } .course-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; } .tag-my { background: var(--accent-gold); color: #000; } .tag-other { background: var(--accent-cyan); color: #000; } .tag-lobby { background: #ff4757; color: #fff; }
        #palette-wrap { position: absolute; bottom: calc(var(--safe-bottom) + 10px); left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; align-items: center; transition: transform 0.3s cubic-bezier(0.2,1,0.3,1); }
        #palette-wrap.collapsed { transform: translate(-50%, calc(100% - 28px)); }
        #palette-toggle { background: #000; color: #fff; border: 2px solid #fff; border-bottom: none; border-radius: 12px 12px 0 0; padding: 4px 24px; font-size: 0.75rem; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        #palette-wrap.collapsed #palette-toggle svg { transform: rotate(180deg); }
        .palette-box { background: var(--bg-surface); border: 3px solid #000; padding: 8px; border-radius: 16px; box-shadow: 0 8px 0 rgba(0,0,0,0.8); max-width: 95vw; }
        .pal-categories { display: flex; gap: 6px; margin-bottom: 8px; border-bottom: 2px dashed #444; padding-bottom: 8px; overflow-x: auto; }
        .pal-tab { background: #111; color: #888; border: 2px solid #000; border-radius: 6px; padding: 4px 12px; font-size: 0.75rem; font-weight: 900; cursor: pointer; white-space: nowrap; } .pal-tab.active { background: var(--accent-gold); color: #000; }
        #palette { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scroll-behavior: smooth; }
        .palette-item { min-width: 44px; height: 44px; background: #111; border: 2.5px solid #000; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; flex-shrink: 0; box-shadow: 0 3px 0 #000; transition: transform 0.1s; }
        .palette-item:active { transform: translateY(3px); box-shadow: none; } .palette-item.selected { background: var(--accent-gold) !important; color: #000 !important; }
        .palette-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; } .palette-label { font-size: 0.5rem; font-weight: 900; margin-top: 2px; }
        #mobile-controls { position: absolute; bottom: calc(var(--safe-bottom) + 20px); left: 0; width: 100%; display: none; justify-content: space-between; padding: 0 20px; z-index: 95; pointer-events: none; }
        .ctrl-group { display: flex; gap: 12px; pointer-events: auto; }
        .ctrl-btn { width: 65px; height: 65px; background: rgba(0,0,0,0.5); border: 3px solid rgba(255,255,255,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; pointer-events: auto; backdrop-filter: blur(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
        .ctrl-btn svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; } .ctrl-btn:active { background: var(--accent-cyan); color: #000; border-color: #000; transform: translateY(4px); box-shadow: none; }
        #center-msg { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: #000; border: 5px solid var(--accent-gold); border-radius: 16px; padding: 16px 32px; text-align: center; color: var(--accent-gold); font-size: 2rem; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 150; box-shadow: 0 10px 0 #000; white-space: nowrap; }
        #center-msg.show { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(-3deg); }
        #toast-msg { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); background: rgba(255,42,95,0.95); color: #fff; border: 3px solid #000; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 0.9rem; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 140; box-shadow: 0 4px 0 #000; }
        #toast-msg.show { opacity: 1; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; touch-action: none; } /* Canvas上のスワイプバックをブロック */
        
        /* チャット関連UI */
        #chat-log-container { position: absolute; bottom: 80px; left: 10px; width: 300px; max-height: 150px; overflow-y: hidden; z-index: 92; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
        .chat-line { background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; color: #fff; font-weight: bold; text-shadow: 1px 1px 0 #000; animation: fadeOut 8s forwards; }
        .chat-line .c-name { color: var(--accent-cyan); margin-right: 4px; }
        @keyframes fadeOut { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }
        
        #chat-input-wrapper { display: none; position: absolute; bottom: calc(var(--safe-bottom) + 20px); left: 10px; z-index: 98; align-items: center; gap: 6px; width: calc(100% - 20px); max-width: 400px; }
        #chat-input-wrapper.show { display: flex; }
        #chat-input { flex: 1; background: rgba(15,18,26,0.9); border: 3px solid var(--accent-cyan); color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; outline: none; box-shadow: 0 4px 0 #000; pointer-events: auto; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal-box { background: var(--bg-surface); border: 4px solid #000; border-radius: 16px; width: 100%; max-width: 550px; padding: 20px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 10px 0 #000; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px dashed var(--border-bold); padding-bottom: 10px; margin-bottom: 16px; }
        .modal-title { font-size: 1.2rem; color: var(--accent-gold); font-weight: 900; }
        .modal-close { background: var(--danger-color); color: #fff; border: 2.5px solid #000; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #000; }
        .modal-close:active { transform: translateY(3px); box-shadow: none; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; } .form-group label { font-size: 0.85rem; font-weight: bold; color: var(--text-primary); } .form-group input { padding: 12px; background: #111; border: 3px solid #000; border-radius: 8px; color: #fff; outline: none; font-size: 1rem; font-weight: bold; } .form-group input:focus { border-color: var(--accent-gold); }
        .stage-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .stage-card { background: #13161f; border: 3px solid #000; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border-radius: 10px; box-shadow: 0 4px 0 #000; }
        .stage-card:active { transform: translateY(3px); box-shadow: none; } .st-title { font-weight: 900; color: var(--accent-gold); font-size: 1.05rem; } .st-author { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; } .st-stats { font-size: 0.8rem; color: var(--accent-cyan); font-weight: bold; margin-top: 4px; }
        .flex-btns { display: flex; gap: 8px; margin-top: 10px; }
        #screen-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 200; transition: opacity 0.1s; }
        @media (max-width: 650px) { .hide-sm { display: none; } .btn-retro { padding: 6px 8px; } #top-bar { padding: 6px 8px; } #hud { top: 62px; } }
    </style>
</head>
<body>
    <div id="screen-flash"></div>
    <div id="top-bar">
        <button class="btn-retro" onclick="location.href='/dashboard'"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg><span class="hide-sm">戻る</span></button>
        <div class="mode-toggle">
            <button id="btn-edit" class="active" onclick="setMode('edit')"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg><span class="hide-sm">作成</span></button>
            <button id="btn-play" onclick="setMode('play')"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" stroke="none"></polygon></svg><span class="hide-sm">遊ぶ</span></button>
        </div>
        <div class="zoom-controls hide-sm">
            <button class="zoom-btn" onclick="adjustZoom(-0.15)">－</button><span class="zoom-val" id="zoom-text">100%</span><button class="zoom-btn" onclick="adjustZoom(0.15)">＋</button>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-retro btn-fire" onclick="joinDailyLobby()">🔥 <span class="hide-sm">日替わり</span></button>
            <button class="btn-retro" onclick="openModal('modal-io')"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg><span class="hide-sm">I/O</span></button>
            <button class="btn-retro btn-cyan" onclick="openLoadModal()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="hide-sm">探す</span></button>
            <button class="btn-retro btn-gold" onclick="openSaveModal()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg><span class="hide-sm">公開</span></button>
        </div>
    </div>

    <div id="hud">
        <div class="hud-badge" style="color: var(--accent-gold);"><svg viewBox="0 0 24 24" fill="#ffd700" stroke="#000" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="17"/></svg><span id="hud-coins">0</span> / <span id="hud-total-coins">0</span></div>
        <div class="hud-badge" id="hud-key" style="color: #666;"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4"/><line x1="11" y1="11" x2="20" y2="20"/><line x1="16" y1="16" x2="19" y2="13"/></svg><span id="hud-key-text">なし</span></div>
        <div class="hud-badge" id="hud-switch-status" style="display:none; color: var(--accent-cyan);"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span id="hud-sw-text">回路: OFF</span></div>
        <div class="hud-badge" id="hud-star-status" style="display:none; color: var(--accent-gold); border-color: var(--accent-gold);"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15.2,8.5 22.2,9.5 17.1,14.5 18.3,21.5 12,18.2 5.7,21.5 6.9,14.5 1.8,9.5 8.8,8.5"/></svg><span id="hud-star-text">0.0s</span></div>
        <div class="hud-badge" id="hud-course-info"><span id="hud-course-tag" class="course-tag tag-my">MY COURSE</span><span id="hud-course-title">新規作成コース</span></div>
        <div class="hud-badge" id="hud-mp-status" style="display:none; background: rgba(255,71,87,0.8); color:#fff;">👥 接続: <span id="hud-mp-count">1</span>人</div>
    </div>

    <div id="chat-log-container"></div>
    <div id="chat-input-wrapper">
        <input type="text" id="chat-input" placeholder="Enterでチャット送信..." maxlength="60" autocomplete="off">
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="center-msg" class="pixel-text">STAGE CLEAR!</div>
    <div id="toast-msg"><span id="toast-text"></span></div>

    <div id="palette-wrap">
        <button id="palette-toggle" onclick="togglePalette()"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="3" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg> ツール</button>
        <div class="palette-box">
            <div class="pal-categories">
                <div class="pal-tab active" onclick="setPalCat('all', this)">全て</div>
                <div class="pal-tab" onclick="setPalCat('terrain', this)">地形</div>
                <div class="pal-tab" onclick="setPalCat('gimmick', this)">仕掛</div>
                <div class="pal-tab" onclick="setPalCat('item', this)">強化</div>
                <div class="pal-tab" onclick="setPalCat('danger', this)">危険</div>
                <div class="pal-tab" onclick="setPalCat('entity', this)">キャラ</div>
            </div>
            <div id="palette"></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btn-left"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></div>
            <div class="ctrl-btn" id="btn-right"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></div>
        </div>
        <div class="ctrl-btn" id="btn-chat" onclick="toggleChatMobile()" style="background: rgba(255,255,255,0.3); border-color: #fff;"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div>
        <div class="ctrl-btn" id="btn-jump" style="background: rgba(0,229,255,0.3); border-color: #00e5ff;"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg></div>
    </div>

    <div id="modal-io" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-io')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">DATA I/O (.mrm1)</div>
                <button class="modal-close" onclick="closeModal('modal-io')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <p style="font-size:0.85rem; margin-bottom:8px;">コースデータのローカル保存・読み込み</p>
            <div class="flex-btns" style="flex-direction: column;">
                <button class="btn-retro btn-cyan" style="justify-content:center; padding: 12px;" onclick="exportDataMRM1()">⬇️ .mrm1形式でダウンロード</button>
                <div style="text-align: center; margin: 10px 0; color: #aaa; font-weight: bold;">または</div>
                <input type="file" id="file-upload" accept=".mrm1" style="display: none;" onchange="importDataMRM1(event)">
                <button class="btn-retro btn-gold" style="justify-content:center; padding: 12px;" onclick="document.getElementById('file-upload').click()">⬆️ .mrm1ファイルをアップロード</button>
            </div>
        </div>
    </div>

    <div id="modal-save" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-save')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">STAGE UPLOAD</div>
                <button class="modal-close" onclick="closeModal('modal-save')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div class="form-group"><label>ステージ名</label><input type="text" id="save-title" placeholder="例: 奈落のどっきり迷宮" maxlength="30"></div>
            <div class="form-group"><label>説明文</label><input type="text" id="save-desc" placeholder="例: 罠がいっぱい！" maxlength="50"></div>
            <button class="btn-retro btn-gold" style="justify-content: center; padding: 12px; margin-top: 10px;" onclick="saveStage()">データベースへ公開</button>
        </div>
    </div>

    <div id="modal-load" class="modal-overlay" onclick="if(event.target===this) closeModal('modal-load')">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title pixel-text">WORLD STAGES</div>
                <button class="modal-close" onclick="closeModal('modal-load')"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div style="display:flex; gap:8px; margin-bottom:12px;"><button class="btn-retro" onclick="openLoadModal()" style="width:100%; justify-content:center;">🔄 リロード / 再検索</button></div>
            <div class="stage-list" id="stage-list-container"></div>
        </div>
    </div>

<script>
function escapeHtml(str) { return str ? String(str).replace(/[&<>"']/g, match => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[match])) : ''; }
function showToast(text) {
    const t = document.getElementById('toast-msg'); 
    document.getElementById('toast-text').innerText = text;
    t.classList.add('show'); 
    setTimeout(() => { t.classList.remove('show'); }, 2500);
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

const TILE_SIZE = 40; 
const MAP_COLS = 100; 
const MAP_ROWS = 25;

const COLOR_SW_ON = '#00e5ff';
const COLOR_SW_OFF = '#ff2a5f';
const W_COLORS = ['#9b59b6', '#3498db', '#1abc9c', '#e67e22', '#e74c3c', '#f1c40f', '#34495e'];

const T = {
    EMPTY: 0, BLOCK: 1, SPIKE_UP: 2, COIN: 3, GOAL: 4, KEY: 5, DOOR: 6, BOUNCER: 7, 
    ENEMY: 8, START: 9, BRICK: 10, SPIKE_DOWN: 11, SPIKE_LEFT: 12, SPIKE_RIGHT: 13,
    BEAM_R: 14, ONEWAY_UP: 15, WARP: 16, PAN: 100,
    BEAM_L: 18, BEAM_U: 19, BEAM_D: 20, 
    ONEWAY_DOWN: 21, ONEWAY_LEFT: 22, ONEWAY_RIGHT: 23,
    ENEMY2: 24, SWITCH: 25, SW_BLOCK_A: 26, SW_BLOCK_B: 27,
    CROSS: 28, BOOST_R: 29, BOOST_L: 30,
    HIDDEN_BLOCK: 31, LEVER: 32, ENEMY_H: 33, ENEMY_V: 34, BOOST_U: 35, LIFT_H: 36, LIFT_V: 37,
    STAR: 38, SPIDER: 39, ENEMY_SNIPER: 40, ENEMY_GOLGO: 41,
    SPIDER_NEW: 42, SPIKE_TOGGLE: 43, CONVEYOR_R: 44, CONVEYOR_L: 45, ICE_BLOCK: 46, CRUMBLE_BLOCK: 47,
    TOGGLE_DOOR: 48, GRAVITY_PANEL: 49, BEAM_HOMING: 50, DOUBLE_JUMP: 51, DASH_SHOES: 52, ENEMY_SHELL: 53, ENEMY_GHOST: 54
};

const paletteItems = [

function joinDailyLobby() {
    fetch('/api/maker/daily', { headers: { 'Authorization': `Bearer ${localStorage.getItem("access_token")}` } })
    .then(r => { if (!r.ok) throw new Error("ロビーが見つかりません。"); return r.json(); })
    .then(data => {
        const stage = data.stage;
        let p = JSON.parse(stage.map_data);
        if (Array.isArray(p)) { mapData = p; warpPairs = []; } else { mapData = p.map; warpPairs = p.warps || []; }
        currentStageInfo = { id: stage.id, title: "本日のロビー: " + stage.title, author: stage.creator_name, isMine: false, isDaily: true };
        
        setMode('play');
        isMultiplayer = true;
        updateCourseHUDInfo();
        document.getElementById('hud-mp-status').style.display = 'flex';
        initWebSocket();
        showToast("🔥 日替わりロビーに参加しました！");
    })
    .catch(err => alert(err.message));
}

function initWebSocket() {
    if (socket) socket.close();
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = protocol + '//' + location.host + '/ws/maker/daily?token=' + localStorage.getItem('access_token');
    
    socket = new WebSocket(wsUrl);
    otherPlayers = {};
    
    socket.onopen = () => { syncInterval = setInterval(syncPlayerPos, 50); };
    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'player_join') {
            document.getElementById('hud-mp-count').innerText = msg.total_players;
        } else if (msg.type === 'player_leave') {
            delete otherPlayers[msg.id];
            document.getElementById('hud-mp-count').innerText = msg.total_players;
        } else if (msg.type === 'pos') {
            if (!otherPlayers[msg.id]) {
                otherPlayers[msg.id] = { ...msg, x: msg.x, y: msg.y, targetX: msg.x, targetY: msg.y, chatTimer: 0, chatMessage: "" };
            } else {
                let op = otherPlayers[msg.id];
                op.targetX = msg.x; op.targetY = msg.y;
                op.vx = msg.vx; op.vy = msg.vy; op.faceDir = msg.faceDir;
                op.gravityDir = msg.gravityDir; op.hook = msg.hook; op.isSpider = msg.isSpider;
                if(msg.name) op.name = msg.name;
                if(msg.is_king !== undefined) op.is_king = msg.is_king;
            }
        } else if (msg.type === 'respawn') {
            createParticles(msg.x + 13, msg.y + 13, '#ff2a5f', 20);
        } else if (msg.type === 'chat') {
            displayChatBubble(msg.id, msg.text);
            addChatLog(msg.name, msg.text, msg.is_king);
        } else if (msg.type === 'clear') {
            addChatLog("システム", `${msg.name} がゴールしました！（${msg.time}秒）`);
            for(let i=0; i<30; i++) createParticles(player.x + (Math.random()-0.5)*200, player.y - 100 + (Math.random()-0.5)*200, '#ffd700', 3);
        }
    };
    socket.onclose = () => {
        clearInterval(syncInterval);
        document.getElementById('hud-mp-status').style.display = 'none';
        isMultiplayer = false;
    };
}

function syncPlayerPos() {
    if (socket && socket.readyState === WebSocket.OPEN && player.state !== 'dead') {
        socket.send(JSON.stringify({
            type: 'pos', x: player.x, y: player.y, vx: player.vx, vy: player.vy, 
            faceDir: player.faceDir, gravityDir: player.gravityDir,
            hook: player.hook, isSpider: (player.hasSpider || player.hasNewSpider)
        }));
    }
}

function sendChatMessage(text) {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'chat', text: text }));
        displayChatBubble('self', text);
        addChatLog("自分", text, false);
    }
}

function displayChatBubble(id, text) {
    if (id === 'self') {
        player.chatMessage = text; player.chatTimer = 240; 
    } else if (otherPlayers[id]) {
        otherPlayers[id].chatMessage = text; otherPlayers[id].chatTimer = 240;
    }
}

function addChatLog(name, text, isKing) {
    const container = document.getElementById('chat-log-container');
    const el = document.createElement('div');
    el.className = 'chat-line';
    const nameColor = isKing ? '#ffd700' : 'var(--accent-cyan)';
    const prefix = isKing ? '👑 ' : '';
    el.innerHTML = `<span class="c-name" style="color:${nameColor}">${prefix}${escapeHtml(name)}:</span> ${escapeHtml(text)}`;
    container.appendChild(el);
    if (container.children.length > 5) container.removeChild(container.firstChild);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 8000);
}

const chatInput = document.getElementById('chat-input');
const chatWrapper = document.getElementById('chat-input-wrapper');

window.addEventListener('keydown', (e) => {
    if (mode === 'play' && isMultiplayer) {
        if (e.key === 'Enter') {
            if (document.activeElement === chatInput) {
                const text = chatInput.value.trim();
                if (text) sendChatMessage(text);
                chatInput.value = '';
                chatInput.blur();
                chatWrapper.classList.remove('show');
            } else {
                chatWrapper.classList.add('show');
                chatInput.focus();
                e.preventDefault();
            }
        }
    }
});

function toggleChatMobile() {
    if (chatWrapper.classList.contains('show')) {
        chatWrapper.classList.remove('show');
        chatInput.blur();
    } else {
        chatWrapper.classList.add('show');
        chatInput.focus();
    }
}

function initMap() {
    mapData = Array.from({ length: MAP_ROWS }, () => new Array(MAP_COLS).fill(0));
    for (let c = 0; c < MAP_COLS; c++) { 
        mapData[MAP_ROWS-1][c] = T.BLOCK; 
        mapData[MAP_ROWS-2][c] = T.BLOCK; 
        if (c === 0 || c === MAP_COLS-1) {
            for (let r = 0; r < MAP_ROWS; r++) mapData[r][c] = T.BLOCK;
        }
    }
    mapData[MAP_ROWS-4][3] = T.START; 
    mapData[MAP_ROWS-4][15] = T.GOAL;
    warpPairs = []; pendingWarp = null; 
    updateCourseHUDInfo();
}

function focusCameraOnStart() {
    const viewW = window.innerWidth / zoomScale;
    const viewH = window.innerHeight / zoomScale;
    let found = false;
    for (let r = 0; r < MAP_ROWS; r++) {
        if(!mapData[r]) continue;
        for (let c = 0; c < MAP_COLS; c++) {
            if (mapData[r][c] === T.START) {
                const startX = c * TILE_SIZE + TILE_SIZE / 2;
                const startY = r * TILE_SIZE + TILE_SIZE / 2;
                camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, startX - viewW / 2));
                camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, startY - viewH / 2));
                found = true; break;
            }
        }
        if(found) break;
    }
    // NaN回避（画面サイズ0の時など）
    if(isNaN(camera.x)) camera.x = 0;
    if(isNaN(camera.y)) camera.y = 0;
}

function setPalCat(cat, btn) {
    document.querySelectorAll('.pal-tab').forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('palette').innerHTML = paletteItems.filter(i => cat === 'all' || i.cat === 'all' || i.cat === cat).map(item => `
        <div class="palette-item ${item.id === currentBrush ? 'selected' : ''}" data-id="${item.id}" style="color:${item.color}" onclick="selectBrush(${item.id})">
            <svg viewBox="0 0 24 24">${item.icon}</svg>
            <span class="palette-label">${item.label}</span>
        </div>
    `).join('');
}

function selectBrush(id) { 
    currentBrush = id; 
    document.querySelectorAll('.palette-item').forEach(el => el.classList.toggle('selected', parseInt(el.dataset.id) === id));
}
function togglePalette() { document.getElementById('palette-wrap').classList.toggle('collapsed'); }

function adjustZoom(delta) { 
    zoomScale = Math.min(Math.max(0.5, zoomScale + delta), 1.8); 
    document.getElementById('zoom-text').innerText = Math.round(zoomScale * 100) + '%'; 
    resize(); 
}

function resize() { 
    isMobile = (window.innerWidth <= 768 || 'ontouchstart' in window);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr; 
    canvas.height = window.innerHeight * dpr; 
    ctx.imageSmoothingEnabled = false;
    
    if (mode === 'edit') {
        const viewW = window.innerWidth / zoomScale;
        const viewH = window.innerHeight / zoomScale;
        camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, camera.x));
        camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, camera.y));
        if(isNaN(camera.x)) camera.x = 0;
        if(isNaN(camera.y)) camera.y = 0;
    }
}

window.addEventListener('resize', resize);
initMap(); 
setPalCat('all', document.querySelector('.pal-tab.active')); 
resize(); 
focusCameraOnStart();

function setMode(newMode) {
    mode = newMode;
    document.getElementById('btn-edit').classList.toggle('active', mode === 'edit');
    document.getElementById('btn-play').classList.toggle('active', mode === 'play');
    document.getElementById('palette-wrap').style.display = (mode === 'play') ? 'none' : 'flex';
    document.getElementById('mobile-controls').style.display = (mode === 'play' && isMobile) ? 'flex' : 'none';
    document.getElementById('hud-switch-status').style.display = (mode === 'play') ? 'flex' : 'none';
    document.getElementById('hud-star-status').style.display = 'none';

    if (mode === 'play') {
        savedMapDataStr = JSON.stringify(mapData);
        startPlay();
    } else {
        if(socket) { socket.close(); socket = null; isMultiplayer = false; }
        document.getElementById('hud-mp-status').style.display = 'none';
        chatWrapper.classList.remove('show');
        activeMapData = []; 
        resize();
        focusCameraOnStart(); 
    }
}

function startPlay() {
    try { activeMapData = JSON.parse(savedMapDataStr); } catch(e) { activeMapData = []; }
    if (!activeMapData || activeMapData.length === 0) activeMapData = Array.from({ length: MAP_ROWS }, () => new Array(MAP_COLS).fill(0));

    enemies = []; beamEmitters = []; projectiles = []; particles = []; trails = []; crosses = []; lifts = []; leverStates = {}; crumbleBlocks = {};
    
    player = { 
        x: 0, y: 0, vx: 0, vy: 0, w: 26, h: 26, state: 'idle', 
        coins: 0, hasKey: false, grounded: false, touchingWall: 0, faceDir: 1, 
        warpCooldown: 0, scaleX: 1, scaleY: 1, boostTimer: 0, invincibleTimer: 0,
        hasSpider: false, hasNewSpider: false, hook: null, hookDist: 0,
        lastLevers: new Set(), gravityDir: 1, doubleJump: false, dashShoes: false, doubleJumpUsed: false,
        startX: 80, startY: 80, chatTimer: 0, chatMessage: ""
    };
    
    isCircuitActive = false; activeSwitchCount = 0; screenShake = 0;
    document.getElementById('center-msg').classList.remove('show');
    totalCoinsInStage = 0; 
    let startFound = false;

    for (let r = 0; r < MAP_ROWS; r++) {
        if (!activeMapData[r]) continue;
        for (let c = 0; c < MAP_COLS; c++) {
            const t = activeMapData[r][c];
            if (!t || t === 0) continue;
            
            if (t === T.COIN) { totalCoinsInStage++; }
            else if (t === T.START) { 
                player.startX = c * TILE_SIZE + (TILE_SIZE - player.w) / 2; 
                player.startY = r * TILE_SIZE + (TILE_SIZE - player.h); 
                player.x = player.startX; player.y = player.startY;
                startFound = true; 
            }
            else if (t === T.ENEMY) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: -2, vy: 0, w: 28, h: 28, blink: 0, type: 1 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY2) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: -2, vy: 0, w: 28, h: 28, blink: 0, type: 2, jumpTmr: 0 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_H) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 24)/2, vx: 2, vy: 0, w: 28, h: 24, blink: 0, type: 3 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_V) { enemies.push({ x: c * TILE_SIZE + (TILE_SIZE - 24)/2, y: r * TILE_SIZE, vx: 0, vy: 2, w: 24, h: 28, blink: 0, type: 4 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_SNIPER) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: 0, vy: 0, w: 28, h: 28, blink: 0, type: 5, tmr: 0 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_GOLGO) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 36), vx: 0, vy: 0, w: 28, h: 36, blink: 0, type: 6, tmr: 0, aimAngle: 0 }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_SHELL) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: -1.5, vy: 0, w: 28, h: 28, blink: 0, type: 7, state: 'walk' }); activeMapData[r][c] = 0; }
            else if (t === T.ENEMY_GHOST) { enemies.push({ x: c * TILE_SIZE, y: r * TILE_SIZE + (TILE_SIZE - 28), vx: 0, vy: 0, w: 28, h: 28, blink: 0, type: 8 }); activeMapData[r][c] = 0; }
            else if ([T.BEAM_R, T.BEAM_L, T.BEAM_U, T.BEAM_D, T.BEAM_HOMING].includes(t)) { beamEmitters.push({ r, c, type: t, tmr: Math.floor(Math.random() * 90) }); }
            else if (t === T.CROSS) { crosses.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 0, vy: 0, w: TILE_SIZE, h: TILE_SIZE }); activeMapData[r][c] = 0; }
            else if (t === T.LIFT_H) { lifts.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 2, vy: 0, w: TILE_SIZE, h: 12 }); activeMapData[r][c] = 0; }
            else if (t === T.LIFT_V) { lifts.push({ x: c*TILE_SIZE, y: r*TILE_SIZE, vx: 0, vy: 2, w: TILE_SIZE, h: 12 }); activeMapData[r][c] = 0; }
            else if (t === T.LEVER) { leverStates[`${r},${c}`] = false; }
        }
    }
    
    if (!startFound) { player.x = player.startX; player.y = player.startY; }
    
    updateHUD(); 
    resize();
    const viewW = window.innerWidth / zoomScale;
    const viewH = window.innerHeight / zoomScale;
    camera.x = Math.max(0, Math.min(MAP_COLS * TILE_SIZE - viewW, player.x + player.w/2 - viewW / 2)); 
    camera.y = Math.max(0, Math.min(MAP_ROWS * TILE_SIZE - viewH, player.y + player.h/2 - viewH / 2));
    if(isNaN(camera.x)) camera.x = 0;
    if(isNaN(camera.y)) camera.y = 0;
}

function updateCourseHUDInfo() {
    const tag = document.getElementById('hud-course-tag'); 
    const title = document.getElementById('hud-course-title');
    if (currentStageInfo.isDaily) { tag.className = 'course-tag tag-lobby'; tag.innerText = '日替わり'; }
    else if (currentStageInfo.isMine) { tag.className = 'course-tag tag-my'; tag.innerText = 'MY COURSE'; } 
    else { tag.className = 'course-tag tag-other'; tag.innerText = '作: ' + currentStageInfo.author; }
    title.innerText = currentStageInfo.title;
}

function updateHUD() {
    document.getElementById('hud-coins').innerText = player.coins; 
    document.getElementById('hud-total-coins').innerText = totalCoinsInStage;
    document.getElementById('hud-key-text').innerText = player.hasKey ? 'あり' : 'なし';
    document.getElementById('hud-key').style.color = player.hasKey ? '#ff9900' : '#666';

    const swEl = document.getElementById('hud-switch-status');
    swEl.style.color = isCircuitActive ? 'var(--switch-on)' : '#666'; 
    document.getElementById('hud-sw-text').innerText = `回路: ${isCircuitActive ? 'ON' : 'OFF'} (${activeSwitchCount})`;

    const starEl = document.getElementById('hud-star-status');
    if (player.invincibleTimer > 0) {
        starEl.style.display = 'flex';
        starEl.style.color = (player.invincibleTimer < 180 && globalFrame % 10 < 5) ? '#ff2a5f' : 'var(--accent-gold)';
        document.getElementById('hud-star-text').innerText = (player.invincibleTimer / 60).toFixed(1) + 's';
    } else {
        starEl.style.display = 'none';
    }
}

function die() {
    if (player.state === 'dead' || player.state === 'clear') return;
    
    if (isMultiplayer) {
        createParticles(player.x + player.w/2, player.y + player.h/2, '#ff2a5f', 30);
        if(socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({type: 'respawn', x: player.x, y: player.y}));
        }
        player.x = player.startX; player.y = player.startY;
        player.vx = 0; player.vy = 0; player.gravityDir = 1;
        player.hasKey = false; player.coins = 0; player.invincibleTimer = 0;
        screenShake = 10;
        document.getElementById('screen-flash').style.opacity = '1'; 
        setTimeout(() => document.getElementById('screen-flash').style.opacity = '0', 50);
        return;
    }

    player.state = 'dead'; 
    screenShake = 20; 
    player.vy = -12 * player.gravityDir; 
    player.vx = 0;
    
    document.getElementById('screen-flash').style.opacity = '1'; 
    setTimeout(() => document.getElementById('screen-flash').style.opacity = '0', 100);
    createParticles(player.x + player.w/2, player.y + player.h/2, '#ff2a5f', 50);
    
    setTimeout(() => { if (mode === 'play') startPlay(); }, 1500);
}

function win() {
    if (player.state === 'clear' || player.state === 'dead') return;
    if (player.coins < totalCoinsInStage) { showToast(`コイン残り: ${totalCoinsInStage - player.coins}枚`); return; }
    
    player.state = 'clear'; player.vx = 0; player.vy = 0; 
    const centerMsg = document.getElementById('center-msg');
    centerMsg.innerText = "STAGE CLEAR!"; centerMsg.classList.add('show');
    
    if (isMultiplayer && socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'clear', time: (globalFrame / 60).toFixed(1) }));
        for(let i=0; i<50; i++) createParticles(player.x + (Math.random()-0.5)*200, player.y - 100 + (Math.random()-0.5)*200, '#ffd700', 3);
        setTimeout(() => { 
            player.x = player.startX; player.y = player.startY; player.state = 'idle';
            centerMsg.classList.remove('show');
            player.coins = 0;
        }, 3000);
        return;
    }
    
    if (currentStageInfo.id && !currentStageInfo.isDaily) {
        fetch(`/api/maker/stages/${currentStageInfo.id}/clear`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem("access_token")}` } }).catch(() => {});
    }
    setTimeout(() => { setMode('edit'); centerMsg.classList.remove('show'); }, 2500);
}

// 入力イベント（スワイプバック完全防止）
// ==========================================
function isChatFocused() { return document.activeElement === chatInput; }

window.addEventListener('keydown', e => {
    if (mode !== 'play' || isChatFocused()) return;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { 
        if (!keys.jump) { keys.jump = true; doJump(); } 
    }
});

window.addEventListener('keyup', e => {
    if (isChatFocused()) return;
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
});

function doJump() {
    if (player.state !== 'idle') return;
    
    if (player.hook) { 
        player.hook = null; player.vy = -10 * player.gravityDir; 
        if (player.hasSpider) player.vx *= 1.2;
        screenShake = 6; createParticles(player.x + player.w/2, player.y + (player.gravityDir>0?player.h:0), '#fff', 15);
        return; 
    }
    
    if (player.grounded) { 
        player.vy = -12 * player.gravityDir; player.grounded = false; player.doubleJumpUsed = false;
        player.scaleX = 0.6; player.scaleY = 1.4; createParticles(player.x + player.w/2, player.y + (player.gravityDir>0?player.h:0), '#fff', 8); 
    } else if (player.doubleJump && !player.doubleJumpUsed) { 
        player.vy = -12 * player.gravityDir; player.doubleJumpUsed = true;
        player.scaleX = 0.6; player.scaleY = 1.4; createParticles(player.x + player.w/2, player.y + player.h/2, '#a29bfe', 15); 
    } else if (player.touchingWall !== 0) { 
        player.vy = -11.5 * player.gravityDir; player.vx = player.touchingWall * -9; player.faceDir = -player.touchingWall; 
        player.scaleX = 0.6; player.scaleY = 1.4; screenShake = 4; 
        const px = player.x + player.w/2 + (player.touchingWall === 1 ? player.w/2 : -player.w/2);
        createParticles(px, player.y + player.h/2, '#00e5ff', 12); 
    }
}

function handleInputCoords(clientX, clientY, isRightClick) {
    const rect = canvas.getBoundingClientRect();
    const wx = (clientX - rect.left) / zoomScale + camera.x;
    const wy = (clientY - rect.top)  / zoomScale + camera.y;
    const col = Math.floor(wx / TILE_SIZE); 
    const row = Math.floor(wy / TILE_SIZE);
    
    if (mode === 'play') {
        if ((player.hasSpider || player.hasNewSpider) && !isRightClick && player.boostTimer === 0) {
            let bestDist = Infinity; let target = null;
            for (let r = row - 2; r <= row + 2; r++) {
                if (!activeMapData[r]) continue;
                for (let c = col - 2; c <= col + 2; c++) {
                    if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS && isSolid(activeMapData[r][c])) {
                        let d = Math.hypot(c * TILE_SIZE + 20 - wx, r * TILE_SIZE + 20 - wy);
                        if (d < bestDist && d < 100) { bestDist = d; target = { x: c * TILE_SIZE + 20, y: r * TILE_SIZE + 20 }; }
                    }
                }
            }
            if (target) { player.hook = target; player.hookDist = 0; slowFrames = 0; }
        }
        return;
    }
    
    if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        if (!mapData[row]) mapData[row] = new Array(MAP_COLS).fill(0);
        if (input.rightDown || isRightClick) {
            if (mapData[row][col] === T.WARP) { warpPairs = warpPairs.filter(wp => !(wp.r1===row && wp.c1===col) && !(wp.r2===row && wp.c2===col)); if (pendingWarp && pendingWarp.r===row && pendingWarp.c===col) pendingWarp = null; }
            mapData[row][col] = 0; 
        } else if (currentBrush === T.START) { 
            for (let y = 0; y < MAP_ROWS; y++) { if (!mapData[y]) continue; for (let x = 0; x < MAP_COLS; x++) { if (mapData[y][x] === T.START) mapData[y][x] = 0; } }
            mapData[row][col] = T.START;
        } else if (currentBrush === T.WARP) {
            if (mapData[row][col] !== T.WARP) {
                if (pendingWarp) { warpPairs.push({ id: warpPairs.length + 1, r1: pendingWarp.r, c1: pendingWarp.c, r2: row, c2: col }); pendingWarp = null; } 
                else { pendingWarp = { r: row, c: col }; }
                mapData[row][col] = T.WARP;
            }
        } else { mapData[row][col] = currentBrush; }
    }
}

// マウスイベント
canvas.addEventListener('mousedown', e => { if (e.button === 0) input.isDown = true; if (e.button === 2) input.rightDown = true; handleInputCoords(e.clientX, e.clientY, e.button === 2); });
window.addEventListener('mouseup', () => { input.isDown = false; input.rightDown = false; if (mode === 'play' && player.hook) { player.hook = null; player.vy = -10 * player.gravityDir; if (player.hasSpider) player.vx *= 1.2; screenShake = 6; } });
canvas.addEventListener('mousemove', e => { if (mode === 'edit' && input.rightDown && currentBrush === T.PAN) { camera.x -= e.movementX / zoomScale; camera.y -= e.movementY / zoomScale; } else if (mode === 'edit' && input.isDown && currentBrush !== T.PAN) handleInputCoords(e.clientX, e.clientY, false); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ボタンイベント (preventDefaultで操作奪われを防止)
const bindBtn = (id, k) => { 
    const b = document.getElementById(id);
    if(!b) return;
    b.addEventListener('touchstart', e => { e.preventDefault(); if (k === 'jump' && !keys.jump) doJump(); keys[k] = true; }, { passive: false }); 
    b.addEventListener('touchend', e => { e.preventDefault(); keys[k] = false; }, { passive: false }); 
};
bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right'); bindBtn('btn-jump', 'jump');

// Canvasタッチイベント（preventDefaultでスワイプバックを強力にブロック）
let lastTouch = null;
canvas.addEventListener('touchstart', e => { 
    e.preventDefault(); 
    if (e.touches.length === 1 && !isChatFocused()) { lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; input.isDown = true; if (mode === 'play' || currentBrush !== T.PAN) handleInputCoords(lastTouch.x, lastTouch.y, false); } 
}, { passive: false });
canvas.addEventListener('touchmove', e => { 
    e.preventDefault(); 
    if (e.touches.length === 1 && lastTouch) { if (mode === 'edit' && currentBrush === T.PAN) { camera.x -= (e.touches[0].clientX - lastTouch.x) / zoomScale; camera.y -= (e.touches[0].clientY - lastTouch.y) / zoomScale; lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; } else if (mode === 'edit' && input.isDown) handleInputCoords(e.touches[0].clientX, e.touches[0].clientY, false); } 
}, { passive: false });
canvas.addEventListener('touchend', e => { 
    e.preventDefault(); 
    input.isDown = false; lastTouch = null; if (mode === 'play' && player.hook) { player.hook = null; player.vy = -10 * player.gravityDir; if (player.hasSpider) player.vx *= 1.2; screenShake = 6; } 
}, { passive: false });

/* =========================================================
   物理演算 & ギミック
========================================================= */
function isSolid(t) { return [T.BLOCK, T.BRICK, T.DOOR, T.BEAM_R, T.BEAM_L, T.BEAM_U, T.BEAM_D, T.BEAM_HOMING, T.HIDDEN_BLOCK, T.ICE_BLOCK, T.CRUMBLE_BLOCK].includes(t) || (t === T.SW_BLOCK_A && !isCircuitActive) || (t === T.SW_BLOCK_B && isCircuitActive) || (t === T.TOGGLE_DOOR && !isCircuitActive); }
function rectIntersect(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; }

function getSpikeBox(r, c, t) { 
    const bx = c * TILE_SIZE, by = r * TILE_SIZE, ts = TILE_SIZE;
    if (t === T.SPIKE_UP || t === T.SPIKE_TOGGLE) return { x: bx + 6, y: by + 24, w: 28, h: 16 }; 
    if (t === T.SPIKE_DOWN) return { x: bx + 6, y: by, w: 28, h: 16 }; 
    if (t === T.SPIKE_LEFT) return { x: bx + 24, y: by + 6, w: 16, h: 28 }; 
    if (t === T.SPIKE_RIGHT) return { x: bx, y: by + 6, w: 16, h: 28 }; 
    return { x: bx, y: by, w: ts, h: ts }; 
}

function updatePhysics() {
    globalFrame++; 
    if (player.invincibleTimer > 0) player.invincibleTimer--; 
    updateHUD();
    
    if (player.state === 'dead') {
        player.y += player.vy; 
        player.vy += 0.6 * player.gravityDir; 
        particles.forEach(pt => { pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.06; }); 
        particles = particles.filter(pt => pt.life > 0);
        return; 
    }
    
    if (player.chatTimer > 0) player.chatTimer--;
    if (player.warpCooldown > 0) player.warpCooldown--; 
    if (player.boostTimer > 0) { 
        player.boostTimer--; 
        if (player.boostTimer % 2 === 0) trails.push({ x: player.x, y: player.y, w: player.w, h: player.h, life: 1, color: '#00e5ff' }); 
    }
    
    player.scaleX += (1.0 - player.scaleX) * 0.25; 
    player.scaleY += (1.0 - player.scaleY) * 0.25;

    let p = player, pCount = 0, curLevers = new Set(), inter = [p, ...crosses, ...enemies.filter(e => e.type !== 8)];
    for (let r = 0; r < MAP_ROWS; r++) {
        if (!activeMapData[r]) continue;
        for (let c = 0; c < MAP_COLS; c++) {
            let t = activeMapData[r][c];
            if (!t || t === 0) continue;

            if (t === T.SWITCH) {
                if (inter.some(i => rectIntersect(i, { x: c * 40 + 2, y: r * 40 + 16, w: 36, h: 24 }))) pCount++;
            } else if (t === T.LEVER) {
                let k = `${r},${c}`; 
                if (inter.some(i => rectIntersect(i, { x: c * 40, y: r * 40, w: 40, h: 40 }))) {
                    curLevers.add(k); 
                    if (!p.lastLevers.has(k)) { leverStates[k] = !leverStates[k]; screenShake = 6; createParticles(c * 40 + 20, r * 40 + 20, '#f39c12', 20); }
                }
            } else if (t === T.CRUMBLE_BLOCK) {
                if (rectIntersect(p, { x: c * 40, y: r * 40 - 2, w: 40, h: 44 })) {
                    crumbleBlocks[`${r},${c}`] = (crumbleBlocks[`${r},${c}`] || 0) + 1;
                    if (crumbleBlocks[`${r},${c}`] > 30) { activeMapData[r][c] = 0; createParticles(c * 40 + 20, r * 40 + 20, '#d2b48c', 15); }
                }
            } else if (t === T.CONVEYOR_R || t === T.CONVEYOR_L) {
                let cv = { x: c * 40, y: r * 40 - 2, w: 40, h: 12 }; 
                if (rectIntersect(p, cv) && p.vy * p.gravityDir >= 0) p.vx += (t === T.CONVEYOR_R ? 2 : -2); 
                crosses.forEach(cr => { if (rectIntersect(cr, cv)) cr.vx += (t === T.CONVEYOR_R ? 1 : -1); });
            }
        }
    }
    p.lastLevers = curLevers; 
    let newSw = pCount + Object.values(leverStates).filter(v => v).length;
    if (activeSwitchCount !== newSw) {
        activeSwitchCount = newSw; 
        if (activeSwitchCount % 2 !== 0 && !isCircuitActive) { screenShake = 8; createParticles(p.x + 13, p.y + 13, '#00e5ff', 30); } 
        else if (activeSwitchCount % 2 === 0 && isCircuitActive) { screenShake = 3; createParticles(p.x + 13, p.y + 13, '#ff2a5f', 10); }
    }
    isCircuitActive = (activeSwitchCount % 2 !== 0); 

    lifts.forEach(lf => {
        let ox = lf.x, oy = lf.y; 
        lf.x += lf.vx; lf.y += lf.vy;

    });

    if (p.hook) {

    enemies.forEach(e => {

                projectiles.push({ x: e.x + 14, y: e.y + 14, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, w: 12, h: 12, active: true, color: '#ff4757' });
            }

            e.vx = 0; e.vy = 0; e.tmr++; e.aimAngle = Math.atan2((p.y + p.h / 2) - (e.y + e.h / 2), (p.x + p.w / 2) - (e.x + e.w / 2));

                projectiles.push({ x: e.x + 14, y: e.y + 14, vx: Math.cos(e.aimAngle) * 30, vy: Math.sin(e.aimAngle) * 30, w: 8, h: 8, active: true, color: '#ffd700', pierce: true, isGolgo: true });

            if ((dx > 0 && p.faceDir < 0) || (dx < 0 && p.faceDir > 0)) { e.vx += dx * 0.01; e.vy += dy * 0.01; } 
            else { e.vx *= 0.9; e.vy *= 0.9; }
            e.vx = Math.max(-2, Math.min(2, e.vx)); e.vy = Math.max(-2, Math.min(2, e.vy));
        }
        
        if (e.type !== 8) {
            e.x += e.vx; 
            let ec1 = Math.floor(e.x / 40), ec2 = Math.floor((e.x + e.w - 0.1) / 40), er1 = Math.floor(e.y / 40), er2 = Math.floor((e.y + e.h - 0.1) / 40);
            if (e.vx > 0 && ((activeMapData[er1] && isSolid(activeMapData[er1][ec2])) || (activeMapData[er2] && isSolid(activeMapData[er2][ec2])))) { e.x = ec2 * 40 - e.w; e.vx = (e.type === 3 || (e.type === 7 && e.state === 'shell') || e.type === 1) ? -e.vx : 0; }
            if (e.vx < 0 && ((activeMapData[er1] && isSolid(activeMapData[er1][ec1])) || (activeMapData[er2] && isSolid(activeMapData[er2][ec1])))) { e.x = ec1 * 40 + 40; e.vx = (e.type === 3 || (e.type === 7 && e.state === 'shell') || e.type === 1) ? -e.vx : 0; }
            
            e.y += e.vy; 
            ec1 = Math.floor(e.x / 40); ec2 = Math.floor((e.x + e.w - 0.1) / 40); er1 = Math.floor(e.y / 40); er2 = Math.floor((e.y + e.h - 0.1) / 40);

    }); 
    enemies = enemies.filter(e => !e.dead);

    beamEmitters.forEach(b => {

function checkColl(isX) {
    let p = player, l = Math.floor(Math.max(0, p.x) / 40), r = Math.floor(Math.min(MAP_COLS * 40 - 1, p.x + p.w - 0.1) / 40), t = Math.floor(Math.max(0, p.y) / 40), b = Math.floor(Math.min(MAP_ROWS * 40 - 1, p.y + p.h - 0.1) / 40);
    for (let row = t; row <= b; row++) {
        if (!activeMapData[row]) continue;
        for (let col = l; col <= r; col++) {
            if (row < 0 || row >= MAP_ROWS || col < 0 || col >= MAP_COLS) continue; 
            let tl = activeMapData[row][col]; 
            if (!tl || tl === 0) continue;
            
            if ([T.SPIKE_UP, T.SPIKE_DOWN, T.SPIKE_LEFT, T.SPIKE_RIGHT, T.SPIKE_TOGGLE].includes(tl)) {
                if (p.invincibleTimer > 0 || (tl === T.SPIKE_TOGGLE && globalFrame % 120 < 60)) continue; 
                if (rectIntersect(p, getSpikeBox(row, col, tl)) && p.boostTimer === 0) die(); 
                continue;
            }
            if (tl === T.COIN) { activeMapData[row][col] = 0; p.coins++; updateHUD(); createParticles(col * 40 + 20, row * 40 + 20, '#ffd700', 8); }
            if (tl === T.KEY) { activeMapData[row][col] = 0; p.hasKey = true; updateHUD(); createParticles(col * 40 + 20, row * 40 + 20, '#f39c12', 12); }
            if (tl === T.STAR) { activeMapData[row][col] = 0; p.invincibleTimer = 600; screenShake = 5; showToast("★ STAR POWER!"); }
            if (tl === T.SPIDER || tl === T.SPIDER_NEW) { activeMapData[row][col] = 0; p.hasSpider = (tl === T.SPIDER); p.hasNewSpider = (tl === T.SPIDER_NEW); screenShake = 5; showToast(tl === T.SPIDER ? "旧クモ糸!" : "新クモ糸!"); }
            if (tl === T.DOUBLE_JUMP) { activeMapData[row][col] = 0; p.doubleJump = true; showToast("2段ジャンプ!"); }
            if (tl === T.DASH_SHOES) { activeMapData[row][col] = 0; p.dashShoes = true; showToast("ダッシュ靴!"); }
            if (tl === T.GRAVITY_PANEL) { activeMapData[row][col] = 0; p.gravityDir *= -1; p.vy = 0; screenShake = 10; createParticles(col * 40 + 20, row * 40 + 20, '#ff00ff', 20); }
            if (tl === T.DOOR && p.hasKey) { activeMapData[row][col] = 0; screenShake = 3; createParticles(col * 40 + 20, row * 40 + 20, '#8e44ad', 20); continue; }
            if (tl === T.BOUNCER && !isX && p.vy * p.gravityDir > 0) { p.vy = -22 * p.gravityDir; p.y = (p.gravityDir > 0 ? row * 40 - p.h : row * 40 + 40); p.scaleX = 0.4; p.scaleY = 1.8; createParticles(p.x + 13, p.y + 13, '#00e5ff', 12); return; }
            if (tl === T.BOOST_R && rectIntersect(p, { x: col * 40, y: row * 40 + 20, w: 40, h: 20 })) { p.faceDir = 1; p.boostTimer = 25; p.vx = 18; p.vy = 0; p.scaleX = 1.6; p.scaleY = 0.7; screenShake = 8; }
            if (tl === T.BOOST_L && rectIntersect(p, { x: col * 40, y: row * 40 + 20, w: 40, h: 20 })) { p.faceDir = -1; p.boostTimer = 25; p.vx = -18; p.vy = 0; p.scaleX = 1.6; p.scaleY = 0.7; screenShake = 8; }
            if (tl === T.BOOST_U && rectIntersect(p, { x: col * 40, y: row * 40 + 20, w: 40, h: 20 })) { p.vy = -24 * p.gravityDir; screenShake = 10; p.scaleX = 0.3; p.scaleY = 2.0; }
            if (tl === T.ONEWAY_UP && !isX && p.vy > 0 && (p.y + p.h - p.vy) <= row * 40 + 8) { p.y = row * 40 - p.h; p.grounded = (p.gravityDir > 0); p.vy = 0; return; }
            if (tl === T.ONEWAY_DOWN && !isX && p.vy < 0 && (p.y - p.vy) >= row * 40 + 32) { p.y = row * 40 + 40; p.grounded = (p.gravityDir < 0); p.vy = 0; return; }
            if (tl === T.ONEWAY_LEFT && isX && p.vx > 0 && (p.x + p.w - p.vx) <= col * 40 + 8) { p.x = col * 40 - p.w; p.vx = 0; return; }
            if (tl === T.ONEWAY_RIGHT && isX && p.vx < 0 && (p.x - p.vx) >= col * 40 + 32) { p.x = col * 40 + 40; p.vx = 0; return; }
            if (tl === T.WARP && p.warpCooldown === 0) { let pr = warpPairs.find(w => (w.r1 === row && w.c1 === col) || (w.r2 === row && w.c2 === col)); if (pr && pr.r2 !== undefined) { let dr = (pr.r1 === row && pr.c1 === col) ? pr.r2 : pr.r1, dc = (pr.r1 === row && pr.c1 === col) ? pr.c2 : pr.c1; p.x = dc * 40 + 7; p.y = dr * 40 + 14; p.warpCooldown = 60; screenShake = 12; p.scaleX = 0.2; p.scaleY = 2.0; return; } }
            if (tl === T.GOAL) { win(); return; }
            if (tl === T.HIDDEN_BLOCK && !isX && p.vy < 0 && (p.y - p.vy) >= row * 40 + 32) { activeMapData[row][col] = T.BLOCK; p.vy = 2; p.y = row * 40 + 40; screenShake = 10; createParticles(col * 40 + 20, row * 40 + 20, '#f1c40f', 25); return; }
            
            if (isSolid(tl) && tl !== T.HIDDEN_BLOCK) {
                if (isX) { 
                    if (p.vx > 0) { p.x = col * 40 - p.w; p.touchingWall = 1; } else if (p.vx < 0) { p.x = col * 40 + 40; p.touchingWall = -1; } 
                    if (p.boostTimer > 0 && p.vy >= -15) { screenShake = 6; p.boostTimer = 0; } 
                    p.vx = 0; 
                } else { 
                    if (p.vy > 0) { p.y = row * 40 - p.h; p.grounded = true; } else if (p.vy < 0) { p.y = row * 40 + 40; if (tl === T.BRICK || tl === T.ICE_BLOCK) { activeMapData[row][col] = 0; createParticles(col * 40 + 20, row * 40 + 20, tl === T.BRICK ? '#e67e22' : '#a0e6ff', 15); } } 
                    p.vy = 0; 
                }
            }
        }
    }
}

function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); ctx.fill(); ctx.stroke(); }

    else if (t === T.CRUMBLE_BLOCK) { ctx.fillStyle = '#d2b48c'; ctx.setLineDash([4, 4]); roundRect(ctx, x, y, ts, ts, 4); ctx.setLineDash([]); let l = crumbleBlocks[`${r},${c}`]; if (l) ctx.fillRect(x, y + ts - l, ts, l); }

function drawChatBubble(ctx, x, y, text) {
    ctx.save();
    ctx.font = '900 12px sans-serif';
    const textWidth = ctx.measureText(text).width;
    const paddingX = 8;
    const paddingY = 6;
    const bw = textWidth + paddingX * 2;
    const bh = 14 + paddingY * 2;
    const bx = x - bw / 2;
    const by = y - bh - 10;
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, bw, bh, 6);
    
    ctx.beginPath(); ctx.moveTo(x - 5, by + bh); ctx.lineTo(x, by + bh + 6); ctx.lineTo(x + 5, by + bh); ctx.fill(); ctx.stroke();
    
    ctx.fillStyle = '#000';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, by + bh / 2);
    ctx.restore();
}

function drawPlayer(ctx, p, isSelf) {
    ctx.save(); 
    ctx.translate(p.x + 13, p.y + (p.gravityDir > 0 ? 26 : 0)); 
    ctx.scale(p.scaleX || 1, (p.scaleY || 1) * p.gravityDir);
    
    if (p.state === 'dead') {
        ctx.fillStyle = '#555'; roundRect(ctx, -13, -26, 26, 26, 6); 
        ctx.fillStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(0, -10); ctx.moveTo(0, -16); ctx.lineTo(-6, -10); ctx.stroke(); ctx.beginPath(); ctx.moveTo(6, -16); ctx.lineTo(12, -10); ctx.moveTo(12, -16); ctx.lineTo(6, -10); ctx.stroke();
    } else {
        if (p.invincibleTimer > 0) { ctx.shadowColor = ctx.fillStyle = `hsl(${(globalFrame * 10) % 360},100%,50%)`; ctx.shadowBlur = 15; } 
        else { ctx.fillStyle = isSelf ? '#00e5ff' : 'rgba(0, 229, 255, 0.5)'; }
        
        ctx.strokeStyle = isSelf ? '#000' : 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3; 
        roundRect(ctx, -13, -26, 26, 26, 6); ctx.shadowBlur = 0;
        
        if (p.boostTimer > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(p.faceDir > 0 ? 6 : -14, -20, 8, 2); } 
        else { 
            ctx.fillStyle = isSelf ? '#fff' : 'rgba(255,255,255,0.7)'; let ex = p.faceDir > 0 ? 8 : -6; 
            ctx.beginPath(); ctx.arc(ex - 5, -18, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
            ctx.beginPath(); ctx.arc(ex + 5, -18, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
            ctx.fillStyle = isSelf ? '#000' : 'rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.arc(ex - 5 + (p.faceDir > 0 ? 1 : -1), -18, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + 5 + (p.faceDir > 0 ? 1 : -1), -18, 2, 0, Math.PI * 2); ctx.fill(); 
        }
    }
    ctx.restore();

    if (!isSelf && p.name) {
        ctx.save();
        ctx.font = '900 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
        const nText = (p.is_king ? '👑 ' : '') + p.name;
        ctx.strokeText(nText, p.x + 13, p.y - 8); ctx.fillText(nText, p.x + 13, p.y - 8);
        ctx.restore();
    }
    
    if (p.hook) {
        ctx.strokeStyle = isSelf ? '#fff' : 'rgba(255,255,255,0.4)'; 
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x + 13, p.y + 13); ctx.lineTo(p.hook.x, p.hook.y); ctx.stroke();
    }
    
    if (p.chatTimer > 0 && p.chatMessage) {
        drawChatBubble(ctx, p.x + 13, p.y - (isSelf ? 0 : 15), p.chatMessage);
    }
}

function draw() {
    ctx.fillStyle = '#0f121a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const dpr = window.devicePixelRatio || 1, vW = window.innerWidth / zoomScale, vH = window.innerHeight / zoomScale;
    
    if (mode === 'play') { 
        camera.x += (player.x + player.w / 2 - vW / 2 - camera.x) * 0.15; 
        camera.y += (player.y + player.h / 2 - vH / 2 + (isMobile ? 80 / zoomScale : 0) - camera.y) * 0.15; 
    }
    // NaN回避
    if(isNaN(camera.x)) camera.x = 0; if(isNaN(camera.y)) camera.y = 0;
    
    camera.x = Math.max(0, Math.min(MAP_COLS * 40 - vW, camera.x)); 
    camera.y = Math.max(0, Math.min(MAP_ROWS * 40 - vH, camera.y));
    
    ctx.save(); ctx.scale(dpr * zoomScale, dpr * zoomScale);
    let sx = 0, sy = 0; 
    if (screenShake > 0) { 
        sx = (Math.random() - 0.5) * screenShake; sy = (Math.random() - 0.5) * screenShake; 
        if (player.boostTimer > 0 && player.vy === 0) { sx *= 2; sy = 0; } 
        screenShake *= 0.8; if (screenShake < 0.5) screenShake = 0; 
    }
    ctx.translate(-Math.round(camera.x - sx), -Math.round(camera.y - sy));
    
    if (mode === 'edit') {
        ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1; ctx.beginPath();
        let sC = Math.max(0, Math.floor(camera.x / 40)), eC = Math.min(MAP_COLS, Math.ceil((camera.x + vW) / 40)), sR = Math.max(0, Math.floor(camera.y / 40)), eR = Math.min(MAP_ROWS, Math.ceil((camera.y + vH) / 40));
        for (let c = sC; c <= eC; c++) { ctx.moveTo(c * 40, sR * 40); ctx.lineTo(c * 40, eR * 40); }
        for (let r = sR; r <= eR; r++) { ctx.moveTo(sC * 40, r * 40); ctx.lineTo(eC * 40, r * 40); }
        ctx.stroke();
    }
    
    let md = mode === 'play' ? activeMapData : mapData; 
    if (md && md.length > 0) {
        ctx.lineWidth = 3; ctx.lineJoin = 'round';
        for (let r = 0; r < MAP_ROWS; r++) {
            if (!md[r]) continue;
            for (let c = 0; c < MAP_COLS; c++) {
                if (md[r][c] !== 0) drawTileGraphics(ctx, md[r][c], r, c, c * 40, r * 40, 40, 20);
            }
        }
    }

    if (mode === 'play') {
        crosses.forEach(cr => drawTileGraphics(ctx, T.CROSS, 0, 0, cr.x, cr.y, 40, 20));
        lifts.forEach(lf => { ctx.fillStyle = '#3498db'; roundRect(ctx, lf.x, lf.y, lf.w, lf.h, 4); ctx.fillStyle = '#111'; ctx.fillRect(lf.x + 4, lf.y + 4, lf.w - 8, lf.h - 8); });
        trails.forEach(tr => { ctx.save(); ctx.globalAlpha = tr.life * 0.5; ctx.translate(tr.x + tr.w / 2, tr.y + tr.h); ctx.fillStyle = tr.color; roundRect(ctx, -tr.w / 2, -tr.h, tr.w, tr.h, 6); ctx.restore(); });
        
        enemies.forEach(e => {
            if (e.type === 6) { ctx.strokeStyle = (e.tmr > 130 && e.tmr % 4 < 2) ? '#fff' : 'rgba(255,71,87,0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.x + 14, e.y + 18); ctx.lineTo(player.x + player.w / 2, player.y + player.h / 2); ctx.stroke(); }
            ctx.fillStyle = e.type === 2 ? '#ff2a5f' : e.type === 3 ? '#e67e22' : e.type === 4 ? '#34495e' : e.type === 5 ? '#ff4757' : e.type === 6 ? '#111' : e.type === 7 ? '#27ae60' : e.type === 8 ? 'rgba(236,240,241,0.7)' : '#a855f7';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
            
            if (e.type === 7 && e.state === 'shell') { 
                ctx.beginPath(); ctx.arc(e.x + 14, e.y + 9, 14, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(e.x + 14, e.y + 9, 6, 0, Math.PI * 2); ctx.fill(); 
            } else if (e.type === 8) {
                ctx.beginPath(); ctx.moveTo(e.x, e.y + e.h); ctx.lineTo(e.x, e.y + 10); ctx.quadraticCurveTo(e.x, e.y, e.x + 14, e.y); ctx.quadraticCurveTo(e.x + e.w, e.y, e.x + e.w, e.y + 10); ctx.lineTo(e.x + e.w, e.y + e.h); ctx.lineTo(e.x + 20, e.y + e.h - 4); ctx.lineTo(e.x + 14, e.y + e.h); ctx.lineTo(e.x + 8, e.y + e.h - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(e.x + 10, e.y + 10, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(e.x + 18, e.y + 10, 2, 0, Math.PI * 2); ctx.fill();
            } else {
                roundRect(ctx, e.x, e.y, e.w, e.h, 6);
                if (e.type === 6) { ctx.fillStyle = '#f1c27d'; ctx.fillRect(e.x + 6, e.y + 4, 16, 8); ctx.fillStyle = '#000'; ctx.fillRect(e.x + 4, e.y + 6, 20, 4); } 
                else if (e.blink < 90) { 
                    ctx.fillStyle = '#fff'; let ex = e.vx > 0 ? e.x + 14 : e.x + 6; 
                    ctx.beginPath(); ctx.arc(ex, e.y + 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
                    ctx.beginPath(); ctx.arc(ex + 8, e.y + 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + (e.vx > 0 ? 1 : -1), e.y + 10, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + 8 + (e.vx > 0 ? 1 : -1), e.y + 10, 1.5, 0, Math.PI * 2); ctx.fill(); 
                }
            }
        });
        
        projectiles.forEach(pr => { 
            if (pr.isGolgo) { ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(pr.x + 4, pr.y + 4); ctx.lineTo(pr.x + 4 - pr.vx, pr.y + 4 - pr.vy); ctx.stroke(); } 
            else { ctx.fillStyle = pr.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pr.x + 6, pr.y + 6, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(pr.x + 6, pr.y + 6, 3, 0, Math.PI * 2); ctx.fill(); } 
        });
        
        if (isMultiplayer) {
            for (let id in otherPlayers) { drawPlayer(ctx, otherPlayers[id], false); }
        }
        drawPlayer(ctx, player, true);
    }
    
    particles.forEach(pt => { ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color; ctx.fillRect(pt.x, pt.y, 5, 5); ctx.globalAlpha = 1.0; });
    ctx.restore();
}

function loop() {
    let isAiming = (mode === 'play' && (player.hasSpider || player.hasNewSpider) && input.isDown && !player.hook), doUpdate = true;
    if (isAiming) { slowFrames++; if (slowFrames % 3 !== 0) doUpdate = false; }
    if (mode === 'play' && doUpdate) updatePhysics(); 
    draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   API・通信系
========================================================= */
const token = localStorage.getItem("access_token");
function openModal(id) { document.getElementById(id).style.display = 'flex'; } 
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function exportDataMRM1() { 
    const data = JSON.stringify({ map: mapData, warps: warpPairs }); 
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); 
    a.download = (currentStageInfo.title || 'stage') + '.mrm1'; 
    a.click(); 
}

function importDataMRM1(e) { 
    const f = e.target.files[0]; if (!f) return; 
    const r = new FileReader(); 
    r.onload = ev => { 
        try { 
            const d = JSON.parse(ev.target.result); 
            mapData = d.map || d; warpPairs = d.warps || []; 
            setMode('edit'); closeModal('modal-io'); showToast("ロード完了"); 
        } catch(err) { alert("不正なファイルです"); } 
    }; 
    r.readAsText(f); e.target.value = ''; 
}

function openSaveModal() {
    if (mode === 'play') setMode('edit');
    let hasStart = false, hasGoal = false;
    for (let r = 0; r < MAP_ROWS; r++) { 
        if (!mapData[r]) continue;
        for (let c = 0; c < MAP_COLS; c++) { 
            if (mapData[r][c] === T.START) hasStart = true; 
            if (mapData[r][c] === T.GOAL) hasGoal = true; 
        } 
    }
    if (!hasStart || !hasGoal) { alert("公開には「スタート(S)」と「ゴール(旗)」が必要です。"); return; }
    openModal('modal-save');
}

async function saveStage() {
    const title = document.getElementById('save-title').value.trim(); 
    const desc = document.getElementById('save-desc').value.trim();
    if (!title) { alert("ステージ名を入力してください。"); return; }
    try {
        const payload = JSON.stringify({ map: mapData, warps: warpPairs });
        const res = await fetch("/api/maker/stages", { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, 
            body: JSON.stringify({ title: title, description: desc, map_data: payload }) 
        });
        const d = await res.json();
        if (res.ok) { 
            alert(d.message || "公開しました！"); 
            currentStageInfo = { id: d.stage_id || d.id, title: title, author: '自分', isMine: true, isDaily: false }; 
            updateCourseHUDInfo(); closeModal('modal-save'); 
        } else { alert("エラー: " + (d.detail || "保存失敗")); }
    } catch (e) { alert("通信エラーが発生しました。"); }
}

async function openLoadModal() {
    if (mode === 'play') setMode('edit'); 
    openModal('modal-load'); 
    const box = document.getElementById('stage-list-container'); 
    box.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">検索中...</div>';
    try {
        const res = await fetch("/api/maker/stages", { headers: { 'Authorization': `Bearer ${token}` } }); 
        const d = await res.json();
        if (d.stages && d.stages.length > 0) {
            box.innerHTML = d.stages.map(s => {
                const badges = [];
                if (s.is_pinned) badges.push(`<span style="color:var(--accent-gold); font-size:0.75rem;">👑勅命</span>`);
                if (s.is_confiscated) badges.push(`<span style="color:var(--danger-color); font-size:0.75rem;">🚨接収済</span>`);
                let acts = ''; 
                if (s.is_mine || d.is_king) acts += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem; border-color:var(--danger-color);" onclick="deleteStage(${s.id}, event)">破棄</button>`;
                if (d.is_king) { 
                    acts += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem;" onclick="pinStage(${s.id}, event)">勅命</button>`; 
                    if (!s.is_confiscated) acts += `<button class="btn-retro" style="padding:4px 8px; font-size:0.7rem;" onclick="confiscateStage(${s.id}, event)">接収</button>`; 
                }
                const userIcon = s.is_mine ? '<span style="color:var(--accent-gold)">👑</span>' : '👤';
                return `<div class="stage-card" onclick="loadStage(${s.id})">
                    <div style="flex:1;">
                        <div class="st-title">${badges.join(' ')} ${userIcon} ${escapeHtml(s.title)}</div>
                        <div class="st-author">作: ${escapeHtml(s.creator_name)} | ${escapeHtml(s.description||'')}</div>
                        <div class="st-stats">プレイ: ${s.plays_count} / クリア: ${s.clears_count}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
                        <button class="btn-retro btn-cyan" style="padding:8px 12px;">PLAY</button>
                        <div style="display:flex; gap:6px; margin-top:4px;">${acts}</div>
                    </div>
                </div>`;
            }).join('');
        } else { box.innerHTML = '<div style="text-align:center;color:#888;margin-top:20px;">ステージがありません。</div>'; }
    } catch (e) { box.innerHTML = '<div style="text-align:center;color:#ff2a5f;margin-top:20px;">エラーが発生しました。</div>'; }
}

async function loadStage(id) { 
    try {
        const res = await fetch(`/api/maker/stages/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const d = await res.json();
        if (res.ok) {
            let p = JSON.parse(d.stage.map_data);
            if (Array.isArray(p)) { mapData = p; warpPairs = []; } else { mapData = p.map; warpPairs = p.warps || []; }
            currentStageInfo = { id: id, title: d.stage.title, author: d.stage.creator_name, isMine: d.stage.is_mine, isDaily: false };
            updateCourseHUDInfo(); closeModal('modal-load'); setMode('play');
        } else { alert("失敗: " + d.detail); }
    } catch (e) { alert("通信エラー"); } 
}

async function deleteStage(id, e) { e.stopPropagation(); if (!confirm("破壊しますか？")) return; try { await fetch(`/api/maker/stages/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } }); openLoadModal(); } catch (err) {} }
async function pinStage(id, e) { e.stopPropagation(); try { await fetch(`/api/admin/maker/stages/${id}/pin`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); openLoadModal(); } catch (err) {} }
async function confiscateStage(id, e) { e.stopPropagation(); if (!confirm("接収しますか？")) return; try { await fetch(`/api/admin/maker/stages/${id}/confiscate`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } }); openLoadModal(); } catch (err) {} }

window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const stageId = params.get('stage_id');
    if (stageId) {
        loadStage(stageId);
    } else {
        const saved = localStorage.getItem('maker_autosave_map');
        if (saved) {
            try {
                const d = JSON.parse(saved);
                const loadedMap = d.map || d;
                if (loadedMap && loadedMap.length > 0 && loadedMap[0] && loadedMap[0].length > 0) {
                    mapData = loadedMap; warpPairs = d.warps || [];
                } else { initMap(); }
            } catch(e) { initMap(); }
        } else { initMap(); }
    }
});

setInterval(() => {
    if (mode === 'edit') {
        localStorage.setItem('maker_autosave_map', JSON.stringify({ map: mapData, warps: warpPairs }));
    }
}, 3000);
</script>
