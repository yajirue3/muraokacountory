<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 王国中央銀行</title>
    <!-- QRコード読み取り用ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
        .container { width: 360px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #2a2a2a; border: 2px solid #555; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { font-size: 1.1rem; font-weight: bold; color: #d4af37; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; font-size: 0.85rem; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #27ae60; color: #fff; font-size: 0.85rem; }
        button:hover { background: #2ecc71; }
        .btn-back { background: #444; color: #ccc; margin-top: 8px; }
        .btn-back:hover { background: #555; }
        .wallet-item { background: #202020; border: 1px solid #444; border-radius: 8px; padding: 12px; margin-bottom: 8px; position: relative; }
        .wallet-title { color: #d4af37; font-weight: bold; font-size: 0.9rem; margin-right: 60px; }
        .wallet-id { color: #888; font-size: 0.75rem; font-family: monospace; }
        .wallet-balance { font-size: 1.1rem; font-weight: bold; color: #2ecc71; margin-top: 4px; }
        .label { color: #888; font-size: 0.75rem; }
        
        /* 履歴表示用のスタイル */
        .log-item { background: #202020; border-left: 4px solid #555; border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; font-size: 0.8rem; }
        .log-item.send { border-left-color: #e74c3c; }
        .log-item.receive { border-left-color: #2ecc71; }
        .log-type { font-weight: bold; font-size: 0.75rem; margin-bottom: 2px; }
        .log-type.send { color: #e74c3c; }
        .log-type.receive { color: #2ecc71; }
        .log-details { color: #aaa; font-family: monospace; font-size: 0.75rem; }
        .log-time { color: #666; font-size: 0.65rem; margin-top: 2px; }

        /* QR用ボタン・モーダル */
        .btn-qr-show { position: absolute; right: 12px; top: 12px; width: auto; padding: 6px 10px; background: #8e44ad; font-size: 0.7rem; border-radius: 4px; }
        .btn-qr-show:hover { background: #9b59b6; }
        .btn-qr-scan { width: auto; margin: 0; padding: 0 14px; background: #3498db; border-radius: 6px; font-size: 0.8rem; }
        .btn-qr-scan:hover { background: #2980b9; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: #222; border: 2px solid #555; border-radius: 12px; width: 90%; max-width: 360px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.8); text-align: center; }

        /* ギフト用スタイル */
        .btn-gift-action { background: #d4af37; color: #1a1a1a; }
        .btn-gift-action:hover { background: #f39c12; }
        .btn-cancel { background: #e74c3c; color: #fff; width: auto; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }
        .btn-cancel:hover { background: #c0392b; }
        .btn-copy { background: #3498db; color: #fff; width: auto; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }
        .btn-copy:hover { background: #2980b9; }
        .gift-item { background: #202020; border: 1px solid #444; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 0.8rem; text-align: left; }
        .status-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .badge-active { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .badge-claimed { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid #3498db; }
        .badge-cancelled { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .badge-expired { background: rgba(149, 165, 166, 0.2); color: #95a5a6; border: 1px solid #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <!-- 口座一覧 -->
    <div class="card">
        <div class="header">🏦 所持ウォレット一覧</div>
        <div id="wallets-list">読み込み中...</div>
    </div>

    <!-- 新規口座作成 -->
    <div class="card">
        <div class="header">➕ 新規ウォレット開設</div>
        <div class="label">口座名</div>
        <input type="text" id="new-wallet-name" placeholder="例: 隠し預金口座">
        <button onclick="createWallet()">口座を開設する</button>
    </div>

    <!-- ウォレット送金 -->
    <div class="card">
        <div class="header">💸 ウォレット間送金</div>
        <div class="label">出金元ウォレット</div>
        <select id="sender-wallet"></select>

        <div class="label">送金先ウォレットID</div>
        <div style="display: flex; gap: 8px; margin-top: 4px; margin-bottom: 10px;">
            <input type="text" id="receiver-wallet-id" placeholder="例: MW-X82K9L" style="margin: 0; flex: 1;">
            <button class="btn-qr-scan" onclick="startQRScanner()">📷 読取</button>
        </div>

        <div class="label">送金金額 (Gold)</div>
        <input type="number" id="transfer-amount" min="1" placeholder="例: 50">

        <button onclick="sendGold()">送金を実行する</button>
    </div>

    <!-- ギフトリンク作成 -->
    <div class="card">
        <div class="header">🎁 ギフトリンク作成（ポチ袋）</div>
        <div class="label">出金元ウォレット</div>
        <select id="gift-sender-wallet"></select>

        <div class="label">ギフト金額 (Gold)</div>
        <input type="number" id="gift-amount" min="1" placeholder="例: 100">

        <div class="label">有効期限</div>
        <select id="gift-expires-hours">
            <option value="1">1時間</option>
            <option value="6">6時間</option>
            <option value="24" selected>24時間（1日）</option>
            <option value="72">3日間</option>
            <option value="168">7日間（1週間）</option>
            <option value="720">30日間</option>
        </select>

        <button class="btn-gift-action" onclick="createGiftLink()">🎁 ギフトリンクを発行する</button>

        <div class="label" style="margin-top: 15px; margin-bottom: 6px;">📋 あなたが発行したギフトリンク</div>
        <div id="my-gifts-list" style="font-size: 0.8rem; color: #888;">読み込み中...</div>
    </div>

    <!-- 送金履歴（通帳） -->
    <div class="card">
        <div class="header">📖 送金履歴 (通帳)</div>
        <div id="logs-list">履歴を読み込み中...</div>
    </div>

    <button class="btn-back" onclick="location.href='/dashboard'">◀ 国民証に戻る</button>
</div>

<!-- ================= ギフト受取モーダル ================= -->
<div id="gift-claim-modal" class="modal-overlay">
    <div class="modal-content" style="border-color: #d4af37;">
        <h3 style="color: #d4af37; margin-top: 0;">🎁 ギフトが届いています！</h3>
        <div id="gift-claim-info" style="font-size: 0.85rem; color: #ccc; margin-bottom: 15px; text-align: left; background: #151515; padding: 10px; border-radius: 6px;"></div>
        
        <div id="gift-claim-action-area">
            <div class="label" style="text-align: left;">受取先ウォレット</div>
            <select id="gift-claim-target-wallet"></select>
            <button class="btn-gift-action" onclick="submitClaimGift()" style="margin-top: 6px;">💰 ギフトを受け取る</button>
        </div>
        
        <button onclick="closeGiftClaimModal()" style="background: #444; margin-top: 10px;">閉じる</button>
    </div>
</div>

<!-- ================= 受取用QR表示モーダル ================= -->
<div id="qr-show-modal" class="modal-overlay" onclick="closeQRShow(event)">
    <div class="modal-content" style="border-color: #8e44ad;" onclick="event.stopPropagation()">
        <h3 style="color: #9b59b6; margin-top: 0;">📱 受取用QRコード</h3>
        <p style="font-size: 0.8rem; color: #ccc; margin-bottom: 15px;">相手にこの画面をスキャンしてもらってください</p>
        <div style="background: #fff; padding: 10px; display: inline-block; border-radius: 8px; margin-bottom: 15px;">
            <img id="my-qr-img" src="" alt="QR Code" width="200" height="200">
        </div>
        <div id="my-qr-id-text" style="font-family: monospace; font-size: 1.1rem; color: #d4af37; font-weight: bold; margin-bottom: 15px; user-select: all;">-</div>
        <button onclick="closeQRShow()" style="background: #444;">閉じる</button>
    </div>
</div>

<!-- ================= QRスキャンモーダル ================= -->
<div id="qr-scan-modal" class="modal-overlay">
    <div class="modal-content" style="border-color: #3498db;">
        <h3 style="color: #3498db; margin-top: 0;">📷 スキャン</h3>
        <p style="font-size: 0.8rem; color: #ccc; margin-bottom: 10px;">相手の受取QRコードを枠に収めてください</p>
        
        <div id="qr-reader" style="width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; background: #000;"></div>
        
        <button onclick="stopQRScanner()" style="background: #e74c3c;">キャンセル</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    let currentGiftCode = null;

    if (!token) {
        window.location.href = "/";
    } else {
        loadWallets().then(() => {
            checkUrlGiftParam();
        });
        loadTransferLogs();
        loadMyGifts();
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            
            if (wallets.length === 0) {
                document.getElementById("wallets-list").innerText = "口座が存在しません";
                return;
            }

            document.getElementById("wallets-list").innerHTML = wallets.map(w => `
                <div class="wallet-item">
                    <div class="wallet-title">${escapeHtml(w.wallet_name)}</div>
                    <div class="wallet-id">ID: ${w.wallet_id}</div>
                    <div class="wallet-balance">${w.balance} Gold</div>
                    <button class="btn-qr-show" onclick="showMyQR('${w.wallet_id}')">受取QR</button>
                </div>
            `).join('');

            const walletOptions = wallets.map(w => `
                <option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (${w.wallet_id}) - 残高:${w.balance}G</option>
            `).join('');

            document.getElementById("sender-wallet").innerHTML = walletOptions;
            document.getElementById("gift-sender-wallet").innerHTML = walletOptions;
            document.getElementById("gift-claim-target-wallet").innerHTML = walletOptions;

        } catch (e) {
            console.error(e);
        }
    }

    async function loadTransferLogs() {
        try {
            const res = await fetch("/api/transfer-logs", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const data = await res.json();
            const logs = data.logs || [];
            const myWallets = data.my_wallets || [];

            if (logs.length === 0) {
                document.getElementById("logs-list").innerText = "送金履歴はありません";
                return;
            }

            document.getElementById("logs-list").innerHTML = logs.map(log => {
                const isSend = myWallets.includes(log.sender_wallet_id);
                const typeClass = isSend ? "send" : "receive";
                const typeText = isSend ? "【出金】" : "【入金】";
                const dateStr = new Date(log.created_at).toLocaleString('ja-JP');

                return `
                    <div class="log-item ${typeClass}">
                        <div class="log-type ${typeClass}">${typeText} ${log.amount} Gold</div>
                        <div class="log-details">${log.sender_wallet_id} ➔ ${log.receiver_wallet_id}</div>
                        <div class="log-time">${dateStr}</div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function createWallet() {
        const wallet_name = document.getElementById("new-wallet-name").value;
        if (!wallet_name) return alert("口座名を入力してください");

        try {
            const res = await fetch("/api/wallets", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_name })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                document.getElementById("new-wallet-name").value = "";
                loadWallets();
            } else {
                alert("エラー: " + data.detail);
            }
        } catch (e) {
            console.error(e);
        }
    }

    async function sendGold() {
        const sender_wallet_id = document.getElementById("sender-wallet").value;
        const receiver_wallet_id = document.getElementById("receiver-wallet-id").value.trim();
        const amount = parseInt(document.getElementById("transfer-amount").value, 10);

        if (!sender_wallet_id || !receiver_wallet_id || !amount || amount <= 0) {
            return alert("送金先ウォレットIDと正の金額を入力してください");
        }

        try {
            const res = await fetch("/api/transfer", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ sender_wallet_id, receiver_wallet_id, amount })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                document.getElementById("receiver-wallet-id").value = "";
                document.getElementById("transfer-amount").value = "";
                loadWallets();
                loadTransferLogs();
            } else {
                alert(data.detail);
            }
        } catch (e) {
            console.error(e);
        }
    }

    /* ================= ギフトリンク機能 ================= */
    async function createGiftLink() {
        const sender_wallet_id = document.getElementById("gift-sender-wallet").value;
        const amount = parseInt(document.getElementById("gift-amount").value, 10);
        const expires_in_hours = parseInt(document.getElementById("gift-expires-hours").value, 10);

        if (!sender_wallet_id || !amount || amount <= 0) {
            return alert("出金元ウォレットと正の金額を入力してください");
        }

        try {
            const res = await fetch("/api/wallets/gifts", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ sender_wallet_id, amount, expires_in_hours })
            });
            const data = await res.json();
            if (res.ok) {
                const giftUrl = `${window.location.origin}/wallet?gift=${data.gift_code}`;
                navigator.clipboard.writeText(giftUrl).catch(() => {});
                alert(`${data.message}\n\nリンクをクリップボードにコピーしました:\n${giftUrl}`);
                document.getElementById("gift-amount").value = "";
                loadWallets();
                loadMyGifts();
            } else {
                alert("発行失敗: " + (data.detail || "エラーが発生しました"));
            }
        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function loadMyGifts() {
        try {
            const res = await fetch("/api/wallets/my-gifts", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const data = await res.json();
            const gifts = data.gifts || [];

            if (gifts.length === 0) {
                document.getElementById("my-gifts-list").innerText = "発行したギフトリンクはありません";
                return;
            }

            document.getElementById("my-gifts-list").innerHTML = gifts.map(g => {
                let badgeClass = 'badge-active';
                let badgeText = '有効';
                let canCancel = false;

                if (g.status === 'CLAIMED') {
                    badgeClass = 'badge-claimed';
                    badgeText = '受取済';
                } else if (g.status === 'CANCELLED') {
                    badgeClass = 'badge-cancelled';
                    badgeText = '取消済';
                } else if (g.status === 'EXPIRED') {
                    badgeClass = 'badge-expired';
                    badgeText = '期限切れ';
                    canCancel = true; // 期限切れ時の払い戻し回収
                } else if (g.status === 'ACTIVE') {
                    canCancel = true;
                }

                const expiresStr = new Date(g.expires_at).toLocaleString('ja-JP');
                const giftUrl = `${window.location.origin}/wallet?gift=${g.id}`;

                return `
                    <div class="gift-item">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <span style="font-weight: bold; color: #d4af37;">${g.amount} Gold</span>
                            <span class="status-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div style="font-size: 0.7rem; color: #888; font-family: monospace;">コード: ${g.id}</div>
                        <div style="font-size: 0.7rem; color: #aaa;">期限: ${expiresStr}</div>
                        <div style="margin-top: 6px; display: flex; gap: 6px;">
                            ${g.status === 'ACTIVE' ? `<button class="btn-copy" onclick="copyGiftUrl('${giftUrl}')">🔗 リンクコピー</button>` : ''}
                            ${canCancel ? `<button class="btn-cancel" onclick="cancelGift('${g.id}')">🚫 無効化・返金</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            console.error(e);
        }
    }

    function copyGiftUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("ギフトリンクをコピーしました！");
        }).catch(() => {
            prompt("以下のURLをコピーしてください:", url);
        });
    }

    async function cancelGift(giftCode) {
        if (!confirm("このギフトリンクを無効化し、出金元口座へ全額払い戻しますか？")) return;

        try {
            const res = await fetch(`/api/wallets/gifts/${giftCode}/cancel`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                loadWallets();
                loadMyGifts();
            } else {
                alert("キャンセル失敗: " + (data.detail || "エラーが発生しました"));
            }
        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    async function checkUrlGiftParam() {
        const urlParams = new URLSearchParams(window.location.search);
        const giftCode = urlParams.get("gift");
        if (!giftCode) return;

        currentGiftCode = giftCode;

        try {
            const res = await fetch(`/api/wallets/gifts/${giftCode}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            if (!res.ok) {
                alert("ギフトリンクエラー: " + (data.detail || "見つかりません"));
                cleanGiftUrl();
                return;
            }

            const infoEl = document.getElementById("gift-claim-info");
            const actionArea = document.getElementById("gift-claim-action-area");
            const expiresStr = new Date(data.expires_at).toLocaleString('ja-JP');

            let html = `
                <div><b>発行者:</b> ${escapeHtml(data.creator_nickname)}</div>
                <div><b>金額:</b> <span style="color: #2ecc71; font-weight: bold; font-size: 1.1rem;">${data.amount} Gold</span></div>
                <div><b>有効期限:</b> ${expiresStr}</div>
                <div><b>状態:</b> ${escapeHtml(data.status)}</div>
            `;

            if (data.is_creator) {
                html += `<div style="color: #e74c3c; margin-top: 6px;">※あなたが作成したギフトです。自分で受け取ることはできません。</div>`;
                actionArea.style.display = "none";
            } else if (data.status !== "ACTIVE") {
                html += `<div style="color: #e74c3c; margin-top: 6px;">※このギフトリンクは受け取ることができません（${escapeHtml(data.status)}）。</div>`;
                actionArea.style.display = "none";
            } else {
                actionArea.style.display = "block";
            }

            infoEl.innerHTML = html;
            document.getElementById("gift-claim-modal").style.display = "flex";

        } catch (e) {
            console.error(e);
        }
    }

    async function submitClaimGift() {
        if (!currentGiftCode) return;
        const targetWalletId = document.getElementById("gift-claim-target-wallet").value;
        if (!targetWalletId) return alert("受取先ウォレットを選択してください");

        try {
            const res = await fetch(`/api/wallets/gifts/${currentGiftCode}/claim`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ receiver_wallet_id: targetWalletId })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                closeGiftClaimModal();
                loadWallets();
                loadTransferLogs();
            } else {
                alert("受取失敗: " + (data.detail || "エラーが発生しました"));
            }
        } catch (e) {
            console.error(e);
            alert("通信エラーが発生しました");
        }
    }

    function closeGiftClaimModal() {
        document.getElementById("gift-claim-modal").style.display = "none";
        cleanGiftUrl();
    }

    function cleanGiftUrl() {
        const url = new URL(window.location.href);
        url.searchParams.delete("gift");
        window.history.replaceState({}, document.title, url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : ''));
    }

    function escapeHtml(str) { return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    /* ================= QRコード表示機能 ================= */
    function showMyQR(walletId) {
        document.getElementById("my-qr-id-text").innerText = walletId;
        // 外部API(QuickChart)を利用してQR画像を生成（Python側の変更不要）
        document.getElementById("my-qr-img").src = `https://quickchart.io/qr?text=${encodeURIComponent(walletId)}&size=200&margin=1`;
        document.getElementById("qr-show-modal").style.display = "flex";
    }

    function closeQRShow(e) {
        if (e && e.target !== document.getElementById("qr-show-modal")) return;
        document.getElementById("qr-show-modal").style.display = "none";
    }

    /* ================= QRコード読取機能 ================= */
    let html5QrCode;

    function startQRScanner() {
        document.getElementById("qr-scan-modal").style.display = "flex";
        
        // すでにインスタンスがあればクリア
        if (html5QrCode) {
            html5QrCode.clear();
        }

        html5QrCode = new Html5Qrcode("qr-reader");
        html5QrCode.start(
            { facingMode: "environment" }, // スマホの背面カメラを優先
            {
                fps: 10,
                qrbox: { width: 200, height: 200 }
            },
            (decodedText, decodedResult) => {
                // スキャン成功時
                document.getElementById("receiver-wallet-id").value = decodedText;
                stopQRScanner();
                // 金額入力欄へ自動でフォーカス
                setTimeout(() => document.getElementById("transfer-amount").focus(), 100);
            },
            (errorMessage) => {
                // 読取中のノイズエラーは無視する仕様
            }
        ).catch((err) => {
            alert("カメラの起動に失敗しました。権限が許可されているか確認してください。\n" + err);
            stopQRScanner();
        });
    }

    function stopQRScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                document.getElementById("qr-scan-modal").style.display = "none";
            }).catch((err) => {
                document.getElementById("qr-scan-modal").style.display = "none";
            });
        } else {
            document.getElementById("qr-scan-modal").style.display = "none";
        }
    }
</script>

</body>
</html>
