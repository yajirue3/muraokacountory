<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国営ダービー - 王国カジノ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">
    <!-- ヘッダー -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-yellow-500">🏇 国営ダービー</h1>
            <div class="flex items-center space-x-4">
                <select id="walletSelect" onchange="loadWallets()" class="bg-slate-700 text-sm p-2 rounded border border-slate-600 focus:outline-none">
                    <option value="">口座読み込み中...</option>
                </select>
                <div class="bg-slate-900 px-3 py-1 rounded border border-slate-700 text-sm">
                    残高: <span id="userBalance" class="text-yellow-400 font-bold">---</span> G
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">
        <!-- レース状態ステータス -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <div id="raceStatus" class="text-sm font-semibold text-slate-400">ステータス確認中...</div>
            <div id="countdown" class="text-4xl font-extrabold text-yellow-400 my-2">00:00</div>
            <div id="raceId" class="text-xs text-slate-500">RACE ID: --</div>
        </div>

        <!-- コース（出走アニメーション） -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 relative overflow-hidden">
            <div class="absolute right-12 top-0 bottom-0 w-1 bg-red-500/50 border-r-2 border-dashed border-red-500 z-10 flex items-center justify-center">
                <span class="text-[10px] text-red-400 -rotate-90 font-bold tracking-widest uppercase">FINISH</span>
            </div>
            
            <div id="track">
                <!-- 1〜6枠馬のコース -->
                <script>
                    const horses = [
                        { id: 1, name: "ムラオカテイオー", color: "bg-red-600" },
                        { id: 2, name: "ブラックドレイ", color: "bg-slate-700" },
                        { id: 3, name: "シャッキンヌス", color: "bg-red-800" },
                        { id: 4, name: "コッコウサクシュ", color: "bg-blue-600" },
                        { id: 5, name: "ハイエナゴールド", color: "bg-yellow-500" },
                        { id: 6, name: "チキンキラー", color: "bg-green-600" },
                    ];
                    horses.forEach(h => {
                        document.write(`
                            <div class="flex items-center space-x-2 py-1.5 border-b border-slate-700/50 last:border-0">
                                <span class="w-6 text-center text-xs font-bold text-slate-400">${h.id}</span>
                                <div class="flex-1 bg-slate-900/80 rounded-full h-8 relative overflow-hidden flex items-center px-1">
                                    <div id="r-${h.id}" class="absolute left-1 transition-all duration-300 ease-linear flex items-center space-x-1" style="transform: translateX(0px);">
                                        <div class="w-6 h-6 rounded-full ${h.color} flex items-center justify-center text-xs font-bold shadow-md">🏇</div>
                                        <span class="text-xs text-slate-300 whitespace-nowrap font-medium">${h.name}</span>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                </script>
            </div>
        </div>

        <!-- 投票フォーム & オッズ表 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 投票入力 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
                <h3 class="font-bold text-lg text-slate-200 border-b border-slate-700 pb-2">🎟️ 馬券購入</h3>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">券種</label>
                    <select id="betType" onchange="toggleBetInputs()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                        <option value="WIN">単勝（1着当て）</option>
                        <option value="QUINELLA">馬連（1・2着ペア・順不同）</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label id="horse1Label" class="block text-xs text-slate-400 mb-1">1着予想馬</label>
                        <select id="horse1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                            <option value="1">1. ムラオカテイオー</option>
                            <option value="2">2. ブラックドレイ</option>
                            <option value="3">3. シャッキンヌス</option>
                            <option value="4">4. コッコウサクシュ</option>
                            <option value="5">5. ハイエナゴールド</option>
                            <option value="6">6. チキンキラー</option>
                        </select>
                    </div>
                    <div id="horse2Container" class="hidden">
                        <label class="block text-xs text-slate-400 mb-1">2着予想馬</label>
                        <select id="horse2" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                            <option value="2">2. ブラックドレイ</option>
                            <option value="1">1. ムラオカテイオー</option>
                            <option value="3">3. シャッキンヌス</option>
                            <option value="4">4. コッコウサクシュ</option>
                            <option value="5">5. ハイエナゴールド</option>
                            <option value="6">6. チキンキラー</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">賭け金（1〜50,000G）</label>
                    <input type="number" id="betAmount" value="1000" min="1" max="50000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm font-bold text-yellow-400">
                </div>

                <button id="btnBet" onclick="placeBet()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2.5 rounded shadow transition duration-200">
                    馬券を購入する
                </button>
            </div>

            <!-- 単勝オッズ表 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h3 class="font-bold text-lg text-slate-200 border-b border-slate-700 pb-2">📊 単勝オッズ</h3>
                <div class="space-y-2" id="oddsList">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentRace = null;
        let isSettling = false;
        let lastSettledId = null;

        function getToken() { return localStorage.getItem("access_token"); }

        async function loadWallets() {
            const token = getToken();
            if(!token) return;
            try {
                const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
                const data = await res.json();
                const select = document.getElementById("walletSelect");
                select.innerHTML = "";
                data.forEach(w => {
                    select.innerHTML += `<option value="${w.wallet_id}">${w.wallet_name} (${w.balance}G)</option>`;
                });
                if(data.length > 0) {
                    document.getElementById("userBalance").innerText = data[0].balance.toLocaleString();
                }
            } catch(e) { console.error(e); }
        }

        function toggleBetInputs() {
            const type = document.getElementById("betType").value;
            const h2 = document.getElementById("horse2Container");
            const h1Label = document.getElementById("horse1Label");
            if (type === "QUINELLA") {
                h2.classList.remove("hidden");
                h1Label.innerText = "選択馬 1";
            } else {
                h2.classList.add("hidden");
                h1Label.innerText = "1着予想馬";
            }
        }

        async function refreshRace() {
            const token = getToken();
            try {
                const res = await fetch("/api/derby/current", { headers: { "Authorization": `Bearer ${token}` } });
                currentRace = await res.json();
                
                document.getElementById("raceId").innerText = `RACE ID: #${currentRace.race_id}`;
                updateOddsDisplay(currentRace.win_odds, currentRace.horses);
            } catch(e) { console.error(e); }
        }

        function updateOddsDisplay(odds, horses) {
            const container = document.getElementById("oddsList");
            container.innerHTML = "";
            for(let h = 1; h <= 6; h++) {
                const o = odds ? odds[h] : 6.0;
                const info = horses[h];
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700/50">
                        <span class="text-sm font-semibold" style="color:${info.color}">${h}. ${info.name}</span>
                        <span class="text-sm font-bold text-yellow-400">${o.toFixed(1)}倍</span>
                    </div>
                `;
            }
        }

        async function placeBet() {
            const token = getToken();
            const walletId = document.getElementById("walletSelect").value;
            const betType = document.getElementById("betType").value;
            const horse1 = parseInt(document.getElementById("horse1").value);
            const horse2 = betType === "QUINELLA" ? parseInt(document.getElementById("horse2").value) : null;
            const amount = parseInt(document.getElementById("betAmount").value);

            if(betType === "QUINELLA" && horse1 === horse2) {
                alert("馬連の場合は異なる2頭を選択してください。");
                return;
            }

            try {
                const res = await fetch("/api/derby/bet", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({
                        race_id: currentRace.race_id,
                        wallet_id: walletId,
                        bet_type: betType,
                        horse1: horse1,
                        horse2: horse2,
                        amount: amount
                    })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.detail || "エラーが発生しました");
                
                alert("馬券を購入しました！");
                await loadWallets();
            } catch(e) { alert(e.message); }
        }

        // メイン描画ループ（アニメーション & カウントダウン & 自動リフレッシュ）
        function renderLoop() {
            if (currentRace) {
                const now = new Date();
                const start = new Date(currentRace.start_time);
                const diffSec = (start - now) / 1000;

                const countdownElem = document.getElementById("countdown");
                const statusElem = document.getElementById("raceStatus");
                const btnBet = document.getElementById("btnBet");

                if (diffSec > 0) {
                    // 投票受付中
                    const m = String(Math.floor(diffSec / 60)).padStart(2, '0');
                    const s = String(Math.floor(diffSec % 60)).padStart(2, '0');
                    countdownElem.innerText = `${m}:${s}`;
                    statusElem.innerText = "投票受付中";
                    statusElem.className = "text-sm font-semibold text-green-400";
                    btnBet.disabled = false;
                    btnBet.className = "w-full bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2.5 rounded shadow transition duration-200";
                } else if (diffSec > -20) {
                    // 発走中（アニメーション再生）
                    countdownElem.innerText = "RACING";
                    statusElem.innerText = "出走中！";
                    statusElem.className = "text-sm font-semibold text-red-500 animate-pulse";
                    btnBet.disabled = true;
                    btnBet.className = "w-full bg-slate-700 text-slate-500 font-bold py-2.5 rounded cursor-not-allowed";

                    if (currentRace.trajectory) {
                        const elapsed = Math.abs(diffSec);
                        const stepIndex = Math.min(20, Math.floor((elapsed / 20) * 20));
                        const trackWidth = document.getElementById("track").clientWidth - 120;

                        for (let h = 1; h <= 6; h++) {
                            const posPercent = currentRace.trajectory[h][stepIndex] || 0;
                            const px = (posPercent / 100) * trackWidth;
                            const elem = document.getElementById(`r-${h}`);
                            if(elem) elem.style.transform = `translateX(${px}px)`;
                        }
                    }
                } else {
                    // 精算完了・結果確定
                    countdownElem.innerText = "FINISH";
                    statusElem.innerText = "精算中・次回レース準備中";
                    statusElem.className = "text-sm font-semibold text-slate-400";

                    // レース終了後の自動更新ロジック
                    if (!isSettling && lastSettledId !== currentRace.race_id) {
                        isSettling = true;
                        lastSettledId = currentRace.race_id;

                        fetch(`/api/derby/settle/${currentRace.race_id}`, { method: "POST" })
                            .finally(() => {
                                setTimeout(async () => {
                                    await loadWallets();
                                    await refreshRace();
                                    isSettling = false;
                                    // 馬をスタートラインへリセット
                                    for (let h = 1; h <= 6; h++) {
                                        const elem = document.getElementById(`r-${h}`);
                                        if (elem) elem.style.transform = `translateX(0px)`;
                                    }
                                }, 5000); // 5秒後に次レース切り替え
                            });
                    }
                }
            }
            requestAnimationFrame(renderLoop);
        }

        // 初期化
        window.onload = async () => {
            await loadWallets();
            await refreshRace();
            setInterval(refreshRace, 10000); // 10秒ごとにサーバー同期
            requestAnimationFrame(renderLoop);
        };
    </script>
</body>
</html>
