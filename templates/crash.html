<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 狂乱クラッシュ (CRASH)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-purple: #b000ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #2a0033 0%, #000000 90%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 100% 100%, 15px 15px, 15px 15px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            margin: 0; 
            min-height: 100vh;
            padding: 10px 5px;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(10, 2, 18, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 16px; 
            padding: 12px; 
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6); 
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .header { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan); 
            padding-bottom: 4px; 
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 2px;
            margin: 0;
        }

        /* 🎰 ステータスエリア */
        .status-display { 
            background: #000; 
            border: 2px solid var(--neon-cyan); 
            border-radius: 12px; 
            padding: 8px; 
            text-align: center; 
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.4);
            position: relative;
            will-change: transform;
        }

        .status-text { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            min-height: 20px; 
            text-shadow: 0 0 8px currentColor;
            margin-bottom: 6px;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.9);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .stat-label { font-size: 0.7rem; color: #aaa; font-weight: bold; }
        .stat-val { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: var(--neon-green); 
            text-shadow: 0 0 8px var(--neon-green); 
            font-family: 'Black Ops One', monospace;
            display: inline-block;
            will-change: transform;
        }

        /* 🚀 クラッシュキャンバス & グラフエリア */
        .canvas-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #050508;
            border-radius: 12px;
            border: 2px solid var(--neon-pink);
            box-shadow: inset 0 0 20px rgba(255, 0, 127, 0.3);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .multiplier-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.2rem;
            font-weight: 900;
            color: #fff;
            font-family: 'Black Ops One', monospace;
            text-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
            pointer-events: none;
            z-index: 5;
            letter-spacing: 1px;
        }

        .multiplier-overlay.crashed {
            color: var(--neon-red);
            text-shadow: 0 0 30px var(--neon-red), 0 0 60px var(--neon-red);
            animation: overlay-bust 0.3s ease-in-out;
        }

        @keyframes overlay-bust {
            0% { transform: translate(-50%, -50%) scale(1.5); }
            50% { transform: translate(-50%, -50%) scale(0.9); }
            100% { transform: translate(-50%, -50%) scale(1.0); }
        }

        /* 📜 履歴バッジバー */
        .history-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 2px;
            scrollbar-width: none;
        }
        .history-bar::-webkit-scrollbar { display: none; }

        .history-tag {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 900;
            font-family: 'Black Ops One', monospace;
            white-space: nowrap;
        }
        .history-tag.low { color: #888; border-color: #555; }
        .history-tag.mid { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        .history-tag.high { color: var(--neon-green); border-color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }
        .history-tag.moon { color: var(--neon-yellow); border-color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); }

        /* 🎛️ 入力フォーム */
        .inputs-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .inputs-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .label { 
            font-size: 0.75rem; 
            color: var(--neon-cyan); 
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-cyan);
            margin-bottom: 4px;
        }

        input, select { 
            width: 100%; 
            padding: 8px 10px; 
            border-radius: 8px; 
            border: 2px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            font-size: 0.9rem; 
            font-weight: bold;
            font-family: inherit; 
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* 🚀 アクションボタン */
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 1.1rem; 
            box-shadow: 0 0 10px var(--neon-yellow);
            user-select: none;
            transition: transform 0.05s ease;
        }

        button:active:not(:disabled) { transform: scale(0.95); filter: brightness(1.3); }

        .btn-bet { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            box-shadow: 0 0 20px var(--neon-pink);
            text-shadow: 0 0 5px #fff;
            border: 2px solid #fff;
            animation: pulse-btn 1.0s infinite;
        }
        @keyframes pulse-btn {
            0% { box-shadow: 0 0 15px var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), 0 0 15px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-pink); }
        }

        .btn-bet:disabled { 
            background: #222; box-shadow: none; cursor: not-allowed; border: none; color: #555; animation: none; 
        }

        /* ⚙️ フッター */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .btn-back { 
            background: #111; color: #888; border: 1px solid #333; font-size: 0.7rem; padding: 6px; box-shadow: none; width: auto; 
        }
        .checkbox-label { 
            display: flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: bold; color: #aaa; cursor: pointer; 
        }
        .checkbox-label input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--neon-pink); }

        /* 💥💥💥 激化限界突破フラッシュ・超振動演出 💥💥💥 */
        body.hyper-flash-active { animation: hyper-body-flash 0.25s linear; }
        @keyframes hyper-body-flash {
            0% { background-color: #fff; filter: invert(1) hue-rotate(180deg); }
            50% { background-color: var(--neon-pink); }
            100% { background-color: #000; filter: none; }
        }

        .win-rainbow-shake { animation: hyper-rainbow-glow 0.15s linear infinite, hyper-shake-anim 0.08s ease-in-out infinite alternate; }
        .win-rainbow-noshake { animation: hyper-rainbow-glow 0.15s linear infinite; }
        .win-text-rainbow { animation: rainbow-text 0.1s linear infinite; }
        .num-pop { animation: hyper-pop-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5); }
        
        @keyframes hyper-pop-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(2.0); text-shadow: 0 0 40px #ffffff, 0 0 80px var(--neon-pink), 0 0 100px var(--neon-yellow); }
            100% { transform: scale(1); }
        }

        .lose-shake { animation: hyper-lose-shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) 2; border-color: var(--neon-red) !important; }

        @keyframes hyper-rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 40px #ffff00, inset 0 0 30px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 40px #00ff00, inset 0 0 30px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 40px #00ffff, inset 0 0 30px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 40px #ff00ff, inset 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
        }
        @keyframes rainbow-text {
            0% { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            25% { color: #ffe600; text-shadow: 0 0 20px #ffe600; }
            50% { color: #00ff66; text-shadow: 0 0 20px #00ff66; }
            75% { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
            100% { color: #ff00a0; text-shadow: 0 0 20px #ff00a0; }
        }
        @keyframes hyper-shake-anim {
            0% { transform: scale(1.04) translate(2px, 2px) rotate(0deg); }
            25% { transform: scale(1.04) translate(-2px, -2px) rotate(-1.5deg); }
            50% { transform: scale(1.04) translate(-2px, 2px) rotate(1.5deg); }
            75% { transform: scale(1.04) translate(2px, -2px) rotate(-1.5deg); }
            100% { transform: scale(1.04) translate(2px, 2px) rotate(1.5deg); }
        }
        @keyframes hyper-lose-shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-12px, -6px); }
            30% { transform: translate(12px, 6px); }
            50% { transform: translate(-12px, 6px); }
            70% { transform: translate(12px, -6px); }
            90% { transform: translate(-6px, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="main-card">
        <div class="header">🚀 狂乱クラッシュ (CRASH) 🚀</div>

        <!-- 📜 直近履歴バー -->
        <div class="history-bar" id="history-bar"></div>

        <!-- 🎰 ステータスエリア -->
        <div class="status-display" id="status-display-box">
            <div id="game-status" class="status-text" style="color: #00f3ff;">⚡ ベット受付中！目標倍率を決めて発射せよ！ ⚡</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">🎯 あなたの目標</div>
                    <div id="stat-target" class="stat-val">1.92x</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">💰 獲得見込みGold</div>
                    <div id="stat-payout" class="stat-val">0 G</div>
                </div>
            </div>
        </div>

        <!-- 🚀 クラッシュキャンバスエリア -->
        <div class="canvas-container">
            <canvas id="crash-canvas"></canvas>
            <div id="multiplier-text" class="multiplier-overlay">15.0s</div>
        </div>

        <!-- 🎛️ 入力エリア -->
        <div class="inputs-grid">
            <div class="input-group">
                <div class="label">💳 支払口座</div>
                <select id="wallet-select"></select>
            </div>
            <div class="inputs-row-2">
                <div>
                    <div class="label">💎 賭け金 (Gold)</div>
                    <input type="number" id="bet-amount" value="100" min="1" max="50000" step="10">
                </div>
                <div>
                    <div class="label">🎯 目標利確倍率 (x)</div>
                    <input type="number" id="target-multiplier" value="1.92" min="1.92" max="100.00" step="0.05">
                </div>
            </div>
        </div>

        <!-- 🚀 アクションボタン -->
        <button id="btn-bet" class="btn-bet">🚀 エントリー (BET)</button>

        <!-- ⚙️ フッター -->
        <div class="footer-row">
            <button class="btn-back" onclick="location.href='/casino'">◀ カジノ一覧</button>
            <label class="checkbox-label">
                <input type="checkbox" id="bgm-toggle">
                <span>🎵 音声/SE ON</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 演出オフ</span>
            </label>
        </div>
        <audio id="bgm-player" src="/templates/dopa.mp3" loop preload="auto"></audio>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('access_token') || localStorage.getItem('token');
        if (!token) window.location.href = "/";

        const canvas = document.getElementById('crash-canvas');
        const ctx = canvas.getContext('2d');
        const multText = document.getElementById('multiplier-text');
        const statusText = document.getElementById('game-status');
        const statusBox = document.getElementById('status-display-box');
        const statTarget = document.getElementById('stat-target');
        const statPayout = document.getElementById('stat-payout');
        const historyBar = document.getElementById('history-bar');

        const inputWallet = document.getElementById('wallet-select');
        const inputBet = document.getElementById('bet-amount');
        const inputTarget = document.getElementById('target-multiplier');
        const btnBet = document.getElementById('btn-bet');

        const bgmPlayer = document.getElementById('bgm-player');
        const bgmToggle = document.getElementById('bgm-toggle');
        const disableShake = document.getElementById('disable-shake');

        let currentRound = null;
        let myBet = null;
        let serverTimeOffset = 0;
        let animationId = null;
        let hasTriggeredCashoutSound = false;

        // --- Web Audio API (SE) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        function playSound(type) {
            if (!bgmToggle.checked) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'CASHOUT') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.setValueAtTime(600, now + 0.08);
                osc.frequency.setValueAtTime(800, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'CRASH') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(15, now + 0.4);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function loadWallets() {
            try {
                const res = await fetch("/api/wallets", { headers: getHeaders() });
                if (!res.ok) return;
                const wallets = await res.json();
                const currentSelected = inputWallet.value;

                inputWallet.innerHTML = wallets.map(w => 
                    `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} - 残高:${w.balance}G</option>`
                ).join('');

                if (currentSelected && wallets.some(w => w.wallet_id === currentSelected)) {
                    inputWallet.value = currentSelected;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function resetEffects() {
            statusBox.className = "status-display";
            statPayout.className = "stat-val";
            statusText.className = "status-text";
        }

        function triggerWinEffects() {
            resetEffects();
            statusText.classList.add("win-text-rainbow");
            if (disableShake.checked) {
                statusBox.classList.add("win-rainbow-noshake");
            } else {
                statusBox.classList.add("win-rainbow-shake");
                statPayout.classList.add("num-pop");
                document.body.classList.add("hyper-flash-active");
                setTimeout(() => document.body.classList.remove("hyper-flash-active"), 250);
            }
        }

        function triggerLoseEffects() {
            resetEffects();
            if (!disableShake.checked) {
                statusBox.classList.add("lose-shake");
            }
        }

        function updateEstimations() {
            const bet = parseFloat(inputBet.value) || 0;
            const target = parseFloat(inputTarget.value) || 1.92;
            statTarget.innerText = `${target.toFixed(2)}x`;
            statPayout.innerText = `${Math.floor(bet * target)} G`;
        }
        inputBet.addEventListener('input', updateEstimations);
        inputTarget.addEventListener('input', updateEstimations);

        function renderHistory(history) {
            historyBar.innerHTML = (history || []).map(val => {
                let badgeClass = 'low';
                if (val >= 10.0) badgeClass = 'moon';
                else if (val >= 2.0) badgeClass = 'high';
                else if (val >= 1.5) badgeClass = 'mid';
                return `<div class="history-tag ${badgeClass}">${val.toFixed(2)}x</div>`;
            }).join('');
        }

        async function fetchCurrentState() {
            try {
                const res = await fetch("/api/crash/current", { headers: getHeaders() });
                if (!res.ok) return;
                const data = await res.json();

                const serverDate = new Date(data.server_time).getTime();
                const localDate = Date.now();
                serverTimeOffset = serverDate - localDate;

                currentRound = data;
                myBet = data.my_bet;
                renderHistory(data.history);

                updateUIByStatus();
            } catch (e) {
                console.error(e);
            }
        }

        function getSyncedServerTime() {
            return Date.now() + serverTimeOffset;
        }

        function updateUIByStatus() {
            if (!currentRound) return;

            const status = currentRound.status;
            if (status === 'BETTING') {
                hasTriggeredCashoutSound = false;
                multText.classList.remove('crashed');

                if (myBet) {
                    btnBet.disabled = true;
                    btnBet.innerText = "🚀 エントリー完了 (発射待機中)";
                    statusText.innerText = `🎯 エントリー中！目標: ${myBet.target_multiplier}x (${Math.floor(myBet.amount * myBet.target_multiplier)}G)`;
                    statusText.style.color = "var(--neon-green)";
                    inputWallet.disabled = true;
                    inputBet.disabled = true;
                    inputTarget.disabled = true;
                } else {
                    btnBet.disabled = false;
                    btnBet.innerText = `🚀 エントリー (BET)`;
                    statusText.innerText = "⚡ ベット受付中！目標倍率を決めて発射せよ！";
                    statusText.style.color = "var(--neon-cyan)";
                    inputWallet.disabled = false;
                    inputBet.disabled = false;
                    inputTarget.disabled = false;
                }

            } else if (status === 'FLYING') {
                btnBet.disabled = true;
                inputWallet.disabled = true;
                inputBet.disabled = true;
                inputTarget.disabled = true;
                btnBet.innerText = "⚡ 飛行中 (エントリー不可) ⚡";

            } else if (status === 'CRASHED') {
                btnBet.disabled = true;
                inputWallet.disabled = true;
                inputBet.disabled = true;
                inputTarget.disabled = true;
                btnBet.innerText = "💥 CRASHED 💥";
            }
        }

        // --- キャンバス描画 ＆ リアルタイム飛行ループ (60fps) ---
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackgroundGrid();

            if (!currentRound) {
                animationId = requestAnimationFrame(renderLoop);
                return;
            }

            const now = getSyncedServerTime();
            const betCloseTime = new Date(currentRound.bet_close_at).getTime();

            // 1. ベット受付中 (毎フレーム滑らかに0.1秒単位でカウントダウン)
            if (currentRound.status === 'BETTING') {
                multText.classList.remove('crashed');
                const remainSec = Math.max(0, (betCloseTime - now) / 1000);
                multText.innerText = `${remainSec.toFixed(1)}s`;
                multText.style.color = 'var(--neon-yellow)';

            // 2. 飛行中
            } else if (currentRound.status === 'FLYING') {
                const elapsedSec = Math.max(0, (now - betCloseTime) / 1000);

                // 指数関数上昇: 1.00x 〜 最大100.00xで完全カンスト
                let currentMultiplier = Math.max(1.00, Math.exp(0.2 * elapsedSec));
                if (currentMultiplier > 100.00) currentMultiplier = 100.00;

                multText.classList.remove('crashed');
                multText.innerText = `${currentMultiplier.toFixed(2)}x`;
                multText.style.color = '#fff';

                drawFlightTrajectory(elapsedSec);

                // 利確演出
                if (myBet && currentMultiplier >= myBet.target_multiplier && !hasTriggeredCashoutSound) {
                    hasTriggeredCashoutSound = true;
                    playSound('CASHOUT');
                    triggerWinEffects();
                    statusText.innerText = `🎉 目標到達！利確成功！！ (+${Math.floor(myBet.amount * myBet.target_multiplier)} Gold)`;
                    loadWallets();
                }

            // 3. 爆発後
            } else if (currentRound.status === 'CRASHED') {
                const crashVal = currentRound.crash_point ? currentRound.crash_point.toFixed(2) : '1.00';
                multText.innerText = `${crashVal}x`;
                multText.classList.add('crashed');

                if (myBet) {
                    if (myBet.target_multiplier <= currentRound.crash_point) {
                        statusText.innerText = `👑 勝利確定！ +${myBet.payout} Gold を獲得しました！`;
                        statusText.style.color = "var(--neon-green)";
                    } else {
                        statusText.innerText = `💀 クラッシュ！目標に届かずロスト... (-${myBet.amount} G)`;
                        statusText.style.color = "var(--neon-red)";
                        triggerLoseEffects();
                    }
                } else {
                    statusText.innerText = `💥 ${crashVal}x で大爆発！次のラウンドへ...`;
                    statusText.style.color = "var(--neon-yellow)";
                }
            }

            animationId = requestAnimationFrame(renderLoop);
        }

        function drawBackgroundGrid() {
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.lineWidth = 1;
            const step = 30;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function drawFlightTrajectory(t) {
            const w = canvas.width;
            const h = canvas.height;
            const startX = 20;
            const startY = h - 20;

            const progress = Math.min(1.0, t / 12.0);
            const currentX = startX + (w - 60) * Math.min(progress * 1.2, 1.0);
            const currentY = startY - (h - 60) * Math.pow(progress, 1.6);

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.quadraticCurveTo(startX + (currentX - startX) * 0.6, startY, currentX, currentY);
            ctx.stroke();

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff007f';
            ctx.fillStyle = '#ff007f';
            ctx.font = '24px "Black Ops One", sans-serif';
            ctx.fillText('🚀', currentX - 12, currentY + 8);
            ctx.shadowBlur = 0;
        }

        async function handleBet() {
            if (!currentRound || currentRound.status !== 'BETTING') return;

            const walletId = inputWallet.value;
            const amount = parseInt(inputBet.value, 10);
            const targetMultiplier = parseFloat(inputTarget.value);

            if (!walletId) return alert('口座を選択してください');
            if (!amount || amount < 1 || amount > 50000) return alert('賭け金は1〜50,000Goldの範囲で入力してください');
            if (!targetMultiplier || targetMultiplier < 1.92 || targetMultiplier > 100.0) return alert('目標倍率は1.92〜100.00xの間で入力してください');

            btnBet.disabled = true;

            try {
                const res = await fetch("/api/crash/bet", {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        round_id: currentRound.round_id,
                        wallet_id: walletId,
                        amount: amount,
                        target_multiplier: targetMultiplier
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    btnBet.disabled = false;
                    return alert(data.detail || 'ベットに失敗しました');
                }

                await loadWallets();
                await fetchCurrentState();
            } catch (e) {
                console.error(e);
                btnBet.disabled = false;
                alert('通信エラーが発生しました');
            }
        }

        btnBet.addEventListener('click', handleBet);

        bgmToggle.addEventListener("change", (e) => {
            if (e.target.checked) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                bgmPlayer.play().catch(() => {});
            } else {
                bgmPlayer.pause();
            }
        });
        document.addEventListener("click", () => {
            if (bgmToggle.checked && bgmPlayer.paused) bgmPlayer.play().catch(() => {});
        }, { once: true });

        loadWallets();
        updateEstimations();
        fetchCurrentState();
        setInterval(fetchCurrentState, 500); // ポーリングを0.5秒間隔に高速化して同期ズレを解消
        renderLoop();
    });

    function escapeHtml(str) { 
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
    }
</script>
</body>
