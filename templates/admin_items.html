<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - アイテムマスター管理</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; justify-content: center; padding: 20px 0; margin: 0; }
        .container { width: 380px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: #2a2a2a; border: 2px solid #555; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header { font-size: 1.1rem; font-weight: bold; color: #d4af37; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 12px; }
        .label { font-size: 0.8rem; color: #aaa; margin-top: 6px; }
        input, select, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; margin-top: 4px; margin-bottom: 10px; font-size: 0.85rem; font-family: sans-serif; }
        textarea { resize: vertical; height: 60px; }
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #d4af37; color: #1a1a1a; font-size: 0.85rem; margin-top: 4px; }
        button:hover { background: #f1c40f; }
        .btn-back { background: #444; color: #ccc; margin-top: 8px; }
        .btn-back:hover { background: #555; }
        .btn-edit { background: #2980b9; color: #fff; }
        .btn-edit:hover { background: #3498db; }
        .btn-delete { background: #c0392b; color: #fff; }
        .btn-delete:hover { background: #e74c3c; }
        .btn-info { background: #8e44ad; color: #fff; }
        .btn-info:hover { background: #9b59b6; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #2ecc71; }

        .item-card { background: #202020; border: 1px solid #444; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .i-title { color: #f39c12; font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; }
        .i-desc { color: #ccc; font-size: 0.8rem; white-space: pre-wrap; margin-bottom: 8px; background: #181818; padding: 8px; border-radius: 4px; }
        .i-info { font-size: 0.75rem; color: #888; margin-bottom: 4px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.75); justify-content: center; align-items: center; }
        .modal-content { background: #2a2a2a; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; border: 2px solid #555; position: relative; box-sizing: border-box; }
        .close-btn { position: absolute; right: 15px; top: 10px; color: #aaa; font-size: 24px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .table-container { max-height: 250px; overflow-y: auto; margin-top: 10px; background: #1a1a1a; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th, td { border: 1px solid #444; padding: 6px; text-align: left; }
        th { background: #333; color: #d4af37; position: sticky; top: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">👑 アイテムマスター管理</div>
        <p style="font-size: 0.75rem; color: #aaa; margin-top: 0; line-height: 1.4;">
            王国に存在するマスターアイテムの管理、所持状況確認、および直接付与を行います。
        </p>
    </div>

    <!-- アイテム作成/編集フォーム -->
    <div class="card">
        <div class="header" id="form-header">📦 新規アイテム登録</div>

        <div class="label">アイテムID（半角英数字・一意）</div>
        <input type="text" id="item-id" placeholder="例: diamond">

        <div class="label">アイテム名</div>
        <input type="text" id="item-name" placeholder="例: ダイヤモンド">

        <div class="label">説明文</div>
        <textarea id="item-desc" placeholder="例: 貴重な鉱石。"></textarea>

        <div class="label">標準売却価格 (Gold)</div>
        <input type="number" id="item-price" min="0" placeholder="例: 1000">

        <button id="btn-submit" onclick="saveItem()">アイテムを保存する</button>
        <button id="btn-cancel-edit" class="btn-back" style="display: none;" onclick="resetForm()">編集をキャンセル</button>
    </div>

    <!-- アイテム一覧 -->
    <div class="card">
        <div class="header">📜 登録済みアイテム一覧</div>
        <div id="items-container">読み込み中...</div>
    </div>

    <button class="btn-back" onclick="location.href='/dashboard'">◀ 国民証に戻る</button>
</div>

<!-- 所持者一覧モーダル -->
<div id="modal-possessors" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-possessors')">&times;</span>
        <div class="header">👥 所持者一覧</div>
        <div id="possessors-item-name" style="color: #f39c12; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem;"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>口座名</th>
                        <th>ユーザーID</th>
                        <th>個数</th>
                    </tr>
                </thead>
                <tbody id="possessors-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 直接付与モーダル -->
<div id="modal-grant" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-grant')">&times;</span>
        <div class="header">🎁 アイテム直接付与</div>
        <div id="grant-item-name" style="color: #f39c12; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem;"></div>
        <input type="hidden" id="grant-item-id">

        <div class="label">付与先ユーザーUUID <span style="color:red">*</span></div>
        <input type="text" id="grant-user-id" placeholder="例: 67c002af-6065-423f-934e-f8e998d74735">

        <div class="label">付与先口座ID (任意 / 空欄なら最古口座)</div>
        <input type="text" id="grant-account-id" placeholder="例: 76b1bbe2-1da0-422b-826f-1ad39d7f5837">

        <div class="label">付与個数 <span style="color:red">*</span></div>
        <input type="number" id="grant-quantity" min="1" value="100">

        <button class="btn-success" style="margin-top: 10px;" onclick="executeGrant()">直接付与を実行する</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) {
        window.location.href = "/";
    }

    let itemsCache = [];

    window.onload = function() {
        loadItems();
    };

    async function loadItems() {
        try {
            const res = await fetch("/api/admin/items", {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (!res.ok) {
                if (res.status === 403) alert("国王権限が必要です");
                return;
            }

            itemsCache = await res.json();
            const container = document.getElementById("items-container");

            if (!itemsCache || itemsCache.length === 0) {
                container.innerText = "登録されているアイテムはありません";
                return;
            }

            container.innerHTML = itemsCache.map(item => `
                <div class="item-card">
                    <div class="i-title">${escapeHtml(item.name)} <span style="font-size: 0.75rem; color: #aaa;">(ID: ${escapeHtml(item.item_id)})</span></div>
                    <div class="i-info">標準価格: <b>${item.base_price} Gold</b></div>
                    <div class="i-desc">${escapeHtml(item.description || '説明なし')}</div>
                    
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <button class="btn-info" style="flex: 1; margin: 0; padding: 6px;" onclick="openPossessorsModal('${escapeHtml(item.item_id)}', '${escapeHtml(item.name)}')">👥 所持者</button>
                        <button class="btn-success" style="flex: 1; margin: 0; padding: 6px;" onclick="openGrantModal('${escapeHtml(item.item_id)}', '${escapeHtml(item.name)}')">🎁 付与</button>
                    </div>

                    <div style="display: flex; gap: 8px; margin-top: 6px;">
                        <button class="btn-edit" style="flex: 1; margin: 0; padding: 6px;" onclick="startEdit('${escapeHtml(item.item_id)}')">✏️ 編集</button>
                        <button class="btn-delete" style="flex: 1; margin: 0; padding: 6px;" onclick="deleteItem('${escapeHtml(item.item_id)}')">🗑 削除</button>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            console.error(e);
        }
    }

    async function saveItem() {
        const itemId = document.getElementById("item-id").value.trim();
        const name = document.getElementById("item-name").value.trim();
        const description = document.getElementById("item-desc").value.trim();
        const base_price = parseInt(document.getElementById("item-price").value, 10);

        if (!itemId || !name || isNaN(base_price) || base_price < 0) {
            return alert("すべての項目を正しく入力してください");
        }

        try {
            const res = await fetch("/api/admin/items", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ item_id: itemId, name, description, base_price })
            });

            const data = await res.json();
            if (res.ok) {
                alert(data.message || "保存しました");
                resetForm();
                loadItems();
            } else {
                alert("エラー: " + data.detail);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function startEdit(itemId) {
        const item = itemsCache.find(i => i.item_id === itemId);
        if (!item) return;

        document.getElementById("item-id").value = item.item_id;
        document.getElementById("item-id").readOnly = true;
        document.getElementById("item-name").value = item.name;
        document.getElementById("item-desc").value = item.description || "";
        document.getElementById("item-price").value = item.base_price;

        document.getElementById("form-header").innerText = "✏️ アイテム編集";
        document.getElementById("btn-submit").innerText = "更新を保存する";
        document.getElementById("btn-cancel-edit").style.display = "block";
    }

    function resetForm() {
        document.getElementById("item-id").value = "";
        document.getElementById("item-id").readOnly = false;
        document.getElementById("item-name").value = "";
        document.getElementById("item-desc").value = "";
        document.getElementById("item-price").value = "";

        document.getElementById("form-header").innerText = "📦 新規アイテム登録";
        document.getElementById("btn-submit").innerText = "アイテムを保存する";
        document.getElementById("btn-cancel-edit").style.display = "none";
    }

    async function deleteItem(itemId) {
        if (!confirm(`アイテム(${itemId})をマスターから削除しますか？`)) return;

        try {
            const res = await fetch(`/api/admin/items/${itemId}`, {
                method: "DELETE",
                headers: { "Authorization": `Bearer ${token}` }
            });

            const data = await res.json();
            if (res.ok) {
                alert(data.message || "削除しました");
                loadItems();
            } else {
                alert("エラー: " + data.detail);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = "none";
    }

    // 1. 所持者一覧を取得
    async function openPossessorsModal(itemId, itemName) {
        document.getElementById("possessors-item-name").innerText = `${itemName} (${itemId})`;
        const tbody = document.getElementById("possessors-tbody");
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">読み込み中...</td></tr>`;
        document.getElementById("modal-possessors").style.display = "flex";

        try {
            const res = await fetch(`/api/admin/items/${itemId}/possessors`, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (!res.ok) {
                const data = await res.json();
                tbody.innerHTML = `<tr><td colspan="3" style="color:#e74c3c; text-align:center;">エラー: ${escapeHtml(data.detail)}</td></tr>`;
                return;
            }

            const data = await res.json();
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#aaa;">所持者はいません</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr>
                    <td>${escapeHtml(p.account_name)}</td>
                    <td style="font-size:0.65rem; word-break:break-all; font-family:monospace;">${escapeHtml(p.user_id)}</td>
                    <td style="text-align:right; font-weight:bold; color:#f1c40f;">${p.quantity}</td>
                </tr>
            `).join('');
        } catch (err) {
            console.error(err);
            tbody.innerHTML = `<tr><td colspan="3" style="color:#e74c3c; text-align:center;">通信エラーが発生しました</td></tr>`;
        }
    }

    // 2. 付与モーダルを開く
    function openGrantModal(itemId, itemName) {
        document.getElementById("grant-item-name").innerText = `${itemName} (${itemId})`;
        document.getElementById("grant-item-id").value = itemId;
        document.getElementById("grant-user-id").value = "";
        document.getElementById("grant-account-id").value = "";
        document.getElementById("grant-quantity").value = 100;
        document.getElementById("modal-grant").style.display = "flex";
    }

    // 3. 直接付与を実行
    async function executeGrant() {
        const itemId = document.getElementById("grant-item-id").value;
        const userId = document.getElementById("grant-user-id").value.trim();
        const accountId = document.getElementById("grant-account-id").value.trim();
        const quantity = parseInt(document.getElementById("grant-quantity").value, 10);

        if (!userId || isNaN(quantity) || quantity <= 0) {
            return alert("対象のユーザーUUIDと、1以上の個数を入力してください");
        }

        try {
            const res = await fetch("/api/admin/grant-item", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    user_id: userId,
                    item_id: itemId,
                    quantity: quantity,
                    account_id: accountId || null
                })
            });

            const data = await res.json();
            if (res.ok) {
                alert(data.message || "付与しました");
                closeModal("modal-grant");
            } else {
                alert("エラー: " + data.detail);
            }
        } catch (err) {
            console.error(err);
            alert("通信エラーが発生しました");
        }
    }

    function escapeHtml(str) { return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }
</script>

</body>
</html>
