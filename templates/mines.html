{% raw %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 狂乱マインズ (MINES)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=M+PLUS+1p:wght@800;900&display=swap');

        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-red: #ff003c;
            --neon-purple: #b000ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'M PLUS 1p', 'Black Ops One', sans-serif; 
            background: #000;
            background-image: 
                radial-gradient(circle at 50% 50%, #2a0033 0%, #000000 90%),
                linear-gradient(0deg, rgba(255, 0, 127, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.15) 1px, transparent 1px);
            background-size: 100% 100%, 15px 15px, 15px 15px;
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            margin: 0; 
            min-height: 100vh;
            padding: 10px 5px;
            user-select: none;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px;
            margin: 0 auto;
        }

        .card { 
            background: rgba(10, 2, 18, 0.95); 
            border: 2px solid var(--neon-pink); 
            border-radius: 16px; 
            padding: 12px; 
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6); 
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .header { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            text-align: center; 
            border-bottom: 2px solid var(--neon-cyan); 
            padding-bottom: 4px; 
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 2px;
            margin: 0;
        }

        /* 🎰 ステータスエリア */
        .status-display { 
            background: #000; 
            border: 2px solid var(--neon-cyan); 
            border-radius: 12px; 
            padding: 8px; 
            text-align: center; 
            box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.4);
            position: relative;
            will-change: transform;
        }

        .status-text { 
            font-size: 0.85rem; 
            font-weight: 900; 
            color: var(--neon-yellow); 
            min-height: 20px; 
            text-shadow: 0 0 8px currentColor;
            margin-bottom: 6px;
        }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
        }

        .stat-box { 
            text-align: center; 
            background: rgba(20, 20, 35, 0.9);
            padding: 6px;
            border-radius: 8px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .stat-label { font-size: 0.7rem; color: #aaa; font-weight: bold; }
        .stat-val { 
            font-size: 1.2rem; 
            font-weight: 900; 
            color: var(--neon-green); 
            text-shadow: 0 0 8px var(--neon-green); 
            font-family: 'Black Ops One', monospace;
            display: inline-block;
            will-change: transform;
        }

        /* 💣 マインズグリッド */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr); /* 縦幅の均等化 */
            gap: 6px;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #050508;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid var(--neon-pink);
            box-shadow: inset 0 0 20px rgba(255, 0, 127, 0.3);
        }

        .tile {
            background: rgba(20, 10, 30, 0.8);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            aspect-ratio: 1 / 1; /* マス自体の正方形維持 */
            margin: 0;
            padding: 0;
            line-height: 1;
        }

        .tile:hover:not(.disabled) {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(1.05);
        }

        .tile.revealed-gem {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            border-color: #fff;
            box-shadow: 0 0 20px var(--neon-green);
            cursor: default;
            animation: tile-mega-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.4);
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
        }

        .tile.revealed-mine {
            background: linear-gradient(135deg, #ff003c 0%, #990000 100%);
            border-color: #fff;
            box-shadow: 0 0 25px var(--neon-red);
            cursor: default;
            animation: tile-shake 0.3s ease-in-out;
        }

        .tile.disabled { pointer-events: none; }
        .tile.fade { opacity: 0.3; filter: grayscale(100%); transition: all 0.5s ease; }

        @keyframes tile-mega-pop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.4); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes tile-shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-5deg); }
            40%, 80% { transform: translateX(6px) rotate(5deg); }
        }

        /* 🎛️ 入力フォーム */
        .inputs-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .inputs-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .label { 
            font-size: 0.75rem; 
            color: var(--neon-cyan); 
            font-weight: 900;
            text-shadow: 0 0 4px var(--neon-cyan);
            margin-bottom: 4px;
        }

        input, select { 
            width: 100%; 
            padding: 8px 10px; 
            border-radius: 8px; 
            border: 2px solid var(--neon-cyan); 
            background: rgba(10, 10, 20, 0.9); 
            color: #fff; 
            font-size: 0.9rem; 
            font-weight: bold;
            font-family: inherit; 
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* 🚀 アクションボタン */
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 1.1rem; 
            box-shadow: 0 0 10px var(--neon-yellow);
            user-select: none;
            transition: transform 0.05s ease;
        }

        button:active:not(:disabled) { transform: scale(0.95); filter: brightness(1.3); }

        .btn-start { 
            background: linear-gradient(135deg, #ff0055 0%, #ff00a0 50%, #7928ca 100%); 
            color: #fff; 
            box-shadow: 0 0 20px var(--neon-pink);
            text-shadow: 0 0 5px #fff;
            border: 2px solid #fff;
            animation: pulse-btn 1.0s infinite;
        }
        @keyframes pulse-btn {
            0% { box-shadow: 0 0 15px var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), 0 0 15px var(--neon-cyan); }
            100% { box-shadow: 0 0 15px var(--neon-pink); }
        }

        .btn-start:disabled { 
            background: #222; box-shadow: none; cursor: not-allowed; border: none; color: #555; animation: none; 
        }

        .btn-cashout {
            background: linear-gradient(135deg, #00ff66 0%, #009933 100%);
            color: #000;
            box-shadow: 0 0 20px var(--neon-green);
            border: 2px solid #fff;
            animation: cashout-glow 0.5s infinite alternate;
            display: none;
        }
        @keyframes cashout-glow {
            from { box-shadow: 0 0 10px var(--neon-green); filter: brightness(1); }
            to { box-shadow: 0 0 35px var(--neon-green), 0 0 20px var(--neon-yellow); filter: brightness(1.5); }
        }

        /* ⚙️ フッター */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .btn-back { 
            background: #111; color: #888; border: 1px solid #333; font-size: 0.7rem; padding: 6px; box-shadow: none; width: auto; 
        }
        .checkbox-label { 
            display: flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: bold; color: #aaa; cursor: pointer; 
        }
        .checkbox-label input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--neon-pink); }

        /* 💥💥💥 激化限界突破フラッシュ・超振動演出 💥💥💥 */
        body.hyper-flash-active { animation: hyper-body-flash 0.25s linear; }
        @keyframes hyper-body-flash {
            0% { background-color: #fff; filter: invert(1) hue-rotate(180deg); }
            50% { background-color: var(--neon-pink); }
            100% { background-color: #000; filter: none; }
        }

        .win-rainbow-shake { animation: hyper-rainbow-glow 0.15s linear infinite, hyper-shake-anim 0.08s ease-in-out infinite alternate; }
        .win-rainbow-noshake { animation: hyper-rainbow-glow 0.15s linear infinite; }
        .win-text-rainbow { animation: rainbow-text 0.1s linear infinite; }
        .num-pop { animation: hyper-pop-bounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.5); }
        
        @keyframes hyper-pop-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(2.0); text-shadow: 0 0 40px #ffffff, 0 0 80px var(--neon-pink), 0 0 100px var(--neon-yellow); }
            100% { transform: scale(1); }
        }

        .lose-shake { animation: hyper-lose-shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) 2; border-color: var(--neon-red) !important; }

        @keyframes hyper-rainbow-glow {
            0% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
            20% { border-color: #ffff00; box-shadow: 0 0 40px #ffff00, inset 0 0 30px #ffff00; }
            40% { border-color: #00ff00; box-shadow: 0 0 40px #00ff00, inset 0 0 30px #00ff00; }
            60% { border-color: #00ffff; box-shadow: 0 0 40px #00ffff, inset 0 0 30px #00ffff; }
            80% { border-color: #ff00ff; box-shadow: 0 0 40px #ff00ff, inset 0 0 30px #ff00ff; }
            100% { border-color: #ff0000; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #ff0000; }
        }
        @keyframes rainbow-text {
            0% { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
            25% { color: #ffe600; text-shadow: 0 0 20px #ffe600; }
            50% { color: #00ff66; text-shadow: 0 0 20px #00ff66; }
            75% { color: #00f3ff; text-shadow: 0 0 20px #00f3ff; }
            100% { color: #ff00a0; text-shadow: 0 0 20px #ff00a0; }
        }
        @keyframes hyper-shake-anim {
            0% { transform: scale(1.04) translate(2px, 2px) rotate(0deg); }
            25% { transform: scale(1.04) translate(-2px, -2px) rotate(-1.5deg); }
            50% { transform: scale(1.04) translate(-2px, 2px) rotate(1.5deg); }
            75% { transform: scale(1.04) translate(2px, -2px) rotate(-1.5deg); }
            100% { transform: scale(1.04) translate(2px, 2px) rotate(1.5deg); }
        }
        @keyframes hyper-lose-shake {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-12px, -6px); }
            30% { transform: translate(12px, 6px); }
            50% { transform: translate(-12px, 6px); }
            70% { transform: translate(12px, -6px); }
            90% { transform: translate(-6px, 0); }
        }

    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">🚨 脳汁全開！MINES 🚨</div>

        <!-- 🎰 ステータスエリア -->
        <div class="status-display" id="status-display-box">
            <div id="game-status" class="status-text" style="color: #00f3ff;">⚡ 全財産溶かして地雷を避けろ！ ⚡</div>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">🔥 配当倍率</div>
                    <div id="stat-multiplier" class="stat-val">1.00x</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">💰 獲得Gold</div>
                    <div id="stat-payout" class="stat-val">0</div>
                </div>
            </div>
        </div>

        <!-- 💣 グリッドエリア -->
        <div class="mines-grid" id="mines-grid">
            <!-- JSで生成 -->
        </div>

        <!-- 🎛️ 入力エリア -->
        <div class="inputs-grid">
            <div class="input-group">
                <div class="label">💳 支払口座</div>
                <select id="wallet-select"></select>
            </div>
            <div class="inputs-row-2">
                <div>
                    <div class="label">💎 賭け金 (Gold)</div>
                    <input type="number" id="bet-amount" value="100" min="1" step="1">
                </div>
                <div>
                    <div class="label">💣 地雷の数</div>
                    <select id="mines-count">
                        <option value="1">1 Mine (チキン)</option>
                        <option value="3" selected>3 Mines (標準)</option>
                        <option value="5">5 Mines (強気)</option>
                        <option value="10">10 Mines (狂気)</option>
                        <option value="20">20 Mines (神頼み)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 🚀 アクションボタン -->
        <button id="btn-start" class="btn-start">🎲 脳汁ダイブ (BET)</button>
        <button id="btn-cashout" class="btn-cashout">💰 超絶利確 (CASHOUT)</button>

        <!-- ⚙️ フッター -->
        <div class="footer-row">
            <button class="btn-back" onclick="location.href='/casino'">◀ 戻る</button>
            <label class="checkbox-label">
                <input type="checkbox" id="bgm-toggle">
                <span>🎵 BGM ON</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="disable-shake">
                <span>🚫 演出オフ</span>
            </label>
        </div>
        <audio id="bgm-player" src="/templates/dopa.mp3" loop preload="auto"></audio>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('mines-grid');
        const btnStart = document.getElementById('btn-start');
        const btnCashout = document.getElementById('btn-cashout');
        const inputWallet = document.getElementById('wallet-select');
        const inputBet = document.getElementById('bet-amount');
        const inputMines = document.getElementById('mines-count');
        const displayMulti = document.getElementById('stat-multiplier');
        const displayProfit = document.getElementById('stat-payout');
        const statusText = document.getElementById('game-status');
        const statusBox = document.getElementById('status-display-box');
        const bgmPlayer = document.getElementById('bgm-player');
        const bgmToggle = document.getElementById('bgm-toggle');
        const disableShake = document.getElementById('disable-shake');

        let isPlaying = false;
        let currentGameId = null;
        let currentBet = 0;

        const API_START = '/api/mines/start';
        const API_STEP = '/api/mines/step';
        const API_CASHOUT = '/api/mines/cashout';

        // トークン取得
        const token = localStorage.getItem('access_token') || localStorage.getItem('token');
        if (!token) window.location.href = "/";

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': token ? `Bearer ${token}` : ''
            };
        }

        // 口座の読み込み（選択状態の保持機能追加）
        async function loadWallets() {
            try {
                const res = await fetch("/api/wallets", { headers: getHeaders() });
                if (!res.ok) return;
                const wallets = await res.json();
                
                // 現在の選択値を保存
                const currentSelected = inputWallet.value;
                
                inputWallet.innerHTML = wallets.map(w => 
                    `<option value="${w.wallet_id}">${w.wallet_name} - 残高:${w.balance}G</option>`
                ).join('');
                
                // オプション一覧に保存した値が存在すれば復元する
                if (currentSelected && wallets.some(w => w.wallet_id === currentSelected)) {
                    inputWallet.value = currentSelected;
                }
            } catch (e) {
                console.error(e);
            }
        }
        loadWallets();

        // BGM設定
        bgmToggle.addEventListener("change", (e) => {
            if (e.target.checked) bgmPlayer.play().catch(() => {});
            else bgmPlayer.pause();
        });
        document.addEventListener("click", () => {
            if (bgmToggle.checked && bgmPlayer.paused) bgmPlayer.play().catch(() => {});
        }, { once: true });

        function initGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.index = i;
                
                const triggerEvent = ('ontouchstart' in window) ? 'touchstart' : 'mousedown';
                tile.addEventListener(triggerEvent, (e) => {
                    e.preventDefault();
                    handleTileClick(i, tile);
                });
                grid.appendChild(tile);
            }
        }

        // 💥 演出リセット
        function resetEffects() {
            statusBox.className = "status-display";
            displayProfit.className = "stat-val";
            statusText.className = "status-text";
        }

        // 🌈 脳汁大噴射エフェクト
        function triggerWinEffects() {
            resetEffects();
            statusText.classList.add("win-text-rainbow");
            if (disableShake.checked) {
                statusBox.classList.add("win-rainbow-noshake");
            } else {
                statusBox.classList.add("win-rainbow-shake");
                displayProfit.classList.add("num-pop");
                document.body.classList.add("hyper-flash-active");
                setTimeout(() => document.body.classList.remove("hyper-flash-active"), 250);
            }
        }

        // 💀 爆死エフェクト
        function triggerLoseEffects() {
            resetEffects();
            if (!disableShake.checked) {
                statusBox.classList.add("lose-shake");
            }
        }

        async function handleTileClick(index, tileEl) {
            if (!isPlaying) return;
            if (tileEl.classList.contains('revealed-gem') || tileEl.classList.contains('revealed-mine')) return;

            try {
                const res = await fetch(API_STEP, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ game_id: currentGameId, tile_index: index })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.detail || '通信エラー');

                if (data.is_safe) {
                    // セーフ！
                    tileEl.classList.add('revealed-gem');
                    tileEl.innerHTML = '💎';
                    displayMulti.textContent = `${data.multiplier.toFixed(2)}x`;
                    displayProfit.textContent = data.current_payout || data.payout;
                    
                    if (data.is_cleared) {
                        statusText.innerText = `🎉 完璧！全マス制覇！！ +${data.payout} Gold 獲得！！`;
                        triggerWinEffects();
                        endGame(data.mines);
                        loadWallets();
                    } else {
                        statusText.innerText = "✨ 回避成功！次を開けるか利確しろ！";
                        statusText.style.color = "#00ff66";
                        if (!disableShake.checked) {
                            displayProfit.style.transform = 'scale(1.3)';
                            setTimeout(() => displayProfit.style.transform = 'scale(1)', 150);
                        }
                    }
                    
                } else {
                    // ドカーン！
                    tileEl.classList.add('revealed-mine');
                    tileEl.innerHTML = '💣';
                    
                    statusText.innerText = `💀 爆死... ${currentBet} Gold 没収！！`;
                    statusText.style.color = "#ff003c";
                    
                    triggerLoseEffects();
                    endGame(data.mines); 
                    loadWallets();
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function startGame() {
            const walletId = inputWallet.value;
            const bet = parseFloat(inputBet.value);
            const mines = parseInt(inputMines.value);

            if (!walletId) return alert('口座を選択してください');
            if (isNaN(bet) || bet <= 0) return alert('賭け金を入力してください');

            try {
                const res = await fetch(API_START, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ wallet_id: walletId, amount: bet, mines_count: mines })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.detail || '開始できませんでした');

                currentGameId = data.game_id;
                isPlaying = true;
                currentBet = bet;

                resetEffects();
                initGrid();
                loadWallets();
                
                displayMulti.textContent = '1.00x';
                displayProfit.textContent = bet;
                
                statusText.innerText = "🎯 直感を信じてマスを開けろ！";
                statusText.style.color = "#00f3ff";
                
                inputWallet.disabled = true;
                inputBet.disabled = true;
                inputMines.disabled = true;
                btnStart.style.display = 'none';
                btnCashout.style.display = 'block';

            } catch (err) {
                console.error(err);
            }
        }

        async function cashout() {
            if (!isPlaying) return;

            try {
                const res = await fetch(API_CASHOUT, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ game_id: currentGameId })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.detail || 'エラーが発生しました');

                statusText.innerText = `🌈👑 脳汁大噴射！！ +${data.payout} Gold 獲得！！ 👑🌈`;
                triggerWinEffects();
                endGame(data.mines);
                loadWallets();
            } catch (err) {
                console.error(err);
            }
        }

        function endGame(minesArray) {
            isPlaying = false;
            const tiles = grid.querySelectorAll('.tile');
            
            tiles.forEach((tile, i) => {
                tile.classList.add('disabled');
                
                if (!tile.classList.contains('revealed-gem') && !tile.classList.contains('revealed-mine')) {
                    tile.classList.add('fade');
                    setTimeout(() => {
                        if (minesArray && minesArray.includes(i)) {
                            tile.innerHTML = '💣';
                        } else {
                            tile.innerHTML = '💎';
                        }
                    }, i * 20); // 高速パラパラめくり
                }
            });

            inputWallet.disabled = false;
            inputBet.disabled = false;
            inputMines.disabled = false;
            btnStart.style.display = 'block';
            btnCashout.style.display = 'none';
        }

        btnStart.addEventListener('click', startGame);
        btnCashout.addEventListener('click', cashout);

        initGrid();
