<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 王国自由市場</title>
    <style>
        :root { --bg-dark: #0f1115; --card-bg: #1c1e24; --border: #333842; --gold: #d4af37; --success: #10b981; --blue: #3b82f6; --purple: #8e44ad; --text-main: #e2e8f0; --text-muted: #94a3b8; --danger: #ef4444;}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 20px 0; margin: 0; min-height: 100vh; }
        .container { width: 380px; display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { font-size: 1.3rem; font-weight: 800; color: var(--gold); text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
        
        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 4px; background: #262932; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .list-item { background: #15171a; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .type-badge-req { background: rgba(59,130,246,0.2); color: var(--blue); border: 1px solid var(--blue); padding: 3px 6px; border-radius: 6px; font-size: 0.65rem; }
        .type-badge-off { background: rgba(142,68,173,0.2); color: var(--purple); border: 1px solid var(--purple); padding: 3px 6px; border-radius: 6px; font-size: 0.65rem; }
        
        .c-desc { font-size: 0.8rem; color: #cbd5e1; background: #0f1115; border-radius: 6px; padding: 8px; margin: 8px 0; border: 1px solid #262932; white-space: pre-wrap; word-break: break-all; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #15171a; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-action { background: linear-gradient(145deg, var(--gold), #b8860b); color: #1a1a1a; }
        .btn-buy { background: linear-gradient(145deg, var(--purple), #6c3483); color: #fff; margin-top: 8px; }
        .btn-accept { background: linear-gradient(145deg, var(--blue), #2563eb); color: #fff; margin-top: 8px; }
        .btn-success { background: linear-gradient(145deg, var(--success), #059669); color: #fff; margin-top: 8px; }
        .btn-danger { background: linear-gradient(145deg, var(--danger), #b91c1c); color: #fff; margin-top: 8px; }
        .btn-back { background: #334155; color: #cbd5e1; margin-top: 14px; }
        .empty-msg { text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">⚖️ 王国自由市場</div>
        <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: -10px; margin-bottom: 16px;">
            依頼と出品のエスクロー（預託）取引所
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('market', event)">📜 市場一覧</button>
            <button class="tab-btn" onclick="switchTab('create', event)">📝 依頼 / 出品する</button>
            <button class="tab-btn" onclick="switchTab('my-created', event)">👑 自らの投稿</button>
            <button class="tab-btn" onclick="switchTab('my-accepted', event)">✍️ 進行中の取引</button>
        </div>

        <!-- 1. 市場一覧 -->
        <div id="tab-market" class="tab-content active">
            <div id="contracts-list"><div class="empty-msg">読み込み中...</div></div>
            <button onclick="loadContracts()" style="background: #334155; color: #fff; margin-top: 10px;">🔄 リロード</button>
        </div>

        <!-- 2. 新規作成 -->
        <div id="tab-create" class="tab-content">
            <label style="font-size: 0.75rem; color: #94a3b8;">投稿タイプ</label>
            <select id="c-type" onchange="updateCreateUI()">
                <option value="REQUEST">📥 依頼する (〇〇をやってほしい / 自分が払う)</option>
                <option value="OFFER">📤 出品する (〇〇を売る・やります / 相手が払う)</option>
            </select>

            <div id="create-hint" style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; border-left: 3px solid var(--blue);">
                【依頼】作成時に指定口座から報酬が引き落とされ、預託されます。
            </div>

            <label style="font-size: 0.75rem; color: #94a3b8;">タイトル</label>
            <input type="text" id="c-title" placeholder="例: 資源の採掘代行">

            <label style="font-size: 0.75rem; color: #94a3b8;">詳細要件・内容</label>
            <textarea id="c-desc" placeholder="詳細を記載してください" style="height: 80px;"></textarea>

            <label style="font-size: 0.75rem; color: #94a3b8;">金額設定 (Gold)</label>
            <input type="number" id="c-amount" min="1" step="1" placeholder="例: 1000">

            <label style="font-size: 0.75rem; color: #94a3b8;">紐付ける口座</label>
            <select id="create-wallet-select"></select>

            <button id="btn-create" class="btn-action" onclick="createContract()">市場に投稿する</button>
        </div>

        <!-- 3. 自分の投稿 -->
        <div id="tab-my-created" class="tab-content"><div id="my-created-list"></div></div>
        
        <!-- 4. 自分が受注/購入した取引 -->
        <div id="tab-my-accepted" class="tab-content"><div id="my-accepted-list"></div></div>

        <button class="btn-back" onclick="location.href='/dashboard'">ダッシュボードへ戻る</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let wallets = [];
    let currentUserId = "";
    let allContracts = [];
    let isProcessing = false;

    // XSS対策エスケープ
    function escapeHtml(str) { 
        return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    }

    async function init() {
        await loadWallets();
        await loadContracts();
    }

    function switchTab(tabId, evt) {
        if (isProcessing) return;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function updateCreateUI() {
        const type = document.getElementById("c-type").value;
        const hint = document.getElementById("create-hint");
        if (type === "REQUEST") {
            hint.innerHTML = "【依頼】作成時にあなたの口座から報酬が引き落とされ、預託されます。";
            hint.style.borderLeftColor = "var(--blue)";
        } else {
            hint.innerHTML = "【出品】購入者が現れた時点で相手から代金が引き落とされ、預託されます。";
            hint.style.borderLeftColor = "var(--purple)";
        }
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                wallets = await res.json();
                const opts = wallets.map(w => `<option value="${escapeHtml(w.wallet_id)}">${escapeHtml(w.wallet_name)} (残: ${w.balance} G)</option>`).join('');
                document.getElementById("create-wallet-select").innerHTML = opts || '<option value="">口座がありません</option>';
            }
        } catch (e) {
            console.error("口座情報の取得エラー", e);
        }
    }

    // 読み込み（エラーハンドリング強化）
    async function loadContracts() {
        if (isProcessing) return;
        const listEl = document.getElementById("contracts-list");
        listEl.innerHTML = '<div class="empty-msg">読み込み中...</div>';
        
        try {
            const res = await fetch("/api/contracts", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                allContracts = data.contracts || [];
                currentUserId = data.current_user_id || "";
                renderAll();
            } else {
                const errText = await res.text();
                listEl.innerHTML = `<div class="empty-msg" style="color:var(--danger);">読込エラー: ${res.status}<br>${escapeHtml(errText)}</div>`;
            }
        } catch (e) {
            listEl.innerHTML = `<div class="empty-msg" style="color:var(--danger);">通信エラー。サーバーが停止している可能性があります。</div>`;
        }
    }

    function renderAll() {
        renderList("contracts-list", allContracts.filter(c => c.status === "OPEN"));
        renderList("my-created-list", allContracts.filter(c => c.creator_user_id === currentUserId));
        renderList("my-accepted-list", allContracts.filter(c => c.acceptor_user_id === currentUserId));
    }

    function renderList(elementId, list) {
        const el = document.getElementById(elementId);
        if (list.length === 0) {
            el.innerHTML = '<div class="empty-msg">該当する取引データがありません。</div>';
            return;
        }
        
        el.innerHTML = list.map(c => {
            const isReq = (c.contract_type === "REQUEST");
            const typeBadge = isReq ? `<span class="type-badge-req">📥 依頼</span>` : `<span class="type-badge-off">📤 出品</span>`;
            
            let actionArea = "";
            
            // 自分が作った投稿以外 ＆ OPEN
            if (c.status === "OPEN" && c.creator_user_id !== currentUserId) {
                const btnClass = isReq ? "btn-accept" : "btn-buy";
                const btnText = isReq ? "✍️ この依頼を受注する" : "🛒 この商品/役務を購入する";
                const walletOptions = wallets.map(w => `<option value="${escapeHtml(w.wallet_id)}">${escapeHtml(w.wallet_name)}</option>`).join('');
                
                actionArea = `
                    <div style="margin-top: 10px;">
                        <select id="wallet-${c.id}" style="padding:8px; font-size:0.75rem; margin-bottom: 4px;">
                            ${walletOptions || '<option value="">口座がありません</option>'}
                        </select>
                        <button class="${btnClass}" onclick="acceptContract(${c.id})">${btnText}</button>
                    </div>`;
            }
            
            // 自分の投稿
            if (c.creator_user_id === currentUserId) {
                if (c.status === "OPEN") {
                    actionArea = `<button class="btn-danger" onclick="cancelContract(${c.id})">✖ 取引を取り消す (キャンセル)</button>`;
                } else if (c.status === "SIGNED") {
                    actionArea = `<button class="btn-success" onclick="completeContract(${c.id})">✅ 取引を完了し、代金を決済する</button>`;
                }
            }

            return `
            <div class="list-item">
                <div class="title-row">
                    <span style="font-weight:bold;">${escapeHtml(c.title)}</span>
                    ${typeBadge}
                </div>
                <div style="font-size: 0.8rem; color: #94a3b8;">
                    投稿者: <b style="color:#fff;">${escapeHtml(c.creator_nickname)}</b> | 金額: <b style="color:var(--gold);">${c.amount} G</b>
                </div>
                <div class="c-desc">${escapeHtml(c.description)}</div>
                ${actionArea}
            </div>`;
        }).join('');
    }

    // ★ 汎用APIコールラッパー（DBが投げたエラーメッセージを確実に表示する）
    async function safeApiCall(url, method, bodyObj, confirmMsg) {
        if (isProcessing) return false;
        if (confirmMsg && !confirm(confirmMsg)) return false;

        isProcessing = true;
        try {
            const options = {
                method: method,
                headers: { "Authorization": `Bearer ${token}` }
            };
            if (bodyObj) {
                options.headers["Content-Type"] = "application/json";
                options.body = JSON.stringify(bodyObj);
            }

            const res = await fetch(url, options);
            const data = await res.json().catch(() => ({}));
            
            // 成功時も失敗時もDB（またはAPI）からのメッセージを表示
            alert(data.message || data.detail || `処理が完了しました (Status: ${res.status})`);
            return res.ok;
        } catch (e) {
            alert("通信エラーが発生しました。サーバーとの接続を確認してください。");
            return false;
        } finally {
            isProcessing = false;
        }
    }

    async function createContract() {
        const title = document.getElementById("c-title").value.trim();
        const desc = document.getElementById("c-desc").value.trim();
        const amount = parseInt(document.getElementById("c-amount").value, 10);
        const wId = document.getElementById("create-wallet-select").value;

        if (!title || !desc || isNaN(amount) || amount <= 0 || !wId) {
            return alert("全項目を正しく入力してください。");
        }

        document.getElementById("btn-create").disabled = true;
        const ok = await safeApiCall("/api/contracts", "POST", {
            contract_type: document.getElementById("c-type").value,
            title: title,
            description: desc,
            amount: amount,
            creator_wallet_id: wId
        }, null);
        document.getElementById("btn-create").disabled = false;

        if (ok) {
            document.getElementById("c-title").value = "";
            document.getElementById("c-desc").value = "";
            document.getElementById("c-amount").value = "";
            await loadWallets();
            await loadContracts();
            switchTab('market');
        }
    }

    async function acceptContract(id) {
        const wId = document.getElementById(`wallet-${id}`).value;
        if (!wId) return alert("使用する口座を選択してください。");
        
        const ok = await safeApiCall(`/api/contracts/${id}/accept`, "POST", { acceptor_wallet_id: wId }, "この取引を実行しますか？");
        if (ok) { await loadWallets(); await loadContracts(); switchTab('my-accepted'); }
    }

    async function cancelContract(id) {
        const ok = await safeApiCall(`/api/contracts/${id}/cancel`, "POST", null, "本当に取り消しますか？預託金がある場合は返金されます。");
        if (ok) { await loadWallets(); await loadContracts(); }
    }

    async function completeContract(id) {
        const ok = await safeApiCall(`/api/contracts/${id}/complete`, "POST", null, "取引を完了として、代金の決済を実行しますか？");
        if (ok) { await loadWallets(); await loadContracts(); }
    }

    init();
</script>
</body>
</html>
