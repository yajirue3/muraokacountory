<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理所</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .btn { padding: 6px 12px; background: #2a2a2a; color: #fff; text-decoration: none; border-radius: 4px; border: 1px solid #444; font-size: 0.9rem; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab { background: none; border: none; color: #888; font-weight: bold; cursor: pointer; }
        .tab.active { color: #d4af37; border-bottom: 2px solid #d4af37; }
        .item { background: #1e1e1e; padding: 15px; border-radius: 6px; border: 1px solid #333; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .title { font-weight: bold; margin-bottom: 4px; }
        .btn-toggle { background: #2980b9; color: white; border: none; }
        .btn-del { background: #c0392b; color: white; border: none; }
    </style>
</head>
<body>
    <a href="/videos" class="btn">← 戻る</a>
    <h2 style="color: #d4af37;">⚙️ 映像管理</h2>

    <div class="tabs">
        <button class="tab active" onclick="setMode('my')">自分の映像</button>
        <button class="tab" id="king-tab" style="display:none; color:#f1c40f;" onclick="setMode('king')">👑 国王管理</button>
    </div>

    <div id="list">読み込み中...</div>

    <script>
        const token = localStorage.getItem("access_token");
        if (!token) location.href = "/";

        let all = [], uid = "", king = false, mode = 'my';

        async function init() {
            const res = await fetch("/api/videos", { headers: { "Authorization": `Bearer ${token}` } });
            const data = await res.json();
            all = data.videos;
            uid = data.user_id;
            king = data.is_king;
            if (king) document.getElementById("king-tab").style.display = "inline-block";
            render();
        }

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function render() {
            const target = mode === 'king' ? all : all.filter(v => v.user_id === uid);
            const box = document.getElementById("list");
            if (target.length === 0) {
                box.innerHTML = "映像がありません。";
                return;
            }
            box.innerHTML = target.map(v => `
                <div class="item">
                    <div>
                        <div class="title">${v.title} <span style="color:${v.is_private?'#e74c3c':'#2ecc71'}">[${v.is_private?'非公開':'公開'}]</span></div>
                        <div style="font-size:0.8rem; color:#888;">投稿者: ${v.author_name}</div>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-toggle" onclick="toggle('${v.id}')">公開切替</button>
                        <button class="btn btn-del" onclick="del('${v.id}')">削除</button>
                    </div>
                </div>
            `).join('');
        }

        async function toggle(id) {
            await fetch(`/api/videos/${id}/toggle_private`, { method: "PATCH", headers: { "Authorization": `Bearer ${token}` } });
            init();
        }

        async function del(id) {
            if(!confirm("削除しますか？")) return;
            await fetch(`/api/videos/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
            init();
        }

        init();
    </script>
</body>
</html>
