<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>村岡王国 - 王立無償遊技場</title>
    <style>
        /* 各ゲーム用フォントの読み込み */
        @import url('https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            /* ページ全体はダークテーマ */
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --card-bg: #1e1e1e;
            --item-border: #333333;
            --btn-back-bg: #2a2a2a;
            --btn-back-hover: #404040;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            padding: 20px 10px; 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .main-card { 
            background: var(--card-bg); 
            border: 1px solid var(--item-border); 
            border-radius: 12px; 
            padding: 24px 20px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
        }

        .header { 
            font-size: 1.4rem; 
            font-weight: 700; 
            color: var(--text-main); 
            text-align: center; 
            border-bottom: 2px solid var(--item-border); 
            padding-bottom: 12px; 
            margin-bottom: 24px; 
            letter-spacing: 1px;
        }

        .game-card { 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 20px; 
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-2px);
        }

        .badge {
            position: absolute;
            top: -10px;
            right: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .game-title { 
            font-size: 1.1rem; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .game-desc { 
            font-size: 0.85rem; 
            margin-bottom: 16px; 
            line-height: 1.6; 
        }
        
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 0.95rem; 
            transition: background 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }

        /* =========================================
           2048 テーマ 
           ========================================= */
        .theme-2048 {
            background: #faf8ef;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            border: 2px solid #bbada0;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        .theme-2048:hover { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6); }
        .theme-2048 .game-title { font-weight: 700; color: #776e65; }
        .theme-2048 .game-desc { color: #8f7a66; }
        .theme-2048 .badge { background: #edc22e; color: #fff; border-radius: 12px; box-shadow: 0 2px 5px rgba(237, 194, 46, 0.4); }
        .theme-2048 .btn-play { background: #8f7a66; color: #f9f6f2; border-radius: 6px; }
        .theme-2048 .btn-play:hover { background: #9f8b77; }

        /* =========================================
           さめがめ (SameGame) テーマ 
           ========================================= */
        .theme-samegame {
            background: #111;
            font-family: 'DotGothic16', sans-serif;
            border: 4px solid #555;
            border-radius: 2px; /* ドット絵風に角を立てる */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
        }
        .theme-samegame:hover { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8); }
        .theme-samegame .game-title { 
            font-family: 'Press Start 2P', cursive; 
            color: #E70012; 
            text-shadow: 1px 1px 0 #fff; 
            font-size: 0.9rem; /* 英語ピクセルフォントは大きいので微調整 */
            padding-top: 4px;
            padding-bottom: 4px;
        }
        .theme-samegame .game-desc { color: #ddd; }
        .theme-samegame .badge { 
            background: #0088FF; 
            color: #fff; 
            border: 2px solid #fff; 
            border-radius: 0; 
            font-family: 'DotGothic16', sans-serif; 
        }
        .theme-samegame .btn-play { 
            background: #555; 
            color: #fff; 
            border: 2px solid #888; 
            border-radius: 0; 
            font-family: 'DotGothic16', sans-serif;
            font-size: 1.1rem;
        }
        .theme-samegame .btn-play:hover { background: #777; }
        .theme-samegame .btn-play:active { transform: translateY(2px); }

        /* =========================================
           共通ボタン 
           ========================================= */
        .btn-back { 
            background: var(--btn-back-bg); 
            color: var(--text-main); 
            margin-top: 10px; 
            border-radius: 6px;
        }
        .btn-back:hover { 
            background: var(--btn-back-hover); 
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <div class="header">🎮 王立無償遊技場</div>
        
        <!-- 2048 カード -->
        <div class="game-card theme-2048">
            <div class="badge">定番</div>
            <div class="game-title">🧩 2048（Strategic Merge）</div>
            <div class="game-desc">
                運要素ゼロの完全思考型パズル。数字を重ねて限界を目指せ。全プレイヤー共通のランキングで覇を競え！
            </div>
            <button class="btn-play" onclick="location.href='/2048'">プレイする</button>
        </div>

        <!-- さめがめ カード -->
        <div class="game-card theme-samegame">
            <div class="badge">NEW!</div>
            <div class="game-title">👾 SAMEGAME</div>
            <div class="game-desc">
                隣接する同色ブロックを消して盤面を圧縮しろ。まとめて消すほどスコアが跳ね上がる。目指せ全消しパーフェクト！
            </div>
            <button class="btn-play" onclick="location.href='/samegame'">START</button>
        </div>

        <!-- ダッシュボードへ戻るボタン -->
        <button class="btn-back" onclick="location.href='/dashboard'">ダッシュボードへ戻る</button>
    </div>
</div>

<script>
    // 未ログイン時は強制送還
    const token = localStorage.getItem("access_token") || localStorage.getItem("token");
    if (!token) {
        window.location.href = "/";
    }
</script>

</body>
</html>
