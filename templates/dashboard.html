<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - ダッシュボード</title>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- Modern UI Variables --- */
        :root {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #111111;
            --bg-hover: #1a1a1a;
            --border-subtle: #222222;
            --border-hover: #333333;
            --text-primary: #ededed;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --accent-color: #ffffff;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --radius-md: 8px;
            --radius-lg: 12px;
            --transition: all 0.2s ease;
        }

        /* --- Reset & Base --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        button { background: none; border: none; font: inherit; cursor: pointer; color: inherit; }
        a { color: inherit; text-decoration: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }

        /* --- Layout --- */
        .app-container {
            width: 100%;
            max-width: 768px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Top Header (Profile & Settings Toggle) --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .profile-summary {
            display: flex;
            flex-direction: column;
        }
        .profile-name { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        .profile-badges { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        .badge {
            font-size: 0.75rem; padding: 2px 8px; border-radius: 99px;
            background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-secondary);
        }
        .settings-toggle {
            padding: 8px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);
            background: var(--bg-card); color: var(--text-secondary); transition: var(--transition);
        }
        .settings-toggle:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-hover); }

        /* --- Info Grid (Tax & Logs) --- */
        .info-grid {
            display: grid; grid-template-columns: 1fr 2fr; gap: 16px;
        }
        @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
        
        .card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 20px;
        }
        .card-title { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        /* Tax Display */
        .tax-amount { font-size: 1.75rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
        .tax-note { font-size: 0.75rem; color: var(--text-muted); }

        /* Announcements */
        .log-list { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 8px; }
        .log-item { font-size: 0.85rem; display: flex; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-item:last-child { border-bottom: none; padding-bottom: 0; }
        .log-date { color: var(--text-muted); font-size: 0.75rem; flex-shrink: 0; }

        /* --- Services Grid (Bento UI) --- */
        .section-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
        }
        .section-title { font-size: 1rem; font-weight: 600; }
        .view-controls { display: flex; gap: 8px; }
        .btn-icon {
            color: var(--text-secondary); padding: 4px; border-radius: 4px; transition: var(--transition);
        }
        .btn-icon:hover { color: var(--text-primary); background: var(--bg-hover); }

        .service-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px;
        }
        .service-grid.compact-mode {
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px;
        }
        
        .service-node {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative;
            transition: var(--transition); text-align: left;
        }
        .service-node:hover {
            border-color: var(--border-hover); background: var(--bg-hover); transform: translateY(-1px);
        }
        .service-grid.compact-mode .service-node { padding: 10px; gap: 8px; }
        
        .node-icon { width: 24px; height: 24px; color: var(--text-primary); }
        .service-grid.compact-mode .node-icon { width: 18px; height: 18px; }
        .node-label { font-size: 0.85rem; font-weight: 500; word-break: break-all; line-height: 1.3; }
        .service-grid.compact-mode .node-label { font-size: 0.75rem; }

        /* Node Actions (Pin / Delete) */
        .node-actions { position: absolute; top: 8px; right: 8px; opacity: 0; transition: var(--transition); display: flex; gap: 4px; }
        .service-node:hover .node-actions { opacity: 1; }
        .btn-action-small {
            color: var(--text-muted); padding: 4px; border-radius: 4px;
        }
        .btn-action-small:hover { color: var(--text-primary); background: rgba(255,255,255,0.1); }
        .pinned .pin-icon { color: var(--text-primary); fill: var(--text-primary); }
        .service-node.pinned .node-actions { opacity: 1; }

        /* Add Custom Node Button */
        .service-node.add-node { border-style: dashed; justify-content: center; align-items: center; color: var(--text-muted); }
        .service-node.add-node:hover { color: var(--text-primary); border-color: var(--text-secondary); }

        /* --- Settings Panel (Hidden by default) --- */
        .settings-panel {
            display: none; background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 20px; flex-direction: column; gap: 16px; margin-bottom: 16px;
        }
        .settings-panel.active { display: flex; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); }
        .form-control {
            background: var(--bg-base); border: 1px solid var(--border-subtle); color: var(--text-primary);
            padding: 10px 12px; border-radius: var(--radius-md); font-size: 0.85rem; font-family: inherit; transition: var(--transition); outline: none;
        }
        .form-control:focus { border-color: var(--text-primary); }
        
        .btn-primary {
            background: var(--text-primary); color: var(--bg-base); border: none; padding: 10px 16px;
            border-radius: var(--radius-md); font-weight: 500; font-size: 0.85rem; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-subtle);
            padding: 10px 16px; border-radius: var(--radius-md); font-weight: 500; font-size: 0.85rem; transition: var(--transition);
        }
        .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-hover); }
        
        .btn-danger { color: var(--danger-color); border-color: rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.1); border-color: var(--danger-color); }
        
        .admin-controls { display: none; border-top: 1px solid var(--border-subtle); padding-top: 16px; flex-direction: column; gap: 12px; }

        /* --- Footer (Underground / Policy) --- */
        .footer-links {
            display: flex; justify-content: space-between; padding-top: 24px; border-top: 1px solid var(--border-subtle); font-size: 0.75rem; color: var(--text-muted);
        }
        .footer-link { transition: var(--transition); cursor: pointer; }
        .footer-link:hover { color: var(--text-primary); }

        /* --- Modals (Custom Link / Alley / Terms) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); z-index: 9999;
            justify-content: center; align-items: center; padding: 16px;
        }
        .modal-box {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); width: 100%; max-width: 400px; padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
        .modal-body { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.6; max-height: 40vh; overflow-y: auto; }
        .modal-footer { display: flex; gap: 12px; justify-content: flex-end; }
        
        /* SVG Utils */
        .icon { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Header -->
    <header class="top-header">
        <div class="profile-summary">
            <div class="profile-name" id="display-nickname">Loading...</div>
            <div class="profile-badges">
                <span class="badge" id="user-title-display">---</span>
                <span class="badge" style="font-family: monospace; border: none; background: transparent; padding: 0;" id="user-email"></span>
            </div>
        </div>
        <button class="settings-toggle" onclick="toggleSettings()" title="設定">
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </header>

    <!-- Settings Panel (Toggleable) -->
    <div id="settings-panel" class="settings-panel">
        <h3 style="font-size: 1rem; margin-bottom: 8px;">設定・プロフィール</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label class="form-label">称号</label>
                <select class="form-control" id="title-select"><option value="">読込中...</option></select>
                <button class="btn-secondary" onclick="equipTitle()">変更を適用</button>
            </div>
            <div class="form-group">
                <label class="form-label">納税口座</label>
                <select class="form-control" id="tax-wallet-select"><option value="">読込中...</option></select>
                <button class="btn-secondary" onclick="payTax()">納税実行 (+100G)</button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px;">
            <div class="form-group">
                <label class="form-label">ニックネーム</label>
                <input class="form-control" type="text" id="nickname" placeholder="入力">
            </div>
            <div class="form-group">
                <label class="form-label">本名 (非公開)</label>
                <input class="form-control" type="text" id="real-name" placeholder="入力">
            </div>
        </div>
        <button class="btn-primary" onclick="saveProfile()" style="width: 100%;">プロフィールを保存</button>

        <div id="admin-controls-wrapper" class="admin-controls">
            <h4 style="font-size: 0.85rem; color: var(--danger-color);">Admin Controls</h4>
            <div style="display: flex; gap: 8px;">
                <button id="btn-admin-items" class="btn-secondary btn-danger" style="flex:1" onclick="location.href='/admin/items'">アイテム管理</button>
                <button id="btn-admin-casino" class="btn-secondary btn-danger" style="flex:1" onclick="location.href='/admin/casino'">カジノ調整</button>
            </div>
            <button id="btn-admin-tax" class="btn-secondary btn-danger" style="width: 100%" onclick="collectAllTax()">全国民から所得税を即時徴収</button>
        </div>
        
        <div style="display: flex; gap: 8px; margin-top: 8px;">
            <button class="btn-secondary" style="flex:1;" onclick="openPolicyViewer()">利用規約</button>
            <button class="btn-secondary" style="flex:1; color: var(--danger-color);" onclick="logout()">ログアウト</button>
        </div>
    </div>

    <!-- Info Grid -->
    <div class="info-grid">
        <div class="card">
            <div class="card-title">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                次回所得税
            </div>
            <div class="tax-amount" id="my-tax-amount">---</div>
            <div class="tax-note">火・金 9:00 (10万G超の0.5%)</div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <svg class="icon" width="16" height="16" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                お知らせ
            </div>
            <div class="log-list" id="announcement-list">
                <div class="log-item"><span class="log-date">--/--</span><span>読込中...</span></div>
            </div>
        </div>
    </div>

    <!-- Services Section -->
    <section>
        <div class="section-header">
            <div class="section-title">サービス一覧</div>
            <div class="view-controls">
                <button class="btn-icon" onclick="toggleDensity()" title="表示切替">
                    <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </button>
            </div>
        </div>
        
        <!-- Grid rendered by JS -->
        <div id="service-grid" class="service-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="footer-links">
        <span class="footer-link" onclick="openAlleyModal()">路地裏へ...</span>
        <span style="color: var(--border-subtle);">MURAOKA PLATFORM</span>
    </footer>

</div>

<!-- --- Modals --- -->

<!-- Add Custom Link Modal -->
<div id="add-link-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">リンクの追加</div>
        <div class="modal-body">
            <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label">サービス名</label>
                <input class="form-control" type="text" id="custom-link-name" placeholder="例: Twitter">
            </div>
            <div class="form-group">
                <label class="form-label">URL</label>
                <input class="form-control" type="url" id="custom-link-url" placeholder="https://...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" onclick="closeAddLinkModal()">キャンセル</button>
            <button class="btn-primary" onclick="saveCustomLink()">追加</button>
        </div>
    </div>
</div>

<!-- Alley Modal -->
<div id="alley-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">路地裏</div>
        <div id="alley-text" class="modal-body"></div>
        <div id="alley-choices-initial" style="display: flex; flex-direction: column; gap: 8px;">
            <button class="btn-secondary" onclick="chooseWork()">仕事を探す</button>
            <button class="btn-secondary" onclick="chooseLoan()">裏金融へ</button>
            <button class="btn-secondary" style="border:none;" onclick="closeAlleyModal()">立ち去る</button>
        </div>
        <div id="alley-choices-factory" style="display: none; flex-direction: column; gap: 8px;">
            <button class="btn-primary" onclick="location.href='/factory'">工場へ行く</button>
            <button class="btn-secondary" onclick="openAlleyModal()">戻る</button>
        </div>
        <div id="alley-choices-loan" style="display: none; flex-direction: column; gap: 8px;">
            <button class="btn-primary" onclick="location.href='/loan'">裏金融へ</button>
            <button class="btn-secondary" onclick="openAlleyModal()">戻る</button>
        </div>
    </div>
</div>

<!-- Policy Viewer Modal -->
<div id="policy-view-modal" class="modal-overlay" onclick="if(event.target === this) closePolicyViewer();">
    <div class="modal-box" onclick="event.stopPropagation();">
        <div class="modal-title">利用規約・ポリシー</div>
        <div id="policy-view-content" class="modal-body" style="white-space: pre-wrap;">読込中...</div>
        <button class="btn-secondary" style="width: 100%;" onclick="closePolicyViewer()">閉じる</button>
    </div>
</div>

<!-- Terms Agree Modal -->
<div id="terms-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">利用規約の同意</div>
        <div class="modal-body" style="margin-bottom: 12px;">サービスの安全な運営のため、利用規約への同意が必要です。</div>
        <div id="terms-content-box" class="modal-body" style="background: var(--bg-base); padding: 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); white-space: pre-wrap;">読込中...</div>
        <button id="agree-terms-btn" class="btn-primary" style="width: 100%;">同意して続ける</button>
    </div>
</div>

    // Grid Rendering Logic
    function renderGrid() {
        const grid = document.getElementById('service-grid');
        const pinned = JSON.parse(localStorage.getItem('muraoka_pinned') || '[]');
        const customLinks = JSON.parse(localStorage.getItem('muraoka_custom_links') || '[]');
        
        let html = '';

        // Sort default services (Pinned first)
        const sortedDefaults = [...defaultServices].sort((a, b) => {
            const aPin = pinned.includes(a.id);
            const bPin = pinned.includes(b.id);
            if (aPin && !bPin) return -1;
            if (!aPin && bPin) return 1;
            return 0;
        });

        // Render Defaults
        sortedDefaults.forEach(svc => {
            const isPinned = pinned.includes(svc.id);
            html += `
                <button class="service-node ${isPinned ? 'pinned' : ''}" onclick="location.href='${svc.url}'">
                    <div class="node-actions">
                        <div class="btn-action-small" onclick="event.stopPropagation(); togglePin('${svc.id}')" title="ピン留め/解除">
                            <svg class="icon pin-icon" width="14" height="14" viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
                        </div>
                    </div>
                    <div class="node-icon">${svc.icon}</div>
                    <div class="node-label">${svc.name}</div>
                </button>
            `;
        });

        // Render Custom Links
        customLinks.forEach(link => {
            html += `
                <button class="service-node" onclick="window.open('${link.url}', '_blank')">
                    <div class="node-actions">
                        <div class="btn-action-small" onclick="event.stopPropagation(); removeCustomLink('${link.id}')" title="削除">
                            <svg class="icon" width="14" height="14" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </div>
                    </div>
                    <div class="node-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></div>
                    <div class="node-label">${link.name}</div>
                </button>
            `;
        });

        // Add Button
        html += `
            <button class="service-node add-node" onclick="openAddLinkModal()">
                <svg class="icon" width="24" height="24" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        `;

        grid.innerHTML = html;
    }

    // Pinning Logic
    function togglePin(id) {
        let pinned = JSON.parse(localStorage.getItem('muraoka_pinned') || '[]');
        if (pinned.includes(id)) {
            pinned = pinned.filter(p => p !== id);
        } else {
            pinned.push(id);
        }
        localStorage.setItem('muraoka_pinned', JSON.stringify(pinned));
        renderGrid();
    }

    // Custom Link Logic
    function openAddLinkModal() {
        document.getElementById('custom-link-name').value = '';
        document.getElementById('custom-link-url').value = '';
        document.getElementById('add-link-modal').style.display = 'flex';
    }
    function closeAddLinkModal() { document.getElementById('add-link-modal').style.display = 'none'; }
    function saveCustomLink() {
        const name = document.getElementById('custom-link-name').value.trim();
        const url = document.getElementById('custom-link-url').value.trim();
        if (!name || !url) return alert('入力が不足しています。');
        
        let customLinks = JSON.parse(localStorage.getItem('muraoka_custom_links') || '[]');
        customLinks.push({ id: 'cstm-' + Date.now(), name, url });
        localStorage.setItem('muraoka_custom_links', JSON.stringify(customLinks));
        
        closeAddLinkModal();
        renderGrid();
    }
    function removeCustomLink(id) {
        if(!confirm('このリンクを削除しますか？')) return;
        let customLinks = JSON.parse(localStorage.getItem('muraoka_custom_links') || '[]');
        customLinks = customLinks.filter(l => l.id !== id);
        localStorage.setItem('muraoka_custom_links', JSON.stringify(customLinks));
        renderGrid();
    }

    // View Density Toggle
    function toggleDensity() {
        const grid = document.getElementById('service-grid');
        grid.classList.toggle('compact-mode');
        const isCompact = grid.classList.contains('compact-mode');
        localStorage.setItem('muraoka_view_compact', isCompact);
    }

    // Initialize UI state
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem('muraoka_view_compact') === 'true') {
            document.getElementById('service-grid').classList.add('compact-mode');
        }
        renderGrid();
    });


    /* =========================================
       2. Original Backend & Core Logic (Preserved)
       ========================================= */
       
    const SUPABASE_URL = window.SUPABASE_URL || localStorage.getItem("SUPABASE_URL") || "";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || localStorage.getItem("SUPABASE_ANON_KEY") || "";
    
    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function escapeHtml(str) { 
        return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; 
    }

    const token = localStorage.getItem("access_token");
    if (!token && !supabaseClient) {
        window.location.href = "/";
    } else {
        document.getElementById("user-email").innerText = localStorage.getItem("user_email") || "";
        loadProfile();
        loadTitles();
        loadWalletsForTax();
        loadAnnouncements();
    }

    /* 100%エラーで落ちない完全防護版 loadAnnouncements */
    async function loadAnnouncements() {
        const container = document.getElementById("announcement-list");
        if (!container) return; 

        let announcements = null;
        try {
            if (typeof supabaseClient !== 'undefined' && supabaseClient && typeof supabaseClient.from === 'function') {
                const { data, error } = await supabaseClient
                    .from('announcements')
                    .select('id, title, content, created_at')
                    .order('created_at', { ascending: false });

                if (!error && Array.isArray(data)) {
                    announcements = data;
                }
            }
        } catch (e) {}

        if (!Array.isArray(announcements)) {
            try {
                const authToken = typeof token !== 'undefined' ? token : (localStorage.getItem("access_token") || "");
                const res = await fetch("/api/announcements", { 
                    headers: { "Authorization": `Bearer ${authToken}` }
                });
                if (res && res.ok) {
                    const apiData = await res.json();
                    if (Array.isArray(apiData)) {
                        announcements = apiData;
                    }
                }
            } catch (e) {}
        }

        try {
            if (Array.isArray(announcements) && announcements.length > 0) {
                let htmlBuffer = "";
                for (let i = 0; i < announcements.length; i++) {
                    const item = announcements[i];
                    if (!item || typeof item !== 'object') continue;

                    let dateStr = '--/--';
                    if (item.created_at !== null && item.created_at !== undefined) {
                        const rawStr = String(item.created_at);
                        dateStr = rawStr.length >= 10 ? rawStr.substring(0, 10) : rawStr;
                    }

                    const rawTitle = item.title !== null && item.title !== undefined ? String(item.title) : '（タイトルなし）';
                    const rawContent = item.content !== null && item.content !== undefined ? String(item.content) : '';
                    const safeTitle = typeof escapeHtml === 'function' ? escapeHtml(rawTitle) : rawTitle;
                    const safeContent = typeof escapeHtml === 'function' ? escapeHtml(rawContent) : rawContent;
                    const safeDate = typeof escapeHtml === 'function' ? escapeHtml(dateStr) : dateStr;

                    htmlBuffer += `
                        <div class="log-item">
                            <span class="log-date">${safeDate}</span>
                            <span><strong>${safeTitle}</strong> ${safeContent ? '- ' + safeContent : ''}</span>
                        </div>
                    `;
                }
                container.innerHTML = htmlBuffer || '<div class="log-item"><span class="log-date">--/--</span><span>現在お知らせはありません。</span></div>';
            } else {
                container.innerHTML = '<div class="log-item"><span class="log-date">--/--</span><span>現在お知らせはありません。</span></div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="log-item"><span class="log-date">--/--</span><span>現在お知らせはありません。</span></div>';
        }
    }

    function calculateWealthTax(balance) {
        if (balance <= 100000) return 0;
        return Math.floor(balance * 0.005);
    }

    async function loadProfile() {
        try {
            const res = await fetch("/api/profile", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                document.getElementById("nickname").value = data.nickname || "";
                document.getElementById("real-name").value = data.real_name || "";
                
                const displayNick = document.getElementById("display-nickname");
                if (displayNick) displayNick.innerText = data.nickname || "（未設定）";

                // Admin UI toggle
                if (data.is_king || data.role === "king") {
                    document.getElementById("admin-controls-wrapper").style.display = "flex";
                }
            }
        } catch (e) { console.error(e); }
    }

    async function loadTitles() {
        try {
            const res = await fetch("/api/titles", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const data = await res.json();
                document.getElementById("user-title-display").innerText = data.equipped_title || "一般国民";

                const select = document.getElementById("title-select");
                if (data.owned_titles && data.owned_titles.length > 0) {
                    select.innerHTML = data.owned_titles.map(t => 
                        `<option value="${escapeHtml(t)}" ${t === data.equipped_title ? 'selected' : ''}>${escapeHtml(t)}</option>`
                    ).join('');
                } else {
                    select.innerHTML = '<option value="">所持称号なし</option>';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function equipTitle() {
        const title = document.getElementById("title-select").value;
        if (!title) return alert("称号を選択してください");
        try {
            const res = await fetch("/api/titles/equip", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ title })
            });
            const data = await res.json();
            alert(res.ok ? data.message : "エラー: " + data.detail);
            if (res.ok) loadTitles();
        } catch (e) { alert("通信エラーが発生しました"); }
    }

    async function loadWalletsForTax() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) {
                const wallets = await res.json();
                const totalBalance = Array.isArray(wallets) ? wallets.reduce((sum, w) => sum + (w.balance || 0), 0) : 0;
                
                const taxAmount = calculateWealthTax(totalBalance);
                const taxDisplay = document.getElementById("my-tax-amount");
                if (taxDisplay) {
                    taxDisplay.innerText = taxAmount > 0 ? `-${taxAmount.toLocaleString()} G` : "0 G";
                    taxDisplay.style.color = taxAmount > 0 ? "var(--danger-color)" : "var(--text-primary)";
                }

                const select = document.getElementById("tax-wallet-select");
                if (!Array.isArray(wallets) || wallets.length === 0) {
                    select.innerHTML = '<option value="">口座がありません</option>';
                    return;
                }
                select.innerHTML = wallets.map(w => 
                    `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} - 残高:${w.balance}G</option>`
                ).join('');
            }
        } catch (e) { console.error(e); }
    }

    async function saveProfile() {
        const nickname = document.getElementById("nickname").value;
        const real_name = document.getElementById("real-name").value;
        try {
            const res = await fetch("/api/profile", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ nickname, real_name })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message || "プロフィールを更新しました");
                loadProfile();
            } else {
                alert("エラー: " + (data.detail || "プロフィールの保存に失敗しました"));
            }
        } catch (e) { alert("通信エラーが発生しました: " + e.message); }
    }

    async function payTax() {
        const wallet_id = document.getElementById("tax-wallet-select").value;
        if (!wallet_id) return alert("受取口座を選択してください");
        try {
            const res = await fetch("/api/pay-tax", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ wallet_id })
            });
            const data = await res.json();
            alert(res.ok ? data.message : "エラー: " + data.detail);
            if (res.ok) loadWalletsForTax();
        } catch (e) { console.error(e); }
    }

    async function collectAllTax() {
        if (!confirm("全国民から所得税を即時徴収します。よろしいですか？")) return;
        try {
            const res = await fetch("/api/admin/collect-tax", {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` }
            });
            const data = await res.json();
            if (res.ok) {
                alert(`徴収完了\n対象: ${data.processed_wallets || data.processed_count}件\n総徴収額: ${data.total_tax_collected || 0} G`);
                loadWalletsForTax();
            } else {
                alert("エラー: " + (data.detail || "徴収に失敗しました"));
            }
        } catch (e) { alert("通信エラーが発生しました"); }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/";
    }

    /* Alley Modal Handlers */
    function openAlleyModal() {
        document.getElementById("alley-text").innerHTML = "「……あ？ なんだお前、俺に何か用か？」";
        document.getElementById("alley-choices-initial").style.display = "flex";
        document.getElementById("alley-choices-factory").style.display = "none";
        document.getElementById("alley-choices-loan").style.display = "none";
        document.getElementById("alley-modal").style.display = "flex";
    }
    function closeAlleyModal() { document.getElementById("alley-modal").style.display = "none"; }
    function chooseWork() {
        document.getElementById("alley-text").innerHTML = "「おい…声がでけぇ、しっ！ 静かにしろ。<br><br>お前、稼ぎに困ってんだろ？ 特別な仕事がある。<br>この国に『国立機械工場』ってのがあるのは知ってるよな？ あそこが今、深刻な人手不足で生産が滞りかけてんだ。<br><br>誰でもできる簡単な作業で、報酬は作った分だけその場で支払われる完全歩合制の即金だ。<br>どうだ、工場へ行って一稼ぎするか？」";
        document.getElementById("alley-choices-initial").style.display = "none";
        document.getElementById("alley-choices-factory").style.display = "flex";
    }
    function chooseLoan() {
        document.getElementById("alley-text").innerHTML = "「……カネ、だと？ ククッ、いい顔つきになってきやがったな。<br><br>カジノで全部スッちまったか？ それとも一発デカい勝負を仕掛けたいって口か。<br>表の銀行じゃ門前払いの奴らでも、この裏路地の闇金融ならカネの余った奴らがいくらでも融資枠をぶら下げて待ってるぜ。<br><br>ただし、借りたカネはきっちり利息乗せて返せよ。返さねぇ奴は朝9時にキッチリ強制回収だ。<br>……覚悟があるなら、裏金融を覗いてきな。」";
        document.getElementById("alley-choices-initial").style.display = "none";
        document.getElementById("alley-choices-loan").style.display = "flex";
    }

    /* Policy Modal Handlers */
    let isPolicyFetching = false;
    async function openPolicyViewer() {
        if (isPolicyFetching) return;
        const modal = document.getElementById("policy-view-modal");
        const contentBox = document.getElementById("policy-view-content");
        try {
            isPolicyFetching = true;
            contentBox.innerText = "規約を読み込んでいます...";
            modal.style.display = "flex";
            const res = await fetch("/api/policy/latest");
            if (res.ok) {
                const data = await res.json();
                contentBox.innerText = data.content || "規約本文がありません。";
            } else {
                contentBox.innerText = "規約の読み込みに失敗しました。";
            }
        } catch (e) {
            contentBox.innerText = "通信エラーが発生しました。";
        } finally { isPolicyFetching = false; }
    }
    function closePolicyViewer() { document.getElementById("policy-view-modal").style.display = "none"; }
</script>

<script>
/* Terms Agreement Auto-Check */
document.addEventListener("DOMContentLoaded", async () => {
    const token = localStorage.getItem("access_token");
    const modalEl = document.getElementById("terms-modal");
    const contentBoxEl = document.getElementById("terms-content-box");
    const agreeBtn = document.getElementById("agree-terms-btn");
    if (!token || !modalEl || !contentBoxEl || !agreeBtn) return;
    try {
        const statusRes = await fetch("/api/policy/status", { headers: { "Authorization": `Bearer ${token}` } });
        if (!statusRes.ok) return;
        const statusData = await statusRes.json();
        if (statusData.needs_agreement) {
            const latestRes = await fetch("/api/policy/latest");
            if (!latestRes.ok) return;
            const latestData = await latestRes.json();
            contentBoxEl.innerText = latestData.content;
            modalEl.style.display = "flex";
            agreeBtn.onclick = async () => {
                agreeBtn.disabled = true;
                try {
                    const agreeRes = await fetch("/api/policy/agree", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                        body: JSON.stringify({ version: latestData.version })
                    });
                    if (agreeRes.ok) modalEl.style.display = "none";
                    else {
                        const errData = await agreeRes.json();
                        alert("エラー: " + (errData.detail || "送信失敗"));
                        agreeBtn.disabled = false;
                    }
                } catch (err) { alert("通信エラー"); agreeBtn.disabled = false; }
            };
        }
    } catch (e) { console.error(e); }
});
</script>
