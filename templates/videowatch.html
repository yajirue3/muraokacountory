<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>映像再生 - 王国映像記録館</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; }
        .nav-bar { background: #1a1a1a; padding: 12px 20px; border-bottom: 1px solid #333; }
        .btn { padding: 6px 12px; background: #2a2a2a; color: #fff; text-decoration: none; border-radius: 4px; border: 1px solid #444; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; border: 1px solid #333; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .video-title { font-size: 1.4rem; color: #d4af37; margin: 0 0 10px 0; }
        .video-desc { background: #1e1e1e; padding: 12px; border-radius: 6px; font-size: 0.9rem; color: #ccc; margin-bottom: 20px; white-space: pre-wrap; }
        .comment-section h3 { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .comment-input { width: 100%; padding: 10px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #444; color: #fff; border-radius: 4px; margin-bottom: 10px; resize: vertical; }
        .comment-submit { background: #d4af37; color: #000; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .comment-list { margin-top: 20px; }
        .comment-item { background: #1a1a1a; padding: 10px; border-radius: 4px; margin-bottom: 10px; border-left: 3px solid #d4af37; }
        .comment-author { font-size: 0.8rem; color: #888; margin-bottom: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="/videos" class="btn">← 記録館へ戻る</a>
    </div>
    <div class="container">
        <div id="player-container" class="player-wrapper"></div>
        <h1 class="video-title" id="v-title">読み込み中...</h1>
        <div class="video-desc" id="v-desc"></div>

        <div class="comment-section">
            <h3>民の言葉 (コメント)</h3>
            <textarea id="comment-text" class="comment-input" rows="3" placeholder="感想を残す..."></textarea>
            <button class="comment-submit" onclick="postComment()">言葉を残す</button>
            <div class="comment-list" id="comments"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (!token || !videoId) window.location.href = "/videos";

        async function loadVideo() {
            try {
                const res = await fetch(`/api/videos/${videoId}`, { headers: { "Authorization": `Bearer ${token}` } });
                if (!res.ok) throw new Error("再生できません");
                const v = await res.json();
                document.getElementById("v-title").innerText = v.title;
                document.getElementById("v-desc").innerText = `記録者: ${v.author_name}\n\n${v.description}`;
                // Driveのプレビュー用URL
                document.getElementById("player-container").innerHTML = `<iframe src="https://drive.google.com/file/d/${v.drive_file_id}/preview" allow="autoplay"></iframe>`;
                loadComments();
            } catch(e) {
                alert(e.message);
                window.location.href = "/videos";
            }
        }

        async function loadComments() {
            const res = await fetch(`/api/videos/${videoId}/comments`);
            const comments = await res.json();
            const box = document.getElementById("comments");
            box.innerHTML = comments.map(c => `
                <div class="comment-item">
                    <div class="comment-author">${c.profiles?.nickname || c.author_name}</div>
                    <div>${c.content.replace(/</g, "&lt;")}</div>
                </div>
            `).join('');
        }

        async function postComment() {
            const txt = document.getElementById("comment-text").value.trim();
            if(!txt) return;
            await fetch(`/api/videos/${videoId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ content: txt })
            });
            document.getElementById("comment-text").value = "";
            loadComments();
        }

        loadVideo();
    </script>
</body>
</html>
