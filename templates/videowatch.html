<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>映像再生</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; }
        .header { background: #1e1e1e; padding: 12px 20px; border-bottom: 1px solid #333; }
        .btn { padding: 6px 12px; background: #2a2a2a; color: #d4af37; text-decoration: none; border-radius: 4px; border: 1px solid #444; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .player { background: #000; width: 100%; aspect-ratio: 16/9; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .player iframe { width: 100%; height: 100%; border: none; border-radius: 8px; }
        .info { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        .info h1 { margin: 0 0 10px 0; font-size: 1.4rem; color: #fff; }
        .info .meta { color: #888; font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .comments { background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .c-form { display: flex; gap: 10px; margin-bottom: 20px; }
        .c-form input { flex: 1; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .c-form button { padding: 10px 16px; background: #d4af37; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .c-item { background: #2a2a2a; padding: 10px; border-radius: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .c-del { color: #e74c3c; background: none; border: none; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="header"><a href="/videos" class="btn">← 戻る</a></div>
    <div class="container">
        <div class="player" id="player">読み込み中...</div>
        <div class="info">
            <h1 id="v-title">-</h1>
            <div class="meta" id="v-meta">-</div>
            <div id="v-desc" style="white-space: pre-wrap;">-</div>
        </div>
        <div class="comments">
            <h3 style="margin-top:0; color:#d4af37;">コメント</h3>
            <div class="c-form">
                <input type="text" id="c-input" placeholder="感想を入力...">
                <button onclick="postComment()">送信</button>
            </div>
            <div id="c-list"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        const videoId = new URLSearchParams(location.search).get('v');
        if (!token || !videoId) location.href = "/videos";

        async function init() {
            try {
                const res = await fetch(`/api/videos/${videoId}`, { headers: { "Authorization": `Bearer ${token}` } });
                if (!res.ok) throw new Error();
                const v = await res.json();
                
                document.getElementById("v-title").innerText = v.title;
                document.getElementById("v-meta").innerText = `👤 ${v.author_name} | 👀 ${v.views || 0}回`;
                document.getElementById("v-desc").innerText = v.description || "説明なし";
                document.getElementById("player").innerHTML = `<iframe src="https://drive.google.com/file/d/${v.drive_file_id}/preview"></iframe>`;
                
                loadComments();
            } catch(e) {
                alert("再生できません");
                location.href = "/videos";
            }
        }

        async function loadComments() {
            const res = await fetch(`/api/videos/${videoId}/comments`);
            const data = await res.json();
            document.getElementById("c-list").innerHTML = data.map(c => `
                <div class="c-item">
                    <div>
                        <div style="font-size:0.8rem; color:#d4af37; margin-bottom:4px;">${c.author_name}</div>
                        <div>${c.content}</div>
                    </div>
                    <button class="c-del" onclick="delComment('${c.id}')">削除</button>
                </div>
            `).join('');
        }

        async function postComment() {
            const val = document.getElementById("c-input").value;
            if(!val.trim()) return;
            const res = await fetch(`/api/videos/${videoId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ content: val })
            });
            if (res.ok) {
                document.getElementById("c-input").value = "";
                loadComments();
            }
        }

        async function delComment(id) {
            if(!confirm("削除しますか？")) return;
            const res = await fetch(`/api/comments/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
            if (res.ok) loadComments();
            else alert("権限がありません");
        }

        init();
    </script>
</body>
</html>
