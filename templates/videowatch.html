<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動画再生 - M-Tube</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #ffffff; color: #0f0f0f; -webkit-font-smoothing: antialiased; padding-bottom: 70px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 56px; position: sticky; top: 0; background: #ffffff; z-index: 100; border-bottom: 1px solid #e5e5e5; }
        .back-btn { text-decoration: none; color: #0f0f0f; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .logo { font-size: 18px; font-weight: bold; color: #0f0f0f; text-decoration: none; letter-spacing: -0.5px; }
        .logo span { color: #cc0000; }

        /* ボトムナビゲーション */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; height: 56px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #0f0f0f; width: 100%; height: 100%; cursor: pointer; border: none; background: transparent; padding: 0; margin: 0; }
        .nav-item .icon-wrap { height: 24px; display: flex; align-items: center; justify-content: center; }
        .nav-item .icon { font-size: 20px; line-height: 1; }
        .nav-item .icon-plus { font-size: 24px; line-height: 1; font-weight: 300; }
        .nav-item .label { font-size: 10px; font-weight: 500; margin-top: 2px; line-height: 1; }
        .nav-item:hover { background: #f2f2f2; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0; }
        
        /* プレイヤー設定 */
        .player-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; background: #000000; overflow: hidden; }
        .player-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        
        .info { padding: 16px; border-bottom: 1px solid #e5e5e5; }
        .title { font-size: 18px; font-weight: bold; margin: 0 0 8px 0; line-height: 1.4; }
        .meta { font-size: 14px; color: #606060; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .channel-info { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .channel-author-wrap { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #cc0000; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; object-fit: cover; flex-shrink: 0; }
        .author-name { font-weight: 500; font-size: 15px; }

        /* 登録ボタン */
        .btn-subscribe { background: #0f0f0f; color: #ffffff; border: none; padding: 0 16px; height: 36px; border-radius: 18px; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .btn-subscribe:hover { background: #272727; }
        .btn-subscribe.subscribed { background: #f2f2f2; color: #0f0f0f; }
        .btn-subscribe.subscribed:hover { background: #e5e5e5; }

        .desc-box { background: #f2f2f2; border-radius: 12px; padding: 12px; font-size: 14px; white-space: pre-wrap; line-height: 1.5; color: #0f0f0f; }

        /* コメント */
        .comments { padding: 16px; }
        .comment-count { font-size: 16px; font-weight: bold; margin-bottom: 20px; }
        .c-form { display: flex; gap: 16px; margin-bottom: 24px; }
        .c-input-wrapper { flex: 1; display: flex; flex-direction: column; }
        .c-input-wrapper input { width: 100%; border: none; border-bottom: 1px solid #737373; padding: 4px 0; font-size: 14px; font-family: inherit; background: transparent; transition: border-bottom-color 0.2s; box-sizing: border-box; }
        .c-input-wrapper input:focus { outline: none; border-bottom: 2px solid #0f0f0f; }
        .c-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
        .btn-submit { background: #f2f2f2; color: #0f0f0f; border: none; padding: 8px 16px; border-radius: 18px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: #e5e5e5; }
        .btn-submit.active { background: #065fd4; color: #fff; }

        .c-item { display: flex; gap: 12px; margin-bottom: 16px; }
        .c-avatar { width: 36px; height: 36px; border-radius: 50%; background: #606060; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; object-fit: cover; }
        .c-content-wrap { flex: 1; }
        .c-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .c-author { font-size: 13px; font-weight: 500; }
        .c-text { font-size: 14px; line-height: 1.4; color: #0f0f0f; }
        .c-del { color: #606060; background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 500; padding: 4px 8px; border-radius: 12px; }
        .c-del:hover { background: #f2f2f2; }

        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 200; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #ffffff; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal h3 { margin: 0 0 20px 0; font-size: 18px; color: #0f0f0f; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: #606060; }
        .modal input[type="text"], .modal textarea, .modal input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 14px; }
        .modal input[type="text"]:focus, .modal textarea:focus { outline: none; border-color: #0f0f0f; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 20px 0; cursor: pointer; color: #0f0f0f; }
        .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .btn { border: none; border-radius: 18px; padding: 0 16px; height: 36px; font-size: 14px; font-weight: 500; cursor: pointer; background: #f2f2f2; color: #0f0f0f; display: inline-flex; align-items: center; justify-content: center; }
        .btn:hover { background: #e5e5e5; }
        .btn-primary { background: #cc0000; color: #ffffff; }
        .btn-primary:hover { background: #990000; }

        @media (min-width: 1000px) {
            .container { padding: 24px; }
            .player-wrapper { border-radius: 12px; }
            header { display: none; }
            .bottom-nav { display: none; }
            body { padding-bottom: 0; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/videos" class="back-btn">← 戻る</a>
        <div class="logo"><span>▶</span> M-Tube</div>
        <div style="width: 60px;"></div>
    </header>

    <div class="container">
        <!-- ストリーミングプレイヤー -->
        <div class="player-wrapper" id="player-container">
            <div style="position: absolute; top:50%; left:50%; transform:translate(-50%, -50%); color:#fff;">読み込み中...</div>
        </div>

        <div class="info">
            <h1 class="title" id="v-title">読み込み中...</h1>
            <div class="meta" id="v-meta">
                <span id="v-views">0 回視聴</span>
            </div>
            
            <div class="channel-info">
                <a href="#" id="v-author-link" class="channel-author-wrap">
                    <div id="v-avatar-container">
                        <div class="avatar" id="v-avatar">?</div>
                    </div>
                    <div class="author-name" id="v-author">名無し</div>
                </a>
                <button class="btn-subscribe" id="btn-subscribe" onclick="toggleSubscribe()" style="display: none;">チャンネル登録</button>
            </div>

            <div class="desc-box" id="v-desc"></div>
        </div>

        <div class="comments">
            <div class="comment-count" id="c-count">コメント</div>
            <div class="c-form">
                <div id="my-avatar-container">
                    <div class="c-avatar" id="my-avatar">👤</div>
                </div>
                <div class="c-input-wrapper">
                    <input type="text" id="c-input" placeholder="コメントを追加..." oninput="checkInput()">
                    <div class="c-actions">
                        <button class="btn-submit" id="btn-submit" onclick="postComment()" disabled>コメント</button>
                    </div>
                </div>
            </div>
            <div id="c-list"></div>
        </div>
    </div>

    <!-- スマホ用下部ナビゲーション -->
    <nav class="bottom-nav">
        <a href="/videos" class="nav-item">
            <div class="icon-wrap"><span class="icon">🎬</span></div>
            <span class="label">動画一覧</span>
        </a>
        <a href="javascript:void(0)" id="my-channel-btn" onclick="goToMyChannel()" class="nav-item">
            <div class="icon-wrap"><span class="icon">👤</span></div>
            <span class="label">チャンネル</span>
        </a>
        <div class="nav-item" onclick="document.getElementById('modal').style.display='flex'">
            <div class="icon-wrap"><span class="icon-plus">⊕</span></div>
            <span class="label">アップロード</span>
        </div>
        <a href="/subscribe" class="nav-item">
            <div class="icon-wrap"><span class="icon">🔔</span></div>
            <span class="label">登録チャンネル</span>
        </a>
        <a href="/manage_videos" class="nav-item">
            <div class="icon-wrap"><span class="icon">⚙️</span></div>
            <span class="label">管理</span>
        </a>
    </nav>

    <!-- アップロード用モーダル -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>動画のアップロード</h3>
            <form onsubmit="uploadVideo(event)">
                <div class="form-group">
                    <label class="form-label">タイトル (必須)</label>
                    <input type="text" id="up-title" required placeholder="タイトルを追加">
                </div>
                <div class="form-group">
                    <label class="form-label">説明 (任意)</label>
                    <textarea id="up-desc" placeholder="動画について視聴者に伝える..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">動画ファイル (必須)</label>
                    <input type="file" id="up-file" accept="video/*" required>
                </div>
                <div class="form-group">
                    <label class="form-label">サムネイル画像 (任意)</label>
                    <input type="file" id="up-thumb" accept="image/*">
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="up-private"> 非公開
                </label>
                <div class="actions">
                    <button type="button" class="btn" onclick="document.getElementById('modal').style.display='none'">キャンセル</button>
                    <button type="submit" class="btn btn-primary" id="btn-up">アップロード</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("access_token");
        const videoId = new URLSearchParams(location.search).get('v');
        if (!token || !videoId) location.href = "/videos";

        let myUserId = null;
        let authorUserId = null;
        let isSubscribed = false;

        // アイコン要素生成ヘルパー
        function createAvatarHTML(avatarDriveId, name, className = 'avatar') {
            if (avatarDriveId) {
                const src = `https://drive.google.com/thumbnail?id=${avatarDriveId}&sz=w100`;
                return `<img src="${src}" class="${className}" alt="${name || ''}">`;
            } else {
                const initial = (name && name.length > 0) ? name.charAt(0).toUpperCase() : '?';
                return `<div class="${className}">${initial}</div>`;
            }
        }

        async function goToMyChannel() {
            if (myUserId) {
                location.href = `/channel?id=${myUserId}`;
                return;
            }
            try {
                const res = await fetch("/api/profile/me", { headers: { "Authorization": `Bearer ${token}` } });
                if (res.ok) {
                    const profile = await res.json();
                    if (profile && profile.id) {
                        myUserId = profile.id;
                        location.href = `/channel?id=${myUserId}`;
                    } else {
                        location.href = "/channel";
                    }
                } else {
                    location.href = "/channel";
                }
            } catch(e) {
                location.href = "/channel";
            }
        }

        async function init() {
            try {
                // 自分のプロフィール情報・アイコンを取得
                fetch("/api/profile/me", { headers: { "Authorization": `Bearer ${token}` } })
                    .then(r => r.ok ? r.json() : null)
                    .then(prof => { 
                        if (prof) {
                            myUserId = prof.id;
                            const myAvatarWrap = document.getElementById("my-avatar-container");
                            myAvatarWrap.innerHTML = createAvatarHTML(prof.avatar_drive_id || prof.avatar_url, prof.nickname || prof.username, "c-avatar");
                        }
                    })
                    .catch(() => {});

                // 動画詳細取得
                const res = await fetch(`/api/videos/${videoId}`, { headers: { "Authorization": `Bearer ${token}` } });
                if (!res.ok) throw new Error();
                const v = await res.json();
                
                authorUserId = v.author_id || v.user_id;

                document.getElementById("v-title").innerText = v.title;
                document.getElementById("v-views").innerText = `${v.views || 0} 回視聴`;
                document.getElementById("v-author").innerText = v.author_name || "名無し";
                document.getElementById("v-desc").innerText = v.description || "説明はありません。";
                
                if (authorUserId) {
                    document.getElementById("v-author-link").href = `/channel?id=${authorUserId}`;
                }

                // アイコンの判定＆表示
                const avatarDriveId = v.author_avatar_drive_id || v.avatar_drive_id || v.author_avatar;
                document.getElementById("v-avatar-container").innerHTML = createAvatarHTML(avatarDriveId, v.author_name, "avatar");
                
                // 動画プレイヤー
                document.getElementById("player-container").innerHTML = `
                    <video controls autoplay playsinline>
                        <source src="/api/videos/${videoId}/stream" type="video/mp4">
                        お使いのブラウザは動画の再生に対応していません。
                    </video>
                `;
                
                // チャンネル登録ボタンの初期設定
                checkSubscriptionStatus();

                loadComments();
            } catch(e) {
                alert("再生できません。権限がないか、動画が存在しません。");
                location.href = "/videos";
            }
        }

        // 登録状態の判定
        async function checkSubscriptionStatus() {
            if (!authorUserId) return;
            const subBtn = document.getElementById("btn-subscribe");
            
            // 自分の動画の場合は登録ボタンを表示しない
            if (myUserId && myUserId === authorUserId) {
                subBtn.style.display = "none";
                return;
            }

            try {
                const res = await fetch(`/api/subscriptions/check?channel_id=${authorUserId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    isSubscribed = !!data.is_subscribed;
                }
            } catch(e) {}

            updateSubscribeButton();
            subBtn.style.display = "inline-flex";
        }

        function updateSubscribeButton() {
            const subBtn = document.getElementById("btn-subscribe");
            if (isSubscribed) {
                subBtn.innerText = "登録済み";
                subBtn.classList.add("subscribed");
            } else {
                subBtn.innerText = "チャンネル登録";
                subBtn.classList.remove("subscribed");
            }
        }

        // チャンネル登録 / 解除の実行
        async function toggleSubscribe() {
            if (!authorUserId) return;
            const subBtn = document.getElementById("btn-subscribe");
            subBtn.disabled = true;

            const method = isSubscribed ? "DELETE" : "POST";
            try {
                const res = await fetch(`/api/channels/${authorUserId}/subscribe`, {
                    method: method,
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.ok) {
                    isSubscribed = !isSubscribed;
                    updateSubscribeButton();
                } else {
                    alert("処理に失敗しました。");
                }
            } catch(e) {
                alert("通信エラーが発生しました。");
            } finally {
                subBtn.disabled = false;
            }
        }

        // コメント一覧読み込み
        async function loadComments() {
            try {
                const res = await fetch(`/api/videos/${videoId}/comments`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById("c-count").innerText = `コメント (${data.length})`;
                document.getElementById("c-list").innerHTML = data.map(c => {
                    const avatarHTML = createAvatarHTML(c.author_avatar_drive_id || c.avatar_drive_id, c.author_name, "c-avatar");
                    const canDelete = (myUserId && (c.author_id === myUserId || c.user_id === myUserId));

                    return `
                    <div class="c-item">
                        ${avatarHTML}
                        <div class="c-content-wrap">
                            <div class="c-header">
                                <div class="c-author">${c.author_name || '名無し'}</div>
                                ${canDelete ? `<button class="c-del" onclick="delComment('${c.id}')">削除</button>` : ''}
                            </div>
                            <div class="c-text">${c.content}</div>
                        </div>
                    </div>
                `}).join('');
            } catch(e) {
                console.error(e);
            }
        }

        function checkInput() {
            const val = document.getElementById("c-input").value.trim();
            const btn = document.getElementById("btn-submit");
            if (val) {
                btn.disabled = false;
                btn.classList.add("active");
            } else {
                btn.disabled = true;
                btn.classList.remove("active");
            }
        }

        async function postComment() {
            const val = document.getElementById("c-input").value;
            if(!val.trim()) return;
            
            const btn = document.getElementById("btn-submit");
            btn.disabled = true;
            
            try {
                const res = await fetch(`/api/videos/${videoId}/comments`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify({ content: val })
                });
                if (res.ok) {
                    document.getElementById("c-input").value = "";
                    checkInput();
                    loadComments();
                } else {
                    alert("コメントの投稿に失敗しました");
                    btn.disabled = false;
                }
            } catch(e) {
                alert("通信エラーが発生しました");
                btn.disabled = false;
            }
        }

        async function delComment(id) {
            if(!confirm("このコメントを削除しますか？")) return;
            try {
                const res = await fetch(`/api/comments/${id}`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}` } });
                if (res.ok) {
                    loadComments();
                } else {
                    alert("削除する権限がないか、エラーが発生しました");
                }
            } catch(e) {
                alert("通信エラーが発生しました");
            }
        }

        // アップロード処理
        async function uploadVideo(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-up");
            btn.disabled = true;
            btn.innerText = "アップロード中...";

            const fd = new FormData();
            fd.append("title", document.getElementById("up-title").value);
            fd.append("description", document.getElementById("up-desc").value);
            fd.append("is_private", document.getElementById("up-private").checked);
            fd.append("file", document.getElementById("up-file").files[0]);

            const thumbFile = document.getElementById("up-thumb").files[0];
            if (thumbFile) {
                fd.append("thumbnail", thumbFile);
            }

            try {
                const res = await fetch("/api/videos/upload", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${token}` },
                    body: fd
                });
                
                if (res.ok) {
                    alert("アップロードが完了しました");
                    document.getElementById("modal").style.display = 'none';
                    e.target.reset();
                } else {
                    const err = await res.json();
                    alert("エラー: " + (err.detail || "アップロード失敗"));
                }
            } catch(e) {
                alert("通信エラーが発生しました");
            } finally {
                btn.disabled = false;
                btn.innerText = "アップロード";
            }
        }

        init();
    </script>
</body>
</html>
