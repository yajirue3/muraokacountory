<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 民営ショッピングモール (Mall)</title>
    <style>
        :root {
            --bg-dark: #0f1115; --card-bg: #1c1e24; --border: #333842; 
            --gold: #d4af37; --success: #10b981; --blue: #3b82f6; --purple: #8e44ad; 
            --text-main: #e2e8f0; --text-muted: #94a3b8; --danger: #ef4444;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 20px 0; margin: 0; min-height: 100vh; }
        .container { width: 100%; max-width: 650px; display: flex; flex-direction: column; gap: 16px; padding: 0 10px; box-sizing: border-box; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { font-size: 1.3rem; font-weight: 800; color: var(--gold); text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
        
        .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tab-btn { flex: 1; min-width: 30%; padding: 10px 4px; background: #262932; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: rgba(212, 175, 55, 0.1); color: var(--gold); border-color: var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .shop-card { background: #15171a; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer; transition: 0.2s; overflow: hidden; display: flex; flex-direction: column; }
        .shop-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .shop-banner { width: 100%; height: 110px; object-fit: cover; background: #262932; display: block; }
        .shop-info { padding: 12px; }

        .item-row { background: #15171a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
        .type-badge { padding: 3px 6px; border-radius: 6px; font-size: 0.65rem; font-weight: bold; }
        .badge-item { background: rgba(59,130,246,0.2); color: var(--blue); border: 1px solid var(--blue); }
        .badge-general { background: rgba(142,68,173,0.2); color: var(--purple); border: 1px solid var(--purple); }
        .badge-unlimited { background: rgba(16,185,129,0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-soldout { background: rgba(239,68,68,0.2); color: var(--danger); border: 1px solid var(--danger); }

        .price-text { font-size: 1.2rem; font-weight: bold; color: var(--gold); }

        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #15171a; color: #fff; box-sizing: border-box; margin-bottom: 12px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.1s; margin-top: 8px; }
        button:active:not(:disabled) { transform: scale(0.96) translateY(2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-action { background: linear-gradient(145deg, var(--gold), #b8860b); color: #1a1a1a; }
        .btn-sub { background: #262932; color: #fff; border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); color: #fff; }

        #shop-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        .modal-content { background: var(--bg-dark); width: 100%; max-width: 650px; height: 90vh; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 30px rgba(212,175,55,0.2); }
        .modal-header { padding: 12px 16px; background: #15171a; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { background: rgba(30,30,30,0.95); border-left: 4px solid var(--gold); padding: 12px 20px; border-radius: 6px; color: #fff; animation: fadein 0.3s, fadeout 0.3s 2.7s forwards; }
        @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }

        @media (max-width: 768px) {
            body { padding: 10px 0; }
            .container { padding: 0 6px; }
            .modal-content { height: 100vh; max-height: 100vh; border-radius: 0; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="container">
    <div class="card">
        <div class="header">🏬 民営ショッピングモール</div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shops', this)">🛍️ 商店街</button>
            <button class="tab-btn" onclick="switchTab('myshop', this)">🏪 マイショップ</button>
            <button class="tab-btn" onclick="switchTab('orders', this)">📜 購入履歴</button>
        </div>

        <div id="tab-shops" class="tab-content active">
            <div id="shop-list"><div style="text-align:center; color:#888;">読み込み中...</div></div>
            <button class="btn-sub" onclick="loadShops()">🔄 商店街を更新</button>
        </div>

        <div id="tab-myshop" class="tab-content">
            <div style="background:#15171a; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:16px;">
                <h4 style="color:var(--gold); margin:0 0 10px 0;">⚙️ 店舗設定</h4>
                <label style="font-size:0.75rem; color:#94a3b8;">店舗名 (1〜30文字)</label>
                <input type="text" id="shop-name-input" placeholder="例: 奴隷のよろず屋" maxlength="30">

                <label style="font-size:0.75rem; color:#94a3b8;">看板・紹介メッセージ</label>
                <textarea id="shop-desc-input" placeholder="お店のこだわりや取扱品" rows="2" maxlength="300"></textarea>

                <label style="font-size:0.75rem; color:#94a3b8;">売上受取用 Gold口座</label>
                <select id="shop-wallet-select"></select>

                <label style="font-size:0.75rem; color:#94a3b8;">看板画像アップロード (任意・5MB以下)</label>
                <input type="file" id="shop-banner-file" accept="image/*">

                <button class="btn-action" onclick="saveMyShopSettings()">店舗情報を保存・更新</button>
            </div>

            <div id="item-create-section" style="display:none; background:#15171a; border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:16px;">
                <h4 style="color:var(--gold); margin:0 0 10px 0;">📦 新規商品を出品する</h4>
                <select id="item-cat-select" onchange="toggleItemCatForm()">
                    <option value="ITEM">🎒 手持ちアイテムを出品 (インベントリ連動)</option>
                    <option value="GENERAL">📜 一般・デジタル情報・サービス等</option>
                </select>

                <div id="cat-item-area">
                    <label style="font-size:0.75rem; color:#94a3b8;">出品するアイテム口座</label>
                    <select id="item-inv-select"></select>
                </div>

                <div id="cat-general-area" style="display:none;">
                    <label style="font-size:0.75rem; color:#94a3b8;">商品タイトル</label>
                    <input type="text" id="item-title-input" placeholder="タイトル (例: 鉱山ダンジョン攻略メモ)" maxlength="60">

                    <label style="font-size:0.75rem; color:#94a3b8;">購入者限定の秘密情報（合言葉・URL・連絡先など）</label>
                    <textarea id="item-secret-input" placeholder="購入した国民にのみ開示されます" rows="2"></textarea>

                    <label style="font-size:0.75rem; color:#94a3b8;">在庫モード</label>
                    <select id="item-unlimited-select" onchange="toggleUnlimited()">
                        <option value="false">数量限定 (在庫管理)</option>
                        <option value="true">無制限 (売り切れなし)</option>
                    </select>
                </div>

                <label style="font-size:0.75rem; color:#94a3b8;">商品説明</label>
                <textarea id="item-desc-input" placeholder="商品の特徴・注意点" rows="2" maxlength="500"></textarea>

                <div id="stock-input-wrapper">
                    <label style="font-size:0.75rem; color:#94a3b8;">初期在庫数</label>
                    <input type="number" id="item-stock-input" min="1" value="1">
                </div>

                <label style="font-size:0.75rem; color:#94a3b8;">販売単価 (1個あたり Gold)</label>
                <input type="number" id="item-price-input" min="1" placeholder="価格 (G)">

                <button class="btn-action" onclick="submitCreateItem()">商品棚に並べる</button>
            </div>

            <h4 style="color:var(--gold); margin:0 0 10px 0;">📋 現在の商品棚</h4>
            <div id="my-items-list"><div style="text-align:center; color:#888;">商品を読み込み中...</div></div>
        </div>

        <div id="tab-orders" class="tab-content">
            <div id="order-list"><div style="text-align:center; color:#888;">購入履歴を読み込み中...</div></div>
            <button class="btn-sub" onclick="loadMyOrders()">🔄 履歴を更新</button>
        </div>

        <button class="btn-sub" style="margin-top:20px;" onclick="location.href='/dashboard'">◀ ダッシュボードへ戻る</button>
    </div>
</div>

<div id="shop-modal">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-shop-title" style="font-weight:bold; color:var(--gold);"></span>
            <button class="btn-sub" style="width:auto; margin:0; padding:6px 14px; font-size:0.8rem;" onclick="closeShopModal()">✖ 閉じる</button>
        </div>
        <div class="modal-body">
            <img id="modal-shop-banner" class="shop-banner" style="height:140px; border-radius:8px; display:none;">
            <div id="modal-shop-owner" style="font-size:0.85rem; color:var(--text-muted);"></div>
            <div id="modal-shop-desc" style="background:#15171a; padding:10px; border-radius:8px; font-size:0.85rem; white-space:pre-wrap;"></div>

            <h4 style="color:var(--gold); margin:10px 0 0 0;">陳列中の商品</h4>
            <div id="modal-items-list"></div>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let currentUser = null;
    let myWallets = [];
    let myItemAccounts = [];
    let currentMyShop = null;

    async function init() {
        await Promise.allSettled([
            loadProfile(),
            loadWallets(),
            loadInventory(),
            loadShops(),
            loadMyShop()
        ]);
    }

    function showToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        if (isError) toast.style.borderLeftColor = 'var(--danger)';
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) { return String(str||'').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${tabId}`).classList.add('active');
        if(tabId === 'orders') loadMyOrders();
        if(tabId === 'myshop') loadMyShop();
    }

    async function loadProfile() {
        try {
            const res = await fetch("/api/profile", { headers: { "Authorization": `Bearer ${token}` } });
            if(res.ok) currentUser = await res.json();
        } catch(e) { console.error("loadProfile error:", e); }
    }

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if(res.ok) {
                myWallets = await res.json();
                const opts = myWallets.map(w => `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (残:${w.balance}G)</option>`).join('');
                document.getElementById("shop-wallet-select").innerHTML = opts;
            }
        } catch(e) { console.error("loadWallets error:", e); }
    }

    async function loadInventory() {
        try {
            const res = await fetch("/api/inventory", { headers: { "Authorization": `Bearer ${token}` } });
            if(res.ok) {
                const data = await res.json();
                myItemAccounts = data.accounts || [];
                let opts = '';
                myItemAccounts.forEach(acc => {
                    if(acc.user_inventories) {
                        acc.user_inventories.forEach(inv => {
                            opts += `<option value="${inv.id}">[${escapeHtml(acc.account_name)}] ${escapeHtml(inv.items.name)} (所持:${inv.quantity})</option>`;
                        });
                    }
                });
                document.getElementById("item-inv-select").innerHTML = opts || '<option value="">アイテムがありません</option>';
            }
        } catch(e) { console.error("loadInventory error:", e); }
    }

    async function loadShops() {
        const listEl = document.getElementById("shop-list");
        try {
            const res = await fetch("/api/mall/shops");
            if(!res.ok) {
                const err = await res.json();
                listEl.innerHTML = `<div style="text-align:center; color:var(--danger);">店舗取得失敗: ${escapeHtml(err.detail || res.statusText)}</div>`;
                return;
            }
            const data = await res.json();
            
            if(!data.shops || data.shops.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#888;">まだ店舗がありません</div>';
                return;
            }

            let html = '';
            data.shops.forEach(s => {
                const owner = s.profiles || {};
                const bannerSrc = s.banner_drive_id ? `https://lh3.googleusercontent.com/u/0/d/${s.banner_drive_id}=w800` : '';
                const bannerTag = bannerSrc ? `<img src="${bannerSrc}" class="shop-banner" onerror="this.style.display='none'">` : '';

                html += `
                    <div class="shop-card" onclick="openShopModal(${s.id})">
                        ${bannerTag}
                        <div class="shop-info">
                            <div style="font-weight:bold; font-size:1.1rem; color:var(--gold);">${escapeHtml(s.shop_name)}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin:3px 0 6px 0;">店主: [${escapeHtml(owner.equipped_title || '奴隷')}] ${escapeHtml(owner.nickname || '不明')}</div>
                            <div style="font-size:0.85rem; color:#ccc;">${escapeHtml(s.description || '挨拶なし')}</div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        } catch(e) {
            console.error("loadShops error:", e);
            listEl.innerHTML = '<div style="text-align:center; color:var(--danger);">通信エラーが発生しました</div>';
        }
    }

    async function openShopModal(shopId) {
        try {
            const res = await fetch(`/api/mall/shops/${shopId}`);
            if(!res.ok) return showToast("店舗情報が取得できませんでした", true);
            const data = await res.json();
            const shop = data.shop;
            const items = data.items || [];
            const owner = shop.profiles || {};

            document.getElementById("modal-shop-title").innerText = `🏪 ${shop.shop_name}`;
            document.getElementById("modal-shop-owner").innerText = `店主: [${owner.equipped_title || '奴隷'}] ${owner.nickname || '不明'}`;
            document.getElementById("modal-shop-desc").innerText = shop.description || '説明なし';

            const bannerImg = document.getElementById("modal-shop-banner");
            if(shop.banner_drive_id) {
                bannerImg.src = `https://lh3.googleusercontent.com/u/0/d/${shop.banner_drive_id}=w800`;
                bannerImg.style.display = 'block';
            } else {
                bannerImg.style.display = 'none';
            }

            const itemsEl = document.getElementById("modal-items-list");
            if(items.length === 0) {
                itemsEl.innerHTML = '<div style="text-align:center; color:#888; padding:20px 0;">現在並んでいる商品はありません</div>';
            } else {
                let html = '';
                items.forEach(it => {
                    const isItem = it.category === 'ITEM';
                    const badgeCat = isItem ? '<span class="type-badge badge-item">🎒 アイテム</span>' : '<span class="type-badge badge-general">📜 一般</span>';
                    const badgeStock = it.is_unlimited ? '<span class="type-badge badge-unlimited">無制限</span>' : (it.stock_quantity > 0 ? `<span class="type-badge" style="background:#262932;">残り ${it.stock_quantity}個</span>` : '<span class="type-badge badge-soldout">売り切れ</span>');
                    const canBuy = (it.is_unlimited || it.stock_quantity > 0) && (shop.owner_user_id !== currentUser?.id);

                    let buyActionHtml = '';
                    if(canBuy) {
                        const walletOpts = myWallets.map(w => `<option value="${w.wallet_id}">${escapeHtml(w.wallet_name)} (残:${w.balance}G)</option>`).join('');
                        let accOpts = '';
                        if(isItem) {
                            accOpts = `<select id="buy-acc-${it.id}" style="margin-bottom:6px;">${myItemAccounts.map(a => `<option value="${a.account_id}">${escapeHtml(a.account_name)}</option>`).join('')}</select>`;
                        }
                        buyActionHtml = `
                            <div style="margin-top:8px; padding-top:8px; border-top:1px dashed var(--border);">
                                <label style="font-size:0.7rem; color:#94a3b8;">支払口座</label>
                                <select id="buy-wallet-${it.id}" style="margin-bottom:6px;">${walletOpts}</select>
                                ${isItem ? `<label style="font-size:0.7rem; color:#94a3b8;">受取アイテム口座</label>${accOpts}` : ''}
                                <div style="display:flex; gap:8px;">
                                    <input type="number" id="buy-qty-${it.id}" value="1" min="1" ${it.is_unlimited ? '' : `max="${it.stock_quantity}"`} style="margin:0; width:80px;">
                                    <button class="btn-action" style="margin:0; flex:1;" onclick="executeBuy(${it.id})">購入する</button>
                                </div>
                            </div>
                        `;
                    } else if(shop.owner_user_id === currentUser?.id) {
                        buyActionHtml = '<div style="font-size:0.75rem; color:#888; margin-top:4px;">※自分の店舗の商品です</div>';
                    }

                    html += `
                        <div class="item-row">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div>${badgeCat} ${badgeStock}</div>
                                <div class="price-text">${it.price} G</div>
                            </div>
                            <div style="font-weight:bold; font-size:1.05rem;">${escapeHtml(it.title)}</div>
                            <div style="font-size:0.8rem; color:#bbb;">${escapeHtml(it.description || '')}</div>
                            ${buyActionHtml}
                        </div>
                    `;
                });
                itemsEl.innerHTML = html;
            }

            document.getElementById("shop-modal").style.display = 'flex';
        } catch(e) { console.error("openShopModal error:", e); }
    }

    function closeShopModal() {
        document.getElementById("shop-modal").style.display = 'none';
    }

    async function executeBuy(itemId) {
        const qty = parseInt(document.getElementById(`buy-qty-${itemId}`).value);
        const walletId = document.getElementById(`buy-wallet-${itemId}`).value;
        const accEl = document.getElementById(`buy-acc-${itemId}`);
        const targetAccId = (accEl && accEl.value) ? accEl.value : null;

        if(!qty || qty <= 0) return showToast("数量を正しく入力してください", true);
        if(!walletId) return showToast("支払口座を選択してください", true);

        try {
            const res = await fetch(`/api/mall/items/${itemId}/buy`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ buyer_wallet_id: walletId, quantity: qty, target_account_id: targetAccId })
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.message);
                closeShopModal();
                await loadWallets();
                await loadInventory();
            } else {
                showToast(data.detail, true);
            }
        } catch(e) { showToast("通信エラー", true); }
    }

    async function loadMyShop() {
        try {
            const res = await fetch("/api/mall/my-shop", { headers: { "Authorization": `Bearer ${token}` } });
            if(!res.ok) {
                document.getElementById("my-items-list").innerHTML = '<div style="text-align:center; color:var(--danger);">店舗情報の読み込みに失敗しました</div>';
                return;
            }
            const data = await res.json();
            currentMyShop = data.shop;

            if(currentMyShop) {
                document.getElementById("shop-name-input").value = currentMyShop.shop_name;
                document.getElementById("shop-desc-input").value = currentMyShop.description || "";
                document.getElementById("shop-wallet-select").value = currentMyShop.wallet_id;
                document.getElementById("item-create-section").style.display = "block";
                renderMyItems(data.items || []);
            } else {
                document.getElementById("item-create-section").style.display = "none";
                document.getElementById("my-items-list").innerHTML = '<div style="text-align:center; color:#888;">店舗を開設すると商品を出品できます</div>';
            }
        } catch(e) { console.error("loadMyShop error:", e); }
    }

    async function saveMyShopSettings() {
        const name = document.getElementById("shop-name-input").value.trim();
        const desc = document.getElementById("shop-desc-input").value.trim();
        const walletId = document.getElementById("shop-wallet-select").value;
        const fileInput = document.getElementById("shop-banner-file");

        if(!name) return showToast("店舗名を入力してください", true);
        if(!walletId) return showToast("売上受取口座を選択してください", true);

        const formData = new FormData();
        formData.append("shop_name", name);
        formData.append("description", desc);
        formData.append("wallet_id", walletId);
        if(fileInput.files.length > 0) {
            formData.append("banner", fileInput.files[0]);
        }

        try {
            const res = await fetch("/api/mall/shops", {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: formData
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.message);
                fileInput.value = "";
                await loadMyShop();
                await loadShops();
            } else {
                showToast(data.detail, true);
            }
        } catch(e) { showToast("通信エラー", true); }
    }

    function toggleItemCatForm() {
        const cat = document.getElementById("item-cat-select").value;
        if(cat === "ITEM") {
            document.getElementById("cat-item-area").style.display = "block";
            document.getElementById("cat-general-area").style.display = "none";
            document.getElementById("stock-input-wrapper").style.display = "block";
        } else {
            document.getElementById("cat-item-area").style.display = "none";
            document.getElementById("cat-general-area").style.display = "block";
            toggleUnlimited();
        }
    }

    function toggleUnlimited() {
        const isUnlimited = document.getElementById("item-unlimited-select").value === "true";
        document.getElementById("stock-input-wrapper").style.display = isUnlimited ? "none" : "block";
    }

    async function submitCreateItem() {
        const cat = document.getElementById("item-cat-select").value;
        const price = parseInt(document.getElementById("item-price-input").value);
        const desc = document.getElementById("item-desc-input").value.trim();

        if(!price || price <= 0) return showToast("価格を正しく入力してください", true);

        const payload = {
            category: cat,
            price: price,
            description: desc,
            stock_quantity: 0,
            is_unlimited: false
        };

        if(cat === "ITEM") {
            payload.user_inventory_id = parseInt(document.getElementById("item-inv-select").value);
            payload.stock_quantity = parseInt(document.getElementById("item-stock-input").value);
            payload.title = "インベントリ出品";
            if(!payload.user_inventory_id) return showToast("出品するアイテムを選択してください", true);
            if(!payload.stock_quantity || payload.stock_quantity <= 0) return showToast("出品数を1個以上にしてください", true);
        } else {
            payload.title = document.getElementById("item-title-input").value.trim();
            payload.secret_content = document.getElementById("item-secret-input").value.trim();
            payload.is_unlimited = document.getElementById("item-unlimited-select").value === "true";
            if(!payload.title) return showToast("タイトルを入力してください", true);
            if(!payload.is_unlimited) {
                payload.stock_quantity = parseInt(document.getElementById("item-stock-input").value);
                if(!payload.stock_quantity || payload.stock_quantity <= 0) return showToast("有限商品の在庫数を指定してください", true);
            }
        }

        try {
            const res = await fetch("/api/mall/items", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.message);
                document.getElementById("item-title-input").value = "";
                document.getElementById("item-desc-input").value = "";
                document.getElementById("item-secret-input").value = "";
                document.getElementById("item-price-input").value = "";
                await loadInventory();
                await loadMyShop();
            } else {
                showToast(data.detail, true);
            }
        } catch(e) { showToast("通信エラー", true); }
    }

    function renderMyItems(items) {
        const listEl = document.getElementById("my-items-list");
        if(items.length === 0) {
            listEl.innerHTML = '<div style="text-align:center; color:#888;">商品棚は空です</div>';
            return;
        }

        let html = '';
        items.forEach(it => {
            const isItem = it.category === 'ITEM';
            const badgeCat = isItem ? '<span class="type-badge badge-item">🎒 アイテム</span>' : '<span class="type-badge badge-general">📜 一般</span>';
            const badgeStock = it.is_unlimited ? '<span class="type-badge badge-unlimited">無制限</span>' : `<span class="type-badge">在庫: ${it.stock_quantity}個</span>`;

            let controlHtml = '';
            if(!it.is_unlimited) {
                controlHtml = `
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <input type="number" id="ctrl-qty-${it.id}" value="1" min="1" style="width:70px; margin:0;">
                        <button class="btn-sub" style="margin:0; padding:6px 12px; font-size:0.8rem;" onclick="restockItem(${it.id})">＋補充</button>
                        <button class="btn-danger" style="margin:0; padding:6px 12px; font-size:0.8rem;" onclick="withdrawItem(${it.id})">－引戻し</button>
                    </div>
                `;
            }

            html += `
                <div class="item-row">
                    <div style="display:flex; justify-content:space-between;">
                        <div>${badgeCat} ${badgeStock}</div>
                        <div class="price-text">${it.price} G</div>
                    </div>
                    <div style="font-weight:bold;">${escapeHtml(it.title)}</div>
                    <div style="font-size:0.8rem; color:#bbb;">${escapeHtml(it.description || '')}</div>
                    ${it.secret_content ? `<div style="font-size:0.75rem; color:var(--purple); background:#0f1115; padding:6px; border-radius:4px;">合言葉: ${escapeHtml(it.secret_content)}</div>` : ''}
                    ${controlHtml}
                </div>
            `;
        });
        listEl.innerHTML = html;
    }

    async function restockItem(itemId) {
        const qty = parseInt(document.getElementById(`ctrl-qty-${itemId}`).value);
        if(!qty || qty <= 0) return showToast("数量を入力してください", true);

        try {
            const res = await fetch(`/api/mall/items/${itemId}/restock`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ quantity: qty })
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.message);
                await loadInventory();
                await loadMyShop();
            } else {
                showToast(data.detail, true);
            }
        } catch(e) { showToast("通信エラー", true); }
    }

    async function withdrawItem(itemId) {
        const qty = parseInt(document.getElementById(`ctrl-qty-${itemId}`).value);
        if(!qty || qty <= 0) return showToast("数量を入力してください", true);

        try {
            const res = await fetch(`/api/mall/items/${itemId}/withdraw`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ quantity: qty })
            });
            const data = await res.json();
            if(res.ok) {
                showToast(data.message);
                await loadInventory();
                await loadMyShop();
            } else {
                showToast(data.detail, true);
            }
        } catch(e) { showToast("通信エラー", true); }
    }

    async function loadMyOrders() {
        const listEl = document.getElementById("order-list");
        try {
            const res = await fetch("/api/mall/my-purchases", { headers: { "Authorization": `Bearer ${token}` } });
            if(!res.ok) {
                const err = await res.json();
                listEl.innerHTML = `<div style="text-align:center; color:var(--danger);">履歴取得失敗: ${escapeHtml(err.detail || res.statusText)}</div>`;
                return;
            }
            const data = await res.json();

            if(!data.orders || data.orders.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#888;">購入履歴はありません</div>';
                return;
            }

            let html = '';
            data.orders.forEach(o => {
                const it = o.mall_items || {};
                const shop = o.mall_shops || {};
                const dateStr = new Date(o.created_at).toLocaleString('ja-JP');

                html += `
                    <div class="item-row">
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#888;">
                            <span>🏬 ${escapeHtml(shop.shop_name || '店舗')}</span>
                            <span>${dateStr}</span>
                        </div>
                        <div style="font-weight:bold; font-size:1rem; color:var(--gold);">${escapeHtml(it.title || '商品')} × ${o.quantity}個</div>
                        <div style="font-size:0.85rem;">支払総額: <b>${o.total_price} G</b> (単価:${o.unit_price}G)</div>
                        ${it.secret_content ? `
                            <div style="background:#0f1115; border:1px solid var(--purple); padding:8px; border-radius:6px; margin-top:4px;">
                                <div style="font-size:0.7rem; color:var(--purple); font-weight:bold;">🔑 購入特典 / 秘密の情報</div>
                                <div style="font-size:0.85rem; color:#fff; word-break:break-all;">${escapeHtml(it.secret_content)}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            listEl.innerHTML = html;
        } catch(e) {
            console.error("loadMyOrders error:", e);
            listEl.innerHTML = '<div style="text-align:center; color:var(--danger);">通信エラーが発生しました</div>';
        }
    }

    init();
</script>
</body>
</html>
