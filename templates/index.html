<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 入国管理所</title>
    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #121212;
            --bg-card: #1a1a1a;
            --border-subtle: #333333;
            --text-primary: #f0f0f0;
            --text-secondary: #999999;
            --accent-gold: #d4af37;
            --accent-gold-hover: #f1c40f;
            --danger-color: #e74c3c;
            --chamfer-clip: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            --octagon-clip: polygon(25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 王国シンボル（八角形エンブレム） */
        .kingdom-emblem {
            align-self: center;
            width: 64px;
            height: 64px;
            background: var(--border-subtle);
            clip-path: var(--octagon-clip);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .kingdom-emblem::before {
            content: "";
            position: absolute;
            top: 1px; left: 1px; right: 1px; bottom: 1px;
            background: var(--bg-card);
            clip-path: var(--octagon-clip);
            z-index: -1;
        }
        .emblem-inner {
            font-size: 1.5rem;
            color: var(--accent-gold);
            font-weight: 900;
        }

        .header-title {
            text-align: center;
        }
        .header-title h1 {
            font-size: 1.25rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            font-weight: 700;
        }
        .header-title p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* 幾何学メインコンソール */
        .terminal-panel {
            background: var(--border-subtle);
            clip-path: var(--chamfer-clip);
            padding: 1px;
            position: relative;
        }
        .terminal-inner {
            background: var(--bg-surface);
            clip-path: var(--chamfer-clip);
            padding: 24px;
        }

        /* タブセレクター */
        .tab-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            clip-path: var(--chamfer-clip);
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: #000;
            background: var(--accent-gold);
        }

        /* フォームグループ */
        .form-group {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: bold;
        }
        .optional {
            font-size: 0.65rem;
            color: #666;
            margin-left: 4px;
            font-weight: normal;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
            clip-path: var(--chamfer-clip);
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--accent-gold);
        }

        /* チェックボックス */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
        }
        .checkbox-group input[type="checkbox"] {
            accent-color: var(--accent-gold);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
        .checkbox-group a {
            color: var(--accent-gold);
            text-decoration: underline;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* ボタン */
        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            clip-path: var(--chamfer-clip);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-gold {
            background-color: var(--accent-gold);
            color: #000;
        }
        .btn-gold:hover {
            background-color: var(--accent-gold-hover);
        }

        /* モーダル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            clip-path: var(--chamfer-clip);
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }
        .modal-title {
            color: var(--accent-gold);
            font-size: 0.95rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
            margin-bottom: 14px;
        }
        .modal-content {
            background: var(--bg-base);
            border: 1px solid var(--border-subtle);
            padding: 12px;
            height: 240px;
            overflow-y: auto;
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 16px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .btn-close {
            background: var(--border-subtle);
            color: var(--text-primary);
        }
        .btn-close:hover {
            background: #444;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <!-- 八角形エンブレム -->
    <div class="kingdom-emblem">
        <div class="emblem-inner">村</div>
    </div>

    <div class="header-title">
        <h1>村岡王国 入国管理所</h1>
        <p>IMMIGRATION & AUTHENTICATION</p>
    </div>

    <!-- メインフレーム -->
    <div class="terminal-panel">
        <div class="terminal-inner">
            <!-- タブ切り替え -->
            <div class="tab-switch">
                <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">入国 (LOGIN)</button>
                <button type="button" class="tab-btn" id="tab-signup" onclick="switchTab('signup')">新規登録 (REGISTER)</button>
            </div>

            <!-- ログインフォーム -->
            <div id="form-login">
                <div class="form-group">
                    <label for="login-email">国民ID (Email)</label>
                    <input type="email" id="login-email" placeholder="mail@example.com">
                </div>
                <div class="form-group">
                    <label for="login-password">暗証番号 (Password)</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn-action btn-gold" style="margin-top: 16px;" onclick="login()">入国認証を実行</button>
            </div>

            <!-- 新規登録フォーム -->
            <div id="form-signup" style="display: none;">
                <div class="form-group">
                    <label for="signup-email">国民ID (Email)</label>
                    <input type="email" id="signup-email" placeholder="mail@example.com">
                </div>
                <div class="form-group">
                    <label for="signup-password">暗証番号 (Password)</label>
                    <input type="password" id="signup-password" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="signup-nickname">ニックネーム<span class="optional">(任意)</span></label>
                    <input type="text" id="signup-nickname" placeholder="名無しの労働奴隷">
                </div>
                <div class="form-group">
                    <label for="signup-realname">リアルネーム<span class="optional">(任意: 設定で限定称号)</span></label>
                    <input type="text" id="signup-realname" placeholder="山田 太郎">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms-agree">
                    <label for="terms-agree">利用規約に同意する</label>
                    <a onclick="openPolicyViewer()">（規約を読む）</a>
                </div>

                <button class="btn-action btn-gold" onclick="signup()">新規国民申請</button>
            </div>
        </div>
    </div>
</div>

<!-- 利用規約モーダル -->
<div id="policy-view-modal" class="modal-overlay" onclick="if(event.target === this) closePolicyViewer();">
    <div class="modal-box" onclick="event.stopPropagation();">
        <div class="modal-title">📜 利用規約・ポリシー</div>
        <div id="policy-view-content" class="modal-content">読み込み中...</div>
        <button type="button" class="btn-action btn-close" onclick="closePolicyViewer()">閉じる</button>
    </div>
</div>

<script>
    // タブ切り替え処理
    function switchTab(mode) {
        const loginTab = document.getElementById("tab-login");
        const signupTab = document.getElementById("tab-signup");
        const loginForm = document.getElementById("form-login");
        const signupForm = document.getElementById("form-signup");

        if (mode === 'login') {
            loginTab.classList.add("active");
            signupTab.classList.remove("active");
            loginForm.style.display = "block";
            signupForm.style.display = "none";
        } else {
            signupTab.classList.add("active");
            loginTab.classList.remove("active");
            signupForm.style.display = "block";
            loginForm.style.display = "none";
        }
    }

    // ログイン済みの場合は自動でダッシュボードへ遷移
    if (localStorage.getItem("access_token")) {
        window.location.href = "/dashboard";
    }

    async function login() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        if (!email || !password) {
            alert("IDと暗証番号を入力してください");
            return;
        }

        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_email", data.email);
                alert(data.message);
                window.location.href = "/dashboard";
            } else {
                alert(data.detail || "入国に失敗しました");
            }
        } catch (e) {
            alert("通信エラーが発生しました");
        }
    }

    async function signup() {
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const nickname = document.getElementById("signup-nickname").value;
        const realName = document.getElementById("signup-realname").value;
        const agreed = document.getElementById("terms-agree").checked;

        if (!email || !password) {
            alert("登録するIDと暗証番号を入力してください");
            return;
        }

        if (!agreed) {
            alert("利用規約への同意が必要です");
            return;
        }

        try {
            const res = await fetch("/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    email: email, 
                    password: password,
                    nickname: nickname || null,
                    real_name: realName || null
                })
            });
            const data = await res.json();
            
            if (res.ok) {
                alert(data.message + "\n入国（ログイン）タブから入国認証を行ってください。");
                switchTab('login');
                document.getElementById("login-email").value = email;
            } else {
                alert(data.detail || "登録に失敗しました");
            }
        } catch (e) {
            alert("通信エラーが発生しました");
        }
    }

    // 利用規約モーダル制御
    let isPolicyFetching = false;
    async function openPolicyViewer() {
        if (isPolicyFetching) return;
        const modal = document.getElementById("policy-view-modal");
        const contentBox = document.getElementById("policy-view-content");
        try {
            isPolicyFetching = true;
            contentBox.innerText = "規約を読み込んでいます...";
            modal.style.display = "flex";
            const res = await fetch("/api/policy/latest");
            if (res.ok) {
                const data = await res.json();
                contentBox.innerText = data.content || "規約本文がありません。";
            } else {
                contentBox.innerText = "規約の読み込みに失敗しました。";
            }
        } catch (e) {
            contentBox.innerText = "通信エラーが発生しました。";
        } finally { 
            isPolicyFetching = false; 
        }
    }
    
    function closePolicyViewer() { 
        document.getElementById("policy-view-modal").style.display = "none"; 
    }
</script>

</body>
</html>
