<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>村岡王国 - 入国管理所</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px 0;
        }
        .main-wrapper {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 720px;
            width: 100%;
            padding: 0 16px;
        }
        .container {
            background: #2a2a2a;
            border: 2px solid #555;
            border-radius: 12px;
            padding: 28px;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1, h2 {
            font-size: 1.3rem;
            text-align: center;
            color: #d4af37; /* 金色 */
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #aaa;
        }
        .optional {
            font-size: 0.75rem;
            color: #888;
            margin-left: 4px;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: #d4af37;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            margin-bottom: 16px;
        }
        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin-bottom: 0;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .checkbox-group a {
            color: #d4af37;
            text-decoration: underline;
            font-size: 0.8rem;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .btn-primary {
            background-color: #d4af37;
            color: #1a1a1a;
        }
        .btn-primary:hover {
            background-color: #f1c40f;
        }
        .btn-secondary {
            background-color: #4a90e2;
            color: #fff;
        }
        .btn-secondary:hover {
            background-color: #357abd;
        }
        .btn-close {
            background-color: #444;
            color: #fff;
        }
        .btn-close:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- ログイン枠 -->
    <div class="container">
        <h1>入国（ログイン）</h1>
        <div class="form-group">
            <label for="login-email">国民ID (Email)</label>
            <input type="email" id="login-email" placeholder="mail@example.com">
        </div>
        <div class="form-group">
            <label for="login-password">暗証番号 (Password)</label>
            <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-primary" onclick="login()">入国する</button>
    </div>

    <!-- 新規登録枠 -->
    <div class="container">
        <h2>新規国民登録</h2>
        <div class="form-group">
            <label for="signup-email">国民ID (Email)</label>
            <input type="email" id="signup-email" placeholder="mail@example.com">
        </div>
        <div class="form-group">
            <label for="signup-password">暗証番号 (Password)</label>
            <input type="password" id="signup-password" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label for="signup-nickname">ニックネーム<span class="optional">(任意)</span></label>
            <input type="text" id="signup-nickname" placeholder="名無しの労働奴隷">
        </div>
        <div class="form-group">
            <label for="signup-realname">リアルネーム<span class="optional">(任意ですが登録すると限定称号が貰えます)</span></label>
            <input type="text" id="signup-realname" placeholder="山田 太郎">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terms-agree">
            <label for="terms-agree">利用規約に同意する</label>
            <a onclick="openPolicyViewer()">（規約を読む）</a>
        </div>

        <button class="btn-secondary" onclick="signup()">申請する</button>
    </div>
</div>

<!-- 利用規約モーダル -->
<div id="policy-view-modal" onclick="if(event.target === this) closePolicyViewer();" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;">
    <div style="background: #222; border: 2px solid rgba(255,255,255,0.08); border-radius: 12px; width: 90%; max-width: 420px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); color: #fff;" onclick="event.stopPropagation();">
        <h3 style="color: #e0e0e0; margin-top: 0; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px;">📜 利用規約・ポリシー</h3>
        <div id="policy-view-content" style="background: #111; border: 1px solid #444; border-radius: 6px; padding: 12px; height: 260px; overflow-y: auto; font-size: 0.75rem; color: #aaa; margin: 15px 0; white-space: pre-wrap; word-break: break-word; line-height: 1.5;">読み込み中...</div>
        <button type="button" class="btn-close" onclick="closePolicyViewer()">閉じる</button>
    </div>
</div>

<script>
    // ログイン済みの場合は自動でダッシュボードへ飛ばす
    if (localStorage.getItem("access_token")) {
        window.location.href = "/dashboard";
    }

    async function login() {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        if (!email || !password) {
            alert("IDと暗証番号を入力してください");
            return;
        }

        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_email", data.email);
                alert(data.message);
                window.location.href = "/dashboard";
            } else {
                alert(data.detail || "入国に失敗しました");
            }
        } catch (e) {
            alert("通信エラーが発生しました");
        }
    }

    async function signup() {
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const nickname = document.getElementById("signup-nickname").value;
        const realName = document.getElementById("signup-realname").value;
        const agreed = document.getElementById("terms-agree").checked;

        if (!email || !password) {
            alert("登録するIDと暗証番号を入力してください");
            return;
        }

        if (!agreed) {
            alert("利用規約への同意が必要です");
            return;
        }

        try {
            const res = await fetch("/signup", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    email: email, 
                    password: password,
                    nickname: nickname || null,
                    real_name: realName || null
                })
            });
            const data = await res.json();
            
            if (res.ok) {
                alert(data.message + "\n左側のフォームからログインしてください。");
            } else {
                alert(data.detail || "登録に失敗しました");
            }
        } catch (e) {
            alert("通信エラーが発生しました");
        }
    }

    // 利用規約モーダル関連の処理
    let isPolicyFetching = false;
    async function openPolicyViewer() {
        if (isPolicyFetching) return;
        const modal = document.getElementById("policy-view-modal");
        const contentBox = document.getElementById("policy-view-content");
        try {
            isPolicyFetching = true;
            contentBox.innerText = "規約を読み込んでいます...";
            modal.style.display = "flex";
            const res = await fetch("/api/policy/latest");
            if (res.ok) {
                const data = await res.json();
                contentBox.innerText = data.content || "規約本文がありません。";
            } else {
                contentBox.innerText = "規約の読み込みに失敗しました。";
            }
        } catch (e) {
            contentBox.innerText = "通信エラーが発生しました。";
        } finally { 
            isPolicyFetching = false; 
        }
    }
    
    function closePolicyViewer() { 
        document.getElementById("policy-view-modal").style.display = "none"; 
    }
</script>

</body>
</html>
