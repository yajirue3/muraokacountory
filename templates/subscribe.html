<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登録チャンネル - M-Tube</title>
    <style>
        body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #f9f9f9; color: #0f0f0f; -webkit-font-smoothing: antialiased; padding-bottom: 60px; }
        
        /* ヘッダー */
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; height: 56px; position: sticky; top: 0; background: #ffffff; z-index: 100; border-bottom: 1px solid #e5e5e5; }
        .logo { font-size: 18px; font-weight: bold; color: #0f0f0f; text-decoration: none; letter-spacing: -0.5px; display: flex; align-items: center; gap: 4px; }
        .logo span { color: #cc0000; }
        .header-actions { display: flex; gap: 16px; align-items: center; }

        /* ボトムナビゲーション (統一仕様) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center; height: 56px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #0f0f0f; width: 100%; height: 100%; cursor: pointer; border: none; background: transparent; padding: 0; margin: 0; }
        .nav-item .icon-wrap { height: 24px; display: flex; align-items: center; justify-content: center; }
        .nav-item .icon { font-size: 20px; line-height: 1; }
        .nav-item .icon-plus { font-size: 24px; line-height: 1; font-weight: 300; }
        .nav-item .label { font-size: 10px; font-weight: 500; margin-top: 2px; line-height: 1; }
        .nav-item:hover { background: #f2f2f2; }
        .nav-item.active { color: #cc0000; }
        .nav-item.active .icon { color: #cc0000; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0; }

        /* 登録チャンネル横スクロール (YouTube風) */
        .channel-scroll-container { background: #ffffff; border-bottom: 1px solid #e5e5e5; }
        .channel-scroll { display: flex; overflow-x: auto; padding: 12px 16px; gap: 16px; -ms-overflow-style: none; scrollbar-width: none; }
        .channel-scroll::-webkit-scrollbar { display: none; }
        .channel-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #0f0f0f; min-width: 60px; cursor: pointer; }
        .channel-avatar { width: 56px; height: 56px; border-radius: 50%; background: #e5e5e5; object-fit: cover; border: 1px solid #ddd; }
        .channel-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60px; text-align: center; }

        /* 動画グリッド */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px 16px; padding: 20px 16px; }
        .v-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; cursor: pointer; }
        .v-thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #e5e5e5; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
        .v-thumb { width: 100%; height: 100%; object-fit: cover; }
        
        .v-info-flex { display: flex; gap: 12px; }
        .v-author-icon { width: 36px; height: 36px; border-radius: 50%; background: #e5e5e5; flex-shrink: 0; object-fit: cover; }
        .v-details { display: flex; flex-direction: column; overflow: hidden; }
        .v-title { font-size: 14px; font-weight: 500; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
        .v-meta { font-size: 12px; color: #606060; display: flex; flex-direction: column; gap: 2px; }

        .load-more-wrap { text-align: center; padding: 20px; }
        .btn-load { padding: 10px 24px; border-radius: 18px; border: 1px solid #ccc; background: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
        .btn-load:hover { background: #f2f2f2; }

        .empty-message { text-align: center; padding: 40px 20px; color: #606060; font-size: 14px; }

        /* モーダル */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 200; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #ffffff; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal h3 { margin: 0 0 20px 0; font-size: 18px; color: #0f0f0f; }
        .modal .form-group { padding: 0; border: none; background: transparent; }
        .modal .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 8px; color: #606060; }
