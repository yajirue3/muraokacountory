<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - PIXEL WAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-base: #050505; --bg-surface: #101010; --bg-card: #161616; --border-subtle: #2a2a2a; --text-primary: #f0f0f0; --text-secondary: #888; --accent-gold: #d4af37; --accent-cyan: #00f3ff; --danger-color: #e74c3c; --chamfer-clip: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-base); color: var(--text-primary); overflow: hidden; width: 100vw; height: 100vh; user-select: none; }
        button { background: none; border: none; font: inherit; cursor: pointer; color: inherit; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #toast-container { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; pointer-events: none; }
        .toast { background: rgba(231, 76, 60, 0.95); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); animation: fadeOut 2.5s forwards; }
        @keyframes fadeOut { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }
        
        #broadcast-area { position: absolute; top: 60px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 50; pointer-events: none; }
        .broadcast-msg { background: rgba(0,0,0,0.8); border: 1px solid var(--accent-gold); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; color: #fff; animation: slideDownFade 5s forwards; }
        @keyframes slideDownFade { 0% { transform: translateY(-20px); opacity: 0;} 10% { transform: translateY(0); opacity: 1;} 80% { transform: translateY(0); opacity: 1;} 100% { transform: translateY(-20px); opacity: 0;} }

        .hud-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 10; pointer-events: none; }
        .hud-bar { background: rgba(16, 16, 16, 0.9); backdrop-filter: blur(6px); border: 1px solid var(--border-subtle); clip-path: var(--chamfer-clip); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        .stat-block { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.58rem; color: var(--text-secondary); font-weight: bold; }
        .stat-value { font-size: 0.85rem; font-weight: 900; color: #fff; }
        .stat-value.gold { color: var(--accent-gold); }
        .stat-value.cyan { color: var(--accent-cyan); }
        .btn-small { background: rgba(0, 243, 255, 0.08); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 4px 8px; font-size: 0.7rem; font-weight: bold; clip-path: var(--chamfer-clip); display: flex; align-items: center; gap: 4px; }
        .btn-small:active { filter: brightness(1.5); }
        .hud-bottom { position: absolute; bottom: 20px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 10; pointer-events: none; }
        .action-menu { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .mode-toggle { display: flex; background: var(--bg-surface); border: 1px solid var(--border-subtle); clip-path: var(--chamfer-clip); overflow: hidden; }
        .mode-btn { padding: 10px 14px; font-size: 0.75rem; font-weight: bold; color: var(--text-secondary); transition: 0.2s; }
        .mode-btn.active.attack { background: var(--danger-color); color: #fff; }
        .mode-btn.active.defend { background: var(--accent-cyan); color: #000; }
        .btn-circle { width: 42px; height: 42px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-primary); display: flex; justify-content: center; align-items: center; transition: 0.1s; }
        .btn-circle:active { transform: scale(0.92); border-color: var(--accent-gold); }
        .minimap-container { width: 90px; height: 90px; background: rgba(5, 5, 5, 0.95); border: 1px solid var(--accent-gold); clip-path: var(--chamfer-clip); position: relative; pointer-events: auto; }
        #minimap-canvas { width: 100%; height: 100%; display: block; }
        .minimap-viewport { position: absolute; border: 1px solid var(--accent-cyan); background: rgba(0, 243, 255, 0.2); pointer-events: none; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 16px; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border-subtle); clip-path: var(--chamfer-clip); width: 100%; max-width: 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 0.95rem; color: var(--accent-gold); font-weight: bold; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; }
        .btn-solid { background: var(--border-subtle); color: var(--text-primary); padding: 10px; font-size: 0.8rem; font-weight: bold; text-align: center; clip-path: var(--chamfer-clip); display: flex; justify-content: center; align-items: center; gap: 6px; }
        .btn-solid:active { background: var(--accent-gold); color: #000; }
        .btn-solid.gold { background: var(--accent-gold); color: #000; }
        input, select { width: 100%; padding: 8px 10px; background: var(--bg-base); border: 1px solid var(--border-subtle); color: var(--text-primary); font-size: 0.85rem; clip-path: var(--chamfer-clip); outline: none; }
        input:focus { border-color: var(--accent-gold); }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border-subtle); font-size: 0.75rem; }
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="toast-container"></div>
<div id="broadcast-area"></div>

<div class="hud-top">
    <div class="hud-bar">
        <div class="stat-block"><span class="stat-label">PLAYER ID</span><span class="stat-value" id="hud-pid">#----</span></div>
        <div style="display: flex; gap: 6px;">
            <button class="btn-small" onclick="loadLeaderboard()" style="color:var(--accent-gold); border-color:var(--accent-gold);">🏆</button>
            <button class="btn-small" onclick="centerCameraOnCore()">◎ CORE</button>
        </div>
    </div>
    <div class="hud-bar">
        <div class="stat-block"><span class="stat-label">INK / CAP</span><span class="stat-value cyan" id="hud-ink">- / -</span></div>
        <div class="stat-block"><span class="stat-label">REGEN</span><span class="stat-value" id="hud-regen">+/min</span></div>
    </div>
    <div class="hud-bar">
        <div class="stat-block"><span class="stat-label">BALANCE</span><span class="stat-value gold" id="hud-gold">0 G</span></div>
        <div class="stat-block"><span class="stat-label">TERRITORY</span><span class="stat-value" id="hud-mass">0 マス</span></div>
    </div>
    <div class="hud-bar" id="barrier-status-bar" style="display: none; border-color: var(--accent-cyan); background: rgba(0, 243, 255, 0.1);">
        <div class="stat-block"><span class="stat-label" style="color: var(--accent-cyan);">🛡️ BARRIER ACTIVE</span><span class="stat-value cyan" style="font-size: 0.7rem;">無敵 (維持費: 10G/分)</span></div>
    </div>
</div>

<div class="hud-bottom">
    <div class="action-menu">
        <div style="display: flex; gap: 8px;">
            <button class="btn-circle" onclick="openModal('shop-modal')"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></button>
            <button class="btn-circle" onclick="openModal('alliance-modal')"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></button>
            <button class="btn-circle" onclick="toggleBarrier()" id="btn-barrier"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></button>
        </div>
        <div class="mode-toggle">
            <button class="mode-btn active attack" id="mode-attack" onclick="setMode(1)">⚔️ 侵略</button>
            <button class="mode-btn defend" id="mode-defend" onclick="setMode(2)">🛡️ 強化</button>
        </div>
    </div>
    <div class="minimap-container" id="minimap-container">
        <canvas id="minimap-canvas" width="200" height="200"></canvas>
        <div class="minimap-viewport" id="minimap-vp"></div>
    </div>
</div>

<!-- モーダル -->
<div id="spawn-modal" class="modal-overlay" style="background: var(--bg-base);">
    <div class="modal-box">
        <div class="modal-title">PIXEL WAR - 出撃</div>
        <select id="spawn-wallet-select"><option>読込中...</option></select>
        <button class="btn-solid gold" onclick="spawnCore()">出撃する</button>
    </div>
</div>
<div id="shop-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title">王国インク工房</div>
        <div style="background: var(--bg-base); padding: 10px; border: 1px solid var(--border-subtle);">
            <div style="font-size: 0.8rem; font-weight: bold;">インクタンク拡張 (+1)</div>
            <div style="font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 8px;">強化費用: <span id="cost-max-ink" style="color: var(--accent-gold);"></span> G</div>
            <button class="btn-solid" onclick="upgradeStat('MAX_INK')">拡張</button>
        </div>
        <div style="background: var(--bg-base); padding: 10px; border: 1px solid var(--border-subtle);">
            <div style="font-size: 0.8rem; font-weight: bold;">高速抽出機 (+1 回復/分)</div>
            <div style="font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 8px;">強化費用: <span id="cost-regen" style="color: var(--accent-gold);"></span> G</div>
            <button class="btn-solid" onclick="upgradeStat('REGEN')">強化</button>
        </div>
        <button class="btn-solid" onclick="closeModal('shop-modal')">閉じる</button>
    </div>
</div>
<div id="alliance-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" style="color: var(--danger-color);">外交・同盟</div>
        <input type="number" id="alliance-target-id" placeholder="相手の Player ID (例: 1234)">
        <button class="btn-solid" onclick="addAlliance()">締結する</button>
        <div style="border-top: 1px dashed var(--border-subtle); padding-top: 8px; margin-top: 8px;">
            <div style="font-size: 0.75rem; font-weight: bold;">締結中</div>
            <div id="alliance-list"></div>
        </div>
        <button class="btn-solid" onclick="closeModal('alliance-modal')">閉じる</button>
    </div>
</div>
<div id="leaderboard-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-title" style="color: var(--danger-color);">🏆 高額賞金首</div>
        <div id="leaderboard-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        <button class="btn-solid" onclick="closeModal('leaderboard-modal')">閉じる</button>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    const BOARD_SIZE = 200, ROCK_ID = 65535;
    const boardData = new Uint8Array(BOARD_SIZE * BOARD_SIZE * 3);
    const dataView = new DataView(boardData.buffer);

    let ws = null;
    let gameState = { walletId: null, playerId: null, coreX: -1, coreY: -1, ink: 0, maxInk: 10, regen: 1, gold: 0, massCount: 0, barrierActive: false, alliances: new Set() };
    let frontierSet = new Set();
    let actionMode = 1;
    let camera = { x: 100, y: 100, zoom: 20 };
    const MIN_ZOOM = 4, MAX_ZOOM = 60;

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const miniCtx = document.getElementById('minimap-canvas').getContext('2d', { alpha: false });

    // 画面の物理ピクセル比を完全に相殺するリサイズ処理
    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function showToast(msg) {
        const c = document.getElementById('toast-container');
        const el = document.createElement('div'); el.className = 'toast'; el.innerText = msg;
        c.appendChild(el); setTimeout(() => el.remove(), 2500);
    }
    function showBroadcast(text, color = "#fff") {
        const a = document.getElementById('broadcast-area');
        const el = document.createElement('div'); el.className = 'broadcast-msg'; el.style.borderColor = color; el.innerText = text;
        a.appendChild(el); setTimeout(() => el.remove(), 5000);
    }

    async function initGame() {
        try {
            const wRes = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            const wallets = await wRes.json();
            if (!wallets.length) { alert("口座がありません"); return; }
            document.getElementById("spawn-wallet-select").innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name} (残高:${w.balance}G)</option>`).join('');

            const meRes = await fetch("/api/pixel/me", { headers: { "Authorization": `Bearer ${token}` } });
            const me = meRes.ok ? await meRes.json() : { exists: false, is_dead: true };

            if (me.exists && !me.is_dead) {
                Object.assign(gameState, { walletId: me.wallet_id, playerId: me.player_id, coreX: me.core_x, coreY: me.core_y, ink: me.ink, maxInk: me.max_ink, regen: me.regen, barrierActive: me.barrier_active, gold: wallets.find(w => w.wallet_id === me.wallet_id).balance });
                centerCameraOnCore(); connectWebSocket(); updateHUD(); startSyncLoop(); return;
            }
            gameState.walletId = wallets[0].wallet_id; gameState.gold = wallets[0].balance;
            updateHUD(); document.getElementById("spawn-modal").style.display = "flex";
        } catch (e) { showToast("初期化エラー"); }
    }

    async function spawnCore() {
        const wid = document.getElementById("spawn-wallet-select").value;
        try {
            const res = await fetch("/api/pixel/spawn", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ wallet_id: wid }) });
            const data = await res.json(); if (!res.ok) throw data;
            Object.assign(gameState, { walletId: wid, playerId: data.player_id, coreX: data.core_x, coreY: data.core_y, ink: 1, maxInk: 10, regen: 1, barrierActive: false });
            document.getElementById("spawn-modal").style.display = "none";
            centerCameraOnCore(); connectWebSocket(); updateShopUI(); startSyncLoop();
        } catch (e) { showToast("出撃エラー"); }
    }

    function startSyncLoop() {
        setInterval(async () => {
            try {
                const res = await fetch("/api/pixel/me", { headers: { "Authorization": `Bearer ${token}` } });
                if (res.ok) { const d = await res.json(); if (!d.is_dead) Object.assign(gameState, { ink: d.ink, maxInk: d.max_ink, regen: d.regen, barrierActive: d.barrier_active }); }
                const wRes = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
                if (wRes.ok) { const ws = await wRes.json(); const cw = ws.find(w => w.wallet_id === gameState.walletId); if (cw) gameState.gold = cw.balance; }
                updateHUD();
            } catch (e) {}
        }, 10000);
    }

    function connectWebSocket() {
        ws = new WebSocket(`${location.protocol === 'https:' ? 'wss://' : 'ws://'}${location.host}/api/pixel/ws`);
        ws.binaryType = "arraybuffer";
        ws.onmessage = (event) => {
            if (typeof event.data === "string") {
                try { const msg = JSON.parse(event.data);
                    if (msg.type === "broadcast") showBroadcast(msg.message, msg.color);
                    else if (msg.type === "error") showToast(msg.msg);
                    else if (msg.type === "status") { gameState.ink = msg.ink; updateHUD(); }
                } catch(e) {} return;
            }
            const buffer = event.data; const dv = new DataView(buffer);
            if (buffer.byteLength === BOARD_SIZE * BOARD_SIZE * 3) {
                boardData.set(new Uint8Array(buffer)); fullRecount();
            } else if (buffer.byteLength % 5 === 0) {
                for (let i = 0; i < buffer.byteLength / 5; i++) {
                    const offset = i * 5; const x = dv.getUint8(offset), y = dv.getUint8(offset + 1);
                    const owner = dv.getUint16(offset + 2, false), hp = dv.getUint8(offset + 4);
                    const idx = (y * BOARD_SIZE + x) * 3; const oldOwner = dataView.getUint16(idx, false);
                    dataView.setUint16(idx, owner, false); dataView.setUint8(idx + 2, hp);
                    if (oldOwner !== owner) {
                        if (oldOwner === gameState.playerId) gameState.massCount = Math.max(0, gameState.massCount - 1);
                        if (owner === gameState.playerId) gameState.massCount++;
                    }
                    updateFrontierAround(x, y);
                }
                updateHUD();
            }
        };
        ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    // 先行消費なしのアクション
    function sendActionToServer(bx, by) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const owner = dataView.getUint16((by * BOARD_SIZE + bx) * 3, false);
        if (owner === ROCK_ID) { showToast("岩盤は塗れません"); return; }
        
        const buffer = new ArrayBuffer(5); const dv = new DataView(buffer);
        dv.setUint8(0, bx); dv.setUint8(1, by); dv.setUint8(2, actionMode); dv.setUint16(3, gameState.playerId, false);
        ws.send(buffer);
    }

    function fullRecount() {
        gameState.massCount = 0; frontierSet.clear();
        for (let y = 0; y < BOARD_SIZE; y++) {
            for (let x = 0; x < BOARD_SIZE; x++) {
                if (dataView.getUint16((y * BOARD_SIZE + x) * 3, false) === gameState.playerId) gameState.massCount++;
                updateFrontierAround(x, y);
            }
        }
        updateHUD();
    }

    function updateFrontierAround(x, y) {
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                const nx = x + dx, ny = y + dy;
                if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) continue;
                const owner = dataView.getUint16((ny * BOARD_SIZE + nx) * 3, false);
                if (owner !== gameState.playerId && !gameState.alliances.has(owner) && owner !== ROCK_ID) {
                    let adjacent = false;
                    for (let d of [[-1,0],[1,0],[0,-1],[0,1]]) {
                        const nnx = nx + d[0], nny = ny + d[1];
                        if (nnx >= 0 && nnx < BOARD_SIZE && nny >= 0 && nny < BOARD_SIZE) {
                            const nOwner = dataView.getUint16((nny * BOARD_SIZE + nnx) * 3, false);
                            if (nOwner === gameState.playerId || gameState.alliances.has(nOwner)) { adjacent = true; break; }
                        }
                    }
                    if (adjacent) frontierSet.add(`${nx},${ny}`); else frontierSet.delete(`${nx},${ny}`);
                } else frontierSet.delete(`${nx},${ny}`);
            }
        }
    }

    function setMode(mode) { actionMode = mode; document.getElementById('mode-attack').classList.toggle('active', mode === 1); document.getElementById('mode-defend').classList.toggle('active', mode === 2); }
    function openModal(id) { document.getElementById(id).style.display = "flex"; }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    function updateHUD() {
        document.getElementById('hud-pid').innerText = `#${gameState.playerId || '----'}`;
        document.getElementById('hud-ink').innerText = `${gameState.ink} / ${gameState.maxInk}`;
        document.getElementById('hud-regen').innerText = `+${gameState.regen}/分`;
        document.getElementById('hud-gold').innerText = `${gameState.gold.toLocaleString()} G`;
        document.getElementById('hud-mass').innerText = `${gameState.massCount} マス`;
        
        const bar = document.getElementById('barrier-status-bar'), btn = document.getElementById('btn-barrier');
        if (gameState.barrierActive) { bar.style.display = "flex"; btn.style.color = btn.style.borderColor = "var(--accent-cyan)"; }
        else { bar.style.display = "none"; btn.style.color = "var(--text-primary)"; btn.style.borderColor = "var(--border-subtle)"; }
        updateShopUI();
    }

    function updateShopUI() {
        document.getElementById('cost-max-ink').innerText = Math.floor(10000 * Math.pow(1.066, gameState.maxInk - 10)).toLocaleString();
        document.getElementById('cost-regen').innerText = Math.floor(10000000 * Math.pow(4, gameState.regen - 1)).toLocaleString();
    }

    async function upgradeStat(type) {
        try {
            const res = await fetch("/api/pixel/upgrade", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ wallet_id: gameState.walletId, upgrade_type: type }) });
            const data = await res.json(); if (!res.ok) throw data;
            gameState.gold -= data.cost;
            if (type === 'MAX_INK') gameState.maxInk += 1; else gameState.regen += 1;
            showToast(`強化完了！コスト: ${data.cost.toLocaleString()}G`); updateHUD();
        } catch (e) { showToast(e.detail || "強化失敗"); }
    }

    async function toggleBarrier() {
        try {
            const res = await fetch("/api/pixel/barrier/toggle", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ wallet_id: gameState.walletId }) });
            const data = await res.json(); if (!res.ok) throw data;
            gameState.barrierActive = data.barrier_active; updateHUD();
        } catch (e) { showToast("バリア操作失敗"); }
    }

    async function loadLeaderboard() {
        openModal('leaderboard-modal');
        const list = document.getElementById('leaderboard-list'); list.innerHTML = '読込中...';
        try {
            const res = await fetch("/api/pixel/leaderboard"); const data = await res.json();
            list.innerHTML = data.length ? data.map((p, i) => `<div class="list-item"><span>${i+1}位 #${p.player_id}</span><strong style="color:var(--danger-color);">${p.bounty_gold.toLocaleString()} G</strong></div>`).join('') : '賞金首なし';
        } catch(e) { list.innerHTML = '取得失敗'; }
    }

    async function addAlliance() {
        const id = document.getElementById("alliance-target-id").value; if(!id) return;
        try {
            const res = await fetch("/api/pixel/alliance/add", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }, body: JSON.stringify({ target_player_id: parseInt(id) }) });
            const data = await res.json(); if (!res.ok) throw data;
            gameState.alliances.add(parseInt(id)); showToast(data.message); closeModal('alliance-modal'); fullRecount();
        } catch(e) { showToast(e.detail || "締結失敗"); }
    }

    const COLOR_MAP = new Map(); COLOR_MAP.set(0, "#080808"); COLOR_MAP.set(ROCK_ID, "#222222");
    function getPlayerColor(id) {
        if (id === gameState.playerId) return "#00f3ff";
        if (gameState.alliances.has(id)) return "#00ff66";
        if (COLOR_MAP.has(id)) return COLOR_MAP.get(id);
        const color = `hsl(${(id * 137.5) % 360}, 80%, 50%)`; COLOR_MAP.set(id, color); return color;
    }

    function draw() {
        // 論理ピクセルで描画 (スケールはresizeCanvasで適用済み)
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, rect.width, rect.height);
        const hw = rect.width / 2, hh = rect.height / 2;
        const startX = Math.max(0, Math.floor(camera.x - hw / camera.zoom));
        const endX = Math.min(BOARD_SIZE, Math.ceil(camera.x + hw / camera.zoom));
        const startY = Math.max(0, Math.floor(camera.y - hh / camera.zoom));
        const endY = Math.min(BOARD_SIZE, Math.ceil(camera.y + hh / camera.zoom));

        const pulse = (Math.sin(Date.now() / 150) + 1) / 2;

        for (let y = startY; y < endY; y++) {
            for (let x = startX; x < endX; x++) {
                const idx = (y * BOARD_SIZE + x) * 3;
                const owner = dataView.getUint16(idx, false), hp = dataView.getUint8(idx + 2);
                const screenX = hw + (x - camera.x) * camera.zoom, screenY = hh + (y - camera.y) * camera.zoom;

                if (owner === ROCK_ID) { ctx.fillStyle = "#222222"; ctx.fillRect(screenX, screenY, camera.zoom, camera.zoom); }
                else if (owner !== 0) { ctx.fillStyle = getPlayerColor(owner); ctx.fillRect(screenX, screenY, camera.zoom, camera.zoom); }

                if (camera.zoom >= 8) { ctx.strokeStyle = "rgba(255, 255, 255, 0.08)"; ctx.lineWidth = 1; ctx.strokeRect(screenX, screenY, camera.zoom, camera.zoom); }

                if (actionMode === 1 && frontierSet.has(`${x},${y}`) && camera.zoom >= 10) {
                    ctx.strokeStyle = `rgba(0, 243, 255, ${0.4 + pulse * 0.6})`; ctx.lineWidth = 2; ctx.strokeRect(screenX + 1, screenY + 1, camera.zoom - 2, camera.zoom - 2);
                }

                if (x === gameState.coreX && y === gameState.coreY) {
                    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(screenX + 2, screenY + 2, camera.zoom - 4, camera.zoom - 4);
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(screenX + camera.zoom * 0.3, screenY + camera.zoom * 0.3, camera.zoom * 0.4, camera.zoom * 0.4);
                } else if (hp > 1 && owner !== ROCK_ID) {
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.6)"; ctx.lineWidth = Math.max(1, camera.zoom * 0.1); ctx.strokeRect(screenX + 2, screenY + 2, camera.zoom - 4, camera.zoom - 4);
                    if (camera.zoom >= 22) { ctx.fillStyle = "#ffffff"; ctx.font = `bold ${Math.floor(camera.zoom * 0.35)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(hp, screenX + camera.zoom / 2, screenY + camera.zoom / 2); }
                }
            }
        }
        drawMinimap(); requestAnimationFrame(draw);
    }

    function drawMinimap() {
        miniCtx.fillStyle = "#050505"; miniCtx.fillRect(0, 0, 200, 200);
        const imgData = miniCtx.createImageData(200, 200); const data = imgData.data;
        for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
            const owner = dataView.getUint16(i * 3, false), ptr = i * 4;
            if (owner === gameState.playerId) { data[ptr] = 0; data[ptr+1] = 243; data[ptr+2] = 255; data[ptr+3] = 255; }
            else if (owner === ROCK_ID) { data[ptr] = 60; data[ptr+1] = 60; data[ptr+2] = 60; data[ptr+3] = 255; }
            else if (owner !== 0) { data[ptr] = 231; data[ptr+1] = 76; data[ptr+2] = 60; data[ptr+3] = 255; }
            else data[ptr+3] = 0;
        }
        miniCtx.putImageData(imgData, 0, 0);
        const rect = canvas.getBoundingClientRect();
        const vp = document.getElementById('minimap-vp'), viewW = (rect.width / camera.zoom) / 200 * 100, viewH = (rect.height / camera.zoom) / 200 * 100;
        vp.style.width = `${Math.min(100, Math.max(1, viewW))}%`; vp.style.height = `${Math.min(100, Math.max(1, viewH))}%`;
        vp.style.left = `${Math.max(0, (camera.x / 200 * 100) - viewW / 2)}%`; vp.style.top = `${Math.max(0, (camera.y / 200 * 100) - viewH / 2)}%`;
    }

    function centerCameraOnCore() { if (gameState.coreX >= 0) { camera.x = gameState.coreX; camera.y = gameState.coreY; camera.zoom = 22; } }

    let isDragging = false, touchStartX = 0, touchStartY = 0, cameraStartX = 0, cameraStartY = 0, lastPinchDist = 0, pressInterval = null, activePointer = null;
    const activeTouches = new Map();

    canvas.addEventListener('pointerdown', (e) => {
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activeTouches.size === 1) {
            isDragging = true; touchStartX = e.clientX; touchStartY = e.clientY; cameraStartX = camera.x; cameraStartY = camera.y;
            const rect = canvas.getBoundingClientRect();
            const bx = Math.floor(camera.x + (e.clientX - rect.left - rect.width / 2) / camera.zoom);
            const by = Math.floor(camera.y + (e.clientY - rect.top - rect.height / 2) / camera.zoom);
            activePointer = { x: e.clientX, y: e.clientY, bx, by };
            if (camera.zoom >= 10 && bx >= 0 && bx < BOARD_SIZE && by >= 0 && by < BOARD_SIZE) {
                sendActionToServer(bx, by);
                pressInterval = setInterval(() => { if (activePointer && Math.hypot(e.clientX - activePointer.x, e.clientY - activePointer.y) < 15) sendActionToServer(activePointer.bx, activePointer.by); else clearInterval(pressInterval); }, 250);
            }
        } else if (activeTouches.size === 2) {
            clearInterval(pressInterval); isDragging = false;
            const pts = Array.from(activeTouches.values()); lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }
    });

    canvas.addEventListener('pointermove', (e) => {
        if (!activeTouches.has(e.pointerId)) return;
        activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (activeTouches.size === 2) {
            const pts = Array.from(activeTouches.values()), currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (lastPinchDist > 0) camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom * (currentDist / lastPinchDist)));
            lastPinchDist = currentDist; return;
        }
        if (isDragging && activeTouches.size === 1) {
            const dx = (touchStartX - e.clientX) / camera.zoom, dy = (touchStartY - e.clientY) / camera.zoom;
            if (Math.hypot(touchStartX - e.clientX, touchStartY - e.clientY) > 10) clearInterval(pressInterval);
            camera.x = Math.max(0, Math.min(BOARD_SIZE, cameraStartX + dx)); camera.y = Math.max(0, Math.min(BOARD_SIZE, cameraStartY + dy));
        }
    });

    const cleanupTouch = (e) => { activeTouches.delete(e.pointerId); if (activeTouches.size < 2) lastPinchDist = 0; if (activeTouches.size === 0) { isDragging = false; clearInterval(pressInterval); activePointer = null; } };
    canvas.addEventListener('pointerup', cleanupTouch); canvas.addEventListener('pointercancel', cleanupTouch);
    canvas.addEventListener('wheel', (e) => { camera.zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, camera.zoom * (e.deltaY > 0 ? 0.9 : 1.1))); });
    document.getElementById('minimap-container').addEventListener('pointerdown', (e) => { const rect = e.currentTarget.getBoundingClientRect(); camera.x = ((e.clientX - rect.left) / rect.width) * BOARD_SIZE; camera.y = ((e.clientY - rect.top) / rect.height) * BOARD_SIZE; });

    initGame(); requestAnimationFrame(draw);
</script>
</body>
