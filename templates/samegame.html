<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SameGame</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&display=swap');

        :root {
            --bg-color: #111;
            --text-dark: #fff;
            --text-light: #f9f6f2;
            --board-bg: #222;
            --cell-bg: rgba(255, 255, 255, 0.05);
            --gap: 4px;
            --board-padding: 8px;
            --transition-speed: 250ms;
            --cols: 10;
            --rows: 10;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 16px; overflow: hidden;
            transition: background-color 0.3s;
        }

        .header-top {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;
        }

        .title { font-family: 'Press Start 2P', cursive; font-size: 1.8rem; color: #E70012; line-height: 1.2; text-shadow: 2px 2px 0 #fff; }
        
        .scores-container { display: flex; gap: 8px; }
        .score-box { background: var(--board-bg); border: 2px solid #555; border-radius: 0; padding: 6px 16px; text-align: center; min-width: 70px; color: white; position: relative; }
        .score-label { font-size: 0.6rem; font-weight: 700; color: #aaa; text-transform: uppercase; margin-bottom: 2px; letter-spacing: 1px; }
        .score-val { font-size: 1.1rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; transition: transform 0.1s; }
        
        .score-addition {
            position: absolute; top: 15px; right: 10px; font-size: 1.2rem; font-weight: bold; color: #FFCC00;
            text-shadow: 1px 1px 0 #000;
            animation: moveUp 0.6s ease-in forwards; z-index: 100; pointer-events: none;
        }
        @keyframes moveUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        .controls-row {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px;
        }

        .action-btn {
            background: #555; color: var(--text-light); border: 2px solid #888; border-radius: 0;
            padding: 10px 16px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s; flex: 1; text-align: center; text-decoration: none;
        }
        .action-btn:active { background: #777; transform: translateY(2px); }
        .btn-primary { background: #E70012; border-color: #ff4a57; }
        .btn-primary:active { background: #cc000f; }
        .sound-btn { flex: 0.4; font-size: 1.1rem; padding: 10px; }

        .board-container {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
            background: var(--board-bg); border: 4px solid #555; padding: var(--board-padding);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .grid-bg { 
            display: grid; 
            grid-template-columns: repeat(var(--cols), 1fr); 
            grid-template-rows: repeat(var(--rows), 1fr); 
            gap: var(--gap); width: 100%; height: 100%; 
        }
        .grid-cell { background: var(--cell-bg); border-radius: 2px; }

        .tile-layer { position: absolute; top: var(--board-padding); left: var(--board-padding); right: var(--board-padding); bottom: var(--board-padding); pointer-events: none; }
        
        .tile-wrapper {
            position: absolute; 
            width: calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
            height: calc((100% - (var(--rows) - 1) * var(--gap)) / var(--rows));
            top: 0; left: 0;
            transition: transform var(--transition-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translate(calc(var(--c) * 100% + var(--c) * var(--gap)), calc(var(--r) * 100% + var(--r) * var(--gap)));
            pointer-events: auto;
            cursor: pointer;
        }
        
        .tile-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 4px;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3), inset 2px 2px 0 rgba(255,255,255,0.4);
