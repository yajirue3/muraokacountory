<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SameGame</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

        :root {
            --bg-color: #111;
            --text-dark: #fff;
            --text-light: #f9f6f2;
            --board-bg: #222;
            --cell-bg: rgba(255, 255, 255, 0.05);
            --gap: 4px;
            --board-padding: 8px;
            --transition-speed: 200ms;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'DotGothic16', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 16px; overflow: hidden;
            transition: background-color 0.3s;
        }

        .header-top {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;
        }

        .title { font-family: 'Press Start 2P', cursive; font-size: 1.8rem; color: #E70012; line-height: 1.2; text-shadow: 2px 2px 0 #fff; }
        
        .scores-container { display: flex; gap: 8px; }
        .score-box { background: var(--board-bg); border: 2px solid #555; padding: 6px 8px; text-align: center; min-width: 60px; color: white; position: relative; }
        .score-label { font-size: 0.7rem; color: #aaa; margin-bottom: 2px; }
        .score-val { font-family: 'Press Start 2P', cursive; font-size: 0.85rem; line-height: 1.2; transition: transform 0.1s; margin-top: 4px; }
        
        .score-addition {
            position: absolute; top: 15px; right: 10px; font-family: 'Press Start 2P', cursive; font-size: 0.8rem; color: #FFCC00;
            text-shadow: 1px 1px 0 #000;
            animation: moveUp 0.6s ease-in forwards; z-index: 100; pointer-events: none;
        }
        @keyframes moveUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

        .controls-row {
            width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px;
        }

        .action-btn {
            background: #555; color: var(--text-dark); border: 2px solid #888;
            padding: 10px 12px; font-family: 'DotGothic16', sans-serif; font-size: 1rem; cursor: pointer; flex: 1; text-align: center; text-decoration: none;
        }
        .action-btn:active { background: #777; transform: translateY(2px); }
        .btn-primary { background: #E70012; border-color: #ff4a57; }
        .btn-primary:active { background: #cc000f; }
        .sound-btn { flex: 0.4; font-size: 1.2rem; padding: 10px; font-family: sans-serif; }

        .board-container {
            position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
            background: var(--board-bg); border: 4px solid #555; padding: var(--board-padding);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .grid-bg { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            grid-template-rows: repeat(10, 1fr); 
            gap: var(--gap); width: 100%; height: 100%; 
        }
        .grid-cell { background: var(--cell-bg); border-radius: 2px; }

        .tile-layer { position: absolute; top: var(--board-padding); left: var(--board-padding); right: var(--board-padding); bottom: var(--board-padding); pointer-events: none; }
        
        .tile-wrapper {
            position: absolute; 
            width: calc((100% - 9 * var(--gap)) / 10);
            height: calc((100% - 9 * var(--gap)) / 10);
            top: 0; left: 0;
            transition: transform var(--transition-speed) cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translate(calc(var(--c) * 100% + var(--c) * var(--gap)), calc(var(--r) * 100% + var(--r) * var(--gap)));
            pointer-events: auto;
            cursor: pointer;
        }
        
        .tile-inner {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.3), inset 2px 2px 0 rgba(255,255,255,0.4);
            transition: transform 0.15s, opacity 0.15s, filter 0.1s;
        }
        
        .tile-wrapper:active .tile-inner { filter: brightness(1.3); transform: scale(0.9); }

        .color-0 { background-color: #E70012; }
        .color-1 { background-color: #0088FF; }
        .color-2 { background-color: #00A600; }
        .color-3 { background-color: #FFCC00; }
        .color-4 { background-color: #9900CC; }

        .floating-score {
            position: absolute; font-family: 'Press Start 2P', cursive; font-size: 0.8rem; color: #fff; text-shadow: 2px 2px 0 #000;
            animation: float-score-anim 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; z-index: 50; width: 40px; text-align: center; pointer-events: none;
        }
        @keyframes float-score-anim {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-15px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }

        .pop-out { transform: scale(0); opacity: 0; }
        .pop-in { animation: popIn 300ms cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }

        .board-container.shake { animation: shake-board 0.4s ease-in-out; }
        @keyframes shake-board { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-4px, 3px); } 40% { transform: translate(4px, -3px); } 60% { transform: translate(-3px, -4px); } 80% { transform: translate(3px, 4px); } }

        body.hyper-flash { animation: hyper-flash-bg 0.6s ease-out; }
        @keyframes hyper-flash-bg { 0%, 20%, 40% { background-color: #fff; } 10%, 30%, 100% { background-color: var(--bg-color); } }

        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
            z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-content {
            background: #222; border: 4px solid #555; width: 100%; max-width: 360px;
            padding: 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.5); animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .tab-row { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; background: #444; color: #aaa; font-family: 'DotGothic16', sans-serif; font-size: 1rem; border: 2px solid #222; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #E70012; color: #fff; border-color: #ff4a57; }
        
        .leaderboard {
            background: #111; border: 2px solid #444; padding: 12px; margin-bottom: 20px;
            max-height: 250px; overflow-y: auto; text-align: left;
        }
        .lb-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #333; font-size: 1.1rem; color: #ddd; }
        .lb-row:last-child { border-bottom: none; }
        .lb-top { color: #FFCC00; }

        .modal-title { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; color: #fff; margin-bottom: 20px; line-height: 1.4; }
        .modal-title.jp { font-family: 'DotGothic16', sans-serif; font-size: 2rem; font-weight: bold; }
        
        /* 次のステージへのメッセージ表示用 */
        .stage-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive; font-size: 1.5rem; color: #FFCC00; text-shadow: 2px 2px 0 #000;
            z-index: 200; display: none; text-align: center; line-height: 1.5; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="header-top">
    <div class="title">SAME<br>GAME</div>
    <div class="scores-container">
        <div class="score-box">
            <div class="score-label">STAGE</div>
            <div class="score-val" id="stage-display">1</div>
        </div>
        <div class="score-box" id="score-box-wrapper">
            <div class="score-label">SCORE</div>
            <div class="score-val" id="score-display">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">BEST</div>
            <div class="score-val" id="best-display">0</div>
        </div>
    </div>
</div>

<div class="controls-row">
    <a href="/games" class="action-btn">退出</a>
    <button class="action-btn sound-btn" id="sound-toggle" onclick="toggleSound()">🔊</button>
    <button class="action-btn" onclick="openRankingModal()">順位</button>
    <button class="action-btn btn-primary" onclick="resetGame()">再挑戦</button>
</div>

<div class="board-container" id="touch-area">
    <div class="grid-bg" id="grid-bg"></div>
    <div class="tile-layer" id="tile-layer"></div>
    <div class="stage-message" id="stage-message">PERFECT!<br><span style="font-size:0.8rem; color:#fff;">NEXT STAGE</span></div>
</div>

<div class="overlay" id="overlay">
    <div class="modal-content">
        <div class="modal-title jp" id="modal-main-title">ゲームオーバー</div>
        
        <div class="tab-row" id="ranking-tabs">
            <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">本日の順位</button>
            <button class="tab-btn" id="tab-alltime" onclick="switchTab('alltime')">全期間</button>
        </div>

        <div class="leaderboard" id="leaderboard">
            <div style="text-align:center; color:#888; font-size:1rem; margin-top:20px;">データ同期中...</div>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button class="action-btn" id="btn-close-modal" onclick="closeModal()">閉じる</button>
            <button class="action-btn btn-primary" id="btn-restart-modal" onclick="resetGame()">もう一度</button>
        </div>
    </div>
</div>

<script>
    const COLS = 10;
    const ROWS = 10;
    const COLOR_COUNT = 5;
    
    // 背景グリッド生成
    const bg = document.getElementById("grid-bg");
    for(let i=0; i<COLS*ROWS; i++) {
        const cell = document.createElement("div");
        cell.className = "grid-cell";
        bg.appendChild(cell);
    }

    function getAuthToken() { return localStorage.getItem("access_token") || localStorage.getItem("token") || ""; }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

    function playTone(type, freq, duration, vol) {
        if (!soundEnabled) return;
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playMatchSound(count) {
        if (!soundEnabled) return;
        initAudio();
        const baseFreq = 220 + Math.min(count * 5, 200);
        const steps = Math.min(count, 8);
        let time = audioCtx.currentTime;
        
        for(let i=0; i<steps; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(baseFreq * Math.pow(1.2, i), time + (i * 0.06));
            gain.gain.setValueAtTime(0.1, time + (i * 0.06));
            gain.gain.exponentialRampToValueAtTime(0.01, time + (i * 0.06) + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time + (i * 0.06));
            osc.stop(time + (i * 0.06) + 0.1);
        }
    }

    function playDropSound() { playTone('triangle', 60, 0.1, 0.2); }
    function playErrorSound() { playTone('sawtooth', 150, 0.15, 0.1); }

    function playGameOverSound() {
        if (!soundEnabled) return;
        initAudio();
        let time = audioCtx.currentTime;
        [330, 293, 261, 196, 164].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, time + (i * 0.15));
            gain.gain.setValueAtTime(0.15, time + (i * 0.15));
            gain.gain.linearRampToValueAtTime(0.01, time + (i * 0.15) + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time + (i * 0.15));
            osc.stop(time + (i * 0.15) + 0.2);
        });
    }

    function playClearAllSound() {
        if (!soundEnabled) return;
        initAudio();
        let time = audioCtx.currentTime;
        [523, 659, 783, 1046, 1318, 1567].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, time + (i * 0.08));
            gain.gain.setValueAtTime(0.2, time + (i * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.01, time + (i * 0.08) + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(time + (i * 0.08));
            osc.stop(time + (i * 0.08) + 0.3);
        });
    }

    function toggleSound() {
        initAudio();
        soundEnabled = !soundEnabled;
        document.getElementById("sound-toggle").innerText = soundEnabled ? "🔊" : "🔇";
        if(soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
    }

    let grid = [];
    let tileIdSeq = 0;
    let score = 0;
    let stage = 1;
    let bestScore = parseInt(localStorage.getItem("samegame_best")) || 0;
    let isProcessing = false;
    let isGameOver = false;
    let rankingData = { daily: [], alltime: [] };

    const layer = document.getElementById("tile-layer");
    const scoreDisplay = document.getElementById("score-display");
    const stageDisplay = document.getElementById("stage-display");
    const bestDisplay = document.getElementById("best-display");
    const overlay = document.getElementById("overlay");
    const lbEl = document.getElementById("leaderboard");
    const stageMsg = document.getElementById("stage-message");

    bestDisplay.innerText = bestScore;

    function initGrid() {
        grid = [];
        layer.innerHTML = "";
        for(let c=0; c<COLS; c++) {
            grid[c] = [];
            for(let r=0; r<ROWS; r++) {
                const colorIdx = Math.floor(Math.random() * COLOR_COUNT);
                
                const wrapper = document.createElement("div");
                wrapper.className = "tile-wrapper";
                wrapper.style.setProperty('--c', c);
                wrapper.style.setProperty('--r', r);
                
                const inner = document.createElement("div");
                inner.className = `tile-inner color-${colorIdx} pop-in`;
                wrapper.appendChild(inner);
                layer.appendChild(wrapper);
                
                const tile = { id: tileIdSeq++, c, r, color: colorIdx, wrapper, inner };
                grid[c][r] = tile;

                wrapper.addEventListener('pointerdown', () => handleTileClick(tile));
            }
        }
    }

    function resetGame() {
        score = 0;
        stage = 1;
        isGameOver = false;
        isProcessing = false;
        closeModal();
        initGrid();
        updateScoreDOM();
    }

    function startNextStage() {
        stage++;
        isGameOver = false;
        isProcessing = false;
        initGrid();
        updateScoreDOM();
    }

    function updateScoreDOM() {
        scoreDisplay.innerText = score;
        stageDisplay.innerText = stage;
        if (score > bestScore) {
            bestScore = score;
            bestDisplay.innerText = bestScore;
            localStorage.setItem("samegame_best", bestScore);
            scoreDisplay.style.transform = "scale(1.2)";
            setTimeout(() => scoreDisplay.style.transform = "scale(1)", 150);
        }
    }

    function getConnectedTiles(startTile) {
        const targetColor = startTile.color;
        const visited = new Set();
        const connected = [];
        const stack = [startTile];

        while(stack.length > 0) {
            const curr = stack.pop();
            if (visited.has(curr.id)) continue;
            visited.add(curr.id);
            connected.push(curr);

            const neighbors = [
                {c: curr.c, r: curr.r - 1}, {c: curr.c, r: curr.r + 1},
                {c: curr.c - 1, r: curr.r}, {c: curr.c + 1, r: curr.r}
            ];

            for(let n of neighbors) {
                if (n.c >= 0 && n.c < COLS && n.r >= 0 && n.r < ROWS) {
                    const neighborTile = grid[n.c][n.r];
                    if (neighborTile && neighborTile.color === targetColor && !visited.has(neighborTile.id)) {
                        stack.push(neighborTile);
                    }
                }
            }
        }
        return connected;
    }

    async function handleTileClick(tile) {
        if (isProcessing || isGameOver) return;
        
        const connected = getConnectedTiles(tile);
        if (connected.length < 2) {
            playErrorSound();
            return;
        }

        isProcessing = true;

        const gainedScore = Math.pow(connected.length - 1, 2) * 10;
        score += gainedScore;
        
        playMatchSound(connected.length);
        showScorePopup(gainedScore, tile.r, tile.c);

        if (connected.length >= 10) {
            const board = document.getElementById("touch-area");
            board.classList.remove("shake");
            void board.offsetWidth;
            board.classList.add("shake");
        }

        connected.forEach(t => {
            t.inner.classList.add('pop-out');
            grid[t.c][t.r] = null;
        });

        updateScoreDOM();

        await new Promise(res => setTimeout(res, 150));
        connected.forEach(t => t.wrapper.remove());

        let moved = false;
        for(let c=0; c<COLS; c++) {
            let writeR = ROWS - 1;
            for(let r=ROWS-1; r>=0; r--) {
                if (grid[c][r]) {
                    if (r !== writeR) {
                        grid[c][writeR] = grid[c][r];
                        grid[c][r] = null;
                        grid[c][writeR].r = writeR;
                        grid[c][writeR].wrapper.style.setProperty('--r', writeR);
                        moved = true;
                    }
                    writeR--;
                }
            }
        }

        let writeC = 0;
        for(let c=0; c<COLS; c++) {
            let hasBlock = false;
            for(let r=0; r<ROWS; r++) { if (grid[c][r]) { hasBlock = true; break; } }
            
            if (hasBlock) {
                if (c !== writeC) {
                    for(let r=0; r<ROWS; r++) {
                        if (grid[c][r]) {
                            grid[writeC][r] = grid[c][r];
                            grid[c][r] = null;
                            grid[writeC][r].c = writeC;
                            grid[writeC][r].wrapper.style.setProperty('--c', writeC);
                            moved = true;
                        }
                    }
                }
                writeC++;
            }
        }

        if (moved) {
            await new Promise(res => setTimeout(res, 200));
            playDropSound();
        }

        checkGameOver();
        if(!isGameOver && document.getElementById("stage-message").style.display !== "block") {
            isProcessing = false;
        }
    }

    function showScorePopup(val, r, c) {
        const pop = document.createElement("div");
        pop.className = "floating-score";
        pop.innerText = val;
        pop.style.top = `calc(${r} * 10% + var(--gap))`;
        pop.style.left = `calc(${c} * 10% + var(--gap))`;
        layer.appendChild(pop);
        
        const headPop = document.createElement("div");
        headPop.className = "score-addition";
        headPop.innerText = "+" + val;
        document.getElementById("score-box-wrapper").appendChild(headPop);

        setTimeout(() => { pop.remove(); headPop.remove(); }, 800);
    }

    function checkGameOver() {
        let remainingBlocks = 0;
        let canMove = false;

        for(let c=0; c<COLS; c++) {
            for(let r=0; r<ROWS; r++) {
                if (grid[c][r]) {
                    remainingBlocks++;
                    if (!canMove) {
                        const right = (c < COLS - 1) ? grid[c+1][r] : null;
                        const down = (r < ROWS - 1) ? grid[c][r+1] : null;
                        if (right && right.color === grid[c][r].color) canMove = true;
                        if (down && down.color === grid[c][r].color) canMove = true;
                    }
                }
            }
        }

        if (!canMove) {
            if (remainingBlocks <= 10) {
                // 10個以下ならクリアとして次のステージへ
                isProcessing = true;
                
                // 0個なら10000点、1〜10個なら残りが少ないほど高得点のボーナス
                let bonus = remainingBlocks === 0 ? 10000 : (10 - remainingBlocks + 1) * 500;
                score += bonus;
                
                updateScoreDOM();
                document.body.classList.add("hyper-flash");
                playClearAllSound();
                
                if (remainingBlocks === 0) {
                    stageMsg.innerHTML = 'PERFECT!<br><span style="font-size:0.8rem; color:#fff;">NEXT STAGE</span>';
                } else {
                    stageMsg.innerHTML = `CLEAR!<br><span style="font-size:0.8rem; color:#fff;">BONUS +${bonus}</span>`;
                }
                stageMsg.style.display = "block";
                
                setTimeout(() => {
                    stageMsg.style.display = "none";
                    startNextStage();
                }, 2500);
            } else {
                // 11個以上残った場合はゲームオーバー
                isGameOver = true;
                playGameOverSound();
                setTimeout(() => handleFinish(remainingBlocks), 1000);
            }
        }
    }

    async function handleFinish(remainingBlocks) {
        document.getElementById("btn-close-modal").style.display = "none";
        document.getElementById("btn-restart-modal").style.display = "block";
        overlay.style.display = "flex";

        const token = getAuthToken();
        if (!token) { renderRankings([]); return; }

        try {
            const res = await fetch("/api/samegame/score", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                body: JSON.stringify({ score, remaining_blocks: remainingBlocks })
            });
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errorText || res.statusText}`);
            }
            const data = await res.json();
            rankingData = { daily: data.daily || [], alltime: data.alltime || [] };
            switchTab('daily');
        } catch (e) { 
            console.error(e);
            lbEl.innerHTML = `<div style="text-align:center; color:#E70012; font-size:1.2rem; margin-top:20px;">通信エラー<br><span style="font-size:0.7rem; color:#888;">${e.message}</span></div>`; 
        }
    }

    async function openRankingModal() {
        document.getElementById("modal-main-title").innerText = "ランキング";
        document.getElementById("btn-close-modal").style.display = "block";
        document.getElementById("btn-restart-modal").style.display = isGameOver ? "block" : "none";
        overlay.style.display = "flex";

        try {
            const res = await fetch("/api/samegame/ranking");
            if (!res.ok) {
                const errorText = await res.text();
                throw new Error(`HTTP ${res.status}: ${errorText || res.statusText}`);
            }
            const data = await res.json();
            rankingData = { daily: data.daily || [], alltime: data.alltime || [] };
            switchTab('daily');
        } catch(e) { 
            console.error(e);
            lbEl.innerHTML = `<div style="text-align:center; color:#E70012; font-size:1.2rem; margin-top:20px;">通信エラー<br><span style="font-size:0.7rem; color:#888;">${e.message}</span></div>`; 
        }
    }

    function switchTab(type) {
        document.getElementById("tab-daily").className = type === 'daily' ? "tab-btn active" : "tab-btn";
        document.getElementById("tab-alltime").className = type === 'alltime' ? "tab-btn active" : "tab-btn";
        renderRankings(rankingData[type]);
    }

    function renderRankings(list) {
        lbEl.innerHTML = "";
        if (list.length === 0) {
            lbEl.innerHTML = '<div style="text-align:center; color:#888; font-size:1rem; margin-top:20px;">データがありません</div>';
            return;
        }
        list.forEach((entry, idx) => {
            const row = document.createElement("div");
            row.className = `lb-row ${idx < 3 ? "lb-top" : ""}`;
            row.innerHTML = `<span><span style="font-family:'Press Start 2P', cursive; font-size:0.8rem;">${idx + 1}.</span> ${escapeHtml(entry.nickname)}</span><span style="font-family:'Press Start 2P', cursive; font-size:0.8rem;">${entry.score.toLocaleString()}</span>`;
            lbEl.appendChild(row);
        });
    }

    function closeModal() { overlay.style.display = "none"; }
    function escapeHtml(str) { return String(str).replace(/[&<>'"]/g, t => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[t])); }

    document.addEventListener("touchmove", (e) => { if (e.target.closest('.board-container')) e.preventDefault(); }, { passive: false });
    
    document.addEventListener("click", () => { 
        initAudio();
        if(audioCtx.state === 'suspended') audioCtx.resume(); 
    }, { once: true });

    resetGame();
</script>
</body>
</html>
