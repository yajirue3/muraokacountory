<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>村岡王国 - 超究極カードバトル</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;900&display=swap');
        
        :root {
            --primary: #00f3ff;
            --secondary: #ff007f;
            --bg-dark: #07030e;
            --card-bg: #1c1a29;
            --taunt-color: #ffaa00;
            --neon-shadow: 0 0 10px rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            font-family: 'M PLUS 1p', sans-serif;
            background: var(--bg-dark);
            color: #fff;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes shake {
            0%, 30%, 60%, 90% { transform: translate(1px, 1px) rotate(0deg); }
            10%, 40%, 70%, 100% { transform: translate(-1px, -1px) rotate(-1deg); }
            20%, 50%, 80% { transform: translate(-2px, 0px) rotate(1deg); }
        }
        .shake { animation: shake 0.3s; }

        .damage-popup {
            position: absolute; color: #ff3333; font-size: 2rem; font-weight: 900;
            text-shadow: 0 0 10px #000, 0 0 20px #ff0000; pointer-events: none; z-index: 1000;
            animation: floatUp 1s forwards ease-out;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            20% { transform: translateY(-15px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }

        .container {
            width: 100%; max-width: 500px; height: 100dvh; display: flex; flex-direction: column;
            padding: 3px; background: linear-gradient(180deg, #111 0%, #050505 100%); position: relative;
        }

        input, select, button { padding: 8px; border-radius: 6px; font-weight: bold; font-family: inherit; }
        button { background: var(--primary); color: #000; border: none; cursor: pointer; box-shadow: var(--neon-shadow); }
        button:hover { filter: brightness(1.2); }

        /* モーダル系 */
        #rules-modal, #draft-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 999; display: none; flex-direction: column;
            justify-content: center; align-items: center; padding: 10px;
        }
        .rule-content {
            background: #1a1525; border: 2px solid var(--primary); border-radius: 12px; padding: 15px; 
            max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto; font-size: 0.85rem;
        }

        #lobby-screen { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }
        .room-list { flex: 1; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 5px; }
        .room-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #333; background: rgba(0,0,0,0.3); margin-bottom: 5px; border-radius: 6px;}

        #battle-screen { display: none; flex-direction: column; height: 100%; gap: 3px; position: relative; }
        
        #action-banner {
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.3), transparent);
            text-align: center; font-weight: bold; padding: 3px; font-size: 0.75rem; color: #fff; flex-shrink: 0;
        }
        #action-banner.alert { background: linear-gradient(90deg, transparent, rgba(255, 0, 127, 0.5), transparent); }

        .info-bar { display: flex; justify-content: space-between; background: #000; padding: 4px 8px; border-bottom: 1px solid var(--primary); font-size: 0.75rem; font-weight: bold; flex-shrink: 0; }
        
        /* 対戦相手エリアのコンパクト化 */
        #opponents-container { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding-bottom: 2px; }
        
        .player-area { 
            display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; 
            background: rgba(0,243,255,0.05); border-radius: 6px; border: 1px solid rgba(0,243,255,0.2); 
            flex-shrink: 0; font-size: 0.8rem;
        }
        .opponent-area { background: rgba(255,0,127,0.05); border-color: rgba(255,0,127,0.2); }
        .hp-text { color: #ff4444; font-size: 1rem; font-weight: 900; }
        .mp-text { color: #44aaff; font-weight: 900; }

        .board { display: flex; gap: 4px; padding: 4px; background: rgba(255,255,255,0.02); overflow-x: auto; align-items: center; border-radius: 6px; min-height: 85px; flex-shrink: 0; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        
        .board-card {
            min-width: 60px; height: 75px; background: var(--card-bg); border: 2px solid #555; border-radius: 6px;
            display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-size: 0.65rem; text-align: center; cursor: pointer; position: relative;
        }
        .board-card.taunt { border-color: var(--taunt-color); background: linear-gradient(180deg, #3a2a10, #1c1a29); }
        .board-card.can-attack { border-color: #00ff00; box-shadow: 0 0 8px #00ff00; animation: pulseGreen 1.5s infinite; }
        .stats { display: flex; justify-content: space-between; font-weight: 900; font-size: 0.75rem; }

        @keyframes pulseGreen { 0% { box-shadow: 0 0 3px #00ff00; } 50% { box-shadow: 0 0 10px #00ff00; } 100% { box-shadow: 0 0 3px #00ff00; } }

        /* 手札エリアのコンパクト化 */
        .hand-area { height: 100px; display: flex; gap: 6px; padding: 6px; overflow-x: auto; background: #050505; border-top: 2px solid var(--primary); flex-shrink: 0; }
        .hand-card {
            min-width: 70px; height: 85px; background: linear-gradient(180deg, #2a2540 0%, #151222 100%);
            border: 2px solid #555; border-radius: 6px; padding: 4px; display: flex; flex-direction: column; font-size: 0.65rem; cursor: pointer; position: relative;
        }
        .hand-card.playable { border-color: var(--primary); box-shadow: 0 0 6px var(--primary); }
        .hand-card.selected { transform: translateY(-10px); border-color: #ff00ff; box-shadow: 0 0 10px #ff00ff; z-index: 20; }
        
        .cost { position: absolute; top: -5px; left: -5px; background: #00f3ff; color: #000; width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 18px; font-weight: 900; font-size: 0.7rem; }
        .card-title { font-weight: 900; text-align: center; margin-top: 8px; margin-bottom: auto; }
        
        .draft-options { display: flex; gap: 10px; justify-content: center; }
        .draft-card { width: 90px; height: 130px; background: var(--card-bg); border: 2px solid var(--primary); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; cursor: pointer; font-size: 0.7rem; }
        
        .target-mode { cursor: crosshair !important; }
        .target-mode .board { box-shadow: inset 0 0 20px rgba(255, 0, 127, 0.4); }
        .target-mode .opponent-area { border-color: #ff007f; box-shadow: 0 0 10px rgba(255, 0, 127, 0.8); cursor: crosshair; }
        
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    </style>
</head>
<body>
<div class="container" id="main-container">

    <!-- ロビー -->
    <div id="lobby-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="color: var(--primary);">⚔️ 村岡王国 TCG</h3>
        </div>
        <div style="display:flex; gap:5px; margin-top:5px;">
            <select id="wallet-select" style="flex:1; min-width:0;"></select>
            <select id="max-players-select" style="width:65px;">
                <option value="2">2人</option>
                <option value="3">3人</option>
            </select>
            <input type="number" id="bet-amount" value="100" min="10" style="width:70px;" placeholder="Bet">
            <button onclick="createRoom()">作成</button>
        </div>
        <div class="room-list" id="room-list"></div>
    </div>

    <!-- バトルレイヤー -->
    <div id="battle-screen">
        <div class="info-bar">
            <span id="sys-message">待機中...</span>
            <span id="sys-timer" style="color:var(--primary);">⏳ 0</span>
        </div>
        
        <div id="action-banner">通信中...</div>
        
        <div id="opponents-container"></div>

        <div style="text-align:center; font-size:0.6rem; color:#888; border-top:1px solid #333; border-bottom:1px solid #333; font-weight:900; letter-spacing: 5px; flex-shrink: 0;">BATTLE FIELD</div>
        
        <div class="board" id="my-board"></div>

        <div class="player-area" id="my-hero" onclick="handleTargetClick('hero', myUserId)">
            <div>
                <span id="my-name">You</span> <span style="font-size:0.7rem;">(Deck: <span id="my-deck-count">0</span>)</span>
            </div>
            <div>
                <span class="hp-text">HP: <span id="my-hp">20</span></span> | 
                <span class="mp-text">MP: <span id="my-mp">0</span>/<span id="my-max-mp">0</span></span>
                <button id="end-turn-btn" style="padding: 4px 8px; display:none; background:#ffaa00; margin-left:5px; font-size:0.7rem;" onclick="endTurn()">終了</button>
            </div>
        </div>

        <div class="hand-area" id="my-hand"></div>
    </div>

    <!-- ドラフト -->
    <div id="draft-overlay">
        <h3 style="color: var(--primary);">🃏 カードをピック！</h3>
        <div class="draft-options" id="draft-options"></div>
        <div id="draft-wait" style="display:none; font-weight:bold;">他のプレイヤーを待っています...</div>
    </div>
</div>

<script>
    const token = localStorage.getItem("access_token");
    if (!token) window.location.href = "/";

    let ws = null;
    let pingInterval = null;
    let currentRoomId = null;
    let isConnecting = false;
    let gameState = null;
    let myUserId = null;
    let opponentIds = [];
    
    let selectedHandCard = null; 
    let selectedBoardUnit = null; 
    let isTargetingMode = false;
    let prevHpState = { my: 20, opps: {} };

    document.addEventListener("DOMContentLoaded", () => {
        loadWallets();
        fetchRooms();
        setInterval(fetchRooms, 3000);
    });

    async function loadWallets() {
        try {
            const res = await fetch("/api/wallets", { headers: { "Authorization": `Bearer ${token}` } });
            if (!res.ok) return;
            const wallets = await res.json();
            document.getElementById("wallet-select").innerHTML = wallets.map(w => `<option value="${w.wallet_id}">${w.wallet_name} (${w.balance}G)</option>`).join('');
        } catch (e) {}
    }

    async function fetchRooms() {
        if (ws) return;
        try {
            const res = await fetch("/api/card/rooms");
            if (!res.ok) return;
            const data = await res.json();
            document.getElementById("room-list").innerHTML = data.rooms.map(r => `
                <div class="room-item">
                    <div>
                        <div style="font-weight:bold; color:var(--primary);">${r.host_name}</div>
                        <div style="font-size:0.75rem; color:#aaa;">Bet: ${r.bet_amount}G | ${r.current_players}/${r.max_players}人</div>
                    </div>
                    <button onclick="joinRoom('${r.room_id}')">参戦する</button>
                </div>
            `).join('');
        } catch (e) {}
    }

    async function createRoom() {
        const walletId = document.getElementById("wallet-select").value;
        const amount = parseInt(document.getElementById("bet-amount").value);
        const maxPlayers = parseInt(document.getElementById("max-players-select").value);
        if (!walletId || amount <= 0) return alert("入力が不正です");

        const res = await fetch("/api/card/create", {
            method: "POST", headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ wallet_id: walletId, amount: amount, max_players: maxPlayers })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.detail);
        connectWS(data.room_id);
    }

    function joinRoom(roomId) { connectWS(roomId); }

    function connectWS(roomId) {
        if (isConnecting) return;
        isConnecting = true;
        currentRoomId = roomId;

        document.getElementById("lobby-screen").style.display = "none";
        document.getElementById("battle-screen").style.display = "flex";
        
        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${location.host}/ws/card/${roomId}?token=${token}`);
        
        ws.onopen = () => {
            isConnecting = false;
            // 確実な状態同期のためにSYNCを送信
            ws.send(JSON.stringify({ action: "SYNC" }));
            
            if (pingInterval) clearInterval(pingInterval);
            pingInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ action: "PING" }));
                }
            }, 10000);
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if(data.type === "PONG") return;
            if(data.type === "ERROR") { alert(data.message); location.reload(); }
            if(data.type === "SYNC_STATE") renderState(data.payload);
        };

        ws.onclose = () => {
            isConnecting = false;
            if (pingInterval) clearInterval(pingInterval);
            if (gameState && gameState.status !== "ENDED" && gameState.status !== "WAITING") {
                updateActionBanner("通信が途切れました。再接続中...", true);
                setTimeout(() => { if (currentRoomId) connectWS(currentRoomId); }, 1000);
            } else if (gameState && gameState.status === "WAITING") {
                location.reload();
            }
        };
    }

    function spawnDamageText(elementId, amount) {
        const el = document.getElementById(elementId);
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const popup = document.createElement("div");
        popup.className = "damage-popup";
        popup.innerText = `-${amount}`;
        popup.style.left = `${rect.left + rect.width / 2 - 15}px`;
        popup.style.top = `${rect.top + 5}px`;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 1000);
    }

    function triggerShake() {
        const container = document.getElementById("main-container");
        container.classList.remove("shake");
        void container.offsetWidth;
        container.classList.add("shake");
    }

    function updateActionBanner(text, isAlert = false) {
        const banner = document.getElementById("action-banner");
        banner.innerText = text;
        if(isAlert) banner.classList.add("alert");
        else banner.classList.remove("alert");
    }

    function renderState(state) {
        gameState = state;
        myUserId = state.your_user_id;
        opponentIds = Object.keys(state.players).filter(id => id !== myUserId);
        
        document.getElementById("sys-message").innerText = state.message;
        document.getElementById("sys-timer").innerText = `⏳ ${state.time_limit}`;

        if (state.status === "WAITING") {
            updateActionBanner(`参加者を待っています... (${Object.keys(state.players).length}/${state.max_players})`);
            return;
        }
        
        if (state.status === "DRAFT") {
            document.getElementById("draft-overlay").style.display = "flex";
            updateActionBanner("ドラフト中...");
            
            if (state.turn_user_id === myUserId && state.draft_options.length > 0) {
                document.getElementById("draft-options").style.display = "flex";
                document.getElementById("draft-wait").style.display = "none";
                document.getElementById("draft-options").innerHTML = state.draft_options.map(c => `
                    <div class="draft-card" onclick="ws.send(JSON.stringify({ action: 'PICK_CARD', card_id: '${c.id}' }))">
                        <div class="cost">${c.cost}</div>
                        <div class="card-title">${c.name}</div>
                        ${c.type === 'unit' ? `<div class="stats" style="margin-top:auto;"><span>⚔️${c.atk}</span><span>❤️${c.hp}</span></div>` : ''}
                    </div>
                `).join('');
            } else {
                document.getElementById("draft-options").style.display = "none";
                document.getElementById("draft-wait").style.display = "block";
            }
        } else {
            document.getElementById("draft-overlay").style.display = "none";
            renderBattlePhase(state);
        }
        
        if (state.status === "ENDED") {
            updateActionBanner("ゲーム終了！", true);
            setTimeout(() => location.reload(), 4000);
        }
    }

    function renderBattlePhase(state) {
        const isMyTurn = state.turn_user_id === myUserId;
        document.getElementById("end-turn-btn").style.display = isMyTurn ? "inline-block" : "none";

        opponentIds.forEach(oppId => {
            if (prevHpState.opps[oppId] !== undefined && state.hp[oppId] < prevHpState.opps[oppId]) {
                spawnDamageText(`opp-hero-${oppId}`, prevHpState.opps[oppId] - state.hp[oppId]);
                triggerShake();
            }
            prevHpState.opps[oppId] = state.hp[oppId];
        });

        if (prevHpState.my !== undefined && state.hp[myUserId] < prevHpState.my) {
            spawnDamageText("my-hero", prevHpState.my - state.hp[myUserId]);
            triggerShake();
        }
        prevHpState.my = state.hp[myUserId];

        document.getElementById("my-name").innerText = state.players[myUserId].name;
        document.getElementById("my-hp").innerText = state.hp[myUserId];
        document.getElementById("my-mp").innerText = state.mp[myUserId];
        document.getElementById("my-max-mp").innerText = state.max_mp[myUserId];
        document.getElementById("my-deck-count").innerText = state.deck_counts[myUserId];

        const renderUnit = (u, isMine) => `
            <div id="unit-${u.instance_id}" class="board-card ${u.taunt ? 'taunt' : ''} ${isMine && u.can_attack && isMyTurn ? 'can-attack' : ''}" 
                 onclick="handleBoardClick('${u.instance_id}', ${isMine})">
                <div style="font-weight:900; color:${isMine ? '#00f3ff' : '#ff007f'}; line-height: 1;">${u.name}</div>
                ${u.taunt ? '<div style="font-size:0.5rem; color:#ffaa00; background:rgba(0,0,0,0.5); border-radius:2px; margin: 2px 0;">🛡️挑発</div>' : ''}
                <div class="stats" style="margin-top:auto;"><span>⚔️${u.atk}</span><span>❤️${u.curr_hp}</span></div>
            </div>`;

        document.getElementById("my-board").innerHTML = (state.boards[myUserId] || []).map(u => renderUnit(u, true)).join('');

        let opponentsHtml = '';
        opponentIds.forEach(oppId => {
            const p = state.players[oppId];
            const hp = state.hp[oppId] || 0;
            const isDead = hp <= 0;
            const opacity = isDead ? "0.4" : "1";
            
            opponentsHtml += `
                <div style="opacity: ${opacity}; display: flex; flex-direction: column; gap: 2px;">
                    <div class="player-area opponent-area" id="opp-hero-${oppId}" onclick="handleTargetClick('hero', '${oppId}')">
                        <div>
                            <span>${p.name} ${isDead ? '<span style="color:red; font-size:0.6rem;">[DEAD]</span>' : ''}</span>
                        </div>
                        <div>
                            <span class="hp-text">HP: <span>${hp}</span></span> | 
                            <span class="mp-text">MP: <span>${state.mp[oppId]||0}</span>/<span>${state.max_mp[oppId]||0}</span></span>
                        </div>
                    </div>
                    <div class="board">
                        ${(state.boards[oppId] || []).map(u => renderUnit(u, false)).join('')}
                    </div>
                </div>
            `;
        });
        document.getElementById("opponents-container").innerHTML = opponentsHtml;

        const myMp = state.mp[myUserId];
        document.getElementById("my-hand").innerHTML = (state.hands[myUserId] || []).map(c => `
            <div class="hand-card ${c.cost <= myMp && isMyTurn ? 'playable' : ''}" id="hand-${c.instance_id}" onclick="handleHandClick('${c.instance_id}', ${c.cost <= myMp && isMyTurn})">
                <div class="cost">${c.cost}</div>
                <div class="card-title">${c.name}</div>
                ${c.type === 'unit' ? `<div class="stats" style="margin-top:auto;"><span>⚔️${c.atk}</span><span>❤️${c.hp}</span></div>` : ''}
            </div>
        `).join('');

        if (state.hp[myUserId] <= 0) {
            updateActionBanner("あなたは敗北しました。観戦中...", true);
        } else if (!isMyTurn) {
            resetSelection();
            updateActionBanner(`${state.players[state.turn_user_id]?.name || '相手'}のターンです...`, false);
        } else if (!isTargetingMode) {
            updateActionBanner("あなたのターン！", false);
        }
    }

    function endTurn() { resetSelection(); ws.send(JSON.stringify({ action: "END_TURN" })); }

    function resetSelection() {
        selectedHandCard = null; selectedBoardUnit = null; isTargetingMode = false;
        document.getElementById("battle-screen").classList.remove("target-mode");
        document.querySelectorAll('.hand-card').forEach(el => el.classList.remove('selected'));
        if(gameState && gameState.turn_user_id === myUserId && gameState.hp[myUserId] > 0) {
            updateActionBanner("あなたのターン！", false);
        }
    }

    function handleHandClick(instanceId, isPlayable) {
        if (!isPlayable) return;
        resetSelection();
        selectedHandCard = gameState.hands[myUserId].find(c => c.instance_id === instanceId);
        document.getElementById(`hand-${instanceId}`).classList.add("selected");
        
        if (selectedHandCard.type === "unit" || (selectedHandCard.type === "spell" && !selectedHandCard.need_target)) {
            ws.send(JSON.stringify({ action: "PLAY_HAND", card_instance_id: instanceId, target: null }));
            resetSelection();
        } else {
            isTargetingMode = true;
            document.getElementById("battle-screen").classList.add("target-mode");
            updateActionBanner("⚡ ターゲットを選択！", true);
        }
    }

    function handleBoardClick(instanceId, isMine) {
        if (isMine) {
            if (gameState.turn_user_id !== myUserId) return;
            const unit = gameState.boards[myUserId].find(u => u.instance_id === instanceId);
            if (unit && unit.can_attack) {
                resetSelection();
                selectedBoardUnit = unit;
                isTargetingMode = true;
                document.getElementById("battle-screen").classList.add("target-mode");
                updateActionBanner(`⚔️ 「${unit.name}」で攻撃！ターゲットを選択！`, true);
            }
        } else {
            if (isTargetingMode) handleTargetClick('unit', instanceId);
        }
    }

    function handleTargetClick(type, id) {
        if (!isTargetingMode) return;
        if (selectedHandCard) ws.send(JSON.stringify({ action: "PLAY_HAND", card_instance_id: selectedHandCard.instance_id, target: { type, id } }));
        else if (selectedBoardUnit) ws.send(JSON.stringify({ action: "DECLARE_ATTACK", attacker_id: selectedBoardUnit.instance_id, target: { type, id } }));
        resetSelection();
    }
</script>
</body>
</html>
